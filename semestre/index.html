/* ---------- Unità 1 · Metodi della fisica ---------- */
u1a:{sp:["Una grandezza fisica è qualcosa che si può misurare: si scrive sempre come numero + unità di misura. «3» non vuol dire nulla, «3 m» sì. Il Sistema Internazionale (SI) sceglie 7 grandezze fondamentali, con un'unità ciascuna; tutte le altre si ottengono combinandole.",
 "Le unità derivate si ricavano dalle formule. Siccome F = m·a, il newton è kg·m/s². Siccome il lavoro è forza per spostamento, il joule è N·m = kg·m²/s². Così, conoscendo le formule, si ricostruisce qualsiasi unità senza impararla a memoria.",
 "I prefissi sono potenze di 10 che si attaccano all'unità: 1 km = 10³ m, 1 mg = 10⁻³ g, 1 µs = 10⁻⁶ s. Attenzione: il chilogrammo è l'unica unità fondamentale che ha già un prefisso nel nome.",
 "Una grandezza è estensiva se raddoppia raddoppiando la quantità di materia (massa, volume, energia, calore), intensiva se non cambia (temperatura, pressione, densità). Se tagli a metà una mela, la sua massa si dimezza ma la temperatura resta quella."],
 es:[{q:"Scrivi il pascal in unità fondamentali.",p:["Pa = N/m²","N = kg·m/s²","Pa = (kg·m/s²)/m² = kg/(m·s²)"],r:"1 Pa = 1 kg·m⁻¹·s⁻²"},
     {q:"Quanti microgrammi ci sono in 2 mg?",p:["1 mg = 10⁻³ g e 1 µg = 10⁻⁶ g","1 mg = 10³ µg","2 mg = 2·10³ µg"],r:"2000 µg"}],
 med:"Dosaggi dei farmaci in mg o µg, concentrazioni in mg/dL, pressione in mmHg: in reparto le unità non SI sono la norma, per questo la conversione è un'abilità di base."},
u1b:{sp:["Per convertire si moltiplica per un «fattore 1»: una frazione che vale 1 perché sopra e sotto c'è la stessa quantità scritta in unità diverse. Esempio: 1 h / 3600 s = 1. Le unità si semplificano come lettere in algebra.",
 "Le conversioni di aree e volumi sono la trappola più frequente: se 1 cm = 10⁻² m, allora 1 cm² = (10⁻²)² m² = 10⁻⁴ m² e 1 cm³ = 10⁻⁶ m³. L'esponente si moltiplica per 2 o per 3.",
 "La notazione scientifica scrive un numero come a·10ⁿ con 1 ≤ a < 10. Per moltiplicare si moltiplicano le a e si sommano gli esponenti; per dividere si dividono le a e si sottraggono gli esponenti. All'esame non c'è la calcolatrice: lavorare con le potenze di 10 è il modo più veloce e sicuro.",
 "Stimare l'ordine di grandezza (la potenza di 10 più vicina) serve a controllare un risultato: se calcoli che un globulo rosso è largo 7 m, c'è un errore di unità (sono circa 7 µm)."],
 es:[{q:"Converti 108 km/h in m/s.",p:["108 km/h = 108 · 1000 m / 3600 s","= 108 / 3,6 m/s"],r:"30 m/s"},
     {q:"Un flacone contiene 250 mL. Quanti m³ sono?",p:["1 mL = 1 cm³ = 10⁻⁶ m³","250 mL = 250·10⁻⁶ m³"],r:"2,5·10⁻⁴ m³"},
     {q:"Calcola (6·10⁴) · (5·10⁻⁷).",p:["6·5 = 30","10⁴·10⁻⁷ = 10⁻³","30·10⁻³ = 3·10⁻²"],r:"3·10⁻² = 0,03"}],
 med:"Portata cardiaca circa 5 L/min = 8,3·10⁻⁵ m³/s; pressione arteriosa 120 mmHg ≈ 16 kPa: sono le conversioni tipiche dei problemi d'esame."},
u1c:{sp:["Un vettore è una freccia: la lunghezza è il modulo, la retta su cui sta è la direzione, la punta indica il verso. Spostamento, velocità, accelerazione e forza sono vettori; per questo due forze da 3 N non danno sempre 6 N.",
 "Somma con il metodo punta-coda: si mette la coda del secondo vettore sulla punta del primo; la somma va dalla coda del primo alla punta del secondo. È lo stesso della regola del parallelogramma.",
 "Il modo più pratico per sommare vettori è scomporli in componenti: aₓ = a·cos θ e a_y = a·sin θ (θ misurato dall'asse x). Si sommano separatamente le x e le y, poi si ricompone il modulo con Pitagora.",
 "Prodotto scalare a·b = ab·cos θ (dà un numero, serve per il lavoro). Prodotto vettoriale |a×b| = ab·sin θ (dà un vettore perpendicolare a entrambi, serve per la forza di Lorentz e il momento). Se θ = 90° il prodotto scalare è zero; se θ = 0° è zero quello vettoriale."],
 es:[{q:"Una forza di 10 N forma 30° con il pavimento. Quanto valgono le componenti orizzontale e verticale?",p:["Fₓ = 10·cos 30° ≈ 10·0,87","F_y = 10·sin 30° = 10·0,5"],r:"Fₓ ≈ 8,7 N; F_y = 5 N"},
     {q:"Due spostamenti: 6 m verso est e 8 m verso nord. Quanto dista il punto di arrivo?",p:["Sono perpendicolari: uso Pitagora","√(6² + 8²) = √(36 + 64) = √100"],r:"10 m"}],
 med:"In biomeccanica la forza di un muscolo si scompone nella parte che fa ruotare l'articolazione e in quella che la comprime."},
u1d:{sp:["Ogni grandezza ha una «dimensione» scritta con le grandezze fondamentali: [L] lunghezza, [M] massa, [T] tempo. Velocità [L T⁻¹], accelerazione [L T⁻²], forza [M L T⁻²], energia [M L² T⁻²].",
 "Regola d'oro: si possono sommare o uguagliare solo grandezze con le stesse dimensioni. Se una formula dà m/s da una parte e m/s² dall'altra, è sbagliata. È il modo più rapido per scartare risposte nelle domande a scelta multipla.",
 "Una grandezza adimensionale è un rapporto tra grandezze omogenee: le unità si semplificano. Esempi: numero di Reynolds, indice di rifrazione, rendimento, costante dielettrica relativa εᵣ, angoli in radianti, deformazione relativa ΔL/L."],
 es:[{q:"La formula v = √(2gh) è dimensionalmente corretta?",p:["[g·h] = (L T⁻²)·L = L² T⁻²","√(L² T⁻²) = L T⁻¹","È proprio una velocità"],r:"Sì"},
     {q:"Quale grandezza ha dimensioni M L² T⁻³?",p:["Energia = M L² T⁻²","Divisa per un tempo: M L² T⁻³","Energia al secondo = potenza"],r:"La potenza (watt)"}]},
/* ---------- Unità 2 · Meccanica ---------- */
u2a:{sp:["La cinematica descrive il moto senza chiedersi perché avviene. Servono tre grandezze: posizione x, velocità v (quanto cambia x nel tempo) e accelerazione a (quanto cambia v nel tempo).",
 "Moto rettilineo uniforme: v costante, a = 0. Lo spazio cresce in modo lineare, s = v·t; nel grafico x–t è una retta, nel grafico v–t una riga orizzontale.",
 "Moto uniformemente accelerato: a costante. La velocità cresce in modo lineare (v = v₀ + at), lo spazio in modo quadratico (s = v₀t + ½at²): nel grafico x–t è una parabola. La terza formula, v² = v₀² + 2as, non contiene il tempo ed è utilissima quando il tempo non è dato.",
 "La caduta libera è un moto uniformemente accelerato verso il basso con a = g ≈ 9,8 m/s². Senza aria, una piuma e un martello cadono insieme: l'accelerazione non dipende dalla massa.",
 "Velocità media = spazio totale / tempo totale. Non è la media aritmetica delle velocità, a meno che i tempi dei due tratti siano uguali."],
 es:[{q:"Un'auto a 20 m/s frena con decelerazione costante di 5 m/s². In quanto spazio si ferma?",p:["v = 0, v₀ = 20 m/s, a = −5 m/s²","v² = v₀² + 2as → 0 = 400 − 10·s","s = 400/10"],r:"40 m (in 4 s)"},
     {q:"Vai a 60 km/h per 1 ora e torni a 30 km/h sullo stesso percorso. Velocità media?",p:["Andata: 60 km in 1 h; ritorno: 60 km in 2 h","Spazio totale 120 km, tempo totale 3 h","120/3"],r:"40 km/h, non 45"}],
 med:"Lo spazio di frenata cresce con il quadrato della velocità: a velocità doppia serve uno spazio quadruplo (traumatologia stradale)."},
u2b:{sp:["Nel moto parabolico il trucco è separare le due direzioni, che sono indipendenti. In orizzontale non ci sono forze (aria trascurata): vₓ resta costante. In verticale agisce solo g: v_y diminuisce salendo, si annulla in cima e cresce scendendo.",
 "Il tempo di volo dipende solo dal moto verticale. Un proiettile sparato in orizzontale e uno lasciato cadere dalla stessa altezza toccano terra nello stesso istante.",
 "Moto circolare uniforme: il modulo della velocità è costante ma la direzione cambia continuamente, quindi c'è un'accelerazione, diretta verso il centro: aᶜ = v²/r = ω²r. Serve una forza centripeta F = m·v²/r (tensione di una fune, attrito delle gomme, gravità per un satellite).",
 "Periodo T = tempo di un giro; frequenza f = 1/T (giri al secondo); velocità angolare ω = 2π/T; velocità lineare v = ω·r."],
 es:[{q:"Un sasso è lanciato in orizzontale a 10 m/s da un'altezza di 5 m (g = 10). Quanto lontano cade?",p:["Tempo di caduta: 5 = ½·10·t² → t = 1 s","In orizzontale MRU: x = 10·1"],r:"10 m"},
     {q:"Una centrifuga fa girare una provetta a 0,1 m dall'asse con v = 30 m/s. Quanto vale l'accelerazione centripeta?",p:["aᶜ = v²/r = 900/0,1"],r:"9000 m/s², circa 900 g"}],
 med:"La centrifuga separa i componenti del sangue perché l'accelerazione centripeta, migliaia di volte g, fa sedimentare in fretta le particelle più dense."},
u2c:{sp:["Le forze sono la causa dei cambiamenti di moto. Primo principio: se la forza risultante è zero, la velocità non cambia (fermo resta fermo, in moto continua dritto e uniforme). Secondo principio: ΣF = m·a, cioè la forza risultante produce un'accelerazione nella sua direzione. Terzo principio: le forze nascono sempre a coppie uguali e opposte su corpi diversi.",
 "Metodo per ogni problema: disegna il corpo, tutte le forze che agiscono su di esso (peso, normale, tensioni, attriti, molle), scegli gli assi, scrivi ΣF = m·a lungo ciascun asse.",
 "Peso P = m·g (la massa non cambia, il peso sì: sulla Luna è circa 1/6). La forza gravitazionale tra due masse è F = G·m₁m₂/r². La normale N è la spinta del piano d'appoggio, perpendicolare alla superficie: su un piano orizzontale N = mg, su un piano inclinato N = mg·cos θ.",
 "Attrito: quello statico impedisce il moto fino a un valore massimo µₛN; quello dinamico, durante lo scorrimento, vale µ_d N ed è di solito un po' minore. Molla: F = −k·x, la forza è proporzionale all'allungamento e opposta ad esso (legge di Hooke)."],
 es:[{q:"Una cassa di 20 kg è tirata con 100 N su un pavimento con µ_d = 0,3 (g = 10). Quanto vale l'accelerazione?",p:["Attrito: µN = 0,3·20·10 = 60 N","Risultante: 100 − 60 = 40 N","a = 40/20"],r:"2 m/s²"},
     {q:"Su un piano inclinato liscio di 30° scivola un corpo di 4 kg (g = 10). Quanto valgono la normale e l'accelerazione?",p:["N = mg cos 30° = 40·0,87 ≈ 35 N","a = g sin 30° = 10·0,5"],r:"N ≈ 35 N; a = 5 m/s²"}],
 med:"Nella trazione ortopedica un peso appeso a una carrucola esercita una tensione costante sull'arto: è il secondo principio in equilibrio."},
u2d:{sp:["Il lavoro misura quanta energia una forza trasferisce a un corpo: L = F·s·cos θ. Se la forza aiuta il moto il lavoro è positivo, se si oppone (attrito, frenata) è negativo, se è perpendicolare (normale, forza centripeta) è nullo.",
 "Energia cinetica Ec = ½mv²: dipende dal quadrato della velocità. Teorema dell'energia cinetica: il lavoro di tutte le forze è uguale alla variazione di Ec.",
 "Le forze conservative (peso, molla, forza elettrica) hanno un'energia potenziale: U = mgh per il peso, U = ½kx² per la molla. Il loro lavoro dipende solo dal punto di partenza e di arrivo, non dal percorso. L'attrito invece è dissipativo: trasforma energia meccanica in calore.",
 "Se agiscono solo forze conservative, l'energia meccanica Ec + U si conserva: quello che perdi in altezza lo guadagni in velocità. È il metodo più rapido per molti esercizi: non serve conoscere la forma del percorso.",
 "Potenza P = L/t: quanto velocemente si fa lavoro. Un kWh è un'energia (potenza per tempo), non una potenza."],
 es:[{q:"Un pendolo parte da fermo 20 cm più in alto del punto più basso. Che velocità ha in fondo? (g = 10)",p:["mgh = ½mv² → v = √(2gh)","v = √(2·10·0,2) = √4"],r:"2 m/s"},
     {q:"Una persona di 60 kg sale 3 m di scale in 6 s. Che potenza sviluppa? (g = 10)",p:["L = mgh = 60·10·3 = 1800 J","P = 1800/6"],r:"300 W"}],
 med:"Il cuore compie circa 1 J di lavoro a battito: con 70 battiti al minuto la sua potenza meccanica è di poco più di 1 W."},
u2e:{sp:["Un corpo rigido non si deforma ma può ruotare. Per farlo ruotare conta il momento torcente M = F·b, dove b è il braccio: la distanza perpendicolare tra la retta d'azione della forza e il fulcro. Per questo una porta si apre facilmente spingendo vicino alla maniglia e a fatica vicino ai cardini.",
 "Equilibrio di un corpo rigido: servono entrambe le condizioni, somma delle forze nulla (non trasla) e somma dei momenti nulla (non ruota). Per le leve la seconda diventa F₁·b₁ = F₂·b₂.",
 "Leve: 1° genere fulcro in mezzo (altalena, forbici, la testa sulla colonna); 2° genere resistenza in mezzo (carriola, sollevarsi sulle punte dei piedi): sempre vantaggiosa; 3° genere potenza in mezzo (pinzette, avambraccio flesso dal bicipite): sempre svantaggiosa, ma il carico si sposta di più e più in fretta.",
 "Il centro di massa è il punto che si muove come se tutta la massa fosse lì: per due masse x_cm = (m₁x₁ + m₂x₂)/(m₁ + m₂), più vicino alla massa maggiore. Un corpo appoggiato è in equilibrio stabile se la verticale del baricentro cade dentro la base d'appoggio."],
 es:[{q:"Il bicipite è attaccato a 4 cm dal gomito; in mano, a 32 cm, c'è un peso di 50 N. Che forza deve fare il bicipite (avambraccio orizzontale, peso dell'avambraccio trascurato)?",p:["Momenti rispetto al gomito: F·0,04 = 50·0,32","F = 16/0,04"],r:"400 N, otto volte il peso"},
     {q:"Due bambini di 20 kg e 30 kg su un'altalena lunga 3 m con fulcro al centro. Dove deve sedersi il più pesante se il leggero sta all'estremità?",p:["Leggero: 20·1,5 = 30 (in kg·m, g si semplifica)","Pesante: 30·b = 30"],r:"a 1 m dal fulcro"}],
 med:"Le forze su muscoli e articolazioni sono molto maggiori dei carichi sollevati: è il motivo delle lesioni da sollevamento con la schiena flessa."},
u2f:{sp:["La quantità di moto p = m·v unisce massa e velocità: un camion lento e un proiettile veloce possono avere la stessa p. È un vettore, con la direzione della velocità.",
 "Il secondo principio si può scrivere F = Δp/Δt. Da qui il teorema dell'impulso: F·Δt = Δp. A parità di variazione di quantità di moto, allungare il tempo dell'urto riduce la forza: è il principio di airbag, caschi, ginocchia piegate quando si atterra.",
 "In un sistema isolato (forze esterne nulle o trascurabili durante l'urto) la quantità di moto totale si conserva. Vale per urti, esplosioni, rinculo di un'arma.",
 "Urto elastico: si conserva anche l'energia cinetica (biglie da biliardo, idealmente). Urto anelastico: parte dell'energia cinetica diventa calore e deformazione; se i corpi restano attaccati è completamente anelastico e la velocità finale si ricava solo dalla conservazione di p."],
 es:[{q:"Una palla da 0,5 kg arriva a 10 m/s contro un muro e rimbalza a 10 m/s. L'urto dura 0,05 s. Che forza media ha esercitato il muro?",p:["Δp = 0,5·10 − (0,5·(−10)) = 10 kg·m/s","F = Δp/Δt = 10/0,05"],r:"200 N"},
     {q:"Un carrello di 3 kg a 4 m/s urta un carrello fermo di 1 kg e restano uniti. Quanta energia cinetica si perde?",p:["v finale = 3·4/(3+1) = 3 m/s","Ec prima = ½·3·16 = 24 J; dopo = ½·4·9 = 18 J"],r:"6 J (il 25%)"}],
 med:"Nei traumi conta la durata dell'urto: cinture e airbag allungano l'arresto del corpo e riducono le forze sugli organi."},
/* ---------- Unità 3 · Meccanica dei fluidi ---------- */
u3a:{sp:["Un fluido (liquido o gas) non ha forma propria: le sue molecole scorrono. I liquidi sono praticamente incomprimibili, i gas no. Per i fluidi si ragiona con la densità ρ = m/V e la pressione p = F/A invece che con masse e forze.",
 "In un liquido fermo la pressione aumenta con la profondità perché ogni strato regge il peso di quelli sopra: p = p₀ + ρgh (Stevino). Dipende solo da h, non dalla forma del recipiente né dalla quantità di liquido.",
 "Principio di Pascal: un aumento di pressione in un punto di un fluido chiuso si trasmette identico ovunque. Nel torchio idraulico una piccola forza su un pistone piccolo genera una grande forza su un pistone grande (ma il pistone grande si sposta di meno: il lavoro si conserva).",
 "Pressione assoluta = pressione relativa (manometrica) + pressione atmosferica. Torricelli: l'atmosfera regge 760 mm di mercurio (1 atm). Con l'acqua, 13,6 volte meno densa, servirebbero circa 10 m: per questo ogni 10 m di immersione la pressione cresce di circa 1 atm."],
 es:[{q:"Pressione relativa del sangue ai piedi rispetto al cuore in una persona in piedi, con dislivello di 1,3 m (ρ = 1060 kg/m³, g = 10)?",p:["Δp = ρgh = 1060·10·1,3 ≈ 13 800 Pa","In mmHg: 13 800/133"],r:"circa 100 mmHg in più"},
     {q:"Torchio idraulico: pistoni di raggio 1 cm e 10 cm. Quale forza sul piccolo solleva un'auto di 10 000 N?",p:["Le aree stanno come i raggi al quadrato: 1 : 100","F = 10 000/100"],r:"100 N"}],
 med:"Per questo la pressione si misura al braccio, all'altezza del cuore, e una flebo va appesa abbastanza in alto da vincere la pressione venosa."},
u3b:{sp:["Un corpo immerso riceve dal fluido una spinta verso l'alto perché la pressione sotto (più profonda) è maggiore di quella sopra. Il risultato è il principio di Archimede: la spinta è uguale al peso del fluido spostato, S = ρ_fluido·g·V_immerso.",
 "Confronto tra peso e spinta a corpo tutto immerso: se ρ_corpo > ρ_fluido affonda, se è minore risale, se è uguale resta sospeso (come un pesce o un sommergibile).",
 "Un corpo che galleggia si immerge fino a quando la spinta eguaglia il peso: ρ_fluido·V_imm = ρ_corpo·V, quindi la frazione immersa è ρ_corpo/ρ_fluido. Il ghiaccio (920) in acqua (1000) sta sotto al 92%.",
 "Peso apparente = peso − spinta: un oggetto in acqua «pesa» meno. Misurando il peso in aria e in acqua si ricava la densità di un corpo (principio della pesata idrostatica)."],
 es:[{q:"Un tronco di densità 600 kg/m³ e volume 0,5 m³ galleggia in acqua. Quale volume è immerso e quale carico massimo può sostenere?",p:["V_imm = 0,6·0,5 = 0,3 m³","Carico max: tutta la spinta disponibile, ρ_acqua·V = 500 kg, meno la massa del tronco 300 kg"],r:"0,3 m³ immersi; circa 200 kg di carico"},
     {q:"Un oggetto pesa 10 N in aria e 6 N in acqua. Qual è la sua densità?",p:["Spinta = 10 − 6 = 4 N = peso dell'acqua spostata","Il corpo pesa 10/4 = 2,5 volte l'acqua di pari volume"],r:"2500 kg/m³"}],
 med:"In acqua la spinta scarica le articolazioni: è il principio dell'idrokinesiterapia e della riabilitazione in piscina."},
u3c:{sp:["Un fluido ideale è incomprimibile e senza attrito interno. In moto stazionario la portata Q = A·v (volume che passa ogni secondo) è uguale in ogni sezione del tubo: equazione di continuità. Dove il tubo si stringe il fluido accelera.",
 "Nei condotti che si ramificano conta la sezione TOTALE: l'aorta ha circa 3–5 cm², i capillari tutti insieme migliaia di cm². Per questo il sangue corre nell'aorta (decine di cm/s) e quasi si ferma nei capillari (meno di 1 mm/s), dove avvengono gli scambi.",
 "Teorema di Bernoulli: lungo un tubo p + ½ρv² + ρgh resta costante. È la conservazione dell'energia per unità di volume: pressione, energia cinetica, energia potenziale. In un tubo orizzontale, dove la velocità aumenta la pressione diminuisce.",
 "Applicazioni: in una stenosi (restringimento) il sangue accelera e la pressione laterale cala, la parete può essere schiacciata dall'esterno; in un aneurisma (dilatazione) il sangue rallenta e la pressione sulla parete già sfiancata aumenta, che peggiora la dilatazione."],
 es:[{q:"In un'arteria il sangue scorre a 0,2 m/s; in un tratto di stenosi la sezione è un quarto. Velocità nella stenosi e calo di pressione? (ρ = 1000 kg/m³)",p:["v₂ = 0,2·4 = 0,8 m/s","Δp = ½ρ(v₂² − v₁²) = 500·(0,64 − 0,04)"],r:"0,8 m/s; Δp = 300 Pa (circa 2 mmHg)"},
     {q:"Un tubo di sezione 2 cm² porta 6 L/min. Quanto vale la velocità?",p:["Q = 6·10⁻³ m³ / 60 s = 10⁻⁴ m³/s","v = Q/A = 10⁻⁴ / 2·10⁻⁴"],r:"0,5 m/s"}],
 med:"Il soffio udibile su una stenosi carotidea nasce dal flusso accelerato e turbolento a valle del restringimento."},
u3d:{sp:["I fluidi reali hanno attrito interno, la viscosità η (in Pa·s). Gli strati vicini alla parete sono frenati e restano fermi, quelli al centro vanno più veloci: in un tubo il profilo di velocità del moto laminare è parabolico. La differenza di velocità tra strati vicini è il gradiente di velocità.",
 "Per far scorrere un fluido viscoso serve una differenza di pressione. Legge di Poiseuille (moto laminare): Q = π r⁴ Δp / (8 η l). La portata è proporzionale alla quarta potenza del raggio: piccole variazioni del calibro di un vaso cambiano moltissimo il flusso.",
 "Come nella legge di Ohm (V = RI), si definisce la resistenza idraulica R = Δp/Q = 8ηl/(πr⁴). Vasi in serie: le resistenze si sommano. Vasi in parallelo: si sommano gli inversi, e la resistenza totale scende.",
 "Oltre una certa velocità il moto diventa turbolento: vortici, rumore, molta più energia dissipata. Il numero di Reynolds Re = ρvd/η lo prevede: indicativamente laminare sotto 2000, turbolento sopra qualche migliaio."],
 es:[{q:"Un'arteriola si restringe del 20% del raggio (r → 0,8 r). Di quanto cala la portata a parità di Δp?",p:["Q ∝ r⁴","0,8⁴ = 0,64·0,64 ≈ 0,41"],r:"scende a circa il 41%, cioè quasi del 60%"},
     {q:"Due vasi uguali, ciascuno con resistenza R, sono messi in parallelo. Quanto vale la resistenza totale?",p:["1/R_tot = 1/R + 1/R = 2/R"],r:"R/2"}],
 med:"Le arteriole regolano la pressione arteriosa proprio così: una piccola vasocostrizione cambia enormemente la resistenza periferica."},
u3e:{sp:["Le molecole sulla superficie di un liquido sono attratte solo verso l'interno: la superficie si comporta come una membrana tesa. La tensione superficiale τ (N/m) è l'energia (o la forza per unità di lunghezza) necessaria per allargarla.",
 "Una superficie curva spinge verso il suo centro: dentro una goccia o una bolla la pressione è maggiore che fuori. Legge di Laplace per una sfera: Δp = 2τ/r. Più la sfera è piccola, più la pressione interna è alta.",
 "Capillarità: in un tubo sottile un liquido che bagna le pareti (acqua nel vetro) sale, uno che non le bagna (mercurio) scende. L'altezza è maggiore quanto più il tubo è sottile.",
 "Il syllabus 2026 la chiede in forma qualitativa: conta capire il segno degli effetti, non fare conti complessi."],
 es:[{q:"Due bolle di sapone di raggio diverso sono collegate da un tubicino. Che cosa succede?",p:["Δp = 2τ/r: la bolla piccola ha pressione interna maggiore","L'aria passa dalla pressione alta alla bassa"],r:"La piccola si svuota nella grande"}],
 med:"Gli alveoli piccoli tenderebbero a svuotarsi in quelli grandi; il surfattante abbassa la tensione superficiale e li stabilizza. Nei prematuri senza surfattante si ha la sindrome da distress respiratorio."},
/* ---------- Unità 4 · Onde meccaniche ---------- */
u4a:{sp:["Un'onda è una perturbazione che viaggia: le particelle del mezzo oscillano attorno alla loro posizione, ma non si spostano con l'onda. Si trasporta energia, non materia (un tappo sull'acqua sale e scende, non viaggia con l'onda).",
 "Trasversale: le particelle oscillano perpendicolarmente alla direzione di propagazione (corda). Longitudinale: oscillano nella stessa direzione, con compressioni e rarefazioni (suono nei fluidi).",
 "Grandezze: ampiezza A (spostamento massimo), lunghezza d'onda λ (distanza tra due creste), periodo T (tempo di un'oscillazione), frequenza f = 1/T (in hertz), pulsazione ω = 2πf. In un periodo l'onda avanza di una lunghezza d'onda, quindi v = λ/T = λ·f.",
 "La velocità dipende dal mezzo (il suono: circa 340 m/s in aria, 1500 m/s in acqua e nei tessuti molli), la frequenza dipende dalla sorgente. Cambiando mezzo f resta uguale e varia λ."],
 es:[{q:"Un ultrasuono da 2 MHz attraversa un tessuto molle (v = 1500 m/s). Quanto vale λ?",p:["λ = v/f = 1500 / 2·10⁶"],r:"7,5·10⁻⁴ m = 0,75 mm"},
     {q:"Un suono di 680 Hz passa dall'aria (340 m/s) all'acqua (1500 m/s). Come cambiano f e λ?",p:["f resta 680 Hz","λ aria = 340/680 = 0,5 m; λ acqua = 1500/680 ≈ 2,2 m"],r:"f invariata; λ da 0,5 m a circa 2,2 m"}],
 med:"Più alta è la frequenza degli ultrasuoni, più piccola è λ e più fini sono i dettagli visibili in ecografia, ma minore è la profondità raggiunta."},
u4b:{sp:["L'intensità di un'onda è la potenza che attraversa ogni metro quadrato: I = P/A (W/m²). Per una sorgente puntiforme la potenza si distribuisce su una sfera di area 4πr², quindi I ∝ 1/r²: a distanza doppia l'intensità è un quarto.",
 "L'intensità è proporzionale al quadrato dell'ampiezza: ampiezza doppia, intensità quadrupla.",
 "L'orecchio percepisce intensità che vanno da 10⁻¹² a circa 1 W/m²: dodici ordini di grandezza. Per questo si usa una scala logaritmica, il livello sonoro in decibel: β = 10·log₁₀(I/I₀), con I₀ = 10⁻¹² W/m². Ogni fattore 10 nell'intensità aggiunge 10 dB.",
 "Regole rapide: ×2 → +3 dB; ×10 → +10 dB; ×100 → +20 dB; ×1000 → +30 dB. Due sorgenti uguali da 60 dB insieme fanno 63 dB, non 120."],
 es:[{q:"Un suono ha intensità 10⁻⁵ W/m². Quanti decibel?",p:["I/I₀ = 10⁻⁵ / 10⁻¹² = 10⁷","β = 10·log₁₀(10⁷) = 10·7"],r:"70 dB"},
     {q:"A 2 m da una sirena si misurano 100 dB. Quanti a 20 m?",p:["Distanza ×10 → intensità ÷100","÷100 = −20 dB"],r:"80 dB"}],
 med:"L'esposizione prolungata sopra gli 85 dB danneggia le cellule ciliate della coclea; l'audiometria misura le soglie in decibel per frequenza."},
u4c:{sp:["Quando sorgente e ascoltatore si avvicinano, le creste arrivano più ravvicinate: la frequenza percepita è più alta. Quando si allontanano, più bassa. È l'effetto Doppler: il suono della sirena che cambia mentre l'ambulanza passa.",
 "La sorgente emette sempre la stessa frequenza: cambia solo quella percepita. Lo spostamento di frequenza è proporzionale alla velocità relativa.",
 "Il syllabus 2026 chiede la descrizione qualitativa. Nel 2025 è uscito un calcolo semplice in percentuale: per velocità piccole rispetto al suono, la variazione relativa di frequenza è circa v/v_suono.",
 "Ecografia: una sonda emette impulsi di ultrasuoni e ascolta gli echi riflessi dalle interfacce tra tessuti diversi. Dal tempo di ritorno, con v ≈ 1540 m/s, si ricava la profondità (andata e ritorno: d = v·t/2)."],
 es:[{q:"Un'ambulanza si avvicina a 34 m/s (suono 340 m/s) emettendo 1000 Hz. Che frequenza si sente circa?",p:["f' = f·v/(v − v_s) = 1000·340/306"],r:"circa 1110 Hz (+11%)"},
     {q:"Un'eco torna alla sonda dopo 65 µs (v = 1540 m/s). A che profondità è l'interfaccia?",p:["d = v·t/2 = 1540·65·10⁻⁶ / 2"],r:"circa 5 cm"}],
 med:"L'ecodoppler misura velocità e verso del flusso sanguigno dallo spostamento di frequenza degli ultrasuoni riflessi dai globuli rossi."},
u4d:{sp:["L'oscillatore armonico è il modello di ogni vibrazione: una massa attaccata a una molla, spostata dall'equilibrio, viene richiamata da una forza F = −kx e oscilla con x(t) = A·cos(ωt).",
 "Il periodo dipende solo da massa e rigidità: T = 2π√(m/k). Massa maggiore → oscillazione più lenta; molla più rigida → più rapida. Non dipende dall'ampiezza (isocronismo): per questo un pendolo può segnare il tempo.",
 "Un'onda armonica è un'oscillazione che si propaga: y(x,t) = A·sin(kx − ωt), con numero d'onda k = 2π/λ e pulsazione ω = 2π/T. Il rapporto ω/k è la velocità dell'onda.",
 "Quando due onde si incontrano gli spostamenti si sommano (sovrapposizione). Se arrivano in fase (creste con creste) l'ampiezza si somma: interferenza costruttiva. Se arrivano in opposizione (creste con ventri) si annullano: interferenza distruttiva. Conta la differenza di cammino: multiplo intero di λ → costruttiva; multiplo dispari di λ/2 → distruttiva."],
 es:[{q:"Una massa di 2 kg su una molla con k = 200 N/m. Quanto vale il periodo? (π ≈ 3,14)",p:["T = 2π√(2/200) = 2π·√0,01 = 2π·0,1"],r:"circa 0,63 s"},
     {q:"Due altoparlanti emettono la stessa nota con λ = 0,8 m. In un punto la differenza di distanza è 1,2 m. Che interferenza c'è?",p:["1,2/0,8 = 1,5 lunghezze d'onda = 3·(λ/2)","Multiplo dispari di λ/2"],r:"distruttiva (quasi silenzio)"}],
 med:"Le cuffie con cancellazione del rumore producono un'onda in opposizione di fase: interferenza distruttiva."},
/* ---------- Unità 5 · Termodinamica ---------- */
u5a:{sp:["Temperatura e calore non sono la stessa cosa. La temperatura misura lo stato di agitazione delle molecole; il calore è energia che passa da un corpo all'altro perché hanno temperature diverse, sempre dal più caldo al più freddo, fino all'equilibrio termico.",
 "Il calore necessario per cambiare la temperatura di un corpo è Q = c·m·ΔT. Il calore specifico c dice quanto un materiale «resiste» a scaldarsi: l'acqua ha un c altissimo (4186 J/(kg·K)), per questo il mare d'estate resta fresco e il corpo, fatto per il 60% d'acqua, cambia temperatura lentamente. La capacità termica C = c·m riguarda l'oggetto intero.",
 "Durante un passaggio di stato (fusione, ebollizione) il calore fornito non alza la temperatura: serve a rompere i legami tra le molecole. Q = λ·m, con λ calore latente (fusione del ghiaccio 334 kJ/kg, evaporazione dell'acqua circa 2260 kJ/kg).",
 "Calorimetria: in un recipiente isolato il calore ceduto dal corpo caldo è uguale a quello assorbito dal freddo. Da qui la temperatura di equilibrio, che è una media pesata con m·c."],
 es:[{q:"Si mescolano 2 kg d'acqua a 80 °C e 3 kg a 20 °C. Temperatura finale?",p:["T = (2·80 + 3·20)/(2 + 3) (stesso c)","= (160 + 60)/5"],r:"44 °C"},
     {q:"Quanto calore serve per far evaporare 10 g di sudore? (λ = 2260 kJ/kg)",p:["Q = λ·m = 2260·0,01 kJ"],r:"22,6 kJ sottratti alla pelle"}],
 med:"L'evaporazione del sudore è il principale meccanismo di raffreddamento sotto sforzo: il calore latente viene preso dal corpo."},
u5b:{sp:["Un gas perfetto è un modello: molecole puntiformi che non interagiscono se non urtandosi. Il suo stato è descritto da pressione p, volume V, temperatura T (sempre in kelvin) e numero di moli n, legati da pV = nRT.",
 "Casi particolari: a T costante pV = costante (Boyle: dimezzi il volume, la pressione raddoppia); a p costante V/T = costante; a V costante p/T = costante. Per due stati dello stesso gas: p₁V₁/T₁ = p₂V₂/T₂.",
 "La pressione nasce dagli urti delle molecole sulle pareti. La temperatura assoluta è proporzionale all'energia cinetica media delle molecole: per questo l'energia interna di un gas perfetto dipende solo da T (ΔU = n·c_v·ΔT).",
 "In condizioni normali (0 °C, 1 atm) una mole occupa circa 22,4 L. I gas reali si discostano dal modello a pressioni alte e temperature basse (non è nel syllabus 2026, ma è uscito nel 2025)."],
 es:[{q:"Un pallone contiene aria a 27 °C e 1 atm. Lo si scalda a 87 °C a volume costante. Pressione finale?",p:["Temperature in kelvin: 300 K → 360 K","p₂ = 1·360/300"],r:"1,2 atm"},
     {q:"Un sub espira una bolla di 1 L a 30 m di profondità (4 atm). Che volume ha in superficie (T costante)?",p:["p₁V₁ = p₂V₂ → 4·1 = 1·V₂"],r:"4 L"}],
 med:"Durante la risalita l'aria nei polmoni si espande: se un sub trattiene il respiro rischia il barotrauma polmonare."},
u5c:{sp:["Primo principio: l'energia si conserva. La variazione di energia interna di un sistema è il calore ricevuto meno il lavoro che il sistema compie: ΔU = Q − L. Convenzione: Q > 0 se entra, L > 0 se il gas si espande e spinge l'ambiente.",
 "Nel piano p–V il lavoro è l'area sotto la curva della trasformazione. A pressione costante L = p·ΔV. Se il gas viene compresso il lavoro è negativo (è l'ambiente a farlo sul gas).",
 "Le quattro trasformazioni del gas perfetto: isocora (V costante: L = 0, il calore va tutto in energia interna); isobara (p costante: L = pΔV); isoterma (T costante: ΔU = 0, il calore assorbito diventa tutto lavoro); adiabatica (nessuno scambio di calore: ΔU = −L, espandendosi il gas si raffredda, comprimendosi si scalda).",
 "Reversibile: lenta, una successione di stati di equilibrio, percorribile al contrario. Le trasformazioni reali (rapide, con attriti, con salti di temperatura) sono irreversibili. In un ciclo il gas torna allo stato iniziale: ΔU = 0 e il lavoro netto è l'area racchiusa."],
 es:[{q:"Un gas riceve 500 J di calore e si espande compiendo 200 J di lavoro. Quanto varia l'energia interna?",p:["ΔU = Q − L = 500 − 200"],r:"+300 J (la temperatura sale)"},
     {q:"Un gas a 2·10⁵ Pa si espande a pressione costante da 3 L a 5 L. Lavoro?",p:["ΔV = 2 L = 2·10⁻³ m³","L = 2·10⁵ · 2·10⁻³"],r:"400 J"}],
 med:"Una pompa per bicicletta si scalda gonfiando: la compressione rapida è quasi adiabatica e il lavoro fatto sul gas ne aumenta l'energia interna."},
u5d:{sp:["Il primo principio non dice in che direzione vanno i processi; lo dice il secondo. Clausius: il calore non passa spontaneamente dal freddo al caldo. Kelvin: nessuna macchina ciclica può trasformare in lavoro tutto il calore preso da una sola sorgente.",
 "Una macchina termica prende calore Q_c da una sorgente calda, ne trasforma una parte in lavoro L e cede il resto Q_f a una sorgente fredda. Rendimento η = L/Q_c = 1 − Q_f/Q_c, sempre minore di 1.",
 "Il rendimento massimo possibile tra due temperature è quello della macchina di Carnot (reversibile): η = 1 − T_f/T_c, con le temperature in kelvin. Per avvicinarsi al 100% servirebbe T_f = 0 K, irraggiungibile.",
 "L'entropia S è una funzione di stato che misura il «disordine»: il numero di modi microscopici compatibili con lo stato macroscopico. In un sistema isolato l'entropia non diminuisce mai: resta costante nei processi reversibili e aumenta in quelli irreversibili. Per un calore Q scambiato reversibilmente a temperatura T: ΔS = Q/T."],
 es:[{q:"Una macchina assorbe 1000 J e cede 700 J alla sorgente fredda a ogni ciclo. Lavoro e rendimento?",p:["L = 1000 − 700 = 300 J","η = 300/1000"],r:"300 J; 30%"},
     {q:"Quanta entropia acquista 1 kg di ghiaccio che fonde a 0 °C? (λ = 334 kJ/kg)",p:["Q = 334 000 J a T = 273 K","ΔS = Q/T = 334 000/273"],r:"circa 1220 J/K"}],
 med:"Il corpo umano è una macchina con rendimento basso (circa 20–25% nel lavoro muscolare): il resto dell'energia diventa calore."},
u5e:{sp:["Conduzione: il calore passa per contatto, da molecola a molecola, senza spostamento di materia. La potenza trasmessa è Q/t = k·A·ΔT/d: cresce con la superficie e la differenza di temperatura, diminuisce con lo spessore. I metalli conducono bene, aria e grasso male (isolanti).",
 "Convezione: il calore è trasportato da un fluido che si muove (l'aria calda sale, il sangue porta il calore dal centro alla pelle).",
 "Irraggiamento: ogni corpo emette onde elettromagnetiche (infrarosso a temperatura ambiente), con una potenza che cresce con la quarta potenza della temperatura assoluta. È l'unico modo di trasmettere calore nel vuoto (il Sole).",
 "Il corpo a riposo perde calore soprattutto per irraggiamento; in un ambiente caldo o durante lo sforzo prevale l'evaporazione del sudore."],
 es:[{q:"Raddoppiando lo spessore di una coperta, come cambia il calore perso per conduzione (stessi ΔT e area)?",p:["Q/t ∝ 1/d"],r:"si dimezza"}],
 med:"Le termocamere misurano l'infrarosso emesso dalla pelle; il tessuto adiposo isola, per questo l'ipotermia è più rapida nei soggetti magri."},
/* ---------- Unità 6 · Elettricità e magnetismo ---------- */
u6a:{sp:["La carica elettrica esiste in due tipi, positiva e negativa; è quantizzata (multipla di e = 1,6·10⁻¹⁹ C) e si conserva: non si crea né si distrugge, si sposta.",
 "Legge di Coulomb: due cariche puntiformi si attraggono (segni opposti) o si respingono (stesso segno) con F = k·q₁q₂/r², k ≈ 9·10⁹ N·m²/C². Come la gravità è una legge dell'inverso del quadrato, ma è enormemente più intensa.",
 "Nei conduttori (metalli, soluzioni saline) le cariche si muovono liberamente; negli isolanti no. Avvicinando un corpo carico a un conduttore le sue cariche si separano: induzione elettrostatica. In un isolante le molecole si orientano senza spostarsi: polarizzazione.",
 "In un conduttore in equilibrio le cariche in eccesso stanno sulla superficie e il campo all'interno è nullo (gabbia di Faraday)."],
 es:[{q:"Due cariche si respingono con 9 N. La distanza viene triplicata e una carica raddoppiata. Nuova forza?",p:["F ∝ q₁q₂/r²: ×2 per la carica, ÷9 per la distanza","9·2/9"],r:"2 N"}],
 med:"Il defibrillatore e l'elettrocardiografo usano elettrodi metallici e gel conduttivo: la pelle secca è un cattivo conduttore."},
u6b:{sp:["Il campo elettrico E descrive come una carica modifica lo spazio intorno a sé: è la forza per unità di carica, E = F/q (N/C = V/m). Si disegna con linee di campo: escono dalle cariche positive, entrano nelle negative, non si incrociano, sono più fitte dove il campo è più intenso.",
 "Il potenziale elettrico V (volt) è l'energia potenziale per unità di carica. Conta la differenza di potenziale: una carica q che passa da un punto all'altro guadagna o perde energia q·ΔV. Una carica positiva lasciata libera va spontaneamente verso potenziali più bassi.",
 "Le superfici equipotenziali (stesso V) sono sempre perpendicolari alle linee di campo; spostarsi su di esse non costa lavoro. Per una carica puntiforme sono sfere concentriche; in un condensatore piano sono piani paralleli alle armature.",
 "In un campo uniforme una carica subisce una forza costante F = qE: si muove di moto uniformemente accelerato (come un sasso nel campo di gravità). La velocità finale si trova dall'energia: ½mv² = q·ΔV."],
 es:[{q:"Tra due armature distanti 1 cm c'è una d.d.p. di 100 V. Quanto vale il campo e che forza subisce un elettrone?",p:["E = ΔV/d = 100/0,01 = 10⁴ V/m","F = eE = 1,6·10⁻¹⁹ · 10⁴"],r:"10⁴ V/m; 1,6·10⁻¹⁵ N"},
     {q:"Un protone attraversa una d.d.p. di 1000 V partendo da fermo. Energia cinetica finale?",p:["Ec = q·ΔV = e·1000 V"],r:"1000 eV = 1,6·10⁻¹⁶ J"}],
 med:"La membrana di un neurone a riposo ha una d.d.p. di circa −70 mV su uno spessore di 7 nm: il campo è di circa 10⁷ V/m."},
u6c:{sp:["Un condensatore è fatto di due conduttori (armature) separati da un isolante. Collegato a una pila, si carica con +Q e −Q: il rapporto C = Q/V si chiama capacità e si misura in farad (di solito µF o pF).",
 "Per il condensatore piano C = ε₀εᵣA/d: armature più grandi e più vicine immagazzinano più carica. Un dielettrico tra le armature si polarizza, riduce il campo interno e aumenta la capacità di εᵣ volte.",
 "Energia immagazzinata: U = ½CV² = ½QV. È l'energia che il defibrillatore accumula e poi scarica in pochi millisecondi.",
 "Collegamenti (al contrario delle resistenze): in parallelo le capacità si sommano, C = C₁ + C₂; in serie si sommano gli inversi, 1/C = 1/C₁ + 1/C₂."],
 es:[{q:"Un defibrillatore ha un condensatore da 100 µF caricato a 2000 V. Quanta energia immagazzina?",p:["U = ½CV² = ½·10⁻⁴·(2·10³)²","= ½·10⁻⁴·4·10⁶"],r:"200 J"},
     {q:"Due condensatori da 6 µF e 3 µF in serie. Capacità equivalente?",p:["1/C = 1/6 + 1/3 = 1/6 + 2/6 = 3/6"],r:"2 µF"}],
 med:"La membrana cellulare (doppio strato lipidico isolante tra due soluzioni conduttive) si comporta come un condensatore di circa 1 µF/cm²."},
u6d:{sp:["La corrente elettrica è un flusso ordinato di cariche: I = Δq/Δt, in ampere. Per convenzione va dal polo + al polo −. Un generatore ideale mantiene ai suoi capi una differenza di potenziale costante, come una «pompa» per le cariche.",
 "Legge di Ohm: nei conduttori ohmici V = R·I. La resistenza dipende dal materiale e dalla forma: R = ρ·l/A (resistività per lunghezza diviso sezione). Un filo lungo e sottile resiste di più.",
 "In serie la corrente è la stessa e le resistenze si sommano. In parallelo la tensione è la stessa, le correnti si dividono (di più dove la resistenza è minore) e si sommano gli inversi: la resistenza equivalente è minore della più piccola.",
 "Una resistenza attraversata da corrente si scalda (effetto Joule): P = V·I = R·I² = V²/R. L'energia consumata è potenza per tempo, in joule o in kWh."],
 es:[{q:"Resistenze da 4 Ω e 12 Ω in parallelo collegate a 12 V. Resistenza equivalente e corrente totale?",p:["1/R = 1/4 + 1/12 = 3/12 + 1/12 = 4/12 → R = 3 Ω","I = 12/3"],r:"3 Ω; 4 A (3 A nella prima, 1 A nella seconda)"},
     {q:"Un asciugacapelli da 2000 W resta acceso 15 minuti. Quanta energia consuma?",p:["E = P·t = 2 kW · 0,25 h"],r:"0,5 kWh = 1,8·10⁶ J"}],
 med:"Il pericolo di una scossa dipende dalla corrente che attraversa il corpo: la pelle bagnata ha resistenza molto più bassa e lascia passare correnti molto maggiori a parità di tensione."},
u6e:{sp:["Il campo magnetico B (tesla) è generato da magneti e da correnti: Oersted vide che un filo percorso da corrente devia l'ago di una bussola. Le linee di B sono sempre chiuse: non esistono poli magnetici isolati.",
 "Una carica in moto in un campo magnetico subisce la forza di Lorentz F = qvB sin θ, perpendicolare sia a v sia a B. Su una carica ferma, o che si muove parallela a B, la forza è nulla. Un filo percorso da corrente in un campo subisce F = I·l·B.",
 "Siccome è sempre perpendicolare alla velocità, la forza di Lorentz non compie lavoro: curva la traiettoria senza cambiare il modulo della velocità. In un campo uniforme la carica percorre una circonferenza di raggio r = mv/(qB).",
 "Induzione elettromagnetica: se il flusso magnetico Φ = B·A·cos θ attraverso un circuito cambia nel tempo, nel circuito nasce una f.e.m. = −ΔΦ/Δt (Faraday-Neumann). Il segno meno (Lenz) dice che la corrente indotta si oppone alla variazione che l'ha generata. Un flusso costante non induce nulla."],
 es:[{q:"Un elettrone si muove a 10⁶ m/s perpendicolarmente a un campo di 0,01 T. Forza?",p:["F = evB = 1,6·10⁻¹⁹ · 10⁶ · 10⁻²"],r:"1,6·10⁻¹⁵ N"},
     {q:"Il flusso in una spira passa da 0,02 Wb a 0 in 0,1 s. Quanto vale la f.e.m. indotta media?",p:["|ΔΦ|/Δt = 0,02/0,1"],r:"0,2 V"}],
 med:"La risonanza magnetica usa campi B da 1,5–3 T; il segnale viene letto per induzione nelle bobine. Anche la stimolazione magnetica transcranica induce correnti nel tessuto cerebrale."},
/* ---------- Unità 7 · Fisica delle radiazioni ---------- */
u7a:{sp:["Le onde elettromagnetiche sono campi elettrici e magnetici che oscillano perpendicolari tra loro e alla direzione di propagazione. Non hanno bisogno di un mezzo: nel vuoto viaggiano tutte a c = 3·10⁸ m/s, e vale c = λ·f.",
 "Lo spettro, in ordine di frequenza crescente (e lunghezza d'onda decrescente): onde radio, microonde, infrarosso, visibile (rosso 700 nm → violetto 400 nm), ultravioletto, raggi X, raggi γ.",
 "La luce è anche fatta di pacchetti di energia, i fotoni: E = h·f = h·c/λ, con h ≈ 6,6·10⁻³⁴ J·s. Un fotone X ha un'energia migliaia di volte maggiore di un fotone visibile.",
 "Ionizzante o no dipende dall'energia del singolo fotone rispetto all'energia di ionizzazione degli atomi (qualche eV, circa 10 eV per le molecole biologiche), non dall'intensità del fascio. Radio, microonde, infrarosso e visibile non ionizzano; UV di alta energia, X e γ sì."],
 es:[{q:"Energia di un fotone verde (λ = 500 nm)? (hc ≈ 1240 eV·nm)",p:["E = hc/λ = 1240/500 eV"],r:"circa 2,5 eV"},
     {q:"Frequenza di una radiazione con λ = 3 m?",p:["f = c/λ = 3·10⁸ / 3"],r:"10⁸ Hz = 100 MHz (onde radio)"}],
 med:"I raggi X (decine di keV) ionizzano e permettono la radiografia; i telefoni cellulari (fotoni di circa 10⁻⁵ eV) scaldano ma non ionizzano."},
u7b:{sp:["Riflessione: il raggio riflesso giace nello stesso piano di quello incidente e della normale, e forma con la normale lo stesso angolo.",
 "Nei materiali la luce rallenta: l'indice di rifrazione n = c/v è sempre ≥ 1 (aria ≈ 1, acqua 1,33, vetro circa 1,5). Passando da un mezzo all'altro il raggio cambia direzione secondo la legge di Snell: n₁ sin θ₁ = n₂ sin θ₂.",
 "Verso un mezzo più rifrangente il raggio si avvicina alla normale; verso uno meno rifrangente si allontana. In quest'ultimo caso, oltre l'angolo limite (sin θ_L = n₂/n₁) la luce non esce più: riflessione totale. È così che la luce resta intrappolata nelle fibre ottiche.",
 "In una lastra a facce parallele le due rifrazioni si compensano: il raggio esce parallelo a quello entrato, solo spostato di lato. Cambiando mezzo la frequenza resta la stessa, cambiano velocità e lunghezza d'onda."],
 es:[{q:"Angolo limite tra vetro (n = 1,5) e aria?",p:["sin θ_L = 1/1,5 ≈ 0,67","θ_L ≈ 42°"],r:"circa 42°"},
     {q:"Un raggio passa dall'aria all'acqua (n = 1,33) con incidenza 30°. Angolo di rifrazione?",p:["sin θ₂ = sin 30°/1,33 = 0,5/1,33 ≈ 0,38","θ₂ ≈ 22°"],r:"circa 22°, più vicino alla normale"}],
 med:"Endoscopi e broncoscopi usano fasci di fibre ottiche per portare luce dentro il corpo e immagini fuori."},
u7c:{sp:["Una lente convergente sottile (più spessa al centro) fa convergere i raggi paralleli all'asse in un punto, il fuoco F, a distanza f dalla lente. Il potere diottrico D = 1/f si misura in diottrie (f in metri).",
 "Equazione dei punti coniugati: 1/p + 1/q = 1/f, con p distanza dell'oggetto e q dell'immagine. Ingrandimento m = −q/p: se è negativo l'immagine è capovolta.",
 "Costruzione con tre raggi: quello parallelo all'asse esce passando per il fuoco; quello per il centro della lente non devia; quello passante per il fuoco anteriore esce parallelo.",
 "Casi: oggetto oltre 2f → immagine reale, capovolta, rimpicciolita (fotocamera, occhio); tra f e 2f → reale, capovolta, ingrandita (proiettore); in f → nessuna immagine; dentro f → virtuale, diritta, ingrandita (lente d'ingrandimento)."],
 es:[{q:"Lente con f = 10 cm, oggetto a 30 cm. Dove si forma l'immagine e com'è?",p:["1/q = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 → q = 15 cm","m = −15/30 = −0,5"],r:"a 15 cm, reale, capovolta, metà"},
     {q:"Una lente ha potere +4 D. Qual è la distanza focale?",p:["f = 1/D = 1/4 m"],r:"25 cm"}],
 med:"Cristallino e cornea formano un sistema convergente di circa 60 diottrie; l'immagine sulla retina è reale e capovolta, il cervello la raddrizza."},
u7d:{sp:["Attraversando un materiale, una parte dei fotoni viene assorbita. Ogni strato sottile assorbe la stessa frazione di quello che gli arriva: per questo l'intensità non cala in modo lineare ma esponenziale con lo spessore, I = I₀·e^(−µx).",
 "In chimica e in laboratorio si usa la forma decimale, la legge di Lambert-Beer: A = log₁₀(I₀/I) = ε·c·l. L'assorbanza A è proporzionale alla concentrazione c e al cammino ottico l (ε è il coefficiente di assorbimento molare, tipico della sostanza e della lunghezza d'onda).",
 "Trasmittanza T = I/I₀ = 10^(−A): con A = 1 passa il 10%, con A = 2 l'1%, con A = 3 lo 0,1%. Raddoppiare spessore o concentrazione raddoppia A, non dimezza T.",
 "È il principio dello spettrofotometro: misurando A si risale alla concentrazione di una sostanza in soluzione."],
 es:[{q:"Una soluzione trasmette il 10% della luce. Se si raddoppia la concentrazione, quanto ne trasmette?",p:["T = 10% → A = 1","Concentrazione ×2 → A = 2","T = 10⁻²"],r:"1%"},
     {q:"A = 0,5 con una cuvetta da 1 cm. Che assorbanza dà la stessa soluzione in una cuvetta da 3 cm?",p:["A ∝ l"],r:"1,5"}],
 med:"Il pulsossimetro misura la saturazione di ossigeno confrontando l'assorbimento di luce rossa e infrarossa da parte di emoglobina ossigenata e non ossigenata."},

FIS_EXPL.u2a.sp.splice(1,0,"La legge oraria x(t) dice dove si trova il corpo a ogni istante; la traiettoria è la linea che percorre. Velocità media = Δx/Δt; la velocità istantanea è quella in un preciso istante, cioè la pendenza del grafico posizione-tempo in quel punto. Allo stesso modo l'accelerazione istantanea è la pendenza del grafico velocità-tempo, e nel grafico velocità-tempo l'area sotto la curva è lo spazio percorso. Saper leggere questi grafici è una delle richieste esplicite del syllabus.");
FIS_EXPL.u3a.sp.unshift("Stati di aggregazione: nei solidi le particelle restano in posizioni fisse e il corpo ha forma e volume propri; i liquidi hanno volume proprio ma prendono la forma del recipiente; i gas occupano tutto lo spazio disponibile. Liquidi e gas sono fluidi perché scorrono: non oppongono resistenza a uno sforzo di taglio.");
FIS_EXPL.u3a.sp.push("Il manometro misura la pressione relativa, cioè la differenza rispetto all'atmosfera: in un manometro a U il dislivello h del liquido dà Δp = ρgh. Lo sfigmomanometro esprime la pressione arteriosa in mmHg, cioè come altezza di una colonna di mercurio, la stessa unità dell'esperimento di Torricelli.");
FIS_EXPL.u5a.sp.unshift("Sistema è la parte di universo che si studia (un gas in un cilindro, il corpo umano), ambiente tutto il resto; lo stato del sistema è descritto da variabili come pressione, volume e temperatura. Scale di temperatura: Celsius (0 °C fusione del ghiaccio, 100 °C ebollizione a 1 atm), Kelvin (T = t + 273,15; 0 K è lo zero assoluto) e Fahrenheit (°F = 1,8·°C + 32). Una variazione di 1 °C è uguale a una di 1 K.");
FIS_EXPL.u5b.sp.push("Calore specifico dei gas ideali: dipende da come si scalda il gas. A volume costante tutto il calore diventa energia interna; per un gas monoatomico c_v = (3/2)R per mole. A pressione costante il gas si espande e compie anche lavoro, quindi serve più calore: c_p = c_v + R, cioè (5/2)R per un monoatomico (relazione di Mayer).");
FIS_EXPL.u6b.sp.push("Con più cariche vale il principio di sovrapposizione: il campo totale è la somma vettoriale dei campi di ciascuna carica, mentre i potenziali (scalari) si sommano con il loro segno. Due cariche uguali danno campo nullo nel punto medio. L'energia potenziale di due cariche puntiformi è U = k·q₁q₂/r: positiva se si respingono, negativa se si attraggono.");
FIS_EXPL.u3e.es.push({q:"Un capillare di raggio 0,25 mm è immerso in acqua (τ = 0,073 N/m, g = 10 m/s²). Di quanto sale l'acqua?",p:["h = 2τ/(ρ·g·r)","= 2·0,073 / (1000·10·0,25·10⁻³) = 0,146/2,5"],r:"circa 0,058 m, cioè 6 cm"});
FIS_EXPL.u5e.es.push({q:"Un vetro di 2 m², spesso 4 mm, separa 20 °C da 0 °C (k = 0,8 W/(m·K)). Quanta potenza passa per conduzione?",p:["Q/t = k·A·ΔT/d","= 0,8·2·20/0,004"],r:"8000 W: per questo si usano i doppi vetri con aria in mezzo"});
FIS_EXPL.u6a.es.push({q:"Due cariche di +2 µC e +3 µC distano 30 cm. Quanto vale la forza?",p:["F = k·q₁q₂/r² = 9·10⁹ · (2·10⁻⁶)(3·10⁻⁶) / 0,3²","= 0,054 / 0,09"],r:"0,6 N, repulsiva"});
FIS_EXPL.u1d.med="In farmacologia si controllano le unità come le dimensioni: una dose in mg/kg moltiplicata per il peso in kg dà mg; una velocità di infusione in mL/h per un tempo in h dà mL. Se l'unità finale non torna, il calcolo è sbagliato.";

u1b:{q:"Un'infusione va a 2 mL/min per 3 ore. Quanto liquido entra in litri e in m³?",p:["3 h = 180 min","2 · 180 = 360 mL = 0,36 L","1 L = 10⁻³ m³ → 0,36·10⁻³ = 3,6·10⁻⁴ m³"],r:"0,36 L = 3,6·10⁻⁴ m³"},
u1c:{q:"Un arto in trazione è tirato da due forze di 30 N perpendicolari tra loro. Quanto vale la risultante e che angolo forma?",p:["Sono perpendicolari: Pitagora","R = √(30² + 30²) = 30·√2 ≈ 42 N","Componenti uguali → bisettrice: 45° da ciascuna forza"],r:"circa 42 N, a 45°"},
u1d:{q:"Il periodo T di un pendolo dipende solo dalla lunghezza l e da g. Con l'analisi dimensionale trova la forma della formula.",p:["T = l^a · g^b → [T] = [L]^a · [L T⁻²]^b","Per L: a + b = 0; per T: −2b = 1","b = −½, a = ½"],r:"T ∝ √(l/g) (la formula vera è T = 2π√(l/g))"},
u2a:{q:"Un'auto va a 72 km/h. Il guidatore vede un ostacolo, reagisce dopo 1 s e poi frena con 5 m/s². In quanti metri si ferma?",p:["72 km/h = 20 m/s","Durante la reazione (moto uniforme): 20 · 1 = 20 m","Frenata: s = v²/(2a) = 400/10 = 40 m"],r:"60 m in tutto (il tempo di reazione pesa un terzo)"},
u2b:{q:"Un pallone è calciato a 20 m/s con un angolo di 30°. Quanto resta in aria e quanto lontano cade? (g = 10)",p:["vₓ = 20·cos 30° ≈ 17,3 m/s; v_y = 20·sin 30° = 10 m/s","Tempo di volo = 2·v_y/g = 2 s","Gittata = vₓ · t ≈ 17,3 · 2"],r:"2 s; circa 35 m"},
u2c:{q:"Una persona di 70 kg sta su una bilancia in un ascensore che accelera verso l'alto a 2 m/s². Che cosa segna la bilancia? (g = 10)",p:["Forze: normale N verso l'alto, peso mg verso il basso","N − mg = m·a → N = m(g + a) = 70 · 12","N = 840 N, come se pesasse 84 kg"],r:"840 N (84 kg sulla scala); in discesa accelerata segnerebbe meno"},
u2d:{q:"Un atleta di 60 kg sale 12 m di scale in 20 s. Lavoro contro la gravità, potenza ed energia chimica consumata se il rendimento muscolare è del 20%?",p:["L = m·g·h = 60·10·12 = 7200 J","P = 7200/20 = 360 W","Energia chimica = 7200/0,20 = 36 000 J ≈ 8,6 kcal"],r:"7200 J; 360 W; circa 36 kJ"},
u2e:{q:"Alzandosi sulla punta di un piede si ha una leva di 2° genere: fulcro sulle dita, peso del corpo (700 N) a 10 cm dalle dita, tendine d'Achille a 15 cm. Che forza fa il polpaccio?",p:["Momenti rispetto alle dita: F·0,15 = 700·0,10","F = 70/0,15"],r:"circa 470 N: leva vantaggiosa, la forza è minore del peso"},
u2f:{q:"Una persona di 60 kg salta giù da 1,25 m. Atterrando a gambe tese si ferma in 0,01 s, piegando le gambe in 0,2 s. Forze medie di arresto? (g = 10)",p:["Velocità all'arrivo: v = √(2gh) = √25 = 5 m/s","Δp = 60 · 5 = 300 kg·m/s","Gambe tese: F = 300/0,01 = 30 000 N; piegate: 300/0,2 = 1500 N"],r:"30 000 N contro 1500 N: piegare le gambe riduce la forza di 20 volte"},
u3a:{q:"Una flebo è appesa 1 m sopra il braccio; la pressione venosa è circa 10 mmHg (1330 Pa). Il liquido entra? Quale altezza minima serve? (ρ = 1000 kg/m³)",p:["Pressione della colonna: ρgh = 1000·10·1 = 10 000 Pa ≈ 75 mmHg","75 mmHg > 10 mmHg: il liquido entra","Altezza minima: h = 1330/(1000·10) ≈ 0,13 m"],r:"sì; servono almeno circa 13 cm"},
u3b:{q:"Un sub con l'attrezzatura ha massa 80 kg e volume 0,082 m³. In mare (ρ = 1025 kg/m³) galleggia? Quanta zavorra serve per restare sospeso?",p:["Spinta = massa d'acqua spostata = 1025 · 0,082 ≈ 84 kg (×g)","84 kg > 80 kg: tende a galleggiare","Servono circa 4 kg di piombo (trascurando il suo volume)"],r:"galleggia; circa 4 kg di zavorra"},
u3c:{q:"L'aorta ha sezione 4 cm² e il sangue vi scorre a 25 cm/s; i capillari, tutti insieme, hanno 2500 cm². Portata e velocità nei capillari?",p:["Q = A·v = 4·10⁻⁴ m² · 0,25 m/s = 10⁻⁴ m³/s = 6 L/min","v_cap = Q/A = 10⁻⁴ / 0,25 = 4·10⁻⁴ m/s"],r:"6 L/min; 0,4 mm/s nei capillari"},
u3d:{q:"Un'arteriola si dilata e il suo raggio aumenta del 10%. Come cambiano resistenza e portata, a parità di Δp?",p:["R ∝ 1/r⁴","1,1⁴ = 1,21 · 1,21 ≈ 1,46","R diventa circa 1/1,46 ≈ 0,68 di prima; Q aumenta di 1,46 volte"],r:"resistenza −32%, portata +46%"},
u3e:{q:"Confronta la sovrappressione dentro una goccia d'acqua di raggio 1 mm e una di 0,1 mm (τ = 0,07 N/m).",p:["Δp = 2τ/r","r = 1 mm: 0,14/0,001 = 140 Pa","r = 0,1 mm: 0,14/0,0001 = 1400 Pa"],r:"140 Pa e 1400 Pa: raggio 10 volte più piccolo, pressione 10 volte più grande"},
u4a:{q:"Su una corda passano 5 creste in 2 s e due creste vicine distano 0,4 m. Frequenza, periodo e velocità dell'onda?",p:["f = 5/2 = 2,5 Hz","T = 1/f = 0,4 s","v = λ·f = 0,4 · 2,5"],r:"2,5 Hz; 0,4 s; 1 m/s"},
u4b:{q:"In un reparto rumoroso ci sono 90 dB; con i tappi si scende a 70 dB. Di quanto si riduce l'intensità? E se i macchinari da 90 dB diventano due?",p:["−20 dB = intensità divisa per 10² = 100","Due sorgenti uguali: intensità ×2 → +3 dB"],r:"intensità 100 volte minore; con due macchinari 93 dB"},
u4c:{q:"Una sonda ecografica a 5 MHz lavora nei tessuti (1540 m/s). Lunghezza d'onda? Un'eco torna dopo 130 µs: a che profondità è l'interfaccia?",p:["λ = v/f = 1540 / 5·10⁶ ≈ 3·10⁻⁴ m = 0,3 mm","Andata e ritorno: d = v·t/2 = 1540 · 130·10⁻⁶ / 2"],r:"circa 0,3 mm; circa 10 cm"},
u4d:{q:"Una massa di 0,5 kg appesa a una molla oscilla con periodo 0,5 s. Quanto vale la costante elastica? (π² ≈ 10)",p:["T = 2π√(m/k) → k = 4π²m/T²","k = 4·10·0,5 / 0,25"],r:"80 N/m"},
u5a:{q:"Un paziente di 70 kg passa da 39 a 37 °C sudando. Quanto calore perde (c ≈ 3500 J/(kg·K)) e quanto sudore deve evaporare (λ ≈ 2400 kJ/kg)?",p:["Q = c·m·ΔT = 3500 · 70 · 2 = 490 000 J","m_sudore = Q/λ = 490 kJ / 2400 kJ/kg ≈ 0,2 kg"],r:"circa 490 kJ; circa 0,2 L di sudore evaporato"},
u5b:{q:"Una bombola di ossigeno da 10 L è a 150 atm. A temperatura costante, quanti litri dà a 1 atm? Per quanto tempo a 2 L/min?",p:["Boyle: p₁V₁ = p₂V₂ → V₂ = 150 · 10 / 1 = 1500 L","Tempo = 1500 / 2 = 750 min"],r:"circa 1500 L; circa 12 ore e mezza (un po' meno: 10 L restano nella bombola)"},
u5c:{q:"Un gas si espande a pressione costante di 1·10⁵ Pa da 2 L a 6 L e intanto assorbe 1000 J. Quanto lavoro compie e come cambia la sua energia interna?",p:["L = p·ΔV = 10⁵ · 4·10⁻³ = 400 J","ΔU = Q − L = 1000 − 400"],r:"400 J di lavoro; ΔU = +600 J (la temperatura sale)"},
u5d:{q:"Un motore assorbe 2000 J a 500 K e cede 1400 J a 300 K per ciclo. Rendimento reale, rendimento massimo e variazione di entropia dell'universo?",p:["η = (2000 − 1400)/2000 = 30%","Carnot: 1 − 300/500 = 40%","ΔS = −2000/500 + 1400/300 = −4 + 4,67"],r:"30% contro 40% massimo; ΔS ≈ +0,67 J/K: ciclo irreversibile"},
u5e:{q:"Un neonato perde calore per irraggiamento: perché lo si mette in incubatrice con pareti calde e non solo con aria calda?",p:["L'irraggiamento netto dipende dalla differenza tra T⁴ della pelle e T⁴ delle superfici intorno","Pareti fredde → grande perdita anche se l'aria è calda","Pareti calde riducono la differenza e quindi la perdita"],r:"perché conta la temperatura delle superfici che lo circondano, non solo quella dell'aria"},
u6a:{q:"Un corpo ha carica +3,2 nC. Quanti elettroni gli mancano?",p:["n = Q/e","= 3,2·10⁻⁹ / 1,6·10⁻¹⁹"],r:"2·10¹⁰ elettroni"},
u6b:{q:"Un elettrone parte da fermo e attraversa una d.d.p. di 100 V. Energia acquistata e velocità finale? (m ≈ 9·10⁻³¹ kg)",p:["E = e·ΔV = 100 eV = 1,6·10⁻¹⁷ J","½mv² = E → v = √(2E/m) = √(3,2·10⁻¹⁷ / 9·10⁻³¹) ≈ √(3,6·10¹³)"],r:"100 eV; circa 6·10⁶ m/s"},
u6c:{q:"Due condensatori da 4 µF e 12 µF. Capacità equivalente in parallelo e in serie; in serie a 12 V, quanta carica ha ciascuno?",p:["Parallelo: 4 + 12 = 16 µF","Serie: 1/C = 1/4 + 1/12 = 4/12 → C = 3 µF","In serie la carica è uguale: Q = 3 µF · 12 V = 36 µC"],r:"16 µF; 3 µF; 36 µC su ciascuno"},
u6d:{q:"Una lampada da 60 W funziona a 230 V. Corrente, resistenza ed energia consumata in 5 ore?",p:["I = P/V = 60/230 ≈ 0,26 A","R = V²/P = 52 900/60 ≈ 880 Ω","E = 60 W · 5 h = 300 Wh"],r:"circa 0,26 A; circa 880 Ω; 0,3 kWh"},
u6e:{q:"Un protone (m = 1,67·10⁻²⁷ kg) a 10⁶ m/s entra perpendicolarmente in un campo di 0,1 T. Raggio della traiettoria?",p:["r = m·v/(q·B)","= 1,67·10⁻²⁷ · 10⁶ / (1,6·10⁻¹⁹ · 0,1) = 1,67·10⁻²¹ / 1,6·10⁻²⁰"],r:"circa 0,10 m"},
u7a:{q:"Un fotone X ha energia 30 keV. Quanto vale la sua lunghezza d'onda? (hc ≈ 1240 eV·nm)",p:["λ = hc/E = 1240 eV·nm / 30 000 eV","≈ 0,041 nm"],r:"circa 0,04 nm (4·10⁻¹¹ m): ionizzante"},
u7b:{q:"Un raggio passa dal vetro (n = 1,5) all'acqua (n = 1,33) con incidenza 60°. Esce o viene riflesso totalmente?",p:["Angolo limite: sin θ_L = 1,33/1,5 ≈ 0,89 → θ_L ≈ 62°","60° < 62°: il raggio esce","sin θ₂ = 1,5 · sin 60° / 1,33 ≈ 0,98 → θ₂ ≈ 78°"],r:"esce quasi radente (circa 78°); sopra i 62° sarebbe riflessione totale"},
u7c:{q:"Una lente da +5 diottrie forma l'immagine di un oggetto posto a 40 cm. Dove e com'è l'immagine?",p:["f = 1/5 m = 20 cm","1/q = 1/20 − 1/40 = 1/40 → q = 40 cm","m = −q/p = −1"],r:"a 40 cm, reale, capovolta, stessa grandezza (oggetto in 2f)"},
u7d:{q:"Uno standard di glucosio 2 mmol/L dà assorbanza 0,5; un campione nella stessa cuvetta dà 0,4. Concentrazione del campione?",p:["A = ε·c·l: con stessi ε e l, A ∝ c","c = 2 · 0,4/0,5"],r:"1,6 mmol/L"},
u7e:{q:"Lo iodio-131 ha emivita di 8 giorni. Quale frazione resta dopo 24 giorni? Dopo quanti giorni si scende sotto l'1%?",p:["24/8 = 3 emivite → 1/2³ = 1/8","2⁶ = 64 (1,6%), 2⁷ = 128 (0,8%)","7 emivite = 56 giorni"],r:"1/8 (12,5%); circa 56 giorni"}

{t:"u3b",k:"m",q:"Un cubo di 1 dm³ completamente immerso in acqua riceve una spinta di (g = 10):",o:["1 N","10 N","100 N","0,1 N","1000 N"],a:1,s:"1 dm³ d'acqua = 1 kg → 10 N."},
{t:"u3b",k:"m",q:"Un corpo galleggia in acqua con metà del volume immerso. La sua densità è:",o:["250 kg/m³","500 kg/m³","1000 kg/m³","2000 kg/m³","1500 kg/m³"],a:1,s:"Frazione immersa = ρ_corpo/ρ_acqua."},
{t:"u3b",k:"c",q:"Un oggetto pesa 30 N in aria e 20 N in acqua: la spinta di Archimede vale ____ N.",a:["10","DIECI"],s:"Peso apparente = peso − spinta."},
{t:"u3b",k:"m",q:"Lo stesso blocco di legno galleggia in acqua dolce e poi in acqua salata. In acqua salata:",o:["affonda di più","emerge un po' di più","la spinta supera il peso","affonda del tutto","non cambia nulla"],a:1,s:"Densità maggiore → basta meno volume immerso."},
{t:"u3c",k:"m",q:"In un tubo la sezione si riduce a un terzo. La velocità del fluido ideale:",o:["si riduce a un terzo","triplica","resta uguale","aumenta di 9 volte","si annulla"],a:1,s:"A·v costante."},
{t:"u3c",k:"m",q:"In un aneurisma (dilatazione dell'arteria) il sangue:",o:["accelera e la pressione sulla parete cala","rallenta e la pressione sulla parete aumenta","si ferma","è sempre turbolento","non cambia"],a:1,s:"Continuità + Bernoulli: la dilatazione tende a peggiorare."},
{t:"u3c",k:"c",q:"Nel SI la portata si misura in metri cubi al ____.",a:["SECONDO"],s:"m³/s."},
{t:"u3c",k:"m",q:"In un tubo orizzontale l'acqua va a 1 m/s nel punto A e a 3 m/s nel punto B. La pressione in A rispetto a B è:",o:["minore di 4000 Pa","maggiore di 4000 Pa","uguale","maggiore di 2000 Pa","maggiore di 9000 Pa"],a:1,s:"½·1000·(9 − 1) = 4000 Pa."},
{t:"u3d",k:"m",q:"Raddoppiando la lunghezza di un tubo (stessi raggio e Δp), la portata di Poiseuille:",o:["raddoppia","si dimezza","diventa 1/16","resta uguale","quadruplica"],a:1,s:"Q ∝ 1/l."},
{t:"u3d",k:"m",q:"Raddoppiando sia il raggio sia la lunghezza di un tubo (stessa Δp), la portata:",o:["raddoppia","aumenta di 8 volte","aumenta di 16 volte","resta uguale","si dimezza"],a:1,s:"16 (r⁴) / 2 (l) = 8."},
{t:"u3d",k:"m",q:"Tre vasi uguali, ciascuno con resistenza R, collegati in serie hanno resistenza totale:",o:["R/3","R","3R","9R","R/9"],a:2,s:"In serie si sommano."},
{t:"u3d",k:"c",q:"Un numero di Reynolds molto alto indica un moto ____.",a:["TURBOLENTO"],s:"Sotto circa 2000 è laminare."},
{t:"u3d",k:"c",q:"L'unità SI della viscosità è il pascal per ____.",a:["SECONDO"],s:"Pa·s."},
{t:"u3e",k:"m",q:"Un insetto cammina sull'acqua grazie:",o:["alla spinta di Archimede","alla tensione superficiale","alla viscosità","alla pressione atmosferica","alla capillarità"],a:1,s:"La superficie si comporta come una membrana tesa."},
{t:"u3e",k:"m",q:"Un detergente aggiunto all'acqua:",o:["aumenta la tensione superficiale","riduce la tensione superficiale","non cambia nulla","aumenta la densità","fa salire di più l'acqua nei capillari"],a:1,s:"È un tensioattivo, come il surfattante."},
{t:"u3e",k:"c",q:"Dimezzando il raggio di un capillare, l'altezza a cui sale l'acqua ____ (raddoppia/dimezza).",a:["RADDOPPIA"],s:"h ∝ 1/r."},
/* u4 onde */
{t:"u4a",k:"m",q:"Un suono di 340 Hz in aria (340 m/s) ha lunghezza d'onda:",o:["1 m","0,1 m","10 m","340 m","1/340 m"],a:0,s:"λ = v/f."},
{t:"u4a",k:"m",q:"Il suono NON si propaga:",o:["nell'acqua","nell'aria","nel vuoto","nelle ossa","nei metalli"],a:2,s:"Serve un mezzo materiale."},
{t:"u4a",k:"c",q:"Nelle onde ____ le particelle oscillano nella stessa direzione di propagazione.",a:["LONGITUDINALI"],s:"Come il suono nei fluidi."},
{t:"u4a",k:"m",q:"Se la frequenza di un'onda raddoppia nello stesso mezzo, la lunghezza d'onda:",o:["raddoppia","si dimezza","resta uguale","quadruplica","si annulla"],a:1,s:"v = λf fissa."},
{t:"u4b",k:"m",q:"Un suono di 80 dB rispetto a uno di 50 dB ha intensità:",o:["30 volte maggiore","300 volte maggiore","1000 volte maggiore","1,6 volte maggiore","3 volte maggiore"],a:2,s:"30 dB = fattore 10³."},
{t:"u4b",k:"m",q:"A 1 m da una sorgente l'intensità è 10⁻⁴ W/m². A 10 m vale:",o:["10⁻⁵ W/m²","10⁻⁶ W/m²","10⁻³ W/m²","10⁻⁸ W/m²","10⁻⁴ W/m²"],a:1,s:"Distanza ×10 → intensità ÷100."},
{t:"u4b",k:"c",q:"L'intensità sonora si misura in watt al metro ____.",a:["QUADRO","QUADRATO"],s:"W/m²."},
{t:"u4c",k:"m",q:"L'effetto Doppler si osserva:",o:["solo con la luce","solo con il suono","con tutte le onde, quando sorgente e osservatore si muovono l'uno rispetto all'altro","solo nel vuoto","solo se la sorgente è ferma"],a:2,s:"Anche con la luce (spostamento verso il rosso)."},
{t:"u4c",k:"m",q:"Nell'ecodoppler, il sangue che si allontana dalla sonda produce un'eco di frequenza:",o:["maggiore di quella emessa","minore di quella emessa","uguale","nulla","doppia"],a:1,s:"Allontanamento → frequenza minore."},
{t:"u4c",k:"c",q:"L'esame che usa l'effetto Doppler degli ultrasuoni per studiare il flusso del sangue si chiama ____.",a:["ECODOPPLER","ECOCOLORDOPPLER","DOPPLER"],s:"Misura velocità e verso del flusso."},
{t:"u4d",k:"m",q:"Una massa di 2 kg su una molla oscilla con periodo π/5 s. La costante elastica è:",o:["50 N/m","100 N/m","200 N/m","400 N/m","20 N/m"],a:2,s:"k = 4π²m/T² = 4π²·2/(π²/25) = 200 N/m."},
{t:"u4d",k:"m",q:"Due onde identiche si sovrappongono in opposizione di fase. L'ampiezza risultante è:",o:["doppia","nulla","uguale","metà","quadrupla"],a:1,s:"Interferenza distruttiva."},
{t:"u4d",k:"c",q:"Il periodo di un oscillatore armonico ____ dipende dall'ampiezza (scrivi «non» o «sì»).",a:["NON"],s:"Isocronismo."},
{t:"u4d",k:"m",q:"Un'oscillazione ha periodo 2 s. La sua pulsazione ω vale:",o:["π rad/s","2π rad/s","π/2 rad/s","4π rad/s","1 rad/s"],a:0,s:"ω = 2π/T."},
/* u5 termodinamica */
{t:"u5a",k:"m",q:"Quanto calore serve per scaldare 2 kg d'acqua da 20 a 70 °C? (c = 4,2 kJ/(kg·K))",o:["42 kJ","210 kJ","420 kJ","840 kJ","100 kJ"],a:2,s:"4,2 · 2 · 50."},
{t:"u5a",k:"m",q:"Durante l'ebollizione a pressione costante, se si fornisce calore la temperatura dell'acqua:",o:["aumenta","diminuisce","resta costante","oscilla","raddoppia"],a:2,s:"Il calore va nel passaggio di stato (calore latente)."},
{t:"u5a",k:"c",q:"37 °C corrispondono a circa ____ K.",a:["310"],s:"37 + 273."},
{t:"u5a",k:"m",q:"Si mescolano 1 kg d'acqua a 10 °C e 3 kg a 50 °C. La temperatura finale è:",o:["20 °C","30 °C","40 °C","45 °C","25 °C"],a:2,s:"(1·10 + 3·50)/4."},
{t:"u5b",k:"m",q:"Una mole di gas perfetto a 0 °C e 1 atm occupa:",o:["1 L","22,4 L","2,24 L","224 L","8,31 L"],a:1,s:"Volume molare in condizioni normali."},
{t:"u5b",k:"m",q:"A volume costante la temperatura di un gas passa da 300 K a 600 K. La pressione:",o:["raddoppia","si dimezza","resta uguale","quadruplica","aumenta di √2"],a:0,s:"p/T costante."},
{t:"u5b",k:"c",q:"Un gas a 27 °C si trova alla temperatura assoluta di ____ K.",a:["300"],s:"27 + 273."},
{t:"u5b",k:"m",q:"Nell'inspirazione il volume dei polmoni aumenta; a temperatura costante la pressione interna:",o:["aumenta","scende sotto quella atmosferica e l'aria entra","resta uguale","diventa zero","raddoppia"],a:1,s:"Boyle."},
{t:"u5c",k:"m",q:"In una trasformazione isoterma di un gas perfetto:",o:["ΔU = 0 e Q = L","Q = 0","L = 0","ΔU = Q","la pressione è costante"],a:0,s:"L'energia interna dipende solo da T."},
{t:"u5c",k:"m",q:"In un'espansione adiabatica un gas:",o:["si scalda","si raffredda","mantiene la temperatura","assorbe calore","cede calore"],a:1,s:"ΔU = −L < 0."},
{t:"u5c",k:"c",q:"In un ciclo termodinamico completo la variazione di energia interna è ____.",a:["ZERO","NULLA","0"],s:"Si torna allo stato iniziale."},
{t:"u5c",k:"m",q:"Nel piano p-V il lavoro di una trasformazione è rappresentato da:",o:["la pendenza della curva","l'area sotto la curva","la lunghezza della curva","il punto finale","l'intercetta"],a:1,s:"L = ∫p dV."},
{t:"u5d",k:"m",q:"Una macchina termica con rendimento del 100%:",o:["è possibile se reversibile","è impossibile per il secondo principio","esiste nei motori moderni","è la macchina di Carnot","si ottiene a 0 °C"],a:1,s:"Enunciato di Kelvin."},
{t:"u5d",k:"m",q:"Una trasformazione reversibile:",o:["aumenta sempre l'entropia dell'universo","lascia invariata l'entropia dell'universo","la diminuisce","avviene rapidamente","ha attriti"],a:1,s:"Le irreversibili la aumentano."},
{t:"u5d",k:"c",q:"Secondo l'interpretazione statistica, l'entropia cresce con il numero di ____ microscopici compatibili con lo stato macroscopico.",a:["STATI","MICROSTATI","MODI"],s:"Boltzmann: S = k ln W."},
{t:"u5d",k:"m",q:"1000 J di calore passano da un corpo a 400 K a uno a 200 K. La variazione di entropia totale è:",o:["−2,5 J/K","0","+2,5 J/K","+5 J/K","−5 J/K"],a:2,s:"−1000/400 + 1000/200 = −2,5 + 5."},
{t:"u5e",k:"m",q:"In inverno una maniglia di metallo sembra più fredda del legno alla stessa temperatura perché:",o:["è davvero più fredda","conduce meglio il calore e lo sottrae più in fretta alla mano","irraggia di più","fa più convezione","ha calore specifico nullo"],a:1,s:"Conta la conducibilità."},
{t:"u5e",k:"m",q:"Una coperta tiene caldo soprattutto perché:",o:["produce calore","intrappola aria, che conduce poco","riflette i raggi X","aumenta la convezione","ha alta conducibilità"],a:1,s:"L'aria ferma è un ottimo isolante."},
{t:"u5e",k:"c",q:"La conducibilità termica dei metalli è ____ di quella dell'aria (maggiore/minore).",a:["MAGGIORE"],s:"Migliaia di volte maggiore."},
/* u6 elettricità e magnetismo */
{t:"u6a",k:"m",q:"Due cariche si attraggono con forza F. Raddoppiando entrambe le cariche e la distanza, la forza diventa:",o:["F","2F","4F","F/4","16F"],a:0,s:"×4 per le cariche, ÷4 per la distanza."},
{t:"u6a",k:"m",q:"Strofinando una bacchetta di vetro con un panno di seta, il vetro si carica positivamente perché:",o:["acquista protoni","perde elettroni","perde protoni","acquista neutroni","crea carica"],a:1,s:"Si spostano solo gli elettroni; la carica si conserva."},
{t:"u6a",k:"c",q:"Nel SI la carica elettrica si misura in ____.",a:["COULOMB","C"],s:"1 C = 1 A·s."},
{t:"u6b",k:"m",q:"Le linee del campo elettrico:",o:["escono dalle cariche negative","escono dalle cariche positive ed entrano nelle negative","sono sempre chiuse","si incrociano","sono parallele alle equipotenziali"],a:1,s:"Sono perpendicolari alle equipotenziali."},
{t:"u6b",k:"m",q:"Tra due armature distanti 2 mm con una d.d.p. di 10 V il campo vale:",o:["5 V/m","20 V/m","5000 V/m","0,2 V/m","20 000 V/m"],a:2,s:"E = V/d = 10/0,002."},
{t:"u6b",k:"c",q:"Spostare una carica lungo una superficie equipotenziale richiede un lavoro ____.",a:["NULLO","ZERO","0"],s:"ΔV = 0."},
{t:"u6b",k:"m",q:"Il campo di una carica puntiforme, a distanza doppia, diventa:",o:["la metà","un quarto","il doppio","uguale","un ottavo"],a:1,s:"E ∝ 1/r²."},
{t:"u6c",k:"m",q:"Raddoppiando la distanza tra le armature di un condensatore piano, la capacità:",o:["raddoppia","si dimezza","quadruplica","resta uguale","si annulla"],a:1,s:"C = ε₀εᵣA/d."},
{t:"u6c",k:"m",q:"Un condensatore da 10 µF caricato a 100 V immagazzina:",o:["0,05 J","0,5 J","1 J","0,1 J","5 J"],a:0,s:"½ · 10⁻⁵ · 10⁴."},
{t:"u6c",k:"c",q:"L'unità di misura della capacità è il ____.",a:["FARAD","F"],s:"1 F = 1 C/V."},
{t:"u6c",k:"m",q:"Inserendo un dielettrico in un condensatore che resta collegato alla pila, la carica sulle armature:",o:["diminuisce","aumenta","resta uguale","si annulla","cambia segno"],a:1,s:"C aumenta e V è fissata: Q = CV aumenta."},
{t:"u6d",k:"m",q:"Un filo ha resistenza R. Un filo dello stesso materiale, lungo il doppio e con sezione doppia, ha resistenza:",o:["R","2R","R/2","4R","R/4"],a:0,s:"R = ρl/A: ×2 e ÷2."},
{t:"u6d",k:"m",q:"Tre resistenze da 30 Ω in parallelo equivalgono a:",o:["90 Ω","10 Ω","30 Ω","3 Ω","60 Ω"],a:1,s:"30/3."},
{t:"u6d",k:"c",q:"Una resistenza da 10 Ω percorsa da 2 A dissipa ____ W.",a:["40","QUARANTA"],s:"P = R·I²."},
{t:"u6d",k:"m",q:"Due lampadine uguali in serie a una pila: se una si brucia (circuito aperto), l'altra:",o:["si spegne","brilla di più","brilla uguale","brilla meno ma resta accesa","si brucia"],a:0,s:"In serie la corrente è unica: il circuito si interrompe."},
{t:"u6e",k:"m",q:"Una carica si muove parallela alle linee di un campo magnetico uniforme. La forza magnetica è:",o:["massima","nulla","uguale a qvB","diretta come B","opposta a v"],a:1,s:"sin 0° = 0."},
{t:"u6e",k:"m",q:"Un filo lungo 0,5 m percorso da 4 A è perpendicolare a un campo di 0,2 T. La forza sul filo è:",o:["0,4 N","0,1 N","4 N","0,8 N","2 N"],a:0,s:"F = I·l·B."},
{t:"u6e",k:"c",q:"Secondo la legge di ____ la corrente indotta si oppone alla variazione di flusso che l'ha generata.",a:["LENZ"],s:"È il segno meno della legge di Faraday-Neumann."},
{t:"u6e",k:"m",q:"Avvicinando un magnete a una spira ferma:",o:["non succede nulla","si induce una corrente nella spira","la spira si carica elettricamente","il magnete si smagnetizza","la spira si scalda senza corrente"],a:1,s:"Il flusso cambia."},
/* u7 radiazioni */
{t:"u7a",k:"m",q:"In ordine di frequenza crescente:",o:["raggi X, visibile, microonde","microonde, visibile, raggi X","visibile, microonde, raggi X","microonde, raggi X, visibile","hanno tutte la stessa frequenza"],a:1,s:"Radio < microonde < IR < visibile < UV < X < γ."},
{t:"u7a",k:"m",q:"Raddoppiando la frequenza di un fotone, la sua energia:",o:["raddoppia","si dimezza","quadruplica","resta uguale","aumenta di √2"],a:0,s:"E = hf."},
{t:"u7a",k:"c",q:"Le radiazioni capaci di strappare elettroni agli atomi si dicono ____.",a:["IONIZZANTI"],s:"X, γ, UV di alta energia."},
{t:"u7a",k:"m",q:"Quale radiazione è NON ionizzante?",o:["raggi X","raggi gamma","microonde","UV di alta energia","particelle alfa"],a:2,s:"Il singolo fotone ha troppa poca energia."},
{t:"u7b",k:"m",q:"L'angolo limite tra un mezzo con n = 2 e l'aria è:",o:["30°","45°","60°","90°","0°"],a:0,s:"sin θ_L = 1/2."},
{t:"u7b",k:"m",q:"Passando dall'aria all'acqua, la frequenza della luce:",o:["aumenta","diminuisce","resta uguale","si annulla","raddoppia"],a:2,s:"Cambiano velocità e lunghezza d'onda."},
{t:"u7b",k:"c",q:"Entrando in un mezzo con indice di rifrazione maggiore, il raggio si ____ alla normale (avvicina/allontana).",a:["AVVICINA"],s:"Snell."},
{t:"u7c",k:"m",q:"Un oggetto alto 2 cm è a 30 cm da una lente convergente con f = 10 cm. L'immagine è alta:",o:["1 cm","2 cm","4 cm","0,5 cm","6 cm"],a:0,s:"q = 15 cm, ingrandimento −15/30 = −0,5: 1 cm, capovolta."},
{t:"u7c",k:"m",q:"Una lente da +2,5 diottrie ha distanza focale:",o:["2,5 m","40 cm","25 cm","4 m","2,5 cm"],a:1,s:"f = 1/2,5 m."},
{t:"u7c",k:"c",q:"Se l'oggetto è nel fuoco di una lente convergente, l'immagine si forma all'____.",a:["INFINITO"],s:"I raggi escono paralleli."},
{t:"u7d",k:"m",q:"Uno strato trasmette il 50% della luce. Raddoppiando lo spessore, la trasmittanza diventa:",o:["25%","0%","100%","75%","12,5%"],a:0,s:"0,5 · 0,5."},
{t:"u7d",k:"m",q:"Una soluzione trasmette il 10% della luce. La sua assorbanza è:",o:["0,1","1","10","2","0,9"],a:1,s:"A = log(1/0,1)."},
{t:"u7d",k:"c",q:"Attraversando un mezzo assorbente l'intensità della luce cala in modo ____ con lo spessore.",a:["ESPONENZIALE"],s:"I = I₀·e^(−µx)."},
{t:"u7e",k:"m",q:"Nel decadimento β⁻ il numero atomico:",o:["aumenta di 1","diminuisce di 1","diminuisce di 2","resta uguale","aumenta di 2"],a:0,s:"Un neutrone diventa protone."},
{t:"u7e",k:"m",q:"Quale radiazione è fermata da un foglio di carta?",o:["alfa","beta","gamma","raggi X","neutroni"],a:0,s:"Poco penetrante, ma molto dannosa se inalata o ingerita."},
{t:"u7e",k:"c",q:"Dopo 3 tempi di dimezzamento resta 1/____ dei nuclei iniziali.",a:["8","OTTO"],s:"1/2³."},
{t:"u7e",k:"m",q:"Un campione ha attività 1600 Bq. Dopo 4 emivite l'attività è:",o:["400 Bq","200 Bq","100 Bq","50 Bq","0 Bq"],a:2,s:"1600/16."}
);

c1a:{breve:["Numero atomico Z = protoni (identifica l'elemento); numero di massa A = protoni + neutroni.","Isotopi: stesso Z, diverso numero di neutroni, quindi diversa A e stesse proprietà chimiche.","Ogni orbitale contiene al massimo 2 elettroni con spin opposto (Pauli); gli orbitali dello stesso livello si riempiono prima singolarmente (Hund).","Lungo un periodo (verso destra) il raggio diminuisce, mentre energia di ionizzazione ed elettronegatività aumentano; lungo un gruppo (verso il basso) vale il contrario."],
 sp:["L'atomo ha un nucleo piccolissimo con protoni (+) e neutroni (neutri) e intorno gli elettroni (−). In un atomo neutro gli elettroni sono uguali ai protoni. Il numero atomico Z (protoni) decide di che elemento si tratta; il numero di massa A = Z + N conta anche i neutroni. Gli isotopi (¹²C, ¹³C, ¹⁴C) hanno lo stesso Z e diversi neutroni: si comportano allo stesso modo nelle reazioni.",
 "Gli elettroni occupano orbitali descritti da quattro numeri quantici: n (livello, la grandezza), l (forma: 0 = s, 1 = p, 2 = d, 3 = f), mₗ (orientazione: da −l a +l, quindi 1 orbitale s, 3 p, 5 d, 7 f) e mₛ (spin, ±½). Per il principio di Pauli due elettroni non possono avere tutti e quattro i numeri uguali: un orbitale ne contiene al massimo 2, qualunque sia l. Un livello n ne contiene al massimo 2n².",
 "La configurazione elettronica si costruisce riempiendo gli orbitali per energia crescente: 1s 2s 2p 3s 3p 4s 3d 4p… Negli orbitali p o d dello stesso livello gli elettroni si dispongono prima uno per orbitale, con spin paralleli (regola di Hund). Esempio: l'ossigeno (Z = 8) è 1s² 2s² 2p⁴, con 2 elettroni spaiati.",
 "La tavola periodica ordina gli elementi per Z. Gli elementi dello stesso gruppo hanno la stessa configurazione esterna e proprietà simili. L'elettronegatività (tendenza ad attirare gli elettroni di legame) cresce verso destra e verso l'alto: il fluoro è il più elettronegativo, poi ossigeno, azoto e cloro. Gli elementi più presenti negli organismi sono C, H, O, N, P e S.",
 "Cenni sulla risonanza magnetica: i nuclei con numero dispari di nucleoni, come ¹H, hanno uno spin e si comportano come piccoli magneti. In un campo magnetico intenso assorbono e riemettono onde radio a una frequenza tipica: la RM sfrutta l'idrogeno dell'acqua dei tessuti."],
