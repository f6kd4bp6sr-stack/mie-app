   - nessun server: la chiave pubblica resta su questo dispositivo e la firma si verifica qui;
   - codice di riserva (4–8 cifre) se la passkey non fosse disponibile;
   - si riblocca dopo 5 minuti fuori dall'app. I dati restano dove sono: il blocco protegge l'apertura, non cifra i dati. */

(function(){
  "use strict";
  var KEY="pn-lock", SES="pn-unlocked", IDLE=5*60*1000;

  function unlocked(){try{var t=+sessionStorage.getItem(SES)||0;return t&&Date.now()-t<IDLE;}catch(e){return false;}}

  if(C&&C.on&&!unlocked())root.classList.add("locked");
  var b64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};

  function msg(t){var e=document.getElementById("lkMsg");if(e)e.textContent=t;}
  var busy=false;

  };

<script>
/* ================= 🤝 METODO =================
   Allenamento alla simpatia, in tono ironico: 4 abilità, una a settimana (👋 Aprire · 💬 Tenere viva la chiacchierata · 🔁 Farsi vivo ·
   😊 Calore), poi si riparte con missioni più impegnative. 🃏 Oggi: 3 carte coperte (Riscaldamento, Si fa sul serio, Da leoni),
   la curiosità e la frase del giorno. 🧠 Lo sapevi? (curiosità con la scienza e le fonti dietro «Da dove viene?»). 💬 Frasi di scorta.
   🤲 Volontariato a Torino (file pubblico occasioni-torino.json, ricontrollato dall'attività programmata).
   Ogni finestra si apre e si chiude; lo stato resta su questo iPad (pn-metfold). Contenuti in sezioni/metodo_dati.json, controllati a ogni
   build da strumenti/verifica_metodo.py. Dati personali solo su questo dispositivo: localStorage «pn-v1» → «met» (+ database «licenze-marco»,
   voce «pianifica»), quindi nelle copie giornaliere e su iCloud. Nessun dato personale nel codice. */
"use strict";
const MD={"abilita":[{"id":"aprire","ic":"👋","n":"Aprire","sotto":"salutare per primo, usare il nome, partire da quello che c'è intorno","motto":"il ghiaccio non si rompe da solo"},{"id":"viva","ic":"💬","n":"Tenere viva la chiacchierata","sotto":"la seconda domanda, ascoltare davvero, raccontare qualcosa di sé","motto":"vietato fermarsi al «bene, grazie»"},{"id":"vivo","ic":"🔁","n":"Farsi vivo","sotto":"un messaggio senza motivo, «com'è andata poi?», un grazie","motto":"ricordati di esistere (per gli altri)"},{"id":"calore","ic":"😊","n":"Calore","sotto":"complimenti precisi, entusiasmo per le buone notizie, meno formalità","motto":"meno sportello, più bar"}],"situazioni":{"nuove":"👤 persone nuove","colleghi":"🧑‍💼 colleghi ed ex colleghi","famiglia":"🏡 famiglia e amici","gruppi":"👥 gruppi","vol":"🤲 volontariato"},"livelli":{"1":"Riscaldamento","2":"Si fa sul serio","3":"Da leoni"},"intro":"Allenamento alla simpatia, un giorno alla volta. Niente compiti: missioni da pescare, curiosità che sorprendono e qualche figuraccia da ridere.","schede":[{"id":"a1","ab":"aprire","tit":"Saluta per primo","princ":"Un saluto per primo, con un sorriso e guardando negli occhi, dice «mi fa piacere vederti» prima di ogni parola.","es":"Al bar, prima di ordinare: «Buongiorno! Come va stamattina?»","frase":"Buongiorno, come va oggi?","app":{"come":"Nello studio, alcuni clienti di una caffetteria dovevano essere il più rapidi possibile; altri dovevano avere uno scambio sincero con chi serviva: sorridere, guardarlo negli occhi, fare due chiacchiere. Chi aveva chiacchierato usciva di umore migliore e si sentiva più parte di una comunità.","prova":["Guarda in faccia e sorridi prima di parlare.","Aggiungi una domanda leggera: «Tutto bene oggi?»","Ricambia sempre il saluto, anche di chi conosci appena."],"att":"Se l'altro ha fretta o una fila davanti, un sorriso e un grazie sono già un saluto riuscito.","fonti":[{"c":"Sandstrom, G. M., & Dunn, E. W. (2014). Is efficiency overrated? Minimal social interactions lead to belonging and positive affect. Social Psychological and Personality Science, 5(4), 437–442.","t":"studio","url":"https://doi.org/10.1177/1948550613502990"}]},"curio":{"tit":"Il barista ti fa bene all'umore","fatto":"In un esperimento, chi scambiava due parole sincere con il barista usciva di umore migliore di chi ordinava e scappava. Stesso caffè, umore diverso.","trad":"Un «buongiorno, come va?» costa zero e rende parecchio."}},{"id":"a2","ab":"aprire","tit":"Usa il nome","princ":"Sentire il proprio nome fa sentire riconosciuti. Quando ti presentano qualcuno, ripeti subito il nome e usalo ancora una volta mentre parlate.","es":"«Piacere, Laura! Da quanto vieni qui?» E più avanti, salutando: «Ciao Laura, a presto!»","frase":"Scusa, mi ripeti il nome? Ci tengo a ricordarlo.","app":{"come":"Per ricordare un nome conta soprattutto richiamarlo a mente: chi prova a ricordarselo dopo poco, poi a intervalli sempre più lunghi, lo ricorda meglio di chi si limita a risentirlo o rileggerlo. Aiuta anche dargli un significato, collegandolo a qualcosa che il nome ti fa venire in mente o che sai di quella persona.","prova":["Appena senti il nome, usalo nella risposta: «Piacere, Laura!»","Dopo un paio di minuti, richiamalo a mente senza dirlo.","Collegalo a un dettaglio: «Laura, quella del cane bianco»."],"att":"Non ripeterlo troppe volte di fila: suona da venditore. Se l'hai dimenticato, chiedilo con naturalezza: capita a tutti.","fonti":[{"c":"Morris, P. E., Fritz, C. O., Jackson, L., Nichol, E., & Roberts, E. (2005). Strategies for learning proper names: Expanding retrieval practice, meaning and imagery. Applied Cognitive Psychology, 19, 779–798.","t":"studio","url":"https://doi.org/10.1002/acp.1115"},{"c":"Brédart, S. (2019). Strategies to improve name learning: A review. European Psychologist, 24(4), 349–358.","t":"studio","url":"https://doi.org/10.1027/1016-9040/a000363"}]},"curio":{"tit":"Il trucco dei nomi","fatto":"Per ricordare un nome, risentirlo tante volte serve meno che sforzarsi di richiamarlo a mente dopo un po', e poi ancora più tardi. La memoria è pigra: va interrogata.","trad":"Tra cinque minuti chiediti: «Come si chiamava?»"}},{"id":"a3","ab":"aprire","tit":"Parti da quello che avete intorno","princ":"Non serve una frase brillante: basta un'osservazione su quello che condividete in quel momento (il posto, l'attesa, l'evento) e una domanda.","es":"In fila: «C'è sempre così tanta gente il sabato?»","frase":"È la prima volta che vieni qui?","app":{"come":"Sui treni e sugli autobus di Chicago, ad alcuni pendolari fu chiesto di parlare con uno sconosciuto, ad altri di restare per conto proprio. Altri pendolari, a cui si chiedeva solo di immaginare la scena, pensavano che il silenzio sarebbe stato più piacevole e che gli altri non avessero voglia di parlare. Invece chi aveva chiacchierato raccontava un viaggio più piacevole.","prova":["Cerca una cosa che vedete tutti e due: il tempo, la fila, il posto.","Trasforma l'osservazione in una domanda aperta.","Se l'altro risponde a monosillabi, saluta con un sorriso: va bene così."],"att":"Rispetta chi ha le cuffie, legge o ha fretta: sono segnali di voler stare per conto proprio.","fonti":[{"c":"Epley, N., & Schroeder, J. (2014). Mistakenly seeking solitude. Journal of Experimental Psychology: General, 143(5), 1980–1999.","t":"studio","url":"https://doi.org/10.1037/a0037323"},{"c":"Sandstrom, G. M., & Boothby, E. J. (2021). Why do people avoid talking to strangers? A mini meta-analysis of predicted fears and actual experiences talking to a stranger. Self and Identity, 20(1), 47–71.","t":"studio","url":"https://doi.org/10.1080/15298868.2020.1816568"}]},"curio":{"tit":"Lo sconosciuto del tram","fatto":"Sui mezzi pubblici di Chicago, chi attaccava discorso con uno sconosciuto faceva un viaggio più piacevole di chi stava zitto. E i rifiuti temuti? Per quanto risultò ai ricercatori, nessuno.","trad":"Lo sconosciuto del tram ha più voglia di parlare di quanto sembri."}},{"id":"a4","ab":"aprire","tit":"Anche le chiacchiere brevi contano","princ":"Non contano solo gli amici stretti: anche gli scambi con i conoscenti (il vicino, il giornalaio, chi incontri al corso) fanno stare meglio e sentire parte di una comunità.","es":"Due parole con il fornaio sul pane del giorno, un saluto al vicino che porta fuori il cane.","frase":"Allora, come va oggi?","app":{"come":"Per alcuni giorni i partecipanti hanno contato le persone con cui parlavano. Nei giorni in cui avevano parlato con più conoscenti, e non solo con amici e familiari, si sentivano più felici e più legati agli altri.","prova":["Scegli 2 o 3 conoscenti fissi (il bar, l'edicola, il vicino) e salutali per nome.","Ogni volta aggiungi una piccola domanda o un commento.","Ricordati di una cosa che ti hanno detto e chiedine la volta dopo."],"att":"Sono scambi brevi: non serve trasformarli in lunghe conversazioni.","fonti":[{"c":"Sandstrom, G. M., & Dunn, E. W. (2014). Social interactions and well-being: The surprising power of weak ties. Personality and Social Psychology Bulletin, 40(7), 910–922.","t":"studio","url":"https://doi.org/10.1177/0146167214529799"}]},"curio":{"tit":"La forza dei conoscenti","fatto":"Non contano solo gli amici del cuore: nei giorni in cui chiacchieriamo con più conoscenti (il giornalaio, il vicino, quello del corso) ci sentiamo più felici.","trad":"Anche il giornalaio fa parte della tua squadra."}},{"id":"a5","ab":"aprire","tit":"Farsi vedere conta","princ":"Più vediamo una faccia, più ci sta simpatica, anche senza parlarci. Frequentare spesso gli stessi posti (il bar, il mercato, la bocciofila) prepara il terreno.","es":"Fare la spesa sempre il sabato mattina, allo stesso banco del mercato.","frase":"Ci vediamo sabato, come sempre!","curio":{"tit":"La faccia nota piace di più","fatto":"In un'aula universitaria quattro ragazze sono venute a lezione 0, 5, 10 o 15 volte, senza parlare con nessuno. A fine corso, più erano venute, più gli studenti le trovavano simpatiche.","trad":"Prima di parlare, fatti vedere: sempre allo stesso bar."},"app":{"come":"Quattro collaboratrici dei ricercatori, simili d'aspetto, hanno frequentato un corso molto numeroso un numero diverso di volte, sedute in vista e senza parlare con nessuno. A fine corso gli studenti guardavano le loro foto: quelle viste più spesso sembravano più simpatiche e attraenti, anche se quasi nessuno ricordava di averle viste. È l'«effetto della semplice esposizione», reso famoso dagli esperimenti di Zajonc (1968).","prova":["Scegli un posto fisso e torna sempre alla stessa ora.","Saluta le facce che rivedi, anche solo con un cenno.","Dopo qualche volta, aggiungi due parole."],"att":"L'effetto è piccolo e vale soprattutto con persone neutre o già gradite: non trasforma un'antipatia in simpatia.","fonti":[{"c":"Moreland, R. L., & Beach, S. R. (1992). Exposure effects in the classroom: The development of affinity among students. Journal of Experimental Social Psychology, 28(3), 255–276.","t":"studio","url":"https://doi.org/10.1016/0022-1031(92)90055-O"},{"c":"Zajonc, R. B. (1968). Attitudinal effects of mere exposure. Journal of Personality and Social Psychology, 9(2, Pt. 2), 1–27.","t":"studio","url":"https://doi.org/10.1037/h0025848"}]}},{"id":"a6","ab":"aprire","tit":"Nessuno ti guarda così tanto","princ":"Pensiamo che gli altri notino ogni nostro errore o ogni macchia sulla camicia: in realtà ci guardano molto meno di quanto crediamo. Saperlo toglie un po' di paura di sbagliare.","es":"Ti si incastra una parola mentre ti presenti? Sorridi e vai avanti: quasi nessuno ci fa caso.","frase":"Scusa, mi sono incartato: ricomincio!","curio":{"tit":"L'effetto riflettore","fatto":"Studenti con una maglietta imbarazzante pensavano che metà della stanza l'avesse notata. In realtà se n'era accorto circa un quarto dei presenti. Il riflettore che senti addosso è molto più piccolo.","trad":"Sbaglia pure con serenità: il pubblico è distratto."},"app":{"come":"Ai partecipanti veniva chiesto di indossare una maglietta con la faccia di un cantante poco alla moda e di entrare per poco in una stanza dove c'erano altri studenti. Poi dovevano stimare quanti l'avessero notata: in media pensavano circa la metà, mentre in realtà erano molti meno. Lo stesso succedeva con le piccole gaffe durante una discussione di gruppo.","prova":["Quando sbagli, sorridi e vai avanti.","Chiediti: «Me ne accorgerei, se lo facesse un altro?»","Trasforma l'errore in una battuta su di te."],"att":"Non vuol dire che nessuno ti nota: vuol dire che gli altri sono occupati soprattutto con se stessi, proprio come te.","fonti":[{"c":"Gilovich, T., Medvec, V. H., & Savitsky, K. (2000). The spotlight effect in social judgment: An egocentric bias in estimates of the salience of one's own actions and appearance. Journal of Personality and Social Psychology, 78(2), 211–222.","t":"studio","url":"https://doi.org/10.1037/0022-3514.78.2.211"}]}},{"id":"a7","ab":"aprire","tit":"Una settimana di caccia al tesoro","princ":"Parlare con gli sconosciuti si impara: dopo qualche giorno di prove, la paura cala e ci si sente più capaci di conversare. È proprio l'idea delle missioni di questa pagina.","es":"Una missione al giorno per una settimana: il barista, il vicino in fila, la signora con il cane.","frase":"Posso chiederle una cosa?","curio":{"tit":"Le missioni funzionano (lo dice uno studio)","fatto":"In un esperimento, alcuni studenti hanno ricevuto per cinque giorni da un'app missioni per parlare con sconosciuti, un po' come qui. Alla fine temevano meno di essere respinti, e l'effetto c'era ancora una settimana dopo.","trad":"Una missione al giorno toglie la paura di torno."},"app":{"come":"Per cinque giorni un gruppo di studenti universitari, nel Regno Unito e negli Stati Uniti, riceveva da un'app missioni da caccia al tesoro: trovare uno sconosciuto con una certa caratteristica (per esempio qualcuno con il cappello o che beve un caffè) e parlarci. Un altro gruppo doveva solo osservare quelle persone, senza parlarci. Chi aveva parlato temeva meno il rifiuto e si sentiva più capace di portare avanti una conversazione, anche una settimana dopo la fine.","prova":["Una sola missione al giorno, anche piccola.","Dopo, nota com'è andata davvero rispetto a quanto temevi.","Aumenta il livello quando ti senti pronto."],"att":"Lo studio è stato fatto con studenti universitari nel Regno Unito e negli Stati Uniti: con adulti più grandi i dettagli possono cambiare, ma l'idea di allenarsi un po' alla volta regge.","fonti":[{"c":"Sandstrom, G. M., Boothby, E. J., & Cooney, G. (2022). Talking to strangers: A week-long intervention reduces psychological barriers to social connection. Journal of Experimental Social Psychology, 102, 104356.","t":"studio","url":"https://doi.org/10.1016/j.jesp.2022.104356"}]}},{"id":"a8","ab":"aprire","tit":"Il punto in comune","princ":"Ci piace chi sentiamo simile a noi. Trovare presto un punto in comune (un posto, una passione, un ricordo) accorcia le distanze.","es":"«Anche lei va al mercato di Porta Palazzo? Qual è il suo banco preferito?»","frase":"Ah, anche tu? Allora dobbiamo parlarne!","curio":{"tit":"Anche tu? Allora parliamone","fatto":"Mettendo insieme oltre 300 studi, i ricercatori hanno visto che ci piace di più chi sentiamo simile a noi. Conta soprattutto la somiglianza che percepiamo: a volte basta scoprire un punto in comune.","trad":"Cerca l'«anche tu?» nei primi cinque minuti."},"app":{"come":"La meta-analisi ha riunito i risultati di centinaia di studi sull'attrazione tra persone. Tra chi non si conosceva ancora, anche la somiglianza reale (opinioni, gusti) aumentava l'attrazione; nelle relazioni già avviate contava soprattutto sentirsi simili, cioè la somiglianza percepita.","prova":["Fai domande su gusti e abitudini, non solo sul lavoro.","Quando trovi un punto in comune, dillo ad alta voce.","Approfondiscilo con una seconda domanda."],"att":"Non inventare somiglianze che non ci sono: si sente subito. E anche le differenze, raccontate con curiosità, fanno conversazione.","fonti":[{"c":"Montoya, R. M., Horton, R. S., & Kirchner, J. (2008). Is actual similarity necessary for attraction? A meta-analysis of actual and perceived similarity. Journal of Social and Personal Relationships, 25(6), 889–922.","t":"studio","url":"https://doi.org/10.1177/0265407508096700"}]}},{"id":"v1","ab":"viva","tit":"La seconda domanda","princ":"Dopo una risposta, fai una domanda proprio su quello che l'altro ha appena detto. È il segno più chiaro che lo stai ascoltando.","es":"«Sono stato in montagna.» «Ah sì? Dove? Che cosa ti è piaciuto di più?»","frase":"E poi com'è andata?","app":{"come":"I ricercatori hanno analizzato centinaia di conversazioni, anche in chat e negli incontri di speed date. Chi faceva più domande piaceva di più, e a fare la differenza erano proprio le domande di approfondimento, quelle che riprendono quello che l'altro ha appena detto. Un altro studio mostra che parlare di sé è piacevole per il cervello: per questo una buona domanda è un regalo.","prova":["Ascolta la parola importante della risposta e chiedi proprio di quella.","Usa domande aperte: «Com'è stato?», «Che cosa ti è piaciuto?»","Dopo due o tre domande, racconta qualcosa di tuo."],"att":"Non trasformarla in un interrogatorio: alterna le domande a qualche tuo pensiero.","fonti":[{"c":"Huang, K., Yeomans, M., Brooks, A. W., Minson, J., & Gino, F. (2017). It doesn't hurt to ask: Question-asking increases liking. Journal of Personality and Social Psychology, 113(3), 430–452.","t":"studio","url":"https://doi.org/10.1037/pspi0000097"},{"c":"Tamir, D. I., & Mitchell, J. P. (2012). Disclosing information about the self is intrinsically rewarding. Proceedings of the National Academy of Sciences, 109(21), 8038–8043.","t":"studio","url":"https://doi.org/10.1073/pnas.1202129109"},{"c":"Yeomans, M., Brooks, A. W., Huang, K., Minson, J., & Gino, F. (2019). It helps to ask: The cumulative benefits of asking follow-up questions. Journal of Personality and Social Psychology, 117(6), 1139–1144.","t":"studio","url":"https://doi.org/10.1037/pspi0000220"}]},"curio":{"tit":"Le domande ti rendono simpatico","fatto":"Analizzando centinaia di conversazioni, i ricercatori hanno visto che chi fa più domande di approfondimento piace di più. E secondo un altro studio, parlare di sé attiva nel cervello aree legate alla ricompensa: una buona domanda è un piccolo regalo.","trad":"«E poi?» è la frase più simpatica della lingua italiana."}},{"id":"v2","ab":"viva","tit":"Ascolta senza preparare la risposta","princ":"Mentre l'altro parla, ascolta invece di pensare a cosa dirai. Poi ripeti con parole tue quello che hai capito, senza spostare subito il discorso su di te.","es":"«Quindi il trasloco ti ha sfinito, ma la casa nuova ti piace?»","frase":"Quindi, se ho capito bene…","app":{"come":"In uno studio, alcuni studenti parlavano con un compagno addestrato dai ricercatori dei loro programmi per il fine settimana e di una delusione vissuta all'università. Chi si sentiva riformulare quello che aveva detto, con l'invito a raccontare di più, si sentiva più capito di chi riceveva consigli o solo cenni di assenso. In uno studio precedente riformulare rendeva l'ascoltatore più simpatico, ma non faceva sentire più capiti: meglio usarlo con misura e con parole proprie.","prova":["Mentre l'altro parla, guarda lui e non il telefono.","Riassumi in una frase quello che hai capito.","Chiedi «Ho capito bene?» e lascia che ti corregga."],"att":"Non ripetere a pappagallo: usa parole tue, e solo ogni tanto, quando il discorso è importante.","fonti":[{"c":"Weger, H., Jr., Castle Bell, G., Minei, E. M., & Robinson, M. C. (2014). The relative effectiveness of active listening in initial interactions. International Journal of Listening, 28(1), 13–31.","t":"studio","url":"https://doi.org/10.1080/10904018.2013.813234"},{"c":"Weger, H., Jr., Castle, G. R., & Emmett, M. C. (2010). Active listening in peer interviews: The influence of message paraphrasing on perceptions of listening skill. International Journal of Listening, 24(1), 34–49.","t":"studio","url":"https://doi.org/10.1080/10904010903466311"},{"c":"Kluger, A. N., & Itzchakov, G. (2022). The power of listening at work. Annual Review of Organizational Psychology and Organizational Behavior, 9, 121–146.","t":"studio","url":"https://doi.org/10.1146/annurev-orgpsych-012420-091013"}]},"curio":{"tit":"Lo specchio che fa sentire capiti","fatto":"In uno studio, riassumere con parole proprie quello che l'altro aveva detto, e invitarlo a raccontare di più, lo faceva sentire più capito di un consiglio. Senza esagerare: il pappagallo non ha mai vinto premi di simpatia.","trad":"Prima di consigliare, riassumi."}},{"id":"v3","ab":"viva","tit":"Racconta qualcosa di te","princ":"Una chiacchierata è uno scambio: dopo aver ascoltato, racconta un tuo pezzetto simile, poi ripassa la parola. La confidenza cresce un passo alla volta, da tutte e due le parti.","es":"«Anch'io ho cambiato casa due anni fa: il peggio sono stati gli scatoloni dei libri! A te che cosa è pesato di più?»","frase":"Mi è successa una cosa simile…","app":{"come":"Coppie di sconosciuti passavano circa 45 minuti a rispondere, a turno, a 36 domande sempre più personali, dai gusti di tutti i giorni ai ricordi importanti. Alla fine si sentivano più vicini delle coppie che avevano fatto solo chiacchiere superficiali. Il segreto è la reciprocità: un passo io, un passo tu.","prova":["Dopo aver ascoltato, racconta un tuo episodio simile, breve.","Torna subito all'altro: «E tu come l'hai vissuta?»","Scendi un gradino alla volta: prima i gusti, poi i ricordi, solo dopo le cose più personali."],"att":"Non rubare la scena: il tuo racconto deve essere più breve del suo.","fonti":[{"c":"Aron, A., Melinat, E., Aron, E. N., Vallone, R. D., & Bator, R. J. (1997). The experimental generation of interpersonal closeness: A procedure and some preliminary findings. Personality and Social Psychology Bulletin, 23(4), 363–377.","t":"studio","url":"https://doi.org/10.1177/0146167297234003"},{"c":"Sprecher, S., Treger, S., Wondra, J. D., Hilaire, N., & Wallpe, K. (2013). Taking turns: Reciprocal self-disclosure promotes liking in initial interactions. Journal of Experimental Social Psychology, 49, 860–866.","t":"studio","url":"https://doi.org/10.1016/j.jesp.2013.03.017"},{"c":"Greater Good in Action, University of California, Berkeley (s.d.). 36 Questions for Increasing Closeness.","t":"articolo","url":"https://ggia.berkeley.edu/practice/36_questions_for_increasing_closeness"}]},"curio":{"tit":"Un passo io, un passo tu","fatto":"Due sconosciuti che si raccontano cose di sé, a turno e un gradino alla volta, finiscono per sentirsi più vicini. Il segreto è il turno: se parla uno solo, è un comizio.","trad":"Hai ascoltato? Ora racconta un pezzetto tuo."}},{"id":"v4","ab":"viva","tit":"Chiudi quando è ancora bello","princ":"Le conversazioni non finiscono quasi mai quando tutti e due lo vorrebbero, e spesso non sappiamo indovinare che cosa vuole l'altro. Chiudere con calore, quando la chiacchierata è ancora piacevole, lascia un buon ricordo e la voglia di rivedersi.","es":"«Che bello sentirti! Ti lascio andare, ma riprendiamo presto il discorso del viaggio.»","frase":"Mi ha fatto piacere parlare con te: riprendiamo presto!","app":{"come":"I ricercatori hanno chiesto a centinaia di persone, dopo una conversazione, quando avrebbero voluto che finisse e quando pensavano che lo volesse l'altro. Quasi mai era finita quando lo volevano tutti e due; spesso uno avrebbe voluto continuare o smettere prima, e le previsioni su che cosa voleva l'altro erano molto imprecise.","prova":["Chiudi con una frase calda, non con una scusa.","Lascia un aggancio per la prossima volta: «Poi mi racconti com'è andata.»","Se l'altro guarda l'orologio, chiudi tu, con il sorriso."],"att":"Non serve indovinare: nessuno ci riesce bene. Chiudi con calore e lascia la porta aperta: «Ti lascio andare, ma mi piacerebbe continuare un'altra volta.»","fonti":[{"c":"Mastroianni, A. M., Gilbert, D. T., Cooney, G., & Wilson, T. D. (2021). Do conversations end when people want them to? Proceedings of the National Academy of Sciences, 118(10), e2011809118.","t":"studio","url":"https://doi.org/10.1073/pnas.2011809118"}]},"curio":{"tit":"Nessuno sa quando finire","fatto":"Su 932 conversazioni studiate, quasi nessuna è finita quando lo volevano tutti e due: tra coppie di sconosciuti, solo il 2% circa. Spesso uno avrebbe voluto continuare o scappare prima, e l'altro non lo indovinava.","trad":"Chiudi tu, con calore, quando è ancora bello."}},{"id":"v5","ab":"viva","tit":"Le domande profonde spaventano più del dovuto","princ":"Pensiamo che con chi conosciamo poco si possa parlare solo del tempo. In realtà anche gli sconosciuti apprezzano una domanda più personale, e la conversazione riesce meglio del previsto.","es":"«Che cosa ti ha reso contento quest'anno?» al posto di «Brutto tempo, eh?»","frase":"Posso farti una domanda un po' diversa dal solito?","curio":{"tit":"Il tempo è sopravvalutato (come argomento)","fatto":"In una serie di esperimenti, coppie di sconosciuti rispondevano a domande più personali del solito. Prima pensavano che sarebbe stato imbarazzante; poi è risultato più piacevole e meno imbarazzante del previsto.","trad":"Ogni tanto salta il meteo e vai al sodo, con garbo."},"app":{"come":"Coppie di sconosciuti rispondevano a domande superficiali oppure profonde. Prima prevedevano che le domande profonde sarebbero state più imbarazzanti e meno piacevoli, anche perché pensavano che all'altro interessasse poco. Dopo, le conversazioni profonde risultavano più piacevoli e creavano più vicinanza di quanto si aspettassero.","prova":["Prepara una domanda «un gradino più su» del solito.","Falla dopo un po' di chiacchiere leggere.","Rispondi anche tu, con sincerità."],"att":"Profondo non vuol dire invadente: niente domande su salute, soldi o guai di famiglia a chi conosci appena.","fonti":[{"c":"Kardas, M., Kumar, A., & Epley, N. (2022). Overly shallow?: Miscalibrated expectations create a barrier to deeper conversation. Journal of Personality and Social Psychology, 122(3), 367–398.","t":"studio","url":"https://doi.org/10.1037/pspa0000281"}]}},{"id":"v6","ab":"viva","tit":"Chiedere un consiglio fa bella figura","princ":"Temiamo che chiedere un consiglio ci faccia sembrare meno capaci. Spesso succede il contrario: chi chiede un consiglio a chi se ne intende sembra più competente, e l'altro si sente stimato.","es":"«Tu che di vini te ne intendi: per una cena con amici che cosa porteresti?»","frase":"Tu che te ne intendi: che cosa mi consigli?","curio":{"tit":"Il consiglio che ti fa sembrare più bravo","fatto":"Chiedere un consiglio sembra un segno di debolezza, ma negli esperimenti succedeva il contrario: chi lo chiedeva sembrava più competente, soprattutto se la domanda era difficile. E chi riceve la domanda si sente stimato.","trad":"«Tu che te ne intendi…» apre molte conversazioni."},"app":{"come":"Nei loro esperimenti i partecipanti lavoravano a un compito con un partner (in realtà simulato) che chiedeva o non chiedeva un consiglio. Chi lo chiedeva era giudicato più competente; l'effetto era più forte quando il compito era difficile e quando il consiglio era chiesto proprio a chi poi dava il giudizio, perché lo faceva sentire apprezzato.","prova":["Pensa a una cosa in cui l'altro è bravo.","Chiedi un consiglio preciso, non generico.","Poi fagli sapere com'è andata."],"att":"Funziona se la domanda è sincera e su una cosa in cui l'altro se ne intende: su cose banali o facilissime l'effetto sparisce.","fonti":[{"c":"Brooks, A. W., Gino, F., & Schweitzer, M. E. (2015). Smart people ask for (my) advice: Seeking advice boosts perceptions of competence. Management Science, 61(6), 1421–1435.","t":"studio","url":"https://doi.org/10.1287/mnsc.2014.2054"}]}},{"id":"v7","ab":"viva","tit":"Più sostanza, più felicità","princ":"Le chiacchiere leggere vanno benissimo per cominciare, ma sono le conversazioni con un po' di sostanza (idee, esperienze, progetti) a lasciare il segno.","es":"Dal «Che caldo oggi» a «Tu come passi l'estate, di solito?»","frase":"E tu che cosa ne pensi, davvero?","curio":{"tit":"Il registratore della felicità","fatto":"Un piccolo registratore ha catturato frammenti delle giornate di alcuni studenti: i più felici parlavano di più con gli altri, con meno chiacchiere leggere e più conversazioni di sostanza. Uno studio più ampio ha confermato il legame con la sostanza.","trad":"Il meteo per cominciare, poi un argomento vero."},"app":{"come":"I partecipanti portavano con sé per alcuni giorni un registratore che si accendeva da solo per pochi secondi, a intervalli. I ricercatori hanno contato il tempo passato da soli, a parlare, in chiacchiere leggere o in conversazioni di sostanza. I più felici erano più spesso in compagnia e avevano più conversazioni di sostanza. Uno studio più grande ha confermato il legame con le conversazioni di sostanza; le chiacchiere leggere non risultavano né positive né negative.","prova":["Dopo i convenevoli, porta il discorso su un'esperienza o un'idea.","Chiedi «perché?» e «come mai?»","Racconta anche tu una cosa che ti sta a cuore."],"att":"È un legame, non una prova di causa: forse chi è felice cerca conversazioni più profonde, o il contrario. Provarci comunque non costa niente.","fonti":[{"c":"Mehl, M. R., Vazire, S., Holleran, S. E., & Clark, C. S. (2010). Eavesdropping on happiness: Well-being is related to having less small talk and more substantive conversations. Psychological Science, 21(4), 539–541.","t":"studio","url":"https://doi.org/10.1177/0956797610362675"},{"c":"Milek, A., Butler, E. A., Tackman, A. M., Kaplan, D. M., Raison, C. L., Sbarra, D. A., Vazire, S., & Mehl, M. R. (2018). “Eavesdropping on happiness” revisited: A pooled, multisample replication of the association between life satisfaction and observed daily conversation quantity and quality. Psychological Science, 29(9), 1451–1462.","t":"studio","url":"https://doi.org/10.1177/0956797618774252"}]}},{"id":"f1","ab":"vivo","tit":"Un messaggio senza motivo","princ":"Non serve un'occasione per farsi sentire: «ho pensato a te» basta, ed è proprio la sorpresa che fa piacere.","es":"«Ciao! Sono passato davanti alla pizzeria dove andavamo e mi sei venuto in mente. Come stai?»","frase":"Mi sei venuto in mente: come stai?","app":{"come":"In una serie di esperimenti, alcune persone mandavano un breve messaggio o un piccolo pensiero a qualcuno che non sentivano da tempo, e prima dovevano indovinare quanto gli avrebbe fatto piacere. Chi lo riceveva lo apprezzava più di quanto si aspettasse chi lo mandava, soprattutto quando era una sorpresa.","prova":["Pensa a una persona che non senti da mesi.","Scrivi due righe concrete: dove ti è venuta in mente e perché.","Chiudi con una domanda semplice: «Come stai?»"],"att":"Se l'altro risponde poco o tardi, non è un rifiuto: spesso è solo fretta.","fonti":[{"c":"Liu, P. J., Rim, S., Min, L., & Min, K. E. (2023). The surprise of reaching out: Appreciated more than we think. Journal of Personality and Social Psychology, 124(4), 754–771.","t":"studio","url":"https://doi.org/10.1037/pspi0000402"},{"c":"American Psychological Association (2022). Friends enjoy being reached out to more than we think.","t":"articolo","url":"https://www.apa.org/news/press/releases/2022/07/friends-enjoy-being-reached"}]},"curio":{"tit":"Il messaggio a sorpresa","fatto":"Chi riceve un messaggio inatteso da qualcuno che non sente da tempo lo apprezza più di quanto immagini chi lo manda, soprattutto se è una sorpresa.","trad":"Quel «come stai?» che rimandi da mesi: mandalo."}},{"id":"f2","ab":"vivo","tit":"Com'è andata poi?","princ":"Ricordati di una cosa importante che l'altro ti ha raccontato (un esame, un viaggio, un trasloco) e chiedine notizie dopo. Annota in «Com'è andata» solo quello che ti serve per chiedere notizie.","es":"«Allora, com'è andato poi il colloquio di tuo figlio?»","frase":"Com'è andata poi con…?","app":{"come":"Secondo il modello dell'intimità di Reis e Shaver, un legame cresce quando una persona si apre e l'altra risponde mostrando di aver capito, di apprezzarla e di tenerci. Ricordarsi di una cosa importante e chiederne notizie in seguito è uno dei modi più chiari per dimostrarlo.","prova":["Dopo un incontro, annota una cosa che l'altro aspettava o temeva.","La volta dopo chiedi: «Com'è andata poi con…?»","Ascolta la risposta con la seconda domanda."],"att":"Annota solo quello che serve per chiedere notizie, e per le cose delicate (salute, famiglia) lascia che sia l'altro a decidere quanto raccontare.","fonti":[{"c":"Reis, H. T., & Shaver, P. (1988). Intimacy as an interpersonal process. In S. Duck (a cura di), Handbook of personal relationships: Theory, research and interventions (pp. 367–389). Wiley.","t":"libro"},{"c":"Itzchakov, G., Reis, H. T., & Weinstein, N. (2022). Do you want to connect with others? Listen to them. Character & Context Blog, Society for Personality and Social Psychology.","t":"articolo","url":"https://spsp.org/news-center/character-context-blog/do-you-want-connect-others-listen-them"}]},"curio":{"tit":"La memoria è una forma di affetto","fatto":"Un legame cresce quando l'altro si sente capito e seguito con attenzione. Chiedere «com'è andata poi?» dimostra in un colpo solo che hai ascoltato e che ci tieni.","trad":"Ricordati il dettaglio, e chiedine notizie."}},{"id":"f3","ab":"vivo","tit":"Grazie e auguri","princ":"Un grazie preciso, anche dopo tanto tempo, o gli auguri in un giorno importante tengono vivi i legami.","es":"«Ripensavo a quando mi hai aiutato col trasloco: grazie ancora, per me è stato importante.»","frase":"Volevo dirti grazie per…","app":{"come":"Nei loro esperimenti, i partecipanti scrivevano una lettera di ringraziamento a una persona importante per loro e provavano a indovinare la sua reazione. Chi la riceveva era più contento e meno in imbarazzo di quanto avessero previsto gli autori della lettera.","prova":["Scegli una persona che ti ha aiutato, anche anni fa.","Scrivi che cosa ha fatto e che effetto ha avuto su di te.","Mandala senza aspettarti niente in cambio."],"att":"Il grazie funziona se è preciso e sincero: meglio tre righe vere che una frase di circostanza.","fonti":[{"c":"Kumar, A., & Epley, N. (2018). Undervaluing gratitude: Expressers misunderstand the consequences of showing appreciation. Psychological Science, 29(9), 1423–1435.","t":"studio","url":"https://doi.org/10.1177/0956797618772506"},{"c":"University of Chicago News (2018). People underestimate value of sending letters of appreciation.","t":"articolo","url":"https://news.uchicago.edu/story/people-underestimate-value-sending-letters-appreciation"}]},"curio":{"tit":"Il grazie sottovalutato","fatto":"Chi scrive un ringraziamento pensa che farà poco effetto e che l'altro si imbarazzerà. Chi lo riceve, invece, è più contento e meno imbarazzato del previsto.","trad":"Quel grazie arretrato non scade: mandalo oggi."}},{"id":"f4","ab":"vivo","tit":"Le amicizie hanno bisogno di tempo","princ":"Un'amicizia non nasce da un incontro solo: cresce con il tempo passato insieme. Per questo conviene rivedere spesso le stesse persone, in un gruppo, un corso o un'attività con un orario fisso.","es":"Invece di tanti incontri sporadici, frequentare un corso del giovedì e restare dopo a fare due chiacchiere.","frase":"Ci vediamo giovedì prossimo?","app":{"come":"Lo studio ha interrogato adulti trasferiti da poco in una nuova città e ha seguito per alcune settimane studenti appena arrivati all'università, chiedendo quante ore passavano con le persone conosciute da poco. Le amicizie diventavano più strette con più ore insieme, soprattutto se passate ad aggiornarsi, scherzare, parlare di cose che contano e svagarsi; il tempo passato solo a lavorare o studiare fianco a fianco non aiutava.","prova":["Scegli un'attività con un orario fisso (volontariato, un corso, un gruppo di cammino).","Fermati 10 minuti prima o dopo per parlare.","Proponi di continuare fuori: un caffè dopo l'incontro."],"att":"Le ore contano di più se passate ad aggiornarvi, scherzare e divertirvi insieme: stare solo nella stessa stanza, o scambiarsi frasi di circostanza, non basta.","fonti":[{"c":"Hall, J. A. (2019). How many hours does it take to make a friend? Journal of Social and Personal Relationships, 36(4), 1278–1296.","t":"studio","url":"https://doi.org/10.1177/0265407518761225"}]},"curio":{"tit":"Le amicizie si contano in ore","fatto":"Per un amico «alla buona» servono circa 40–60 ore insieme, per un amico vero 80–100, per un amico stretto più di 200. Ore di chiacchiere e risate, non di fila alle Poste.","trad":"Meglio un'attività fissa che cento incontri a caso."}},{"id":"f5","ab":"vivo","tit":"Le relazioni fanno bene alla salute","princ":"Coltivare le relazioni non è solo piacevole: è legato anche a una vita più lunga. Farsi vivi con regolarità è una piccola abitudine che conta.","es":"Una telefonata al cugino la domenica, un caffè con l'ex collega, una passeggiata con il vicino.","frase":"Ci sentiamo domenica, come sempre?","curio":{"tit":"L'amicizia allunga la vita","fatto":"Mettendo insieme 148 studi su oltre 300.000 persone, i ricercatori hanno visto che chi ha relazioni sociali più solide ha circa il 50% di probabilità in più di essere ancora in vita alla fine degli studi. Un effetto paragonabile a quello di smettere di fumare.","trad":"Una telefonata a un amico è anche un investimento sulla salute."},"app":{"come":"La meta-analisi ha riunito studi che seguivano le persone per anni (in media più di sette), misurando all'inizio quanto erano inserite in relazioni e reti sociali. Chi aveva relazioni più solide aveva circa il 50% di probabilità in più di sopravvivere nel periodo dello studio, e il risultato valeva a tutte le età, per uomini e donne e qualunque fosse lo stato di salute iniziale. Gli autori paragonano la forza di questo legame a quella di fattori noti come il fumo e l'alcol.","prova":["Scegli due persone da sentire ogni settimana.","Metti un promemoria fisso nel Calendario.","Preferisci la voce o un incontro a un semplice messaggio, quando puoi."],"att":"Sono studi osservazionali: mostrano un legame forte, non una ricetta precisa. E conta la qualità dei rapporti, non il numero di contatti in rubrica.","fonti":[{"c":"Holt-Lunstad, J., Smith, T. B., & Layton, J. B. (2010). Social relationships and mortality risk: A meta-analytic review. PLoS Medicine, 7(7), e1000316.","t":"studio","url":"https://doi.org/10.1371/journal.pmed.1000316"}]}},{"id":"f6","ab":"vivo","tit":"Lo studio che dura dal 1938","princ":"Chi arriva più sereno e in salute alla vecchiaia non è il più ricco o il più famoso, ma chi ha buoni rapporti. E i rapporti, come la forma fisica, si mantengono con l'esercizio.","es":"Dedicare ogni settimana un'ora alle persone a cui tieni, come si fa con la palestra.","frase":"Ci teniamo a vederci: fissiamo una data?","curio":{"tit":"Lo studio più lungo sulla felicità","fatto":"Dal 1938 l'Università di Harvard segue le stesse persone, e oggi anche i loro figli. La lezione principale: chi a 50 anni era più soddisfatto dei propri rapporti era più in salute a 80. Più del colesterolo.","trad":"Gli amici si allenano come i muscoli: un po' ogni settimana."},"app":{"come":"Lo studio è iniziato con due gruppi di giovani uomini: studenti di Harvard e ragazzi dei quartieri poveri di Boston, intervistati e visitati regolarmente per tutta la vita; poi si è esteso a mogli e figli. Robert Waldinger, l'attuale direttore, e Marc Schulz hanno raccolto i risultati in un libro: la qualità dei rapporti è tra i fattori più legati alla salute e alla felicità nel tempo.","prova":["Pensa a chi vorresti accanto tra dieci anni.","Dedica a quelle persone un momento fisso ogni settimana.","Ricuci un rapporto che si è raffreddato: un messaggio basta per cominciare."],"att":"All'inizio lo studio comprendeva solo uomini bianchi americani: i risultati vanno letti insieme ad altri studi, che però vanno nella stessa direzione.","fonti":[{"c":"Waldinger, R., & Schulz, M. (2023). The good life: Lessons from the world's longest scientific study of happiness. Simon & Schuster.","t":"libro"},{"c":"Waldinger, R. J., & Schulz, M. S. (2010). What's love got to do with it? Social functioning, perceived health, and daily happiness in married octogenarians. Psychology and Aging, 25(2), 422–431.","t":"studio","url":"https://doi.org/10.1037/a0019087"}]}},{"id":"f7","ab":"vivo","tit":"Aiutare fa bene a chi aiuta","princ":"Il volontariato regala nuove relazioni, uno scopo e una routine. Per chi esce dal lavoro è uno dei modi più naturali per incontrare persone nuove ogni settimana.","es":"Un turno fisso il martedì mattina in biblioteca, con gli stessi compagni di turno.","frase":"Che cosa fa un volontario nuovo il primo giorno?","curio":{"tit":"Il turno che fa bene","fatto":"Una grande rassegna di studi ha trovato che chi fa volontariato tende a essere meno depresso e più soddisfatto della vita; negli studi che seguono le persone per anni, il rischio di morte era più basso di circa un quinto.","trad":"Il turno del martedì fa bene anche a te."},"app":{"come":"La rassegna sistematica ha riunito esperimenti e studi che seguono nel tempo persone volontarie e non volontarie. Negli studi di lungo periodo il volontariato era legato a meno sintomi depressivi, più soddisfazione e benessere, e a un rischio di morte più basso di circa il 22%. Negli esperimenti, più piccoli, i risultati erano meno chiari.","prova":["Scegli un'attività con molto contatto con le persone.","Comincia con un turno fisso, anche piccolo.","Dai un nome a ogni faccia che incontri."],"att":"Sono soprattutto studi osservazionali: forse chi sta già bene fa più volontariato. Gli esperimenti veri sono pochi e meno chiari.","fonti":[{"c":"Jenkinson, C. E., Dickens, A. P., Jones, K., Thompson-Coon, J., Taylor, R. S., Rogers, M., Bambra, C. L., Lang, I., & Richards, S. H. (2013). Is volunteering a public health intervention? A systematic review and meta-analysis of the health and survival of volunteers. BMC Public Health, 13, 773.","t":"studio","url":"https://doi.org/10.1186/1471-2458-13-773"}]}},{"id":"c1","ab":"calore","tit":"Il complimento preciso","princ":"Un complimento sincero su una cosa concreta (una scelta, un impegno, un lavoro ben fatto) vale più di tanti complimenti generici.","es":"«Hai organizzato la cena benissimo: si vede che ci hai messo cura.»","frase":"Mi piace come hai…","app":{"come":"I partecipanti facevano un complimento sincero a un amico o a una persona che conoscevano e provavano a indovinare come l'avrebbe presa. Chi lo riceveva si sentiva meglio e meno a disagio di quanto immaginasse chi lo faceva. Per questo, spesso, i complimenti restano nella testa e non vengono detti.","prova":["Nota una cosa concreta fatta bene.","Dilla subito, con il motivo: «… perché …»","Non aggiungere un «ma»."],"att":"Meglio sui comportamenti e sulle scelte che sull'aspetto fisico, soprattutto con chi conosci poco.","fonti":[{"c":"Zhao, X., & Epley, N. (2021). Insufficiently complimentary?: Underestimating the positive impact of compliments creates a barrier to expressing them. Journal of Personality and Social Psychology, 121(2), 239–256.","t":"studio","url":"https://doi.org/10.1037/pspa0000277"}]},"curio":{"tit":"Il complimento trattenuto","fatto":"Chi fa un complimento sincero sottovaluta quanto farà piacere e teme di mettere l'altro in imbarazzo. Risultato: tanti complimenti restano in testa e non arrivano mai.","trad":"Se lo pensi, dillo."}},{"id":"c2","ab":"calore","tit":"Entusiasmo per le buone notizie","princ":"Quando qualcuno ti racconta una cosa bella, mostra gioia e fai domande. Una risposta tiepida («ah, bene») spegne la conversazione.","es":"«Diventi nonno? Ma è bellissimo! Quando nasce? Come vi sentite?»","frase":"Che bella notizia! Raccontami tutto.","app":{"come":"Gable e colleghi distinguono quattro modi di rispondere a una buona notizia: con entusiasmo e domande (attivo e costruttivo), con un tiepido «bene» (passivo), sminuendo («sì, ma…») oppure cambiando discorso. Solo il primo è legato a rapporti più intimi e soddisfacenti. Esperimenti successivi, anche tra sconosciuti, mostrano che una risposta entusiasta aumenta la fiducia e la voglia di confidarsi.","prova":["Mostra gioia con il viso e la voce.","Fai almeno due domande: «Quando? Come ti senti?»","Torna sulla notizia anche nei giorni dopo."],"att":"L'entusiasmo deve essere vero: se una notizia non ti convince, mostra comunque interesse per come l'altro la vive.","fonti":[{"c":"Gable, S. L., Reis, H. T., Impett, E. A., & Asher, E. R. (2004). What do you do when things go right? The intrapersonal and interpersonal benefits of sharing positive events. Journal of Personality and Social Psychology, 87(2), 228–245.","t":"studio","url":"https://doi.org/10.1037/0022-3514.87.2.228"},{"c":"Reis, H. T., Smith, S. M., Carmichael, C. L., Caprariello, P. A., Tsai, F.-F., Rodrigues, A., & Maniaci, M. R. (2010). Are you happy for me? How sharing positive events with others provides personal and interpersonal benefits. Journal of Personality and Social Psychology, 99(2), 311–329.","t":"studio","url":"https://doi.org/10.1037/a0018344"}]},"curio":{"tit":"Il tifo per le buone notizie","fatto":"Davanti a una bella notizia, un tiepido «ah, bene» non scalda nessuno; entusiasmo e un paio di domande, invece, avvicinano e fanno venire voglia di confidarsi.","trad":"Alle buone notizie degli altri si fa il tifo."}},{"id":"c3","ab":"calore","tit":"Meno formale, più vero","princ":"Quando conosciamo qualcuno, notiamo prima di tutto se sembra ben disposto. Un sorriso, un tono morbido e un pizzico di ironia su te stesso abbassano le difese.","es":"Invece di un «Salve» con la mano rigida, un «Ciao, piacere!» con un sorriso. E se sbagli strada: «Ecco, il mio famoso senso dell'orientamento!»","frase":"Se ti va, possiamo darci del tu.","app":{"come":"Secondo gli studi raccolti da Fiske, Cuddy e Glick, quando incontriamo qualcuno ci chiediamo subito due cose: ha buone intenzioni verso di me (calore)? È capace (competenza)? Il calore viene giudicato per primo e pesa di più sulle nostre reazioni.","prova":["Sorridi e usa un tono morbido.","Proponi il tu quando l'altro sembra a suo agio.","Un po' di ironia su te stesso, mai sugli altri."],"att":"Meno formale non vuol dire trascurato: con persone più anziane o in contesti ufficiali, il calore passa anche dalla gentilezza del lei.","fonti":[{"c":"Fiske, S. T., Cuddy, A. J. C., & Glick, P. (2007). Universal dimensions of social cognition: Warmth and competence. Trends in Cognitive Sciences, 11(2), 77–83.","t":"studio","url":"https://doi.org/10.1016/j.tics.2006.11.005"}]},"curio":{"tit":"Prima il calore, poi il curriculum","fatto":"Quando conosciamo qualcuno ci chiediamo subito due cose: è ben disposto verso di me? È capace? Alla prima rispondiamo prima, e conta di più.","trad":"Un sorriso apre più porte di un curriculum."}},{"id":"c4","ab":"calore","tit":"Un piccolo gesto gentile","princ":"Un gesto gentile e inatteso (un caffè offerto, un aiuto, un pensiero) fa più piacere di quanto crediamo, e spesso mette di buon umore anche chi lo fa.","es":"Al bar, offrire il caffè al collega che ti ha dato una mano in settimana.","frase":"Oggi offro io: grazie per l'altro giorno.","app":{"come":"Nei loro esperimenti, alcune persone offrivano per esempio una cioccolata calda a sconosciuti in un parco, oppure facevano un piccolo regalo. Chi lo riceveva era più contento di quanto prevedesse chi lo faceva; in un esperimento, chi aveva ricevuto un gesto gentile era poi più generoso a sua volta con altri.","prova":["Scegli un gesto piccolo e concreto.","Fallo senza annunciarlo e senza aspettarti niente.","Accompagnalo con una parola: «Pensavo ti facesse piacere.»"],"att":"Il gesto deve essere piccolo e senza secondi fini: non deve far sentire l'altro in debito.","fonti":[{"c":"Kumar, A., & Epley, N. (2023). A little good goes an unexpectedly long way: Underestimating the positive impact of kindness on recipients. Journal of Experimental Psychology: General, 152(1), 236–252.","t":"studio","url":"https://doi.org/10.1037/xge0001271"},{"c":"Curry, O. S., Rowland, L. A., Van Lissa, C. J., Zlotowitz, S., McAlaney, J., & Whitehouse, H. (2018). Happy to help? A systematic review and meta-analysis of the effects of performing acts of kindness on the well-being of the actor. Journal of Experimental Social Psychology, 76, 320–329.","t":"studio","url":"https://doi.org/10.1016/j.jesp.2018.02.014"}]},"curio":{"tit":"La gentilezza rende più del previsto","fatto":"Chi fa un piccolo gesto gentile, come offrire una cioccolata calda a uno sconosciuto, sottovaluta quanto farà piacere. E in un esperimento chi l'aveva ricevuto è stato poi più generoso con altri.","trad":"Ogni tanto il caffè offrilo tu."}},{"id":"c5","ab":"calore","tit":"Si ride in compagnia","princ":"Non serve essere comici: si ride soprattutto in compagnia, e quasi mai per le barzellette. Ridere insieme di piccole cose è il segnale che si sta bene.","es":"«Questo ascensore ha più anni di noi due messi insieme!»","frase":"Questa me la segno!","curio":{"tit":"Le barzellette sono sopravvalutate","fatto":"Annotando oltre mille risate nella vita di tutti i giorni, uno psicologo ha scoperto che solo una piccola parte seguiva una battuta vera: quasi sempre si rideva dopo frasi normalissime. E si ride circa 30 volte di più in compagnia che da soli.","trad":"Non serve il repertorio: basta la compagnia."},"app":{"come":"Robert Provine e i suoi studenti hanno annotato oltre 1.200 episodi di risate ascoltate in luoghi pubblici, segnando che cosa era stato detto appena prima: solo il 10–20% circa era una battuta. In un altro studio, con dei diari, le persone ridevano molto più spesso quando erano in compagnia che quando erano da sole.","prova":["Lasciati andare alle risate leggere, senza forzarle.","Ridi delle situazioni, non delle persone.","Racconta un piccolo episodio buffo della tua giornata."],"att":"Ridere con gli altri, mai degli altri: la risata che esclude qualcuno fa l'effetto opposto.","fonti":[{"c":"Provine, R. R., & Fischer, K. R. (1989). Laughing, smiling, and talking: Relation to sleeping and social context in humans. Ethology, 83(4), 295–305.","t":"studio","url":"https://doi.org/10.1111/j.1439-0310.1989.tb00536.x"},{"c":"Provine, R. R. (1993). Laughter punctuates speech: Linguistic, social and gender contexts of laughter. Ethology, 95(4), 291–298.","t":"studio","url":"https://doi.org/10.1111/j.1439-0310.1993.tb00478.x"}]}},{"id":"c6","ab":"calore","tit":"La gaffe che rende simpatici","princ":"Una persona brava che fa una piccola gaffe sembra più umana. Non serve essere impeccabili: un piccolo errore, preso con il sorriso, avvicina.","es":"Rovesci il caffè durante una riunione: «Ecco, questo era il mio numero di prestigio.»","frase":"Ecco il mio numero di prestigio!","curio":{"tit":"L'effetto caffè rovesciato","fatto":"In un esperimento degli anni Sessanta, gli studenti ascoltavano un concorrente bravissimo a un quiz che alla fine si rovesciava il caffè addosso: piaceva più di quello impeccabile. Si chiama «pratfall effect», l'effetto del capitombolo.","trad":"Una gaffe presa con il sorriso fa più simpatia della perfezione."},"app":{"come":"Gli studenti ascoltavano la registrazione di un candidato a un quiz universitario, molto bravo oppure mediocre; in alcune versioni, alla fine, si sentiva il candidato rovesciarsi addosso il caffè. Il candidato bravo con la gaffe risultava il più simpatico, quello mediocre con la gaffe il meno simpatico. Le repliche successive hanno trovato effetti meno netti, che dipendono anche da chi ascolta.","prova":["Quando sbagli in piccolo, ridici su per primo.","Non nascondere la gaffe: dichiarala con leggerezza.","Poi torna a fare bene quello che stavi facendo."],"att":"Funziona solo con gaffe piccole e se per il resto sei affidabile: non vale come scusa per gli errori veri.","fonti":[{"c":"Aronson, E., Willerman, B., & Floyd, J. (1966). The effect of a pratfall on increasing interpersonal attractiveness. Psychonomic Science, 4(6), 227–228.","t":"studio","url":"https://doi.org/10.3758/BF03342263"}]}},{"id":"c7","ab":"calore","tit":"La bella imperfezione","princ":"Ammettere un errore, chiedere aiuto o dire «mi sono emozionato» ci sembra una debolezza. Gli altri, invece, lo vedono soprattutto come coraggio e sincerità.","es":"«Ieri ti ho risposto male: ho sbagliato, scusami.»","frase":"Ho sbagliato io, scusami.","curio":{"tit":"L'effetto «bel pasticcio»","fatto":"In una serie di esperimenti, le persone giudicavano più negativo mostrarsi vulnerabili loro stesse (ammettere uno sbaglio, chiedere aiuto) che vederlo fare a un altro. Quando lo fa un altro, ci sembra coraggio. Gli psicologi l'hanno chiamato «beautiful mess», bel pasticcio.","trad":"Il tuo «ho sbagliato», agli altri, sembra coraggio."},"app":{"come":"I partecipanti immaginavano situazioni in cui si mostravano vulnerabili, come ammettere un errore o chiedere aiuto, oppure in cui lo faceva un'altra persona. Giudicavano la propria vulnerabilità più negativamente, come debolezza, e quella degli altri più positivamente, come coraggio e sincerità. In sette esperimenti l'effetto si è visto sempre; in uno, più realistico, i partecipanti si aspettavano davvero di dover improvvisare una canzone davanti a una giuria, o di fare da giurati.","prova":["Quando sbagli, dillo presto e semplicemente.","Chiedi aiuto per una cosa piccola e concreta.","Ringrazia chi ti ascolta."],"att":"Vale per la sincerità misurata: confidare problemi pesanti a chi conosci appena può mettere a disagio.","fonti":[{"c":"Bruk, A., Scholl, S. G., & Bless, H. (2018). Beautiful mess effect: Self–other differences in evaluation of showing vulnerability. Journal of Personality and Social Psychology, 115(2), 192–205.","t":"studio","url":"https://doi.org/10.1037/pspa0000120"}]}},{"id":"c8","ab":"calore","tit":"La gratitudine che lega","princ":"La gratitudine non è solo buona educazione: ci fa notare le persone che si prendono cura di noi, ci ricorda quanto valgono e ci lega a loro.","es":"«Grazie per avermi accompagnato dal meccanico: mi hai salvato la mattinata.»","frase":"Grazie, mi hai proprio salvato la giornata.","curio":{"tit":"Trova, ricorda, lega","fatto":"Secondo la psicologa Sara Algoe la gratitudine ha tre compiti: ci fa trovare le persone giuste, ci ricorda quanto valgono e ci lega a loro. In uno studio, la gratitudine provata durante una settimana di accoglienza prevedeva un legame più stretto un mese dopo.","trad":"Il grazie è la colla delle amicizie."},"app":{"come":"Lo studio ha seguito le ragazze appena entrate in tre associazioni studentesche femminili di un'università americana, durante una settimana in cui le più anziane le accoglievano con piccoli regali ed eventi organizzati per loro. Più gratitudine provavano le nuove arrivate, più giudicavano buono il rapporto un mese dopo; un legame simile, ma più debole, si vedeva anche nelle risposte delle ragazze più anziane. Algoe ha poi riassunto il ruolo della gratitudine con tre verbi: trovare, ricordare, legare.","prova":["Ringrazia per una cosa precisa, appena succede.","Nomina la qualità dell'altro: «sei stato gentile».","Ricordala anche dopo: «ripensavo a quando mi hai aiutato»."],"att":"Un grazie di circostanza vale poco: conta riconoscere la persona, non solo il favore.","fonti":[{"c":"Algoe, S. B., Haidt, J., & Gable, S. L. (2008). Beyond reciprocity: Gratitude and relationships in everyday life. Emotion, 8(3), 425–429.","t":"studio","url":"https://doi.org/10.1037/1528-3542.8.3.425"},{"c":"Algoe, S. B. (2012). Find, remind, and bind: The functions of gratitude in everyday relationships. Social and Personality Psychology Compass, 6(6), 455–469.","t":"studio","url":"https://doi.org/10.1111/j.1751-9004.2012.00439.x"}]}}],"sfide":[{"id":"ap1n","ab":"aprire","liv":1,"sit":"nuove","t":"Chiedi al barista (o al fornaio) che cosa sceglierebbe lui, oggi.","nome":"☕ Operazione Cornetto","bonus":"Se ti spiega perché la crema batte la marmellata, hai vinto la giornata."},{"id":"ap1c","ab":"aprire","liv":1,"sit":"colleghi","t":"Saluta per nome, con un sorriso, tre colleghi o ex colleghi.","nome":"🏷️ Nome e sorriso","bonus":"Se ne ripeschi uno che avevi sulla punta della lingua, vale doppio."},{"id":"ap1f","ab":"aprire","liv":1,"sit":"famiglia","t":"Quando rientri, saluta tu per primo ognuno e chiedi: «Allora, com'è andata oggi?»","nome":"🏠 Bentornati a casa","bonus":"Vietato accettare «bene» come unica risposta."},{"id":"ap1g","ab":"aprire","liv":1,"sit":"gruppi","t":"Quando arrivi in un gruppo (una riunione, un corso, una sala d'attesa), saluta tu per primo.","nome":"👋 Il primo della classe","bonus":"Gli altri ricambieranno: è quasi una legge della fisica."},{"id":"ap1v","ab":"aprire","liv":1,"sit":"vol","nome":"🔎 Curiosare non costa","t":"Cerca un'associazione di volontariato del tuo quartiere, leggi che cosa fa e salvane una che ti incuriosisce.","bonus":"Per ora si guarda e basta, come le vetrine il sabato."},{"id":"ap2n","ab":"aprire","liv":2,"sit":"nuove","t":"In fila o in attesa, fai a uno sconosciuto un commento su quello che avete intorno, poi una domanda.","nome":"🌫️ Meteo di quartiere","bonus":"A Torino la nebbia è un argomento che non delude mai."},{"id":"ap2c","ab":"aprire","liv":2,"sit":"colleghi","t":"Fai due parole con un collega che conosci poco: «Di che cosa ti occupi, di preciso?»","nome":"🔍 Il collega misterioso","bonus":"Se alla fine sapresti spiegarlo a un altro, hai ascoltato davvero."},{"id":"ap2f","ab":"aprire","liv":2,"sit":"famiglia","t":"Al prossimo incontro o telefonata di famiglia, inizia tu con il parente con cui parli di meno: «Raccontami, che cosa fai di bello?»","nome":"🎙️ Intervista di famiglia","bonus":"Ascolta almeno due minuti senza parlare di te."},{"id":"ap2g","ab":"aprire","liv":2,"sit":"gruppi","t":"In un gruppo, presentati a una persona nuova e usa il suo nome almeno una volta.","nome":"🐘 Memoria da elefante","bonus":"Ricordalo anche il giorno dopo, senza appunti."},{"id":"ap3n","ab":"aprire","liv":3,"sit":"nuove","t":"Inizia una vera chiacchierata con un vicino con cui finora vi siete detti solo «buongiorno».","nome":"🚪 Il vicino sconosciuto","bonus":"Se scopri come si chiama il suo cane, conta come mezza amicizia."},{"id":"ap3c","ab":"aprire","liv":3,"sit":"colleghi","t":"Proponi un caffè a un collega che conosci poco.","nome":"☕ Caffè a sorpresa","bonus":"Offri tu: è l'investimento più redditizio della settimana."},{"id":"ap3f","ab":"aprire","liv":3,"sit":"famiglia","t":"Con l'amico di un amico o un parente acquisito che conosci poco, inizia tu una chiacchierata partendo da un interesse comune.","nome":"🧩 Il pezzo che mancava","bonus":"Trova almeno una cosa che piace a tutti e due."},{"id":"ap3g","ab":"aprire","liv":3,"sit":"gruppi","t":"Vai a un incontro aperto (una presentazione, una festa di quartiere) e parla con almeno due persone.","nome":"🎪 Facce nuove","bonus":"Una delle due non deve c'entrare niente con te."},{"id":"ap3v","ab":"aprire","liv":3,"sit":"vol","t":"Chiama Vol.To (011 81 38 711) o scrivi a centroservizi@volontariatotorino.it per fissare il colloquio di orientamento gratuito.","nome":"📞 Chiamata di orientamento","bonus":"Dieci minuti di telefonata che possono cambiarti la settimana."},{"id":"vi1n","ab":"viva","liv":1,"sit":"nuove","t":"In una chiacchierata breve, fai almeno una seconda domanda su quello che ti hanno appena risposto.","nome":"🔁 Il «E poi?»","bonus":"Due parole, zero fatica, e l'altro ti racconta il resto."},{"id":"vi1c","ab":"viva","liv":1,"sit":"colleghi","t":"Chiedi a un collega com'è andato il fine settimana (o la giornata di ieri), poi una seconda domanda su un dettaglio.","nome":"📅 Il lunedì del collega","bonus":"Se risponde «niente di che», chiedi che cosa ha mangiato: funziona sempre."},{"id":"vi1f","ab":"viva","liv":1,"sit":"famiglia","t":"A tavola chiedi: «Qual è stata la cosa più bella di oggi?» e ascolta la risposta fino in fondo.","nome":"🍝 Domanda a tavola","bonus":"Il telefono resta a faccia in giù: per una sera può fare il timido."},{"id":"vi1g","ab":"viva","liv":1,"sit":"gruppi","t":"In gruppo, quando qualcuno racconta qualcosa, rilancia con una domanda invece di cambiare argomento.","nome":"🎾 Il rimbalzo","bonus":"Resisti all'«anche a me una volta…» per almeno un giro."},{"id":"vi2n","ab":"viva","liv":2,"sit":"nuove","t":"In una conversazione, ripeti una volta con parole tue quello che hai capito: «Quindi, se ho capito bene…»","nome":"🪞 Lo specchio","bonus":"Se l'altro dice «esatto!», hai fatto centro."},{"id":"vi2c","ab":"viva","liv":2,"sit":"colleghi","t":"Con un collega, racconta un tuo piccolo episodio simile al suo, poi ripassagli la parola.","nome":"🤝 Uno a uno","bonus":"Regola d'oro: il tuo racconto dura meno del suo."},{"id":"vi2f","ab":"viva","liv":2,"sit":"famiglia","t":"Chiedi a un familiare di raccontarti un suo ricordo (un viaggio, il primo lavoro) e fagli tre domande.","nome":"📼 Archivio di famiglia","bonus":"Bonus se scopri una marachella di gioventù che nessuno ti aveva mai raccontato."},{"id":"vi2g","ab":"viva","liv":2,"sit":"gruppi","t":"In gruppo, coinvolgi chi parla poco: «E tu che cosa ne pensi?»","nome":"🎤 Il microfono passa","bonus":"Spesso è proprio chi ha la storia più bella."},{"id":"vi3n","ab":"viva","liv":3,"sit":"nuove","t":"Tieni viva per almeno dieci minuti una chiacchierata con una persona appena conosciuta, alternando domande e racconti.","nome":"⏱️ Dieci minuti di gloria","bonus":"Se perdi il filo, pesca una frase di scorta."},{"id":"vi3c","ab":"viva","liv":3,"sit":"colleghi","t":"In pausa con un collega, non parlate di lavoro: scopri una sua passione.","nome":"🚫 Vietato il lavoro","bonus":"Chi nomina una pratica paga il caffè."},{"id":"vi3f","ab":"viva","liv":3,"sit":"famiglia","t":"Passa una serata senza telefono con una persona di famiglia: solo domande, ascolto e racconti.","nome":"📵 Serata analogica","bonus":"Sì, si sopravvive. Anzi."},{"id":"vi3g","ab":"viva","liv":3,"sit":"gruppi","t":"A una cena con più persone, fai almeno una domanda a ciascuno, così che tutti abbiano spazio per raccontare.","nome":"🎬 Il regista","bonus":"Nessuno ricorderà il regista: ricorderanno che si sono divertiti."},{"id":"vi3v","ab":"viva","liv":3,"sit":"vol","t":"Partecipa, o iscriviti, a una serata informativa di un'associazione di volontariato e fai due domande a un volontario.","nome":"🎟️ Serata informativa","bonus":"Chiedigli che cosa gli piace di più: lì si accende."},{"id":"fv1n","ab":"vivo","liv":1,"sit":"nuove","t":"Se hai conosciuto qualcuno di recente e hai il suo numero, mandagli due righe: «È stato un piacere conoscerti.»","nome":"💌 Il seguito","bonus":"Tempo richiesto: 30 secondi. Effetto: settimane."},{"id":"fv1c","ab":"vivo","liv":1,"sit":"colleghi","t":"Manda un messaggio a un ex collega: «Mi sei venuto in mente, come stai?»","nome":"👻 Operazione Fantasma","bonus":"Gli farà più piacere di quanto pensi: lo dicono gli studi."},{"id":"fv1f","ab":"vivo","liv":1,"sit":"famiglia","t":"Manda una foto o un ricordo a un familiare o a un amico lontano, con due righe.","nome":"📸 Cartolina digitale","bonus":"Una foto vecchia vale doppio."},{"id":"fv1g","ab":"vivo","liv":1,"sit":"gruppi","t":"In una chat di gruppo, scrivi un messaggio caloroso o rispondi a qualcuno chiamandolo per nome.","nome":"💬 Chat risvegliata","bonus":"Senza le immagini del buongiorno, per favore."},{"id":"fv2n","ab":"vivo","liv":2,"sit":"nuove","t":"Torna nel negozio o nel bar dove hai parlato con qualcuno e riprendi il discorso dell'ultima volta.","nome":"🔁 La puntata successiva","bonus":"«Allora, alla fine la crema ha vinto?»"},{"id":"fv2c","ab":"vivo","liv":2,"sit":"colleghi","t":"Chiedi a un collega notizie di una cosa che ti aveva raccontato: «Com'è andata poi con…?»","nome":"📌 Il promemoria umano","bonus":"Il dettaglio ricordato vale più di un regalo."},{"id":"fv2f","ab":"vivo","liv":2,"sit":"famiglia","t":"Telefona a un familiare o a un amico per chiedere com'è andata una cosa importante per lui o per lei.","nome":"☎️ Telefonata col seguito","bonus":"Niente favori da chiedere: solo notizie."},{"id":"fv2g","ab":"vivo","liv":2,"sit":"gruppi","t":"Proponi tu al gruppo una data per rivedervi.","nome":"🗓️ Data alla mano","bonus":"Una data precisa: «uno di questi giorni» non vale."},{"id":"fv3n","ab":"vivo","liv":3,"sit":"nuove","t":"Invita a prendere un caffè una persona conosciuta di recente.","nome":"☕ Il secondo caffè","bonus":"È al secondo caffè che un conoscente comincia a diventare un amico."},{"id":"fv3c","ab":"vivo","liv":3,"sit":"colleghi","t":"Scrivi oggi agli ex colleghi che non vedi da tempo e proponi una data per un pranzo o una pizza.","nome":"🍕 Operazione Rimpatriata","bonus":"Preparati una storia di allora da raccontare."},{"id":"fv3f","ab":"vivo","liv":3,"sit":"famiglia","t":"Scrivi a un familiare o a un amico un grazie preciso per qualcosa che ha fatto per te, anche tanto tempo fa.","nome":"🙏 Il grazie in ritardo","bonus":"Più è in ritardo, più sorprende."},{"id":"fv3g","ab":"vivo","liv":3,"sit":"gruppi","t":"Occupati tu del prossimo ritrovo del gruppo: data, posto e messaggio a tutti.","nome":"🎉 Il capo-ritrovo","bonus":"Scegli un posto dove ci si sente parlare."},{"id":"fv3v","ab":"vivo","liv":3,"sit":"vol","t":"Scrivi o telefona all'associazione di volontariato che ti ha incuriosito per chiedere come cominciare.","nome":"✉️ Il primo messaggio","bonus":"Il primo passo è il più corto, anche se sembra il più lungo."},{"id":"ca1n","ab":"calore","liv":1,"sit":"nuove","t":"Fai un complimento preciso a chi ti serve (al bar, in negozio) per una cosa fatta bene.","nome":"🏆 Il premio del giorno","bonus":"«Il cappuccino migliore del quartiere» vale, se lo pensi davvero."},{"id":"ca1c","ab":"calore","liv":1,"sit":"colleghi","t":"Ringrazia un collega per una cosa concreta che ha fatto, dicendogli perché ti è stata utile.","nome":"🎁 Grazie con il perché","bonus":"Il «perché» trasforma un grazie in un regalo."},{"id":"ca1f","ab":"calore","liv":1,"sit":"famiglia","t":"Fai a un familiare un complimento preciso su una scelta o su un impegno, non sull'aspetto.","nome":"🌟 Complimento da intenditore","bonus":"«Mi piace come hai…» è l'attacco perfetto."},{"id":"ca1g","ab":"calore","liv":1,"sit":"gruppi","t":"In un incontro di gruppo, guarda negli occhi e sorridi a chi parla, mentre parla.","nome":"😊 Il pubblico perfetto","bonus":"Chi parla davanti a tutti cerca sempre una faccia amica: sii tu."},{"id":"ca2n","ab":"calore","liv":2,"sit":"nuove","t":"Proponi di darvi del tu a una persona che vedi spesso: «Se ti va, possiamo darci del tu.»","nome":"🤝 Promozione al «tu»","bonus":"Spesso la risposta è: «Finalmente!»"},{"id":"ca2c","ab":"calore","liv":2,"sit":"colleghi","t":"Chiedi a un collega se c'è qualcosa di bello in arrivo e, se te lo racconta, rispondi con entusiasmo e fagli due domande.","nome":"📣 Tifoso ufficiale","bonus":"Vietato il «beato te»."},{"id":"ca2f","ab":"calore","liv":2,"sit":"famiglia","t":"Chiedi a un familiare: «Qual è stata la cosa più bella di questa settimana?» e rispondi: «Che bello! Raccontami tutto.»","nome":"🎉 Ufficio entusiasmo","bonus":"La faccia deve dire la stessa cosa delle parole."},{"id":"ca2g","ab":"calore","liv":2,"sit":"gruppi","t":"In gruppo, ridi di te stesso una volta, con leggerezza, per un piccolo errore o una tua abitudine.","nome":"🤡 Autoironia controllata","bonus":"Su di te sì, sugli altri mai."},{"id":"ca3n","ab":"calore","liv":3,"sit":"nuove","t":"Offri aiuto a uno sconosciuto in una piccola cosa (un'indicazione, una borsa pesante), chiedendo prima se gli serve, e scambiate due parole.","nome":"🦸 Supereroe di quartiere","bonus":"Mantello facoltativo."},{"id":"ca3c","ab":"calore","liv":3,"sit":"colleghi","t":"Scrivi a un collega o ex collega che cosa hai apprezzato di lui o di lei lavorando insieme.","nome":"⭐ Recensione a cinque stelle","bonus":"Un episodio preciso vale più di dieci aggettivi."},{"id":"ca3f","ab":"calore","liv":3,"sit":"famiglia","t":"Scrivi a mano un biglietto a una persona di famiglia: che cosa ti piace di lei e perché.","nome":"✍️ Il biglietto a mano","bonus":"Sì, a mano: la calligrafia storta fa parte del fascino."},{"id":"ca3g","ab":"calore","liv":3,"sit":"gruppi","t":"In un gruppo, presenta tu due persone che non si conoscono, dicendo una cosa bella di ognuna.","nome":"🎀 Il presentatore","bonus":"Due amicizie in un colpo solo: complimenti."},{"id":"ca3v","ab":"calore","liv":3,"sit":"vol","t":"Partecipa almeno per un'ora a un'iniziativa di volontariato aperta a tutti e ringrazia di persona un volontario per quello che fa.","nome":"🤲 Un'ora per gli altri","bonus":"Scoprirai che il grazie torna indietro."},{"id":"ap1n2","ab":"aprire","liv":1,"sit":"nuove","nome":"🍎 La domanda al banco","t":"Al mercato o in un negozio, saluta per primo e fai una domanda sulla merce: «Da dove arrivano queste mele?»","bonus":"Se ti racconta la storia di quello che vende, prenditi il tempo di ascoltarla."},{"id":"ap1c2","ab":"aprire","liv":1,"sit":"colleghi","nome":"📬 Il saluto di corridoio","t":"Saluta con un sorriso un collega che incroci sempre e con cui non hai mai parlato.","bonus":"Domani aggiungi «Come va?»: è la seconda puntata."},{"id":"ap1f2","ab":"aprire","liv":1,"sit":"famiglia","nome":"🤗 Giro di saluti","t":"Al prossimo incontro di famiglia, saluta tu per primo ognuno, anche i parenti acquisiti e i ragazzi, chiamandoli per nome.","bonus":"Se qualcuno ti chiede «come mai così allegro?», rispondi: «Mi fa piacere vedervi.»"},{"id":"ap1g2","ab":"aprire","liv":1,"sit":"gruppi","nome":"🪑 La sedia giusta","t":"In una sala d'attesa, a un corso o a una riunione, siediti vicino a qualcuno invece che nell'angolo libero.","bonus":"Un sorriso quando ti siedi vale come presentazione."},{"id":"ap2n2","ab":"aprire","liv":2,"sit":"nuove","nome":"🐕 Il cane come scusa","t":"Fai un complimento a chi porta a spasso un cane e chiedi come si chiama (il cane).","bonus":"Se la chiacchierata va, chiedi anche il nome del padrone."},{"id":"ap2c2","ab":"aprire","liv":2,"sit":"colleghi","nome":"🍽️ Pranzo con vista nuova","t":"In mensa o al bar, siediti con colleghi con cui di solito non mangi.","bonus":"Chiedi da dove vengono: ogni collega ha una geografia da raccontare."},{"id":"ap2f2","ab":"aprire","liv":2,"sit":"famiglia","nome":"🥖 Il vicino di tavola","t":"A un pranzo o a una festa di famiglia, siediti accanto alla persona che conosci meno (un parente acquisito, l'amico di un nipote) e apri tu la conversazione.","bonus":"Fatti dire una cosa che non sapevi di lui o di lei."},{"id":"ap2g2","ab":"aprire","liv":2,"sit":"gruppi","nome":"🎯 Il primo a parlare","t":"In un gruppo nuovo, sii tu a fare la prima domanda a qualcuno.","bonus":"Chi rompe il silenzio, di solito, viene ricordato con simpatia."},{"id":"ap3n2","ab":"aprire","liv":3,"sit":"nuove","nome":"🧳 Il turista smarrito","t":"Se vedi qualcuno che consulta la mappa con aria persa, chiedigli se ha bisogno di un'indicazione.","bonus":"Consiglia anche un buon caffè lì vicino: ambasciatore di Torino per un giorno."},{"id":"ap3c2","ab":"aprire","liv":3,"sit":"colleghi","nome":"🤝 Il nuovo arrivato","t":"Presentati a un collega appena arrivato (o all'ultimo arrivato del gruppo) e offriti di spiegargli qualcosa.","bonus":"Ricordati com'era il tuo primo giorno."},{"id":"ap3f2","ab":"aprire","liv":3,"sit":"famiglia","nome":"🍰 Benvenuto in famiglia","t":"Fai sentire il benvenuto a chi è entrato da poco in famiglia o nella tua compagnia: presentati tu e chiedigli qualcosa di sé.","bonus":"La volta dopo salutalo per nome: per chi è nuovo vale più di un regalo."},{"id":"ap3g2","ab":"aprire","liv":3,"sit":"gruppi","nome":"🎭 Lezione di prova","t":"Partecipa a una lezione di prova di un corso mai fatto (ballo, coro, bocce, cucina) e parla con almeno una persona.","bonus":"Chiedi da quanto lo frequenta: avrai subito un aneddoto."},{"id":"ap3v2","ab":"aprire","liv":3,"sit":"vol","nome":"🗺️ Giro di ricognizione","t":"Vai di persona a vedere un'associazione di volontariato (una sede, un evento aperto, un banchetto) e presentati.","bonus":"Porta una domanda pronta: «Che cosa fa un volontario nuovo il primo giorno?»"},{"id":"vi1n2","ab":"viva","liv":1,"sit":"nuove","nome":"🌤️ Oltre il meteo","t":"Quando qualcuno ti parla del tempo, rilancia con una domanda su di lui: «E tu come passi le giornate così?»","bonus":"Il meteo è l'antipasto, non il pranzo."},{"id":"vi1c2","ab":"viva","liv":1,"sit":"colleghi","nome":"☕ La pausa curiosa","t":"In pausa caffè, chiedi a un collega che cosa ha in programma per il fine settimana.","bonus":"Ricordatelo: lunedì gli chiedi com'è andata."},{"id":"vi1f2","ab":"viva","liv":1,"sit":"famiglia","nome":"🎬 Il consiglio della settimana","t":"Chiedi a un familiare che cosa ha visto, letto o ascoltato di bello ultimamente, e perché gli è piaciuto.","bonus":"Se ti consiglia qualcosa, provalo davvero e diglielo."},{"id":"vi1g2","ab":"viva","liv":1,"sit":"gruppi","nome":"👂 Il sale della conversazione","t":"In una conversazione di gruppo, fai almeno due domande agli altri prima di raccontare qualcosa di tuo.","bonus":"Si chiama dosare: come il sale."},{"id":"vi2n2","ab":"viva","liv":2,"sit":"nuove","nome":"🎓 Lezione gratuita","t":"Chiedi a qualcuno di spiegarti una cosa che sa fare bene (il suo lavoro, un hobby).","bonus":"Le persone si illuminano quando insegnano."},{"id":"vi2c2","ab":"viva","liv":2,"sit":"colleghi","nome":"🧭 Il consiglio richiesto","t":"Chiedi a un collega un consiglio su una cosa in cui è bravo.","bonus":"Chiedere un consiglio fa sentire l'altro stimato, e te più competente."},{"id":"vi2f2","ab":"viva","liv":2,"sit":"famiglia","nome":"🔦 La domanda di sostanza","t":"A cena con la famiglia o con un amico, fai una domanda più profonda del solito: «Di che cosa sei più contento quest'anno?»","bonus":"Con gli sconosciuti va meglio del previsto, dice uno studio: figurati in famiglia."},{"id":"vi2g2","ab":"viva","liv":2,"sit":"gruppi","nome":"🧶 Il filo comune","t":"In un gruppo, scopri una cosa in comune tra due persone e falla notare: «Ma allora anche voi…?»","bonus":"Hai appena cucito una conversazione."},{"id":"vi3n2","ab":"viva","liv":3,"sit":"nuove","nome":"🚂 Il compagno di viaggio","t":"In treno, in fila o in sala d'attesa, porta avanti una vera chiacchierata con uno sconosciuto per almeno cinque minuti.","bonus":"Se scendi alla tua fermata con un sorriso, missione compiuta."},{"id":"vi3c2","ab":"viva","liv":3,"sit":"colleghi","nome":"📖 La storia del collega","t":"Chiedi a un collega o ex collega come ha cominciato a fare il suo lavoro, e ascolta tutta la storia.","bonus":"Chiedi anche qual è stato il momento più strano."},{"id":"vi3f2","ab":"viva","liv":3,"sit":"famiglia","nome":"🕰️ La storia dietro la foto","t":"Prendi una vecchia foto di famiglia e fatti raccontare da un parente chi c'è, dove e quando, con almeno tre domande.","bonus":"Rileggigli la storia la volta dopo: scoprirai che si ricorda un altro pezzo."},{"id":"vi3g2","ab":"viva","liv":3,"sit":"gruppi","nome":"🍷 L'aperitivo senza telefono","t":"A un aperitivo o a una cena di gruppo, proponi: «Telefoni in tasca fino al caffè?»","bonus":"Se accettano, hai vinto la serata. Se ridono, hai vinto lo stesso."},{"id":"vi3v2","ab":"viva","liv":3,"sit":"vol","nome":"🙋 Il volontario esperto","t":"Chiedi a un volontario che conosci (o che incontri) che cosa gli ha dato di più il volontariato.","bonus":"Ascolta senza interrompere: spesso è la risposta più bella della settimana."},{"id":"fv1n2","ab":"vivo","liv":1,"sit":"nuove","nome":"👋 Ci rivediamo","t":"Quando rivedi una persona conosciuta di recente, salutala per nome.","bonus":"Se ricordi anche una cosa che ti aveva detto, è un colpo da maestro."},{"id":"fv1c2","ab":"vivo","liv":1,"sit":"colleghi","nome":"🎂 Auguri sinceri","t":"Segna nel Calendario i compleanni (o gli onomastici) di tre colleghi o ex colleghi e, se uno cade in questi giorni, mandagli due righe.","bonus":"Personalizza: «Auguri, e spero che la bici nuova funzioni!» batte «Auguri!!!»"},{"id":"fv1f2","ab":"vivo","liv":1,"sit":"famiglia","nome":"🎵 Ti ho pensato","t":"Manda a un familiare o a un amico una canzone, un articolo o una foto che ti ha fatto pensare a lui.","bonus":"Aggiungi una riga sul perché."},{"id":"fv1g2","ab":"vivo","liv":1,"sit":"gruppi","nome":"🗳️ Il sondaggio del gruppo","t":"Nella chat di un gruppo, fai una domanda leggera a tutti: «Qual è il miglior posto per un caffè in zona?»","bonus":"Le domande facili risvegliano anche le chat più addormentate."},{"id":"fv2n2","ab":"vivo","liv":2,"sit":"nuove","nome":"🔁 Promessa mantenuta","t":"Se hai detto a qualcuno «ti mando quel link» o «ti faccio sapere», fallo oggi.","bonus":"Le piccole promesse mantenute costruiscono la fiducia più in fretta di quelle grandi."},{"id":"fv2c2","ab":"vivo","liv":2,"sit":"colleghi","nome":"🧾 Il grazie a distanza","t":"Scrivi a un ex collega per ringraziarlo di una cosa che ti ha insegnato.","bonus":"Cita un episodio preciso: «Ti ricordi quando mi hai spiegato…?»"},{"id":"fv2f2","ab":"vivo","liv":2,"sit":"famiglia","nome":"📅 L'appuntamento fisso","t":"Proponi a un familiare o a un amico un appuntamento fisso: una telefonata la domenica, un caffè il giovedì.","bonus":"Le abitudini tengono vive le amicizie meglio delle buone intenzioni."},{"id":"fv2g2","ab":"vivo","liv":2,"sit":"gruppi","nome":"📸 L'album condiviso","t":"Dopo un ritrovo di gruppo, manda a tutti le foto con una frase calda.","bonus":"Scegli quelle in cui vengono bene gli altri, non tu."},{"id":"fv3n2","ab":"vivo","liv":3,"sit":"nuove","nome":"🚶 Il caffè che diventa abitudine","t":"Proponi a una persona conosciuta da poco di rivedervi ogni settimana per qualcosa (una passeggiata, un caffè, un corso).","bonus":"Le amicizie crescono con le ore insieme: questa è la scorciatoia."},{"id":"fv3c2","ab":"vivo","liv":3,"sit":"colleghi","nome":"📞 La telefonata lunga","t":"Telefona (non scrivere) a un ex collega che non senti da più di un anno.","bonus":"Se risponde la segreteria, lascia un messaggio allegro: vale lo stesso."},{"id":"fv3f2","ab":"vivo","liv":3,"sit":"famiglia","nome":"✉️ La lettera di carta","t":"Scrivi una lettera o una cartolina vera a un parente o a un amico lontano.","bonus":"Nell'epoca delle chat, una busta nella cassetta delle lettere è un piccolo evento."},{"id":"fv3g2","ab":"vivo","liv":3,"sit":"gruppi","nome":"🧭 Il gruppo nuovo","t":"Scegli un gruppo con incontri fissi (cammino, lettura, coro, bocce), contatta gli organizzatori e segna nel Calendario il primo incontro.","bonus":"Al primo incontro presentati ad almeno una persona; al secondo salutala per nome."},{"id":"fv3v2","ab":"vivo","liv":3,"sit":"vol","nome":"🗓️ Il turno fisso","t":"Se hai iniziato un volontariato, fissa un giorno della settimana e scrivilo nel Calendario.","bonus":"La costanza trasforma i compagni di turno in amici."},{"id":"ca1n2","ab":"calore","liv":1,"sit":"nuove","nome":"🙏 Grazie negli occhi","t":"Oggi ringrazia tre persone che ti servono (alla cassa, al bar, sull'autobus) guardandole negli occhi e sorridendo.","bonus":"Se il nome è scritto sul cartellino, usalo: punti extra."},{"id":"ca1c2","ab":"calore","liv":1,"sit":"colleghi","nome":"👏 L'applauso meritato","t":"Fai notare a un collega, davanti agli altri, una cosa che ha fatto bene.","bonus":"Le lodi in pubblico, le critiche in privato: regola antica e sempre valida."},{"id":"ca1f2","ab":"calore","liv":1,"sit":"famiglia","nome":"🫖 Il caffè servito","t":"Prepara un caffè o un tè a un familiare senza che te lo chieda.","bonus":"Il vassoio d'argento è facoltativo."},{"id":"ca1g2","ab":"calore","liv":1,"sit":"gruppi","nome":"😄 La risata condivisa","t":"In un gruppo, ridi di gusto a una battuta di un altro (se ti fa ridere davvero).","bonus":"La risata è contagiosa: lo dice la scienza, e anche la zia al pranzo di Natale."},{"id":"ca2n2","ab":"calore","
