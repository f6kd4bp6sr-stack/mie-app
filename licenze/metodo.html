<script>
/* ================= BLOCCO CON FACE ID (comune a tutte le pagine di Pianificazione) =================
   - usa una passkey del dispositivo (WebAuthn): l'iPad chiede Face ID, o il codice dell'iPad se il volto non viene riconosciuto;
   - nessun server: la chiave pubblica resta su questo dispositivo e la firma si verifica qui;
   - codice di riserva (4–8 cifre) se la passkey non fosse disponibile;
   - si riblocca dopo 5 minuti fuori dall'app. I dati restano dove sono: il blocco protegge l'apertura, non cifra i dati. */
/* chiavi di Pianificazione con il prefisso dell'app (prima erano «mie-app-…», nome condiviso con il sito): spostate una volta sola */
(function(){try{[["mie-app-lastSnap","pn-lastSnap"],["mie-app-lastBackup","pn-lastBackup"],["mie-app-copia-cloud","pn-copia-cloud"]].forEach(function(p){var v=localStorage.getItem(p[0]);if(v!=null){if(localStorage.getItem(p[1])==null)localStorage.setItem(p[1],v);localStorage.removeItem(p[0]);}});}catch(e){}})();
(function(){
  "use strict";
  var KEY="pn-lock", SES="pn-unlocked", IDLE=5*60*1000;
  function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
  var C=cfg(), root=document.documentElement;
  function unlocked(){try{var t=+sessionStorage.getItem(SES)||0;return t&&Date.now()-t<IDLE;}catch(e){return false;}}
  function mark(){try{sessionStorage.setItem(SES,String(Date.now()));}catch(e){}}
  if(C&&C.on&&!unlocked())root.classList.add("locked");
  var b64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
  var unb64=function(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
  async function sha(t){var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return b64(h);}
  // firma ES256 (DER) → formato grezzo r|s per WebCrypto
  function der2raw(d){var i=2;if(d[1]&0x80)i+=d[1]&0x7f;function int(){i++;var l=d[i++];var v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);var o=new Uint8Array(32);o.set(v,32-v.length);return o;}var r=int(),s=int(),out=new Uint8Array(64);out.set(r,0);out.set(s,32);return out;}
  async function verify(pkB64,authData,clientJSON,sig){
    try{var key=await crypto.subtle.importKey("spki",unb64(pkB64),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
      var ch=new Uint8Array(await crypto.subtle.digest("SHA-256",clientJSON)),ad=new Uint8Array(authData),data=new Uint8Array(ad.length+ch.length);data.set(ad,0);data.set(ch,ad.length);
      return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,der2raw(new Uint8Array(sig)),data);}catch(e){return null;}
  }
  function done(){mark();root.classList.remove("locked");try{window.dispatchEvent(new Event("pn-unlocked"));}catch(e){}}
  function msg(t){var e=document.getElementById("lkMsg");if(e)e.textContent=t;}
  var busy=false;
  async function faceId(){
    C=cfg(); if(!C||!C.id){showPin();return;}
    if(busy)return; busy=true; msg("Guarda l’iPad…");
    try{
      var chal=rnd(32);
      var a=await navigator.credentials.get({publicKey:{challenge:chal,rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb64(C.id)}],userVerification:"required",timeout:60000}});
      var r=a.response,cj=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
      if(cj.type!=="webauthn.get"||cj.challenge!==b64(chal))throw new Error("risposta non valida");
      var flags=new Uint8Array(r.authenticatorData)[32];if(!(flags&4))throw new Error("verifica del volto non fatta");
      if(C.pk){var ok=await verify(C.pk,r.authenticatorData,r.clientDataJSON,r.signature);if(ok===false)throw new Error("firma non valida");}
      done();
    }catch(e){msg(e&&e.name==="NotAllowedError"?"Tocca «Sblocca con Face ID» per riprovare, o usa il codice di riserva.":"Non riuscito: riprova o usa il codice di riserva.");}
    busy=false;
  }
  function showPin(){var b=document.getElementById("lkPinBox");if(b){b.hidden=false;var i=document.getElementById("lkPin");if(i)i.focus();}}
  async function pin(){var v=(document.getElementById("lkPin").value||"").trim();C=cfg();
    if(C&&C.pin&&await sha("pn-pin:"+v)===C.pin){done();document.getElementById("lkPin").value="";document.getElementById("lkErr").textContent="";}
    else{document.getElementById("lkErr").textContent="Codice sbagliato";}}
  function wire(){
    var g=document.getElementById("lkGo");if(!g)return;
    g.onclick=faceId;document.getElementById("lkAlt").onclick=showPin;document.getElementById("lkPinGo").onclick=pin;
    document.getElementById("lkPin").onkeydown=function(e){if(e.key==="Enter")pin();};
    if(root.classList.contains("locked"))faceId();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",wire);else wire();
  // si riblocca dopo 5 minuti fuori dall'app
  document.addEventListener("visibilitychange",function(){C=cfg();if(!C||!C.on)return;
    if(document.visibilityState==="hidden"){if(!root.classList.contains("locked"))mark();}else if(!unlocked()){root.classList.add("locked");msg("Sblocca con Face ID per continuare.");faceId();}});
  setInterval(function(){if(!root.classList.contains("locked")&&document.visibilityState==="visible")mark();},30000);

  /* ---------- attivazione (usata dalla pagina Pianificazione → 🔒 Blocco) ---------- */
  window.__pnLock={
    cfg:cfg,
    available:async function(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}},
    enable:async function(pinCode){
      if(!/^\d{4,8}$/.test(pinCode||""))throw new Error("Il codice di riserva deve avere da 4 a 8 cifre");
      var c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"Pianificazione",id:location.hostname},
        user:{id:rnd(16),name:"pianificazione",displayName:"Pianificazione"},pubKeyCredParams:[{type:"public-key",alg:-7}],
        authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000,attestation:"none"}});
      var pk=null;try{pk=c.response.getPublicKey?b64(c.response.getPublicKey()):null;}catch(e){}
      localStorage.setItem(KEY,JSON.stringify({on:true,id:b64(c.rawId),pk:pk,pin:await sha("pn-pin:"+pinCode),at:new Date().toISOString()}));mark();return true;
    },
    disable:function(){localStorage.removeItem(KEY);try{sessionStorage.removeItem(SES);}catch(e){}},
    lockNow:function(){try{sessionStorage.removeItem(SES);}catch(e){}if(cfg())root.classList.add("locked");msg("Sblocca con Face ID per continuare.");}
  };
})();
</script>

<script>
/* ================= 🤝 METODO =================
   Allenamento a stare con gli altri: 4 abilità, una a settimana (👋 Aprire · 💬 Tenere viva la chiacchierata · 🔁 Farsi vivo · 😊 Calore);
   ogni giorno 3 sfide (facile, media, coraggiosa) in situazioni diverse; Regole d'oro; Preparo un incontro; Com'è andata con il
   riepilogo della domenica; Volontariato a Torino (file pubblico occasioni-torino.json, aggiornato dall'attività programmata).
   I contenuti (schede e sfide) sono in sezioni/metodo_dati.json, controllati a ogni build da strumenti/verifica_metodo.py.
   I dati personali (sfide scelte, note, incontri) restano su questo dispositivo: localStorage «pn-v1» → «met» + database «licenze-marco»
   voce «pianifica», quindi entrano nelle copie giornaliere e nella copia su iCloud. Nessun dato personale nel codice. */
"use strict";
const MD={"abilita":[{"id":"aprire","ic":"👋","n":"Aprire","sotto":"salutare per primo, usare il nome, partire da quello che c'è intorno"},{"id":"viva","ic":"💬","n":"Tenere viva la chiacchierata","sotto":"la seconda domanda, ascoltare davvero, raccontare qualcosa di sé"},{"id":"vivo","ic":"🔁","n":"Farsi vivo","sotto":"un messaggio senza motivo, «com'è andata poi?», un grazie"},{"id":"calore","ic":"😊","n":"Calore","sotto":"complimenti precisi, entusiasmo per le buone notizie, meno formalità"}],"situazioni":{"nuove":"👤 persone nuove","colleghi":"🧑‍💼 colleghi ed ex colleghi","famiglia":"🏡 famiglia e amici","gruppi":"👥 gruppi","vol":"🤲 volontariato"},"livelli":{"1":"facile","2":"media","3":"coraggiosa"},"intro":"Piacere agli altri non è solo un talento: è fatto anche di piccole abitudini che si allenano. E c'è una buona notizia: dopo una chiacchierata, di solito piacciamo all'altro più di quanto pensiamo.","intro_base":"Boothby e colleghi (2018) lo chiamano «liking gap»: dopo una conversazione tra sconosciuti, ognuno in media sottovaluta quanto è piaciuto all'altro.","schede":[{"id":"a1","ab":"aprire","tit":"Saluta per primo","princ":"Un saluto per primo, con un sorriso e guardando negli occhi, dice «mi fa piacere vederti» prima di ogni parola.","es":"Al bar, prima di ordinare: «Buongiorno! Come va stamattina?»","frase":"Buongiorno, come va oggi?","base":"Sandstrom e Dunn (2014): in un esperimento, i clienti di una caffetteria a cui era stato chiesto di scambiare due parole sincere con chi serviva uscivano di umore migliore di quelli a cui era stato chiesto di essere il più rapidi possibile.","app":{"come":"Nello studio, alcuni clienti di una caffetteria dovevano essere il più rapidi possibile; altri dovevano avere uno scambio sincero con chi serviva: sorridere, guardarlo negli occhi, fare due chiacchiere. Chi aveva chiacchierato usciva di umore migliore e si sentiva più parte di una comunità.","prova":["Guarda in faccia e sorridi prima di parlare.","Aggiungi una domanda leggera: «Tutto bene oggi?»","Ricambia sempre il saluto, anche di chi conosci appena."],"att":"Se l'altro ha fretta o una fila davanti, un sorriso e un grazie sono già un saluto riuscito.","fonti":[{"c":"Sandstrom, G. M., & Dunn, E. W. (2014). Is efficiency overrated? Minimal social interactions lead to belonging and positive affect. Social Psychological and Personality Science, 5(4), 437–442.","t":"studio","url":"https://doi.org/10.1177/1948550613502990"}]}},{"id":"a2","ab":"aprire","tit":"Usa il nome","princ":"Sentire il proprio nome fa sentire riconosciuti. Quando ti presentano qualcuno, ripeti subito il nome e usalo ancora una volta mentre parlate.","es":"«Piacere, Laura! Da quanto vieni qui?» E più avanti, salutando: «Ciao Laura, a presto!»","frase":"Scusa, mi ripeti il nome? Ci tengo a ricordarlo.","base":"Dire subito il nome, provare a richiamarlo a mente dopo qualche minuto e collegarlo a qualcosa (il posto, un dettaglio) aiuta a ricordarlo: lo mostrano gli studi sulla memoria dei nomi.","app":{"come":"Per ricordare un nome conta soprattutto richiamarlo a mente: chi prova a ricordarselo dopo poco, poi a intervalli sempre più lunghi, lo ricorda meglio di chi si limita a risentirlo o rileggerlo. Aiuta anche dargli un significato, collegandolo a qualcosa che il nome ti fa venire in mente o che sai di quella persona.","prova":["Appena senti il nome, usalo nella risposta: «Piacere, Laura!»","Dopo un paio di minuti, richiamalo a mente senza dirlo.","Collegalo a un dettaglio: «Laura, quella del cane bianco»."],"att":"Non ripeterlo troppe volte di fila: suona da venditore. Se l'hai dimenticato, chiedilo con naturalezza: capita a tutti.","fonti":[{"c":"Morris, P. E., Fritz, C. O., Jackson, L., Nichol, E., & Roberts, E. (2005). Strategies for learning proper names: Expanding retrieval practice, meaning and imagery. Applied Cognitive Psychology, 19, 779–798.","t":"studio","url":"https://doi.org/10.1002/acp.1115"},{"c":"Brédart, S. (2019). Strategies to improve name learning: A review. European Psychologist, 24(4), 349–358.","t":"studio","url":"https://doi.org/10.1027/1016-9040/a000363"}]}},{"id":"a3","ab":"aprire","tit":"Parti da quello che avete intorno","princ":"Non serve una frase brillante: basta un'osservazione su quello che condividete in quel momento (il posto, l'attesa, l'evento) e una domanda.","es":"In fila: «C'è sempre così tanta gente il sabato?»","frase":"È la prima volta che vieni qui?","base":"Epley e Schroeder (2014): chi sui mezzi pubblici attaccava discorso con uno sconosciuto faceva un viaggio più piacevole di chi restava in silenzio. Si temeva di essere respinti, ma per quanto risultò ai ricercatori nessuno lo fu.","app":{"come":"Sui treni e sugli autobus di Chicago, ad alcuni pendolari fu chiesto di parlare con uno sconosciuto, ad altri di restare per conto proprio. Altri pendolari, a cui si chiedeva solo di immaginare la scena, pensavano che il silenzio sarebbe stato più piacevole e che gli altri non avessero voglia di parlare. Invece chi aveva chiacchierato raccontava un viaggio più piacevole.","prova":["Cerca una cosa che vedete tutti e due: il tempo, la fila, il posto.","Trasforma l'osservazione in una domanda aperta.","Se l'altro risponde a monosillabi, saluta con un sorriso: va bene così."],"att":"Rispetta chi ha le cuffie, legge o ha fretta: sono segnali di voler stare per conto proprio.","fonti":[{"c":"Epley, N., & Schroeder, J. (2014). Mistakenly seeking solitude. Journal of Experimental Psychology: General, 143(5), 1980–1999.","t":"studio","url":"https://doi.org/10.1037/a0037323"},{"c":"Sandstrom, G. M., & Boothby, E. J. (2021). Why do people avoid talking to strangers? A mini meta-analysis of predicted fears and actual experiences talking to a stranger. Self and Identity, 20(1), 47–71.","t":"studio","url":"https://doi.org/10.1080/15298868.2020.1816568"}]}},{"id":"a4","ab":"aprire","tit":"Anche le chiacchiere brevi contano","princ":"Non contano solo gli amici stretti: anche gli scambi con i conoscenti (il vicino, il giornalaio, chi incontri al corso) fanno stare meglio e sentire parte di una comunità.","es":"Due parole con il fornaio sul pane del giorno, un saluto al vicino che porta fuori il cane.","frase":"Allora, come va oggi?","base":"Sandstrom e Dunn (2014): nei giorni in cui le persone avevano più scambi con conoscenti si sentivano più felici e più legate agli altri.","app":{"come":"Per alcuni giorni i partecipanti hanno contato le persone con cui parlavano. Nei giorni in cui avevano parlato con più conoscenti, e non solo con amici e familiari, si sentivano più felici e più legati agli altri.","prova":["Scegli 2 o 3 conoscenti fissi (il bar, l'edicola, il vicino) e salutali per nome.","Ogni volta aggiungi una piccola domanda o un commento.","Ricordati di una cosa che ti hanno detto e chiedine la volta dopo."],"att":"Sono scambi brevi: non serve trasformarli in lunghe conversazioni.","fonti":[{"c":"Sandstrom, G. M., & Dunn, E. W. (2014). Social interactions and well-being: The surprising power of weak ties. Personality and Social Psychology Bulletin, 40(7), 910–922.","t":"studio","url":"https://doi.org/10.1177/0146167214529799"}]}},{"id":"v1","ab":"viva","tit":"La seconda domanda","princ":"Dopo una risposta, fai una domanda proprio su quello che l'altro ha appena detto. È il segno più chiaro che lo stai ascoltando.","es":"«Sono stato in montagna.» «Ah sì? Dove? Che cosa ti è piaciuto di più?»","frase":"E poi com'è andata?","base":"Huang e colleghi (Harvard, 2017): chi faceva più domande di approfondimento piaceva di più alle persone con cui parlava.","app":{"come":"I ricercatori hanno analizzato centinaia di conversazioni, anche in chat e negli incontri di speed date. Chi faceva più domande piaceva di più, e a fare la differenza erano proprio le domande di approfondimento, quelle che riprendono quello che l'altro ha appena detto. Un altro studio mostra che parlare di sé è piacevole per il cervello: per questo una buona domanda è un regalo.","prova":["Ascolta la parola importante della risposta e chiedi proprio di quella.","Usa domande aperte: «Com'è stato?», «Che cosa ti è piaciuto?»","Dopo due o tre domande, racconta qualcosa di tuo."],"att":"Non trasformarla in un interrogatorio: alterna le domande a qualche tuo pensiero.","fonti":[{"c":"Huang, K., Yeomans, M., Brooks, A. W., Minson, J., & Gino, F. (2017). It doesn't hurt to ask: Question-asking increases liking. Journal of Personality and Social Psychology, 113(3), 430–452.","t":"studio","url":"https://doi.org/10.1037/pspi0000097"},{"c":"Tamir, D. I., & Mitchell, J. P. (2012). Disclosing information about the self is intrinsically rewarding. Proceedings of the National Academy of Sciences, 109(21), 8038–8043.","t":"studio","url":"https://doi.org/10.1073/pnas.1202129109"},{"c":"Yeomans, M., Brooks, A. W., Huang, K., Minson, J., & Gino, F. (2019). It helps to ask: The cumulative benefits of asking follow-up questions. Journal of Personality and Social Psychology, 117(6), 1139–1144.","t":"studio","url":"https://doi.org/10.1037/pspi0000220"}]}},{"id":"v2","ab":"viva","tit":"Ascolta senza preparare la risposta","princ":"Mentre l'altro parla, ascolta invece di pensare a cosa dirai. Poi ripeti con parole tue quello che hai capito, senza spostare subito il discorso su di te.","es":"«Quindi il trasloco ti ha sfinito, ma la casa nuova ti piace?»","frase":"Quindi, se ho capito bene…","base":"È il cuore dell'«ascolto attivo»: in uno studio (Weger e colleghi, 2014) chi si sentiva riformulare ciò che aveva detto si sentiva più capito di chi riceveva consigli o solo cenni di assenso.","app":{"come":"In uno studio, alcuni studenti parlavano con un compagno addestrato dai ricercatori dei loro programmi per il fine settimana e di una delusione vissuta all'università. Chi si sentiva riformulare quello che aveva detto, con l'invito a raccontare di più, si sentiva più capito di chi riceveva consigli o solo cenni di assenso. In uno studio precedente riformulare rendeva l'ascoltatore più simpatico, ma non faceva sentire più capiti: meglio usarlo con misura e con parole proprie.","prova":["Mentre l'altro parla, guarda lui e non il telefono.","Riassumi in una frase quello che hai capito.","Chiedi «Ho capito bene?» e lascia che ti corregga."],"att":"Non ripetere a pappagallo: usa parole tue, e solo ogni tanto, quando il discorso è importante.","fonti":[{"c":"Weger, H., Jr., Castle Bell, G., Minei, E. M., & Robinson, M. C. (2014). The relative effectiveness of active listening in initial interactions. International Journal of Listening, 28(1), 13–31.","t":"studio","url":"https://doi.org/10.1080/10904018.2013.813234"},{"c":"Weger, H., Jr., Castle, G. R., & Emmett, M. C. (2010). Active listening in peer interviews: The influence of message paraphrasing on perceptions of listening skill. International Journal of Listening, 24(1), 34–49.","t":"studio","url":"https://doi.org/10.1080/10904010903466311"},{"c":"Kluger, A. N., & Itzchakov, G. (2022). The power of listening at work. Annual Review of Organizational Psychology and Organizational Behavior, 9, 121–146.","t":"studio","url":"https://doi.org/10.1146/annurev-orgpsych-012420-091013"}]}},{"id":"v3","ab":"viva","tit":"Racconta qualcosa di te","princ":"Una chiacchierata è uno scambio: dopo aver ascoltato, racconta un tuo pezzetto simile, poi ripassa la parola. La confidenza cresce un passo alla volta, da tutte e due le parti.","es":"«Anch'io ho cambiato casa due anni fa: il peggio sono stati gli scatoloni dei libri! A te che cosa è pesato di più?»","frase":"Mi è successa una cosa simile…","base":"Aron e colleghi (1997): due sconosciuti che, a turno, rispondevano a domande sempre più personali si sentivano più vicini di chi faceva solo chiacchiere superficiali.","app":{"come":"Coppie di sconosciuti passavano circa 45 minuti a rispondere, a turno, a 36 domande sempre più personali, dai gusti di tutti i giorni ai ricordi importanti. Alla fine si sentivano più vicini delle coppie che avevano fatto solo chiacchiere superficiali. Il segreto è la reciprocità: un passo io, un passo tu.","prova":["Dopo aver ascoltato, racconta un tuo episodio simile, breve.","Torna subito all'altro: «E tu come l'hai vissuta?»","Scendi un gradino alla volta: prima i gusti, poi i ricordi, solo dopo le cose più personali."],"att":"Non rubare la scena: il tuo racconto deve essere più breve del suo.","fonti":[{"c":"Aron, A., Melinat, E., Aron, E. N., Vallone, R. D., & Bator, R. J. (1997). The experimental generation of interpersonal closeness: A procedure and some preliminary findings. Personality and Social Psychology Bulletin, 23(4), 363–377.","t":"studio","url":"https://doi.org/10.1177/0146167297234003"},{"c":"Sprecher, S., Treger, S., Wondra, J. D., Hilaire, N., & Wallpe, K. (2013). Taking turns: Reciprocal self-disclosure promotes liking in initial interactions. Journal of Experimental Social Psychology, 49, 860–866.","t":"studio","url":"https://doi.org/10.1016/j.jesp.2013.03.017"},{"c":"Greater Good in Action, University of California, Berkeley (s.d.). 36 Questions for Increasing Closeness.","t":"articolo","url":"https://ggia.berkeley.edu/practice/36_questions_for_increasing_closeness"}]}},{"id":"v4","ab":"viva","tit":"Chiudi quando è ancora bello","princ":"Le conversazioni non finiscono quasi mai quando tutti e due lo vorrebbero, e spesso non sappiamo indovinare che cosa vuole l'altro. Chiudere con calore, quando la chiacchierata è ancora piacevole, lascia un buon ricordo e la voglia di rivedersi.","es":"«Che bello sentirti! Ti lascio andare, ma riprendiamo presto il discorso del viaggio.»","frase":"Mi ha fatto piacere parlare con te: riprendiamo presto!","base":"Mastroianni e colleghi (2021): su 932 conversazioni, solo il 2% circa è finito quando lo volevano entrambi, e le persone non sanno indovinare quando l'altro vorrebbe smettere.","app":{"come":"I ricercatori hanno chiesto a centinaia di persone, dopo una conversazione, quando avrebbero voluto che finisse e quando pensavano che lo volesse l'altro. Quasi mai era finita quando lo volevano tutti e due; spesso uno avrebbe voluto continuare o smettere prima, e le previsioni su che cosa voleva l'altro erano molto imprecise.","prova":["Chiudi con una frase calda, non con una scusa.","Lascia un aggancio per la prossima volta: «Poi mi racconti com'è andata.»","Se l'altro guarda l'orologio, chiudi tu, con il sorriso."],"att":"Non serve indovinare: nessuno ci riesce bene. Chiudi con calore e lascia la porta aperta: «Ti lascio andare, ma mi piacerebbe continuare un'altra volta.»","fonti":[{"c":"Mastroianni, A. M., Gilbert, D. T., Cooney, G., & Wilson, T. D. (2021). Do conversations end when people want them to? Proceedings of the National Academy of Sciences, 118(10), e2011809118.","t":"studio","url":"https://doi.org/10.1073/pnas.2011809118"}]}},{"id":"f1","ab":"vivo","tit":"Un messaggio senza motivo","princ":"Non serve un'occasione per farsi sentire: «ho pensato a te» basta, ed è proprio la sorpresa che fa piacere.","es":"«Ciao! Sono passato davanti alla pizzeria dove andavamo e mi sei venuto in mente. Come stai?»","frase":"Mi sei venuto in mente: come stai?","base":"Liu e colleghi (2023): chi riceve un messaggio inatteso lo apprezza più di quanto immagini chi lo manda, soprattutto quando è una sorpresa e il legame è meno stretto.","app":{"come":"In una serie di esperimenti, alcune persone mandavano un breve messaggio o un piccolo pensiero a qualcuno che non sentivano da tempo, e prima dovevano indovinare quanto gli avrebbe fatto piacere. Chi lo riceveva lo apprezzava più di quanto si aspettasse chi lo mandava, soprattutto quando era una sorpresa.","prova":["Pensa a una persona che non senti da mesi.","Scrivi due righe concrete: dove ti è venuta in mente e perché.","Chiudi con una domanda semplice: «Come stai?»"],"att":"Se l'altro risponde poco o tardi, non è un rifiuto: spesso è solo fretta.","fonti":[{"c":"Liu, P. J., Rim, S., Min, L., & Min, K. E. (2023). The surprise of reaching out: Appreciated more than we think. Journal of Personality and Social Psychology, 124(4), 754–771.","t":"studio","url":"https://doi.org/10.1037/pspi0000402"},{"c":"American Psychological Association (2022). Friends enjoy being reached out to more than we think.","t":"articolo","url":"https://www.apa.org/news/press/releases/2022/07/friends-enjoy-being-reached"}]}},{"id":"f2","ab":"vivo","tit":"Com'è andata poi?","princ":"Ricordati di una cosa importante che l'altro ti ha raccontato (un esame, un viaggio, un trasloco) e chiedine notizie dopo. Annota in «Com'è andata» solo quello che ti serve per chiedere notizie.","es":"«Allora, com'è andato poi il colloquio di tuo figlio?»","frase":"Com'è andata poi con…?","base":"Sentirsi capiti, apprezzati e seguiti con attenzione è al centro dei legami stretti: Harry Reis e Phillip Shaver (1988) lo chiamano «responsività».","app":{"come":"Secondo il modello dell'intimità di Reis e Shaver, un legame cresce quando una persona si apre e l'altra risponde mostrando di aver capito, di apprezzarla e di tenerci. Ricordarsi di una cosa importante e chiederne notizie in seguito è uno dei modi più chiari per dimostrarlo.","prova":["Dopo un incontro, annota una cosa che l'altro aspettava o temeva.","La volta dopo chiedi: «Com'è andata poi con…?»","Ascolta la risposta con la seconda domanda."],"att":"Annota solo quello che serve per chiedere notizie, e per le cose delicate (salute, famiglia) lascia che sia l'altro a decidere quanto raccontare.","fonti":[{"c":"Reis, H. T., & Shaver, P. (1988). Intimacy as an interpersonal process. In S. Duck (a cura di), Handbook of personal relationships: Theory, research and interventions (pp. 367–389). Wiley.","t":"libro"},{"c":"Itzchakov, G., Reis, H. T., & Weinstein, N. (2022). Do you want to connect with others? Listen to them. Character & Context Blog, Society for Personality and Social Psychology.","t":"articolo","url":"https://spsp.org/news-center/character-context-blog/do-you-want-connect-others-listen-them"}]}},{"id":"f3","ab":"vivo","tit":"Grazie e auguri","princ":"Un grazie preciso, anche dopo tanto tempo, o gli auguri in un giorno importante tengono vivi i legami.","es":"«Ripensavo a quando mi hai aiutato col trasloco: grazie ancora, per me è stato importante.»","frase":"Volevo dirti grazie per…","base":"Kumar ed Epley (2018): chi scrive un ringraziamento sottovaluta quanto farà piacere a chi lo riceve e sopravvaluta l'imbarazzo che proverà.","app":{"come":"Nei loro esperimenti, i partecipanti scrivevano una lettera di ringraziamento a una persona importante per loro e provavano a indovinare la sua reazione. Chi la riceveva era più contento e meno in imbarazzo di quanto avessero previsto gli autori della lettera.","prova":["Scegli una persona che ti ha aiutato, anche anni fa.","Scrivi che cosa ha fatto e che effetto ha avuto su di te.","Mandala senza aspettarti niente in cambio."],"att":"Il grazie funziona se è preciso e sincero: meglio tre righe vere che una frase di circostanza.","fonti":[{"c":"Kumar, A., & Epley, N. (2018). Undervaluing gratitude: Expressers misunderstand the consequences of showing appreciation. Psychological Science, 29(9), 1423–1435.","t":"studio","url":"https://doi.org/10.1177/0956797618772506"},{"c":"University of Chicago News (2018). People underestimate value of sending letters of appreciation.","t":"articolo","url":"https://news.uchicago.edu/story/people-underestimate-value-sending-letters-appreciation"}]}},{"id":"f4","ab":"vivo","tit":"Le amicizie hanno bisogno di tempo","princ":"Un'amicizia non nasce da un incontro solo: cresce con il tempo passato insieme. Per questo conviene rivedere spesso le stesse persone, in un gruppo, un corso o un'attività con un orario fisso.","es":"Invece di tanti incontri sporadici, frequentare un corso del giovedì e restare dopo a fare due chiacchiere.","frase":"Ci vediamo giovedì prossimo?","base":"Hall (2019): servono circa 40–60 ore insieme per passare da conoscente ad amico «alla buona», circa 80–100 per un amico e più di 200 per un amico stretto.","app":{"come":"Lo studio ha interrogato adulti trasferiti da poco in una nuova città e ha seguito per alcune settimane studenti appena arrivati all'università, chiedendo quante ore passavano con le persone conosciute da poco. Le amicizie diventavano più strette con più ore insieme, soprattutto se passate ad aggiornarsi, scherzare, parlare di cose che contano e svagarsi; il tempo passato solo a lavorare o studiare fianco a fianco non aiutava.","prova":["Scegli un'attività con un orario fisso (volontariato, un corso, un gruppo di cammino).","Fermati 10 minuti prima o dopo per parlare.","Proponi di continuare fuori: un caffè dopo l'incontro."],"att":"Le ore contano di più se passate ad aggiornarvi, scherzare e divertirvi insieme: stare solo nella stessa stanza, o scambiarsi frasi di circostanza, non basta.","fonti":[{"c":"Hall, J. A. (2019). How many hours does it take to make a friend? Journal of Social and Personal Relationships, 36(4), 1278–1296.","t":"studio","url":"https://doi.org/10.1177/0265407518761225"}]}},{"id":"c1","ab":"calore","tit":"Il complimento preciso","princ":"Un complimento sincero su una cosa concreta (una scelta, un impegno, un lavoro ben fatto) vale più di tanti complimenti generici.","es":"«Hai organizzato la cena benissimo: si vede che ci hai messo cura.»","frase":"Mi piace come hai…","base":"Zhao ed Epley (2021): chi fa un complimento sottovaluta quanto farà piacere e crede di mettere l'altro in imbarazzo più di quanto accada.","app":{"come":"I partecipanti facevano un complimento sincero a un amico o a una persona che conoscevano e provavano a indovinare come l'avrebbe presa. Chi lo riceveva si sentiva meglio e meno a disagio di quanto immaginasse chi lo faceva. Per questo, spesso, i complimenti restano nella testa e non vengono detti.","prova":["Nota una cosa concreta fatta bene.","Dilla subito, con il motivo: «… perché …»","Non aggiungere un «ma»."],"att":"Meglio sui comportamenti e sulle scelte che sull'aspetto fisico, soprattutto con chi conosci poco.","fonti":[{"c":"Zhao, X., & Epley, N. (2021). Insufficiently complimentary?: Underestimating the positive impact of compliments creates a barrier to expressing them. Journal of Personality and Social Psychology, 121(2), 239–256.","t":"studio","url":"https://doi.org/10.1037/pspa0000277"}]}},{"id":"c2","ab":"calore","tit":"Entusiasmo per le buone notizie","princ":"Quando qualcuno ti racconta una cosa bella, mostra gioia e fai domande. Una risposta tiepida («ah, bene») spegne la conversazione.","es":"«Diventi nonno? Ma è bellissimo! Quando nasce? Come vi sentite?»","frase":"Che bella notizia! Raccontami tutto.","base":"Gable e colleghi (2004): nelle coppie in cui si risponde alle buone notizie dell'altro con entusiasmo e interesse (la «risposta attiva e costruttiva») i rapporti risultano più intimi e soddisfacenti.","app":{"come":"Gable e colleghi distinguono quattro modi di rispondere a una buona notizia: con entusiasmo e domande (attivo e costruttivo), con un tiepido «bene» (passivo), sminuendo («sì, ma…») oppure cambiando discorso. Solo il primo è legato a rapporti più intimi e soddisfacenti. Esperimenti successivi, anche tra sconosciuti, mostrano che una risposta entusiasta aumenta la fiducia e la voglia di confidarsi.","prova":["Mostra gioia con il viso e la voce.","Fai almeno due domande: «Quando? Come ti senti?»","Torna sulla notizia anche nei giorni dopo."],"att":"L'entusiasmo deve essere vero: se una notizia non ti convince, mostra comunque interesse per come l'altro la vive.","fonti":[{"c":"Gable, S. L., Reis, H. T., Impett, E. A., & Asher, E. R. (2004). What do you do when things go right? The intrapersonal and interpersonal benefits of sharing positive events. Journal of Personality and Social Psychology, 87(2), 228–245.","t":"studio","url":"https://doi.org/10.1037/0022-3514.87.2.228"},{"c":"Reis, H. T., Smith, S. M., Carmichael, C. L., Caprariello, P. A., Tsai, F.-F., Rodrigues, A., & Maniaci, M. R. (2010). Are you happy for me? How sharing positive events with others provides personal and interpersonal benefits. Journal of Personality and Social Psychology, 99(2), 311–329.","t":"studio","url":"https://doi.org/10.1037/a0018344"}]}},{"id":"c3","ab":"calore","tit":"Meno formale, più vero","princ":"Quando conosciamo qualcuno, notiamo prima di tutto se sembra ben disposto. Un sorriso, un tono morbido e un pizzico di ironia su te stesso abbassano le difese.","es":"Invece di un «Salve» con la mano rigida, un «Ciao, piacere!» con un sorriso. E se sbagli strada: «Ecco, il mio famoso senso dell'orientamento!»","frase":"Se ti va, possiamo darci del tu.","base":"Fiske, Cuddy e Glick (2007): di una persona giudichiamo prima il calore e poi la competenza, e il calore pesa di più.","app":{"come":"Secondo gli studi raccolti da Fiske, Cuddy e Glick, quando incontriamo qualcuno ci chiediamo subito due cose: ha buone intenzioni verso di me (calore)? È capace (competenza)? Il calore viene giudicato per primo e pesa di più sulle nostre reazioni.","prova":["Sorridi e usa un tono morbido.","Proponi il tu quando l'altro sembra a suo agio.","Un po' di ironia su te stesso, mai sugli altri."],"att":"Meno formale non vuol dire trascurato: con persone più anziane o in contesti ufficiali, il calore passa anche dalla gentilezza del lei.","fonti":[{"c":"Fiske, S. T., Cuddy, A. J. C., & Glick, P. (2007). Universal dimensions of social cognition: Warmth and competence. Trends in Cognitive Sciences, 11(2), 77–83.","t":"studio","url":"https://doi.org/10.1016/j.tics.2006.11.005"}]}},{"id":"c4","ab":"calore","tit":"Un piccolo gesto gentile","princ":"Un gesto gentile e inatteso (un caffè offerto, un aiuto, un pensiero) fa più piacere di quanto crediamo, e spesso mette di buon umore anche chi lo fa.","es":"Al bar, offrire il caffè al collega che ti ha dato una mano in settimana.","frase":"Oggi offro io: grazie per l'altro giorno.","base":"Kumar ed Epley (2023): chi fa un piccolo gesto gentile sottovaluta quanto farà piacere a chi lo riceve.","app":{"come":"Nei loro esperimenti, alcune persone offrivano per esempio una cioccolata calda a sconosciuti in un parco, oppure facevano un piccolo regalo. Chi lo riceveva era più contento di quanto prevedesse chi lo faceva; in un esperimento, chi aveva ricevuto un gesto gentile era poi più generoso a sua volta con altri.","prova":["Scegli un gesto piccolo e concreto.","Fallo senza annunciarlo e senza aspettarti niente.","Accompagnalo con una parola: «Pensavo ti facesse piacere.»"],"att":"Il gesto deve essere piccolo e senza secondi fini: non deve far sentire l'altro in debito.","fonti":[{"c":"Kumar, A., & Epley, N. (2023). A little good goes an unexpectedly long way: Underestimating the positive impact of kindness on recipients. Journal of Experimental Psychology: General, 152(1), 236–252.","t":"studio","url":"https://doi.org/10.1037/xge0001271"},{"c":"Curry, O. S., Rowland, L. A., Van Lissa, C. J., Zlotowitz, S., McAlaney, J., & Whitehouse, H. (2018). Happy to help? A systematic review and meta-analysis of the effects of performing acts of kindness on the well-being of the actor. Journal of Experimental Social Psychology, 76, 320–329.","t":"studio","url":"https://doi.org/10.1016/j.jesp.2018.02.014"}]}}],"sfide":[{"id":"ap1n","ab":"aprire","liv":1,"sit":"nuove","t":"Saluta per primo il barista o il negoziante e chiedigli come va la giornata."},{"id":"ap1c","ab":"aprire","liv":1,"sit":"colleghi","t":"Saluta per nome, con un sorriso, tre colleghi o ex colleghi che incontri oggi."},{"id":"ap1f","ab":"aprire","liv":1,"sit":"famiglia","t":"Quando rientri a casa, saluta per primo ognuno e chiedi: «Com'è andata oggi?»"},{"id":"ap1g","ab":"aprire","liv":1,"sit":"gruppi","t":"Quando arrivi in un gruppo (una riunione, un corso, una sala d'attesa), saluta tu per primo."},{"id":"ap2n","ab":"aprire","liv":2,"sit":"nuove","t":"In fila o in attesa, fai a uno sconosciuto un'osservazione su quello che avete intorno, poi una domanda."},{"id":"ap2c","ab":"aprire","liv":2,"sit":"colleghi","t":"Fai due parole con un collega che conosci poco: «Da quanto sei qui? Di che cosa ti occupi?»"},{"id":"ap2f","ab":"aprire","liv":2,"sit":"famiglia","t":"Al prossimo incontro o telefonata di famiglia, inizia tu la conversazione con il parente con cui parli di meno: «Raccontami, che cosa fai di bello in questo periodo?»"},{"id":"ap2g","ab":"aprire","liv":2,"sit":"gruppi","t":"In un gruppo, presentati a una persona nuova e usa il suo nome almeno una volta."},{"id":"ap3n","ab":"aprire","liv":3,"sit":"nuove","t":"Inizia una vera chiacchierata con un vicino di casa con cui finora vi siete solo salutati."},{"id":"ap3c","ab":"aprire","liv":3,"sit":"colleghi","t":"Proponi un caffè a un collega che conosci poco."},{"id":"ap3f","ab":"aprire","liv":3,"sit":"famiglia","t":"Con un amico di un amico o un parente acquisito che conosci poco, inizia tu una vera chiacchierata partendo da un interesse comune."},{"id":"ap3g","ab":"aprire","liv":3,"sit":"gruppi","t":"Vai a un incontro aperto (una presentazione, una festa di quartiere) e parla con almeno due persone."},{"id":"ap3v","ab":"aprire","liv":3,"sit":"vol","t":"Chiama Vol.To (011 81 38 711) o scrivi a centroservizi@volontariatotorino.it per fissare il colloquio di orientamento gratuito."},{"id":"vi1n","ab":"viva","liv":1,"sit":"nuove","t":"In una chiacchierata breve, fai almeno una seconda domanda su quello che ti hanno risposto."},{"id":"vi1c","ab":"viva","liv":1,"sit":"colleghi","t":"Chiedi a un collega com'è andato il fine settimana (o la giornata di ieri), poi fai una seconda domanda su un dettaglio."},{"id":"vi1f","ab":"viva","liv":1,"sit":"famiglia","t":"A tavola chiedi: «Qual è stata la cosa più bella di oggi?» e ascolta la risposta fino in fondo."},{"id":"vi1g","ab":"viva","liv":1,"sit":"gruppi","t":"In gruppo, quando qualcuno racconta qualcosa, rilancia con una domanda invece di cambiare argomento."},{"id":"vi2n","ab":"viva","liv":2,"sit":"nuove","t":"In una conversazione, ripeti una volta con parole tue quello che hai capito: «Quindi, se ho capito bene…»"},{"id":"vi2c","ab":"viva","liv":2,"sit":"colleghi","t":"Con un collega, racconta un tuo piccolo episodio simile al suo e poi ripassagli la parola."},{"id":"vi2f","ab":"viva","liv":2,"sit":"famiglia","t":"Chiedi a un familiare di raccontarti un suo ricordo (un viaggio, il primo lavoro) e fagli tre domande."},{"id":"vi2g","ab":"viva","liv":2,"sit":"gruppi","t":"In gruppo, coinvolgi chi parla poco: «E tu che cosa ne pensi?»"},{"id":"vi3n","ab":"viva","liv":3,"sit":"nuove","t":"Tieni viva per almeno dieci minuti una chiacchierata con una persona appena conosciuta, alternando domande e racconti."},{"id":"vi3c","ab":"viva","liv":3,"sit":"colleghi","t":"In pausa con un collega, non parlate di lavoro: scopri una sua passione."},{"id":"vi3f","ab":"viva","liv":3,"sit":"famiglia","t":"Passa una serata senza telefono con una persona di famiglia: solo domande, ascolto e racconti."},{"id":"vi3g","ab":"viva","liv":3,"sit":"gruppi","t":"A una cena con più persone, fai almeno una domanda a ciascuno, così che tutti abbiano spazio per raccontare qualcosa."},{"id":"vi3v","ab":"viva","liv":3,"sit":"vol","t":"Partecipa, o iscriviti, a una serata informativa di un'associazione di volontariato e fai due domande a un volontario."},{"id":"fv1n","ab":"vivo","liv":1,"sit":"nuove","t":"Se hai conosciuto qualcuno di recente e hai il suo numero, mandagli due righe: «È stato un piacere conoscerti.»"},{"id":"fv1c","ab":"vivo","liv":1,"sit":"colleghi","t":"Manda un messaggio a un ex collega: «Mi sei venuto in mente, come stai?»"},{"id":"fv1f","ab":"vivo","liv":1,"sit":"famiglia","t":"Manda una foto o un ricordo a un familiare o a un amico lontano, con due righe."},{"id":"fv1g","ab":"vivo","liv":1,"sit":"gruppi","t":"In una chat di gruppo, scrivi un messaggio caloroso o rispondi a qualcuno chiamandolo per nome."},{"id":"fv2n","ab":"vivo","liv":2,"sit":"nuove","t":"Torna nel negozio o nel bar dove hai parlato con qualcuno e riprendi il discorso dell'ultima volta."},{"id":"fv2c","ab":"vivo","liv":2,"sit":"colleghi","t":"Chiedi a un collega notizie di una cosa che ti aveva raccontato: «Com'è andata poi con…?»"},{"id":"fv2f","ab":"vivo","liv":2,"sit":"famiglia","t":"Telefona a un familiare o a un amico per chiedere com'è andata una cosa importante per lui o per lei."},{"id":"fv2g","ab":"vivo","liv":2,"sit":"gruppi","t":"Proponi tu al gruppo una data per rivedervi."},{"id":"fv3n","ab":"vivo","liv":3,"sit":"nuove","t":"Invita a prendere un caffè una persona conosciuta di recente."},{"id":"fv3c","ab":"vivo","liv":3,"sit":"colleghi","t":"Scrivi oggi agli ex colleghi che non vedi da tempo e proponi una data per un pranzo o una pizza."},{"id":"fv3f","ab":"vivo","liv":3,"sit":"famiglia","t":"Scrivi a un familiare o a un amico un grazie preciso per qualcosa che ha fatto per te, anche tanto tempo fa."},{"id":"fv3g","ab":"vivo","liv":3,"sit":"gruppi","t":"Occupati tu del prossimo ritrovo del gruppo: data, posto e messaggio a tutti."},{"id":"fv3v","ab":"vivo","liv":3,"sit":"vol","t":"Scrivi o telefona all'associazione di volontariato che ti ha incuriosito per chiedere come cominciare."},{"id":"ca1n","ab":"calore","liv":1,"sit":"nuove","t":"Fai un complimento preciso a chi ti serve (al bar, in negozio) per una cosa fatta bene."},{"id":"ca1c","ab":"calore","liv":1,"sit":"colleghi","t":"Ringrazia un collega per una cosa concreta che ha fatto, dicendogli perché ti è stata utile."},{"id":"ca1f","ab":"calore","liv":1,"sit":"famiglia","t":"Fai a un familiare un complimento preciso su una scelta o su un impegno, non sull'aspetto."},{"id":"ca1g","ab":"calore","liv":1,"sit":"gruppi","t":"In un incontro di gruppo, guarda negli occhi e sorridi a chi parla, mentre parla."},{"id":"ca2n","ab":"calore","liv":2,"sit":"nuove","t":"Proponi di darvi del tu a una persona che vedi spesso."},{"id":"ca2c","ab":"calore","liv":2,"sit":"colleghi","t":"Chiedi a un collega se c'è qualcosa di bello in arrivo e, se te lo racconta, rispondi con entusiasmo e fagli due domande."},{"id":"ca2f","ab":"calore","liv":2,"sit":"famiglia","t":"Chiedi a un familiare: «Qual è stata la cosa più bella di questa settimana?» e rispondi con entusiasmo: «Che bello! Raccontami tutto.»"},{"id":"ca2g","ab":"calore","liv":2,"sit":"gruppi","t":"In gruppo, ridi di te stesso una volta, con leggerezza, per un piccolo errore o una tua abitudine."},{"id":"ca3n","ab":"calore","liv":3,"sit":"nuove","t":"Offri il tuo aiuto a uno sconosciuto in una piccola cosa (un'indicazione, una borsa pesante), chiedendo prima se gli serve, e scambiate due parole."},{"id":"ca3c","ab":"calore","liv":3,"sit":"colleghi","t":"Scrivi a un collega o ex collega che cosa hai apprezzato di lui o di lei lavorando insieme."},{"id":"ca3f","ab":"calore","liv":3,"sit":"famiglia","t":"Scrivi a mano un biglietto a una persona di famiglia: che cosa ti piace di lei e perché."},{"id":"ca3g","ab":"calore","liv":3,"sit":"gruppi","t":"In un gruppo, presenta tu due persone che non si conoscono, dicendo una cosa bella di ognuna."},{"id":"ca3v","ab":"calore","liv":3,"sit":"vol","t":"Partecipa per almeno un'ora a un'iniziativa di volontariato aperta a tutti (una raccolta, un evento) e ringrazia di persona un volontario per quello che fa."}],"domande_idee":["Che cosa ti ha tenuto impegnato ultimamente?","C'è qualcosa che aspetti con piacere nei prossimi mesi?","Com'è andata poi con…?","Qual è stata la cosa più bella di questo periodo?","Stai leggendo o guardando qualcosa che ti piace?","Che cosa ti piace fare in una giornata libera?","Se domani potessi partire per un viaggio, dove andresti?","Com'è cambiato il quartiere da quando ci abiti?"],"intro_app":{"come":"Coppie di sconosciuti chiacchieravano per qualche minuto; poi ognuno diceva quanto gli era piaciuto l'altro e quanto pensava di essere piaciuto. In media si sottovalutavano: l'altro li aveva apprezzati più di quanto credessero. È successo anche tra compagni di alloggio all'università, per diversi mesi, e in uno studio successivo nei gruppi e nei team di lavoro.","prova":["Dopo un incontro, ricorda che probabilmente sei piaciuto più di quanto pensi.","Non rimuginare sui silenzi o sulle frasi venute male: di solito giudichi i tuoi passi falsi più severamente di quanto faccia l'altro."],"att":"È una tendenza media: non garantisce che ogni incontro vada bene, ma dice che la paura di non piacere è spesso esagerata.","fonti":[{"c":"Boothby, E. J., Cooney, G., Sandstrom, G. M., & Clark, M. S. (2018). The liking gap in conversations: Do people like us more than we think? Psychological Science, 29(11), 1742–1756.","t":"studio","url":"https://doi.org/10.1177/0956797618783714"},{"c":"Mastroianni, A. M., Cooney, G., Boothby, E. J., & Reece, A. G. (2021). The liking gap in groups and teams. Organizational Behavior and Human Decision Processes, 162, 109–122.","t":"studio","url":"https://doi.org/10.1016/j.obhdp.2020.10.013"},{"c":"Association for Psychological Science (2018). You probably made a better first impression than you think.","t":"articolo","url":"https://www.psychologicalscience.org/news/releases/you-probably-made-a-better-first-impression-than-you-think.html"}]}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"long",day:"numeric",month:"long"});
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}

const KEY="pn-v1";
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):st.put(val,key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
const normM=m=>{m=m&&typeof m==="object"?m:{};m.g=m.g&&typeof m.g==="object"?m.g:{};m.inc=Array.isArray(m.inc)?m.inc:[];m.occ=m.occ&&typeof m.occ==="object"?m.occ:{};m.lette=m.lette||{};return m;};
let M=normM((lsJ(KEY)||{}).met);
let saveT=null;
function save(){const P=lsJ(KEY)||{ver:1};P.met=M;P.savedAt=new Date().toISOString();const t=JSON.stringify(P); // riparto sempre dall'ultima versione salvata: le altre sezioni restano intatte
  try{localStorage.setItem(KEY,t);}catch(e){toast("⚠️ Memoria piena: non salvato");return;}clearTimeout(saveT);saveT=setTimeout(()=>kv("readwrite","pianifica",t).catch(()=>{}),300);}
async function recover(){if(lsJ(KEY))return;try{const t=await kv("readonly","pianifica");if(t){localStorage.setItem(KEY,t);M=normM(JSON.parse(t).met);render();}}catch(e){}}

/* ---------- il percorso: un'abilità a settimana, poi si riparte con sfide più impegnative ---------- */
function startOf(){if(!M.start){M.start=monday(today());save();}return M.start;}
function weekInfo(s){const w=Math.max(0,Math.floor(diff(startOf(),s)/7));return{w,ab:AB[w%4],n:w%4+1,ciclo:Math.floor(w/4)};}
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;};
const SITS=["nuove","colleghi","famiglia","gruppi"];
function propose(s,rnd){
  const W=weekInfo(s),lv=W.ciclo?[2,3,3]:[1,2,3],recent=new Set();
  for(let i=1;i<=14;i++){const g=M.g[add(s,-i)];if(g&&g.s)recent.add(g.s);}
  let seed=rnd?Math.floor(Math.random()*1e9):hash(s+W.ab.id);const out=[],used=new Set();
  lv.forEach((l,k)=>{let pool=MD.sfide.filter(x=>x.ab===W.ab.id&&x.liv===l&&!out.includes(x.id));
    const fresh=pool.filter(x=>!recent.has(x.id)&&!used.has(x.sit));if(fresh.length)pool=fresh;else{const f2=pool.filter(x=>!used.has(x.sit));if(f2.length)pool=f2;}
    if(!pool.length)return;const x=pool[(seed>>>(k*5))%pool.length];out.push(x.id);used.add(x.sit);});
  return out;
}
function dayG(s){let g=M.g[s];if(!g){g=M.g[s]={ab:weekInfo(s).ab.id,p:propose(s)};save();}return g;}
function occPrimo(s){const v=OCC&&(OCC.voci||[]).find(x=>"occ:"+x.id===s);return v?`<span class="lbl">${esc(v.primo)}</span>`:"";}
function sfTxt(g){if(!g||!g.s)return "";if(g.s.startsWith("occ:"))return g.txt||"";return (SF[g.s]||{}).t||"";}
