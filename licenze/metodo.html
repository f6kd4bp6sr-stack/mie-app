<div id="lockScr" role="dialog" aria-modal="true" aria-label="App bloccata"><div class="lk">
  <div class="lk-i">🔒</div><h1>Pianificazione</h1><p id="lkMsg">Sblocca con Face ID per continuare.</p>
  <button type="button" class="go" id="lkGo">Sblocca con Face ID</button>
  <div id="lkPinBox" hidden><input id="lkPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="codice di riserva"><div class="err" id="lkErr"></div><button type="button" class="go" id="lkPinGo">Entra</button></div>
  <button type="button" class="alt" id="lkAlt">Usa il codice di riserva</button>
</div></div>
<script>
/* ================= BLOCCO CON FACE ID (comune a tutte le pagine di Pianificazione) =================
   - usa una passkey del dispositivo (WebAuthn): l'iPad chiede Face ID, o il codice dell'iPad se il volto non viene riconosciuto;
   - nessun server: la chiave pubblica resta su questo dispositivo e la firma si verifica qui;
   - codice di riserva (4–8 cifre) se la passkey non fosse disponibile;
   - si riblocca dopo 5 minuti fuori dall'app. I dati restano dove sono: il blocco protegge l'apertura, non cifra i dati. */
/* chiavi di Pianificazione con il prefisso dell'app (prima erano «mie-app-…», nome condiviso con il sito): spostate una volta sola */
(function(){try{[["mie-app-lastSnap","pn-lastSnap"],["mie-app-lastBackup","pn-lastBackup"],["mie-app-copia-cloud","pn-copia-cloud"]].forEach(function(p){var v=localStorage.getItem(p[0]);if(v!=null){if(localStorage.getItem(p[1])==null)localStorage.setItem(p[1],v);localStorage.removeItem(p[0]);}});}catch(e){}})();
(function(){
  "use strict";
  var KEY="pn-lock", SES="pn-unlocked", IDLE=5*60*1000;
  function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
  var C=cfg(), root=document.documentElement;
  function unlocked(){try{var t=+sessionStorage.getItem(SES)||0;return t&&Date.now()-t<IDLE;}catch(e){return false;}}
  function mark(){try{sessionStorage.setItem(SES,String(Date.now()));}catch(e){}}
  if(C&&C.on&&!unlocked())root.classList.add("locked");
  var b64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
  var unb64=function(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
  async function sha(t){var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return b64(h);}
  // firma ES256 (DER) → formato grezzo r|s per WebCrypto
  function der2raw(d){var i=2;if(d[1]&0x80)i+=d[1]&0x7f;function int(){i++;var l=d[i++];var v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);var o=new Uint8Array(32);o.set(v,32-v.length);return o;}var r=int(),s=int(),out=new Uint8Array(64);out.set(r,0);out.set(s,32);return out;}
  async function verify(pkB64,authData,clientJSON,sig){
    try{var key=await crypto.subtle.importKey("spki",unb64(pkB64),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
      var ch=new Uint8Array(await crypto.subtle.digest("SHA-256",clientJSON)),ad=new Uint8Array(authData),data=new Uint8Array(ad.length+ch.length);data.set(ad,0);data.set(ch,ad.length);
      return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,der2raw(new Uint8Array(sig)),data);}catch(e){return null;}
  }
  function done(){mark();root.classList.remove("locked");try{window.dispatchEvent(new Event("pn-unlocked"));}catch(e){}}
  function msg(t){var e=document.getElementById("lkMsg");if(e)e.textContent=t;}
  var busy=false;
  async function faceId(){
    C=cfg(); if(!C||!C.id){showPin();return;}
    if(busy)return; busy=true; msg("Guarda l’iPad…");
    try{
      var chal=rnd(32);
      var a=await navigator.credentials.get({publicKey:{challenge:chal,rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb64(C.id)}],userVerification:"required",timeout:60000}});
      var r=a.response,cj=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
      if(cj.type!=="webauthn.get"||cj.challenge!==b64(chal))throw new Error("risposta non valida");
      var flags=new Uint8Array(r.authenticatorData)[32];if(!(flags&4))throw new Error("verifica del volto non fatta");
      if(C.pk){var ok=await verify(C.pk,r.authenticatorData,r.clientDataJSON,r.signature);if(ok===false)throw new Error("firma non valida");}
      done();
    }catch(e){msg(e&&e.name==="NotAllowedError"?"Tocca «Sblocca con Face ID» per riprovare, o usa il codice di riserva.":"Non riuscito: riprova o usa il codice di riserva.");}
    busy=false;
  }
  function showPin(){var b=document.getElementById("lkPinBox");if(b){b.hidden=false;var i=document.getElementById("lkPin");if(i)i.focus();}}
  async function pin(){var v=(document.getElementById("lkPin").value||"").trim();C=cfg();
    if(C&&C.pin&&await sha("pn-pin:"+v)===C.pin){done();document.getElementById("lkPin").value="";document.getElementById("lkErr").textContent="";}
    else{document.getElementById("lkErr").textContent="Codice sbagliato";}}
  function wire(){
    var g=document.getElementById("lkGo");if(!g)return;
    g.onclick=faceId;document.getElementById("lkAlt").onclick=showPin;document.getElementById("lkPinGo").onclick=pin;
    document.getElementById("lkPin").onkeydown=function(e){if(e.key==="Enter")pin();};
    if(root.classList.contains("locked"))faceId();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",wire);else wire();
  // si riblocca dopo 5 minuti fuori dall'app
  document.addEventListener("visibilitychange",function(){C=cfg();if(!C||!C.on)return;
    if(document.visibilityState==="hidden"){if(!root.classList.contains("locked"))mark();}else if(!unlocked()){root.classList.add("locked");msg("Sblocca con Face ID per continuare.");faceId();}});
  setInterval(function(){if(!root.classList.contains("locked")&&document.visibilityState==="visible")mark();},30000);

  /* ---------- attivazione (usata dalla pagina Pianificazione → 🔒 Blocco) ---------- */
  window.__pnLock={
    cfg:cfg,
    available:async function(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}},
    enable:async function(pinCode){
      if(!/^\d{4,8}$/.test(pinCode||""))throw new Error("Il codice di riserva deve avere da 4 a 8 cifre");
      var c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"Pianificazione",id:location.hostname},
        user:{id:rnd(16),name:"pianificazione",displayName:"Pianificazione"},pubKeyCredParams:[{type:"public-key",alg:-7}],
        authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000,attestation:"none"}});
      var pk=null;try{pk=c.response.getPublicKey?b64(c.response.getPublicKey()):null;}catch(e){}
      localStorage.setItem(KEY,JSON.stringify({on:true,id:b64(c.rawId),pk:pk,pin:await sha("pn-pin:"+pinCode),at:new Date().toISOString()}));mark();return true;
    },
    disable:function(){localStorage.removeItem(KEY);try{sessionStorage.removeItem(SES);}catch(e){}},
    lockNow:function(){try{sessionStorage.removeItem(SES);}catch(e){}if(cfg())root.classList.add("locked");msg("Sblocca con Face ID per continuare.");}
  };
})();
</script>

<script>
/* ================= 🤝 METODO =================
   Allenamento a stare con gli altri: 4 abilità, una a settimana (👋 Aprire · 💬 Tenere viva la chiacchierata · 🔁 Farsi vivo · 😊 Calore);
   ogni giorno 3 sfide (facile, media, coraggiosa) in situazioni diverse; Regole d'oro; Preparo un incontro; Com'è andata con il
   riepilogo della domenica; Volontariato a Torino (file pubblico occasioni-torino.json, aggiornato dall'attività programmata).
   I contenuti (schede e sfide) sono in sezioni/metodo_dati.json, controllati a ogni build da strumenti/verifica_metodo.py.
   I dati personali (sfide scelte, note, incontri) restano su questo dispositivo: localStorage «pn-v1» → «met» + database «licenze-marco»
   voce «pianifica», quindi entrano nelle copie giornaliere e nella copia su iCloud. Nessun dato personale nel codice. */
"use strict";
const MD={"abilita":[{"id":"aprire","ic":"👋","n":"Aprire","sotto":"salutare per primo, usare il nome, partire da quello che c'è intorno","motto":"il ghiaccio non si rompe da solo"},{"id":"viva","ic":"💬","n":"Tenere viva la chiacchierata","sotto":"la seconda domanda, ascoltare davvero, raccontare qualcosa di sé","motto":"vietato fermarsi al «bene, grazie»"},{"id":"vivo","ic":"🔁","n":"Farsi vivo","sotto":"un messaggio senza motivo, «com'è andata poi?», un grazie","motto":"ricordati di esistere (per gli altri)"},{"id":"calore","ic":"😊","n":"Calore","sotto":"complimenti precisi, entusiasmo per le buone notizie, meno formalità","motto":"meno sportello, più bar"}],"situazioni":{"nuove":"👤 persone nuove","colleghi":"🧑‍💼 colleghi ed ex colleghi","famiglia":"🏡 famiglia e amici","gruppi":"👥 gruppi","vol":"🤲 volontariato"},"livelli":{"1":"Riscaldamento","2":"Si fa sul serio","3":"Da leoni"},"intro":"Allenamento alla simpatia, un giorno alla volta. Niente compiti: missioni da pescare, curiosità che sorprendono e qualche figuraccia da ridere.","intro_base":"Boothby e colleghi (2018) lo chiamano «liking gap»: dopo una conversazione tra sconosciuti, ognuno in media sottovaluta quanto è piaciuto all'altro.","schede":[{"id":"a1","ab":"aprire","tit":"Saluta per primo","princ":"Un saluto per primo, con un sorriso e guardando negli occhi, dice «mi fa piacere vederti» prima di ogni parola.","es":"Al bar, prima di ordinare: «Buongiorno! Come va stamattina?»","frase":"Buongiorno, come va oggi?","base":"Sandstrom e Dunn (2014): in un esperimento, i clienti di una caffetteria a cui era stato chiesto di scambiare due parole sincere con chi serviva uscivano di umore migliore di quelli a cui era stato chiesto di essere il più rapidi possibile.","app":{"come":"Nello studio, alcuni clienti di una caffetteria dovevano essere il più rapidi possibile; altri dovevano avere uno scambio sincero con chi serviva: sorridere, guardarlo negli occhi, fare due chiacchiere. Chi aveva chiacchierato usciva di umore migliore e si sentiva più parte di una comunità.","prova":["Guarda in faccia e sorridi prima di parlare.","Aggiungi una domanda leggera: «Tutto bene oggi?»","Ricambia sempre il saluto, anche di chi conosci appena."],"att":"Se l'altro ha fretta o una fila davanti, un sorriso e un grazie sono già un saluto riuscito.","fonti":[{"c":"Sandstrom, G. M., & Dunn, E. W. (2014). Is efficiency overrated? Minimal social interactions lead to belonging and positive affect. Social Psychological and Personality Science, 5(4), 437–442.","t":"studio","url":"https://doi.org/10.1177/1948550613502990"}]},"curio":{"tit":"Il barista ti fa bene all'umore","fatto":"In un esperimento, chi scambiava due parole sincere con il barista usciva di umore migliore di chi ordinava e scappava. Stesso caffè, umore diverso.","trad":"Un «buongiorno, come va?» costa zero e rende parecchio."}},{"id":"a2","ab":"aprire","tit":"Usa il nome","princ":"Sentire il proprio nome fa sentire riconosciuti. Quando ti presentano qualcuno, ripeti subito il nome e usalo ancora una volta mentre parlate.","es":"«Piacere, Laura! Da quanto vieni qui?» E più avanti, salutando: «Ciao Laura, a presto!»","frase":"Scusa, mi ripeti il nome? Ci tengo a ricordarlo.","base":"Dire subito il nome, provare a richiamarlo a mente dopo qualche minuto e collegarlo a qualcosa (il posto, un dettaglio) aiuta a ricordarlo: lo mostrano gli studi sulla memoria dei nomi.","app":{"come":"Per ricordare un nome conta soprattutto richiamarlo a mente: chi prova a ricordarselo dopo poco, poi a intervalli sempre più lunghi, lo ricorda meglio di chi si limita a risentirlo o rileggerlo. Aiuta anche dargli un significato, collegandolo a qualcosa che il nome ti fa venire in mente o che sai di quella persona.","prova":["Appena senti il nome, usalo nella risposta: «Piacere, Laura!»","Dopo un paio di minuti, richiamalo a mente senza dirlo.","Collegalo a un dettaglio: «Laura, quella del cane bianco»."],"att":"Non ripeterlo troppe volte di fila: suona da venditore. Se l'hai dimenticato, chiedilo con naturalezza: capita a tutti.","fonti":[{"c":"Morris, P. E., Fritz, C. O., Jackson, L., Nichol, E., & Roberts, E. (2005). Strategies for learning proper names: Expanding retrieval practice, meaning and imagery. Applied Cognitive Psychology, 19, 779–798.","t":"studio","url":"https://doi.org/10.1002/acp.1115"},{"c":"Brédart, S. (2019). Strategies to improve name learning: A review. European Psychologist, 24(4), 349–358.","t":"studio","url":"https://doi.org/10.1027/1016-9040/a000363"}]},"curio":{"tit":"Il trucco dei nomi","fatto":"Per ricordare un nome, risentirlo tante volte serve meno che sforzarsi di richiamarlo a mente dopo un po', e poi ancora più tardi. La memoria è pigra: va interrogata.","trad":"Tra cinque minuti chiediti: «Come si chiamava?»"}},{"id":"a3","ab":"aprire","tit":"Parti da quello che avete intorno","princ":"Non serve una frase brillante: basta un'osservazione su quello che condividete in quel momento (il posto, l'attesa, l'evento) e una domanda.","es":"In fila: «C'è sempre così tanta gente il sabato?»","frase":"È la prima volta che vieni qui?","base":"Epley e Schroeder (2014): chi sui mezzi pubblici attaccava discorso con uno sconosciuto faceva un viaggio più piacevole di chi restava in silenzio. Si temeva di essere respinti, ma per quanto risultò ai ricercatori nessuno lo fu.","app":{"come":"Sui treni e sugli autobus di Chicago, ad alcuni pendolari fu chiesto di parlare con uno sconosciuto, ad altri di restare per conto proprio. Altri pendolari, a cui si chiedeva solo di immaginare la scena, pensavano che il silenzio sarebbe stato più piacevole e che gli altri non avessero voglia di parlare. Invece chi aveva chiacchierato raccontava un viaggio più piacevole.","prova":["Cerca una cosa che vedete tutti e due: il tempo, la fila, il posto.","Trasforma l'osservazione in una domanda aperta.","Se l'altro risponde a monosillabi, saluta con un sorriso: va bene così."],"att":"Rispetta chi ha le cuffie, legge o ha fretta: sono segnali di voler stare per conto proprio.","fonti":[{"c":"Epley, N., & Schroeder, J. (2014). Mistakenly seeking solitude. Journal of Experimental Psychology: General, 143(5), 1980–1999.","t":"studio","url":"https://doi.org/10.1037/a0037323"},{"c":"Sandstrom, G. M., & Boothby, E. J. (2021). Why do people avoid talking to strangers? A mini meta-analysis of predicted fears and actual experiences talking to a stranger. Self and Identity, 20(1), 47–71.","t":"studio","url":"https://doi.org/10.1080/15298868.2020.1816568"}]},"curio":{"tit":"Lo sconosciuto del tram","fatto":"Sui mezzi pubblici di Chicago, chi attaccava discorso con uno sconosciuto faceva un viaggio più piacevole di chi stava zitto. E i rifiuti temuti? Per quanto risultò ai ricercatori, nessuno.","trad":"Lo sconosciuto del tram ha più voglia di parlare di quanto sembri."}},{"id":"a4","ab":"aprire","tit":"Anche le chiacchiere brevi contano","princ":"Non contano solo gli amici stretti: anche gli scambi con i conoscenti (il vicino, il giornalaio, chi incontri al corso) fanno stare meglio e sentire parte di una comunità.","es":"Due parole con il fornaio sul pane del giorno, un saluto al vicino che porta fuori il cane.","frase":"Allora, come va oggi?","base":"Sandstrom e Dunn (2014): nei giorni in cui le persone avevano più scambi con conoscenti si sentivano più felici e più legate agli altri.","app":{"come":"Per alcuni giorni i partecipanti hanno contato le persone con cui parlavano. Nei giorni in cui avevano parlato con più conoscenti, e non solo con amici e familiari, si sentivano più felici e più legati agli altri.","prova":["Scegli 2 o 3 conoscenti fissi (il bar, l'edicola, il vicino) e salutali per nome.","Ogni volta aggiungi una piccola domanda o un commento.","Ricordati di una cosa che ti hanno detto e chiedine la volta dopo."],"att":"Sono scambi brevi: non serve trasformarli in lunghe conversazioni.","fonti":[{"c":"Sandstrom, G. M., & Dunn, E. W. (2014). Social interactions and well-being: The surprising power of weak ties. Personality and Social Psychology Bulletin, 40(7), 910–922.","t":"studio","url":"https://doi.org/10.1177/0146167214529799"}]},"curio":{"tit":"La forza dei conoscenti","fatto":"Non contano solo gli amici del cuore: nei giorni in cui chiacchieriamo con più conoscenti (il giornalaio, il vicino, quello del corso) ci sentiamo più felici.","trad":"Anche il giornalaio fa parte della tua squadra."}},{"id":"v1","ab":"viva","tit":"La seconda domanda","princ":"Dopo una risposta, fai una domanda proprio su quello che l'altro ha appena detto. È il segno più chiaro che lo stai ascoltando.","es":"«Sono stato in montagna.» «Ah sì? Dove? Che cosa ti è piaciuto di più?»","frase":"E poi com'è andata?","base":"Huang e colleghi (Harvard, 2017): chi faceva più domande di approfondimento piaceva di più alle persone con cui parlava.","app":{"come":"I ricercatori hanno analizzato centinaia di conversazioni, anche in chat e negli incontri di speed date. Chi faceva più domande piaceva di più, e a fare la differenza erano proprio le domande di approfondimento, quelle che riprendono quello che l'altro ha appena detto. Un altro studio mostra che parlare di sé è piacevole per il cervello: per questo una buona domanda è un regalo.","prova":["Ascolta la parola importante della risposta e chiedi proprio di quella.","Usa domande aperte: «Com'è stato?», «Che cosa ti è piaciuto?»","Dopo due o tre domande, racconta qualcosa di tuo."],"att":"Non trasformarla in un interrogatorio: alterna le domande a qualche tuo pensiero.","fonti":[{"c":"Huang, K., Yeomans, M., Brooks, A. W., Minson, J., & Gino, F. (2017). It doesn't hurt to ask: Question-asking increases liking. Journal of Personality and Social Psychology, 113(3), 430–452.","t":"studio","url":"https://doi.org/10.1037/pspi0000097"},{"c":"Tamir, D. I., & Mitchell, J. P. (2012). Disclosing information about the self is intrinsically rewarding. Proceedings of the National Academy of Sciences, 109(21), 8038–8043.","t":"studio","url":"https://doi.org/10.1073/pnas.1202129109"},{"c":"Yeomans, M., Brooks, A. W., Huang, K., Minson, J., & Gino, F. (2019). It helps to ask: The cumulative benefits of asking follow-up questions. Journal of Personality and Social Psychology, 117(6), 1139–1144.","t":"studio","url":"https://doi.org/10.1037/pspi0000220"}]},"curio":{"tit":"Le domande ti rendono simpatico","fatto":"Analizzando centinaia di conversazioni, i ricercatori hanno visto che chi fa più domande di approfondimento piace di più. E secondo un altro studio, parlare di sé attiva nel cervello aree legate alla ricompensa: una buona domanda è un piccolo regalo.","trad":"«E poi?» è la frase più simpatica della lingua italiana."}},{"id":"v2","ab":"viva","tit":"Ascolta senza preparare la risposta","princ":"Mentre l'altro parla, ascolta invece di pensare a cosa dirai. Poi ripeti con parole tue quello che hai capito, senza spostare subito il discorso su di te.","es":"«Quindi il trasloco ti ha sfinito, ma la casa nuova ti piace?»","frase":"Quindi, se ho capito bene…","base":"È il cuore dell'«ascolto attivo»: in uno studio (Weger e colleghi, 2014) chi si sentiva riformulare ciò che aveva detto si sentiva più capito di chi riceveva consigli o solo cenni di assenso.","app":{"come":"In uno studio, alcuni studenti parlavano con un compagno addestrato dai ricercatori dei loro programmi per il fine settimana e di una delusione vissuta all'università. Chi si sentiva riformulare quello che aveva detto, con l'invito a raccontare di più, si sentiva più capito di chi riceveva consigli o solo cenni di assenso. In uno studio precedente riformulare rendeva l'ascoltatore più simpatico, ma non faceva sentire più capiti: meglio usarlo con misura e con parole proprie.","prova":["Mentre l'altro parla, guarda lui e non il telefono.","Riassumi in una frase quello che hai capito.","Chiedi «Ho capito bene?» e lascia che ti corregga."],"att":"Non ripetere a pappagallo: usa parole tue, e solo ogni tanto, quando il discorso è importante.","fonti":[{"c":"Weger, H., Jr., Castle Bell, G., Minei, E. M., & Robinson, M. C. (2014). The relative effectiveness of active listening in initial interactions. International Journal of Listening, 28(1), 13–31.","t":"studio","url":"https://doi.org/10.1080/10904018.2013.813234"},{"c":"Weger, H., Jr., Castle, G. R., & Emmett, M. C. (2010). Active listening in peer interviews: The influence of message paraphrasing on perceptions of listening skill. International Journal of Listening, 24(1), 34–49.","t":"studio","url":"https://doi.org/10.1080/10904010903466311"},{"c":"Kluger, A. N., & Itzchakov, G. (2022). The power of listening at work. Annual Review of Organizational Psychology and Organizational Behavior, 9, 121–146.","t":"studio","url":"https://doi.org/10.1146/annurev-orgpsych-012420-091013"}]},"curio":{"tit":"Lo specchio che fa sentire capiti","fatto":"In uno studio, riassumere con parole proprie quello che l'altro aveva detto, e invitarlo a raccontare di più, lo faceva sentire più capito di un consiglio. Senza esagerare: il pappagallo non ha mai vinto premi di simpatia.","trad":"Prima di consigliare, riassumi."}},{"id":"v3","ab":"viva","tit":"Racconta qualcosa di te","princ":"Una chiacchierata è uno scambio: dopo aver ascoltato, racconta un tuo pezzetto simile, poi ripassa la parola. La confidenza cresce un passo alla volta, da tutte e due le parti.","es":"«Anch'io ho cambiato casa due anni fa: il peggio sono stati gli scatoloni dei libri! A te che cosa è pesato di più?»","frase":"Mi è successa una cosa simile…","base":"Aron e colleghi (1997): due sconosciuti che, a turno, rispondevano a domande sempre più personali si sentivano più vicini di chi faceva solo chiacchiere superficiali.","app":{"come":"Coppie di sconosciuti passavano circa 45 minuti a rispondere, a turno, a 36 domande sempre più personali, dai gusti di tutti i giorni ai ricordi importanti. Alla fine si sentivano più vicini delle coppie che avevano fatto solo chiacchiere superficiali. Il segreto è la reciprocità: un passo io, un passo tu.","prova":["Dopo aver ascoltato, racconta un tuo episodio simile, breve.","Torna subito all'altro: «E tu come l'hai vissuta?»","Scendi un gradino alla volta: prima i gusti, poi i ricordi, solo dopo le cose più personali."],"att":"Non rubare la scena: il tuo racconto deve essere più breve del suo.","fonti":[{"c":"Aron, A., Melinat, E., Aron, E. N., Vallone, R. D., & Bator, R. J. (1997). The experimental generation of interpersonal closeness: A procedure and some preliminary findings. Personality and Social Psychology Bulletin, 23(4), 363–377.","t":"studio","url":"https://doi.org/10.1177/0146167297234003"},{"c":"Sprecher, S., Treger, S., Wondra, J. D., Hilaire, N., & Wallpe, K. (2013). Taking turns: Reciprocal self-disclosure promotes liking in initial interactions. Journal of Experimental Social Psychology, 49, 860–866.","t":"studio","url":"https://doi.org/10.1016/j.jesp.2013.03.017"},{"c":"Greater Good in Action, University of California, Berkeley (s.d.). 36 Questions for Increasing Closeness.","t":"articolo","url":"https://ggia.berkeley.edu/practice/36_questions_for_increasing_closeness"}]},"curio":{"tit":"Un passo io, un passo tu","fatto":"Due sconosciuti che si raccontano cose di sé, a turno e un gradino alla volta, finiscono per sentirsi più vicini. Il segreto è il turno: se parla uno solo, è un comizio.","trad":"Hai ascoltato? Ora racconta un pezzetto tuo."}},{"id":"v4","ab":"viva","tit":"Chiudi quando è ancora bello","princ":"Le conversazioni non finiscono quasi mai quando tutti e due lo vorrebbero, e spesso non sappiamo indovinare che cosa vuole l'altro. Chiudere con calore, quando la chiacchierata è ancora piacevole, lascia un buon ricordo e la voglia di rivedersi.","es":"«Che bello sentirti! Ti lascio andare, ma riprendiamo presto il discorso del viaggio.»","frase":"Mi ha fatto piacere parlare con te: riprendiamo presto!","base":"Mastroianni e colleghi (2021): quasi nessuna conversazione finisce quando lo vogliono entrambi (tra sconosciuti in laboratorio, il 2% circa), e le persone non sanno indovinare quando l'altro vorrebbe smettere.","app":{"come":"I ricercatori hanno chiesto a centinaia di persone, dopo una conversazione, quando avrebbero voluto che finisse e quando pensavano che lo volesse l'altro. Quasi mai era finita quando lo volevano tutti e due; spesso uno avrebbe voluto continuare o smettere prima, e le previsioni su che cosa voleva l'altro erano molto imprecise.","prova":["Chiudi con una frase calda, non con una scusa.","Lascia un aggancio per la prossima volta: «Poi mi racconti com'è andata.»","Se l'altro guarda l'orologio, chiudi tu, con il sorriso."],"att":"Non serve indovinare: nessuno ci riesce bene. Chiudi con calore e lascia la porta aperta: «Ti lascio andare, ma mi piacerebbe continuare un'altra volta.»","fonti":[{"c":"Mastroianni, A. M., Gilbert, D. T., Cooney, G., & Wilson, T. D. (2021). Do conversations end when people want them to? Proceedings of the National Academy of Sciences, 118(10), e2011809118.","t":"studio","url":"https://doi.org/10.1073/pnas.2011809118"}]},"curio":{"tit":"Nessuno sa quando finire","fatto":"Su 932 conversazioni studiate, quasi nessuna è finita quando lo volevano tutti e due: tra coppie di sconosciuti, solo il 2% circa. Spesso uno avrebbe voluto continuare o scappare prima, e l'altro non lo indovinava.","trad":"Chiudi tu, con calore, quando è ancora bello."}},{"id":"f1","ab":"vivo","tit":"Un messaggio senza motivo","princ":"Non serve un'occasione per farsi sentire: «ho pensato a te» basta, ed è proprio la sorpresa che fa piacere.","es":"«Ciao! Sono passato davanti alla pizzeria dove andavamo e mi sei venuto in mente. Come stai?»","frase":"Mi sei venuto in mente: come stai?","base":"Liu e colleghi (2023): chi riceve un messaggio inatteso lo apprezza più di quanto immagini chi lo manda, soprattutto quando è una sorpresa e il legame è meno stretto.","app":{"come":"In una serie di esperimenti, alcune persone mandavano un breve messaggio o un piccolo pensiero a qualcuno che non sentivano da tempo, e prima dovevano indovinare quanto gli avrebbe fatto piacere. Chi lo riceveva lo apprezzava più di quanto si aspettasse chi lo mandava, soprattutto quando era una sorpresa.","prova":["Pensa a una persona che non senti da mesi.","Scrivi due righe concrete: dove ti è venuta in mente e perché.","Chiudi con una domanda semplice: «Come stai?»"],"att":"Se l'altro risponde poco o tardi, non è un rifiuto: spesso è solo fretta.","fonti":[{"c":"Liu, P. J., Rim, S., Min, L., & Min, K. E. (2023). The surprise of reaching out: Appreciated more than we think. Journal of Personality and Social Psychology, 124(4), 754–771.","t":"studio","url":"https://doi.org/10.1037/pspi0000402"},{"c":"American Psychological Association (2022). Friends enjoy being reached out to more than we think.","t":"articolo","url":"https://www.apa.org/news/press/releases/2022/07/friends-enjoy-being-reached"}]},"curio":{"tit":"Il messaggio a sorpresa","fatto":"Chi riceve un messaggio inatteso da qualcuno che non sente da tempo lo apprezza più di quanto immagini chi lo manda, soprattutto se è una sorpresa.","trad":"Quel «come stai?» che rimandi da mesi: mandalo."}},{"id":"f2","ab":"vivo","tit":"Com'è andata poi?","princ":"Ricordati di una cosa importante che l'altro ti ha raccontato (un esame, un viaggio, un trasloco) e chiedine notizie dopo. Annota in «Com'è andata» solo quello che ti serve per chiedere notizie.","es":"«Allora, com'è andato poi il colloquio di tuo figlio?»","frase":"Com'è andata poi con…?","base":"Sentirsi capiti, apprezzati e seguiti con attenzione è al centro dei legami stretti: Harry Reis e Phillip Shaver (1988) lo chiamano «responsività».","app":{"come":"Secondo il modello dell'intimità di Reis e Shaver, un legame cresce quando una persona si apre e l'altra risponde mostrando di aver capito, di apprezzarla e di tenerci. Ricordarsi di una cosa importante e chiederne notizie in seguito è uno dei modi più chiari per dimostrarlo.","prova":["Dopo un incontro, annota una cosa che l'altro aspettava o temeva.","La volta dopo chiedi: «Com'è andata poi con…?»","Ascolta la risposta con la seconda domanda."],"att":"Annota solo quello che serve per chiedere notizie, e per le cose delicate (salute, famiglia) lascia che sia l'altro a decidere quanto raccontare.","fonti":[{"c":"Reis, H. T., & Shaver, P. (1988). Intimacy as an interpersonal process. In S. Duck (a cura di), Handbook of personal relationships: Theory, research and interventions (pp. 367–389). Wiley.","t":"libro"},{"c":"Itzchakov, G., Reis, H. T., & Weinstein, N. (2022). Do you want to connect with others? Listen to them. Character & Context Blog, Society for Personality and Social Psychology.","t":"articolo","url":"https://spsp.org/news-center/character-context-blog/do-you-want-connect-others-listen-them"}]},"curio":{"tit":"La memoria è una forma di affetto","fatto":"Un legame cresce quando l'altro si sente capito e seguito con attenzione. Chiedere «com'è andata poi?» dimostra in un colpo solo che hai ascoltato e che ci tieni.","trad":"Ricordati il dettaglio, e chiedine notizie."}},{"id":"f3","ab":"vivo","tit":"Grazie e auguri","princ":"Un grazie preciso, anche dopo tanto tempo, o gli auguri in un giorno importante tengono vivi i legami.","es":"«Ripensavo a quando mi hai aiutato col trasloco: grazie ancora, per me è stato importante.»","frase":"Volevo dirti grazie per…","base":"Kumar ed Epley (2018): chi scrive un ringraziamento sottovaluta quanto farà piacere a chi lo riceve e sopravvaluta l'imbarazzo che proverà.","app":{"come":"Nei loro esperimenti, i partecipanti scrivevano una lettera di ringraziamento a una persona importante per loro e provavano a indovinare la sua reazione. Chi la riceveva era più contento e meno in imbarazzo di quanto avessero previsto gli autori della lettera.","prova":["Scegli una persona che ti ha aiutato, anche anni fa.","Scrivi che cosa ha fatto e che effetto ha avuto su di te.","Mandala senza aspettarti niente in cambio."],"att":"Il grazie funziona se è preciso e sincero: meglio tre righe vere che una frase di circostanza.","fonti":[{"c":"Kumar, A., & Epley, N. (2018). Undervaluing gratitude: Expressers misunderstand the consequences of showing appreciation. Psychological Science, 29(9), 1423–1435.","t":"studio","url":"https://doi.org/10.1177/0956797618772506"},{"c":"University of Chicago News (2018). People underestimate value of sending letters of appreciation.","t":"articolo","url":"https://news.uchicago.edu/story/people-underestimate-value-sending-letters-appreciation"}]},"curio":{"tit":"Il grazie sottovalutato","fatto":"Chi scrive un ringraziamento pensa che farà poco effetto e che l'altro si imbarazzerà. Chi lo riceve, invece, è più contento e meno imbarazzato del previsto.","trad":"Quel grazie arretrato non scade: mandalo oggi."}},{"id":"f4","ab":"vivo","tit":"Le amicizie hanno bisogno di tempo","princ":"Un'amicizia non nasce da un incontro solo: cresce con il tempo passato insieme. Per questo conviene rivedere spesso le stesse persone, in un gruppo, un corso o un'attività con un orario fisso.","es":"Invece di tanti incontri sporadici, frequentare un corso del giovedì e restare dopo a fare due chiacchiere.","frase":"Ci vediamo giovedì prossimo?","base":"Hall (2019): servono circa 40–60 ore insieme per passare da conoscente ad amico «alla buona», circa 80–100 per un amico e più di 200 per un amico stretto.","app":{"come":"Lo studio ha interrogato adulti trasferiti da poco in una nuova città e ha seguito per alcune settimane studenti appena arrivati all'università, chiedendo quante ore passavano con le persone conosciute da poco. Le amicizie diventavano più strette con più ore insieme, soprattutto se passate ad aggiornarsi, scherzare, parlare di cose che contano e svagarsi; il tempo passato solo a lavorare o studiare fianco a fianco non aiutava.","prova":["Scegli un'attività con un orario fisso (volontariato, un corso, un gruppo di cammino).","Fermati 10 minuti prima o dopo per parlare.","Proponi di continuare fuori: un caffè dopo l'incontro."],"att":"Le ore contano di più se passate ad aggiornarvi, scherzare e divertirvi insieme: stare solo nella stessa stanza, o scambiarsi frasi di circostanza, non basta.","fonti":[{"c":"Hall, J. A. (2019). How many hours does it take to make a friend? Journal of Social and Personal Relationships, 36(4), 1278–1296.","t":"studio","url":"https://doi.org/10.1177/0265407518761225"}]},"curio":{"tit":"Le amicizie si contano in ore","fatto":"Per un amico «alla buona» servono circa 40–60 ore insieme, per un amico vero 80–100, per un amico stretto più di 200. Ore di chiacchiere e risate, non di fila alle Poste.","trad":"Meglio un'attività fissa che cento incontri a caso."}},{"id":"c1","ab":"calore","tit":"Il complimento preciso","princ":"Un complimento sincero su una cosa concreta (una scelta, un impegno, un lavoro ben fatto) vale più di tanti complimenti generici.","es":"«Hai organizzato la cena benissimo: si vede che ci hai messo cura.»","frase":"Mi piace come hai…","base":"Zhao ed Epley (2021): chi fa un complimento sottovaluta quanto farà piacere e crede di mettere l'altro in imbarazzo più di quanto accada.","app":{"come":"I partecipanti facevano un complimento sincero a un amico o a una persona che conoscevano e provavano a indovinare come l'avrebbe presa. Chi lo riceveva si sentiva meglio e meno a disagio di quanto immaginasse chi lo faceva. Per questo, spesso, i complimenti restano nella testa e non vengono detti.","prova":["Nota una cosa concreta fatta bene.","Dilla subito, con il motivo: «… perché …»","Non aggiungere un «ma»."],"att":"Meglio sui comportamenti e sulle scelte che sull'aspetto fisico, soprattutto con chi conosci poco.","fonti":[{"c":"Zhao, X., & Epley, N. (2021). Insufficiently complimentary?: Underestimating the positive impact of compliments creates a barrier to expressing them. Journal of Personality and Social Psychology, 121(2), 239–256.","t":"studio","url":"https://doi.org/10.1037/pspa0000277"}]},"curio":{"tit":"Il complimento trattenuto","fatto":"Chi fa un complimento sincero sottovaluta quanto farà piacere e teme di mettere l'altro in imbarazzo. Risultato: tanti complimenti restano in testa e non arrivano mai.","trad":"Se lo pensi, dillo."}},{"id":"c2","ab":"calore","tit":"Entusiasmo per le buone notizie","princ":"Quando qualcuno ti racconta una cosa bella, mostra gioia e fai domande. Una risposta tiepida («ah, bene») spegne la conversazione.","es":"«Diventi nonno? Ma è bellissimo! Quando nasce? Come vi sentite?»","frase":"Che bella notizia! Raccontami tutto.","base":"Gable e colleghi (2004): nelle coppie in cui si risponde alle buone notizie dell'altro con entusiasmo e interesse (la «risposta attiva e costruttiva») i rapporti risultano più intimi e soddisfacenti.","app":{"come":"Gable e colleghi distinguono quattro modi di rispondere a una buona notizia: con entusiasmo e domande (attivo e costruttivo), con un tiepido «bene» (passivo), sminuendo («sì, ma…») oppure cambiando discorso. Solo il primo è legato a rapporti più intimi e soddisfacenti. Esperimenti successivi, anche tra sconosciuti, mostrano che una risposta entusiasta aumenta la fiducia e la voglia di confidarsi.","prova":["Mostra gioia con il viso e la voce.","Fai almeno due domande: «Quando? Come ti senti?»","Torna sulla notizia anche nei giorni dopo."],"att":"L'entusiasmo deve essere vero: se una notizia non ti convince, mostra comunque interesse per come l'altro la vive.","fonti":[{"c":"Gable, S. L., Reis, H. T., Impett, E. A., & Asher, E. R. (2004). What do you do when things go right? The intrapersonal and interpersonal benefits of sharing positive events. Journal of Personality and Social Psychology, 87(2), 228–245.","t":"studio","url":"https://doi.org/10.1037/0022-3514.87.2.228"},{"c":"Reis, H. T., Smith, S. M., Carmichael, C. L., Caprariello, P. A., Tsai, F.-F., Rodrigues, A., & Maniaci, M. R. (2010). Are you happy for me? How sharing positive events with others provides personal and interpersonal benefits. Journal of Personality and Social Psychology, 99(2), 311–329.","t":"studio","url":"https://doi.org/10.1037/a0018344"}]},"curio":{"tit":"Il tifo per le buone notizie","fatto":"Davanti a una bella notizia, un tiepido «ah, bene» non scalda nessuno; entusiasmo e un paio di domande, invece, avvicinano e fanno venire voglia di confidarsi.","trad":"Alle buone notizie degli altri si fa il tifo."}},{"id":"c3","ab":"calore","tit":"Meno formale, più vero","princ":"Quando conosciamo qualcuno, notiamo prima di tutto se sembra ben disposto. Un sorriso, un tono morbido e un pizzico di ironia su te stesso abbassano le difese.","es":"Invece di un «Salve» con la mano rigida, un «Ciao, piacere!» con un sorriso. E se sbagli strada: «Ecco, il mio famoso senso dell'orientamento!»","frase":"Se ti va, possiamo darci del tu.","base":"Fiske, Cuddy e Glick (2007): di una persona giudichiamo prima il calore e poi la competenza, e il calore pesa di più.","app":{"come":"Secondo gli studi raccolti da Fiske, Cuddy e Glick, quando incontriamo qualcuno ci chiediamo subito due cose: ha buone intenzioni verso di me (calore)? È capace (competenza)? Il calore viene giudicato per primo e pesa di più sulle nostre reazioni.","prova":["Sorridi e usa un tono morbido.","Proponi il tu quando l'altro sembra a suo agio.","Un po' di ironia su te stesso, mai sugli altri."],"att":"Meno formale non vuol dire trascurato: con persone più anziane o in contesti ufficiali, il calore passa anche dalla gentilezza del lei.","fonti":[{"c":"Fiske, S. T., Cuddy, A. J. C., & Glick, P. (2007). Universal dimensions of social cognition: Warmth and competence. Trends in Cognitive Sciences, 11(2), 77–83.","t":"studio","url":"https://doi.org/10.1016/j.tics.2006.11.005"}]},"curio":{"tit":"Prima il calore, poi il curriculum","fatto":"Quando conosciamo qualcuno ci chiediamo subito due cose: è ben disposto verso di me? È capace? Alla prima rispondiamo prima, e conta di più.","trad":"Un sorriso apre più porte di un curriculum."}},{"id":"c4","ab":"calore","tit":"Un piccolo gesto gentile","princ":"Un gesto gentile e inatteso (un caffè offerto, un aiuto, un pensiero) fa più piacere di quanto crediamo, e spesso mette di buon umore anche chi lo fa.","es":"Al bar, offrire il caffè al collega che ti ha dato una mano in settimana.","frase":"Oggi offro io: grazie per l'altro giorno.","base":"Kumar ed Epley (2023): chi fa un piccolo gesto gentile sottovaluta quanto farà piacere a chi lo riceve.","app":{"come":"Nei loro esperimenti, alcune persone offrivano per esempio una cioccolata calda a sconosciuti in un parco, oppure facevano un piccolo regalo. Chi lo riceveva era più contento di quanto prevedesse chi lo faceva; in un esperimento, chi aveva ricevuto un gesto gentile era poi più generoso a sua volta con altri.","prova":["Scegli un gesto piccolo e concreto.","Fallo senza annunciarlo e senza aspettarti niente.","Accompagnalo con una parola: «Pensavo ti facesse piacere.»"],"att":"Il gesto deve essere piccolo e senza secondi fini: non deve far sentire l'altro in debito.","fonti":[{"c":"Kumar, A., & Epley, N. (2023). A little good goes an unexpectedly long way: Underestimating the positive impact of kindness on recipients. Journal of Experimental Psychology: General, 152(1), 236–252.","t":"studio","url":"https://doi.org/10.1037/xge0001271"},{"c":"Curry, O. S., Rowland, L. A., Van Lissa, C. J., Zlotowitz, S., McAlaney, J., & Whitehouse, H. (2018). Happy to help? A systematic review and meta-analysis of the effects of performing acts of kindness on the well-being of the actor. Journal of Experimental Social Psychology, 76, 320–329.","t":"studio","url":"https://doi.org/10.1016/j.jesp.2018.02.014"}]},"curio":{"tit":"La gentilezza rende più del previsto","fatto":"Chi fa un piccolo gesto gentile, come offrire una cioccolata calda a uno sconosciuto, sottovaluta quanto farà piacere. E in un esperimento chi l'aveva ricevuto è stato poi più generoso con altri.","trad":"Ogni tanto il caffè offrilo tu."}}],"sfide":[{"id":"ap1n","ab":"aprire","liv":1,"sit":"nuove","t":"Chiedi al barista (o al fornaio) che cosa sceglierebbe lui, oggi.","nome":"☕ Operazione Cornetto","bonus":"Se ti spiega perché la crema batte la marmellata, hai vinto la giornata."},{"id":"ap1c","ab":"aprire","liv":1,"sit":"colleghi","t":"Saluta per nome, con un sorriso, tre colleghi o ex colleghi.","nome":"🏷️ Nome e sorriso","bonus":"Se ne ripeschi uno che avevi sulla punta della lingua, vale doppio."},{"id":"ap1f","ab":"aprire","liv":1,"sit":"famiglia","t":"Quando rientri, saluta tu per primo ognuno e chiedi: «Allora, com'è andata oggi?»","nome":"🏠 Bentornati a casa","bonus":"Vietato accettare «bene» come unica risposta."},{"id":"ap1g","ab":"aprire","liv":1,"sit":"gruppi","t":"Quando arrivi in un gruppo (una riunione, un corso, una sala d'attesa), saluta tu per primo.","nome":"👋 Il primo della classe","bonus":"Gli altri ricambieranno: è quasi una legge della fisica."},{"id":"ap1v","ab":"aprire","liv":1,"sit":"vol","nome":"🔎 Curiosare non costa","t":"Cerca un'associazione di volontariato del tuo quartiere, leggi che cosa fa e salvane una che ti incuriosisce.","bonus":"Per ora si guarda e basta, come le vetrine il sabato."},{"id":"ap2n","ab":"aprire","liv":2,"sit":"nuove","t":"In fila o in attesa, fai a uno sconosciuto un commento su quello che avete intorno, poi una domanda.","nome":"🌫️ Meteo di quartiere","bonus":"A Torino la nebbia è un argomento che non delude mai."},{"id":"ap2c","ab":"aprire","liv":2,"sit":"colleghi","t":"Fai due parole con un collega che conosci poco: «Di che cosa ti occupi, di preciso?»","nome":"🔍 Il collega misterioso","bonus":"Se alla fine sapresti spiegarlo a un altro, hai ascoltato davvero."},{"id":"ap2f","ab":"aprire","liv":2,"sit":"famiglia","t":"Al prossimo incontro o telefonata di famiglia, inizia tu con il parente con cui parli di meno: «Raccontami, che cosa fai di bello?»","nome":"🎙️ Intervista di famiglia","bonus":"Ascolta almeno due minuti senza parlare di te."},{"id":"ap2g","ab":"aprire","liv":2,"sit":"gruppi","t":"In un gruppo, presentati a una persona nuova e usa il suo nome almeno una volta.","nome":"🐘 Memoria da elefante","bonus":"Ricordalo anche il giorno dopo, senza appunti."},{"id":"ap3n","ab":"aprire","liv":3,"sit":"nuove","t":"Inizia una vera chiacchierata con un vicino con cui finora vi siete detti solo «buongiorno».","nome":"🚪 Il vicino sconosciuto","bonus":"Se scopri come si chiama il suo cane, conta come mezza amicizia."},{"id":"ap3c","ab":"aprire","liv":3,"sit":"colleghi","t":"Proponi un caffè a un collega che conosci poco.","nome":"☕ Caffè a sorpresa","bonus":"Offri tu: è l'investimento più redditizio della settimana."},{"id":"ap3f","ab":"aprire","liv":3,"sit":"famiglia","t":"Con l'amico di un amico o un parente acquisito che conosci poco, inizia tu una chiacchierata partendo da un interesse comune.","nome":"🧩 Il pezzo che mancava","bonus":"Trova almeno una cosa che piace a tutti e due."},{"id":"ap3g","ab":"aprire","liv":3,"sit":"gruppi","t":"Vai a un incontro aperto (una presentazione, una festa di quartiere) e parla con almeno due persone.","nome":"🎪 Facce nuove","bonus":"Una delle due non deve c'entrare niente con te."},{"id":"ap3v","ab":"aprire","liv":3,"sit":"vol","t":"Chiama Vol.To (011 81 38 711) o scrivi a centroservizi@volontariatotorino.it per fissare il colloquio di orientamento gratuito.","nome":"📞 Chiamata di orientamento","bonus":"Dieci minuti di telefonata che possono cambiarti la settimana."},{"id":"vi1n","ab":"viva","liv":1,"sit":"nuove","t":"In una chiacchierata breve, fai almeno una seconda domanda su quello che ti hanno appena risposto.","nome":"🔁 Il «E poi?»","bonus":"Due parole, zero fatica, e l'altro ti racconta il resto."},{"id":"vi1c","ab":"viva","liv":1,"sit":"colleghi","t":"Chiedi a un collega com'è andato il fine settimana (o la giornata di ieri), poi una seconda domanda su un dettaglio.","nome":"📅 Il lunedì del collega","bonus":"Se risponde «niente di che», chiedi che cosa ha mangiato: funziona sempre."},{"id":"vi1f","ab":"viva","liv":1,"sit":"famiglia","t":"A tavola chiedi: «Qual è stata la cosa più bella di oggi?» e ascolta la risposta fino in fondo.","nome":"🍝 Domanda a tavola","bonus":"Il telefono resta a faccia in giù: per una sera può fare il timido."},{"id":"vi1g","ab":"viva","liv":1,"sit":"gruppi","t":"In gruppo, quando qualcuno racconta qualcosa, rilancia con una domanda invece di cambiare argomento.","nome":"🎾 Il rimbalzo","bonus":"Resisti all'«anche a me una volta…» per almeno un giro."},{"id":"vi2n","ab":"viva","liv":2,"sit":"nuove","t":"In una conversazione, ripeti una volta con parole tue quello che hai capito: «Quindi, se ho capito bene…»","nome":"🪞 Lo specchio","bonus":"Se l'altro dice «esatto!», hai fatto centro."},{"id":"vi2c","ab":"viva","liv":2,"sit":"colleghi","t":"Con un collega, racconta un tuo piccolo episodio simile al suo, poi ripassagli la parola.","nome":"🤝 Uno a uno","bonus":"Regola d'oro: il tuo racconto dura meno del suo."},{"id":"vi2f","ab":"viva","liv":2,"sit":"famiglia","t":"Chiedi a un familiare di raccontarti un suo ricordo (un viaggio, il primo lavoro) e fagli tre domande.","nome":"📼 Archivio di famiglia","bonus":"Bonus se scopri una marachella di gioventù che nessuno ti aveva mai raccontato."},{"id":"vi2g","ab":"viva","liv":2,"sit":"gruppi","t":"In gruppo, coinvolgi chi parla poco: «E tu che cosa ne pensi?»","nome":"🎤 Il microfono passa","bonus":"Spesso è proprio chi ha la storia più bella."},{"id":"vi3n","ab":"viva","liv":3,"sit":"nuove","t":"Tieni viva per almeno dieci minuti una chiacchierata con una persona appena conosciuta, alternando domande e racconti.","nome":"⏱️ Dieci minuti di gloria","bonus":"Se perdi il filo, pesca una frase di scorta."},{"id":"vi3c","ab":"viva","liv":3,"sit":"colleghi","t":"In pausa con un collega, non parlate di lavoro: scopri una sua passione.","nome":"🚫 Vietato il lavoro","bonus":"Chi nomina una pratica paga il caffè."},{"id":"vi3f","ab":"viva","liv":3,"sit":"famiglia","t":"Passa una serata senza telefono con una persona di famiglia: solo domande, ascolto e racconti.","nome":"📵 Serata analogica","bonus":"Sì, si sopravvive. Anzi."},{"id":"vi3g","ab":"viva","liv":3,"sit":"gruppi","t":"A una cena con più persone, fai almeno una domanda a ciascuno, così che tutti abbiano spazio per raccontare.","nome":"🎬 Il regista","bonus":"Nessuno ricorderà il regista: ricorderanno che si sono divertiti."},{"id":"vi3v","ab":"viva","liv":3,"sit":"vol","t":"Partecipa, o iscriviti, a una serata informativa di un'associazione di volontariato e fai due domande a un volontario.","nome":"🎟️ Serata informativa","bonus":"Chiedigli che cosa gli piace di più: lì si accende."},{"id":"fv1n","ab":"vivo","liv":1,"sit":"nuove","t":"Se hai conosciuto qualcuno di recente e hai il suo numero, mandagli due righe: «È stato un piacere conoscerti.»","nome":"💌 Il seguito","bonus":"Tempo richiesto: 30 secondi. Effetto: settimane."},{"id":"fv1c","ab":"vivo","liv":1,"sit":"colleghi","t":"Manda un messaggio a un ex collega: «Mi sei venuto in mente, come stai?»","nome":"👻 Operazione Fantasma","bonus":"Gli farà più piacere di quanto pensi: lo dicono gli studi."},{"id":"fv1f","ab":"vivo","liv":1,"sit":"famiglia","t":"Manda una foto o un ricordo a un familiare o a un amico lontano, con due righe.","nome":"📸 Cartolina digitale","bonus":"Una foto vecchia vale doppio."},{"id":"fv1g","ab":"vivo","liv":1,"sit":"gruppi","t":"In una chat di gruppo, scrivi un messaggio caloroso o rispondi a qualcuno chiamandolo per nome.","nome":"💬 Chat risvegliata","bonus":"Senza le immagini del buongiorno, per favore."},{"id":"fv2n","ab":"vivo","liv":2,"sit":"nuove","t":"Torna nel negozio o nel bar dove hai parlato con qualcuno e riprendi il discorso dell'ultima volta.","nome":"🔁 La puntata successiva","bonus":"«Allora, alla fine la crema ha vinto?»"},{"id":"fv2c","ab":"vivo","liv":2,"sit":"colleghi","t":"Chiedi a un collega notizie di una cosa che ti aveva raccontato: «Com'è andata poi con…?»","nome":"📌 Il promemoria umano","bonus":"Il dettaglio ricordato vale più di un regalo."},{"id":"fv2f","ab":"vivo","liv":2,"sit":"famiglia","t":"Telefona a un familiare o a un amico per chiedere com'è andata una cosa importante per lui o per lei.","nome":"☎️ Telefonata col seguito","bonus":"Niente favori da chiedere: solo notizie."},{"id":"fv2g","ab":"vivo","liv":2,"sit":"gruppi","t":"Proponi tu al gruppo una data per rivedervi.","nome":"🗓️ Data alla mano","bonus":"Una data precisa: «uno di questi giorni» non vale."},{"id":"fv3n","ab":"vivo","liv":3,"sit":"nuove","t":"Invita a prendere un caffè una persona conosciuta di recente.","nome":"☕ Il secondo caffè","bonus":"È al secondo caffè che un conoscente comincia a diventare un amico."},{"id":"fv3c","ab":"vivo","liv":3,"sit":"colleghi","t":"Scrivi oggi agli ex colleghi che non vedi da tempo e proponi una data per un pranzo o una pizza.","nome":"🍕 Operazione Rimpatriata","bonus":"Preparati una storia di allora da raccontare."},{"id":"fv3f","ab":"vivo","liv":3,"sit":"famiglia","t":"Scrivi a un familiare o a un amico un grazie preciso per qualcosa che ha fatto per te, anche tanto tempo fa.","nome":"🙏 Il grazie in ritardo","bonus":"Più è in ritardo, più sorprende."},{"id":"fv3g","ab":"vivo","liv":3,"sit":"gruppi","t":"Occupati tu del prossimo ritrovo del gruppo: data, posto e messaggio a tutti.","nome":"🎉 Il capo-ritrovo","bonus":"Scegli un posto dove ci si sente parlare."},{"id":"fv3v","ab":"vivo","liv":3,"sit":"vol","t":"Scrivi o telefona all'associazione di volontariato che ti ha incuriosito per chiedere come cominciare.","nome":"✉️ Il primo messaggio","bonus":"Il primo passo è il più corto, anche se sembra il più lungo."},{"id":"ca1n","ab":"calore","liv":1,"sit":"nuove","t":"Fai un complimento preciso a chi ti serve (al bar, in negozio) per una cosa fatta bene.","nome":"🏆 Il premio del giorno","bonus":"«Il cappuccino migliore del quartiere» vale, se lo pensi davvero."},{"id":"ca1c","ab":"calore","liv":1,"sit":"colleghi","t":"Ringrazia un collega per una cosa concreta che ha fatto, dicendogli perché ti è stata utile.","nome":"🎁 Grazie con il perché","bonus":"Il «perché» trasforma un grazie in un regalo."},{"id":"ca1f","ab":"calore","liv":1,"sit":"famiglia","t":"Fai a un familiare un complimento preciso su una scelta o su un impegno, non sull'aspetto.","nome":"🌟 Complimento da intenditore","bonus":"«Mi piace come hai…» è l'attacco perfetto."},{"id":"ca1g","ab":"calore","liv":1,"sit":"gruppi","t":"In un incontro di gruppo, guarda negli occhi e sorridi a chi parla, mentre parla.","nome":"😊 Il pubblico perfetto","bonus":"Chi parla davanti a tutti cerca sempre una faccia amica: sii tu."},{"id":"ca2n","ab":"calore","liv":2,"sit":"nuove","t":"Proponi di darvi del tu a una persona che vedi spesso: «Se ti va, possiamo darci del tu.»","nome":"🤝 Promozione al «tu»","bonus":"Spesso la risposta è: «Finalmente!»"},{"id":"ca2c","ab":"calore","liv":2,"sit":"colleghi","t":"Chiedi a un collega se c'è qualcosa di bello in arrivo e, se te lo racconta, rispondi con entusiasmo e fagli due domande.","nome":"📣 Tifoso ufficiale","bonus":"Vietato il «beato te»."},{"id":"ca2f","ab":"calore","liv":2,"sit":"famiglia","t":"Chiedi a un familiare: «Qual è stata la cosa più bella di questa settimana?» e rispondi: «Che bello! Raccontami tutto.»","nome":"🎉 Ufficio entusiasmo","bonus":"La faccia deve dire la stessa cosa delle parole."},{"id":"ca2g","ab":"calore","liv":2,"sit":"gruppi","t":"In gruppo, ridi di te stesso una volta, con leggerezza, per un piccolo errore o una tua abitudine.","nome":"🤡 Autoironia controllata","bonus":"Su di te sì, sugli altri mai."},{"id":"ca3n","ab":"calore","liv":3,"sit":"nuove","t":"Offri aiuto a uno sconosciuto in una piccola cosa (un'indicazione, una borsa pesante), chiedendo prima se gli serve, e scambiate due parole.","nome":"🦸 Supereroe di quartiere","bonus":"Mantello facoltativo."},{"id":"ca3c","ab":"calore","liv":3,"sit":"colleghi","t":"Scrivi a un collega o ex collega che cosa hai apprezzato di lui o di lei lavorando insieme.","nome":"⭐ Recensione a cinque stelle","bonus":"Un episodio preciso vale più di dieci aggettivi."},{"id":"ca3f","ab":"calore","liv":3,"sit":"famiglia","t":"Scrivi a mano un biglietto a una persona di famiglia: che cosa ti piace di lei e perché.","nome":"✍️ Il biglietto a mano","bonus":"Sì, a mano: la calligrafia storta fa parte del fascino."},{"id":"ca3g","ab":"calore","liv":3,"sit":"gruppi","t":"In un gruppo, presenta tu due persone che non si conoscono, dicendo una cosa bella di ognuna.","nome":"🎀 Il presentatore","bonus":"Due amicizie in un colpo solo: complimenti."},{"id":"ca3v","ab":"calore","liv":3,"sit":"vol","t":"Partecipa almeno per un'ora a un'iniziativa di volontariato aperta a tutti e ringrazia di persona un volontario per quello che fa.","nome":"🤲 Un'ora per gli altri","bonus":"Scoprirai che il grazie torna indietro."}],"domande_idee":["Qual è la cosa più inutile che hai comprato quest'anno?","Se domani potessi partire per un viaggio, dove andresti?","Che cosa ti piace fare in una giornata libera?","Stai leggendo o guardando qualcosa che ti piace?","Qual è il piatto che ti riesce meglio?","C'è qualcosa che aspetti con piacere nei prossimi mesi?","Com'è cambiato il quartiere da quando ci abiti?","Qual è stata la cosa più bella di questo periodo?","E poi com'è andata?","Che cosa ti è piaciuto di più?","Come ci sei arrivato?"],"intro_app":{"come":"Coppie di sconosciuti chiacchieravano per qualche minuto; poi ognuno diceva quanto gli era piaciuto l'altro e quanto pensava di essere piaciuto. In media si sottovalutavano: l'altro li aveva apprezzati più di quanto credessero. È successo anche tra compagni di alloggio all'università, per diversi mesi, e in uno studio successivo nei gruppi e nei team di lavoro.","prova":["Dopo un incontro, ricorda che probabilmente sei piaciuto più di quanto pensi.","Non rimuginare sui silenzi o sulle frasi venute male: di solito giudichi i tuoi passi falsi più severamente di quanto faccia l'altro."],"att":"È una tendenza media: non garantisce che ogni incontro vada bene, ma dice che la paura di non piacere è spesso esagerata.","fonti":[{"c":"Boothby, E. J., Cooney, G., Sandstrom, G. M., & Clark, M. S. (2018). The liking gap in conversations: Do people like us more than we think? Psychological Science, 29(11), 1742–1756.","t":"studio","url":"https://doi.org/10.1177/0956797618783714"},{"c":"Mastroianni, A. M., Cooney, G., Boothby, E. J., & Reece, A. G. (2021). The liking gap in groups and teams. Organizational Behavior and Human Decision Processes, 162, 109–122.","t":"studio","url":"https://doi.org/10.1016/j.obhdp.2020.10.013"},{"c":"Association for Psychological Science (2018). You probably made a better first impression than you think.","t":"articolo","url":"https://www.psychologicalscience.org/news/releases/you-probably-made-a-better-first-impression-than-you-think.html"}]},"intro_curio":{"tit":"Sei più simpatico di quanto credi","fatto":"Dopo una chiacchierata tra sconosciuti, in media pensiamo di essere piaciuti meno di quanto siamo piaciuti davvero. Gli psicologi lo chiamano «liking gap».","trad":"Quella frase venuta male l'hai notata soprattutto tu."},"quiz":[{"id":"q1","sch":"v1","q":"A cena il tuo vicino di posto dice: «Sono appena tornato dal Portogallo.» Tu:","op":[{"t":"«Io in Portogallo non ci sono mai stato.»","ok":0,"r":"Conversazione deceduta alle 21:14. Causa: muro."},{"t":"«Bello. Mi passi il sale?»","ok":0,"r":"Il sale arriva, la conversazione no."},{"t":"«Che cosa ti ha sorpreso di più?»","ok":1,"r":"Domanda di approfondimento: chi le fa piace di più. Ora preparati alle foto."}]},{"id":"q2","sch":"a2","q":"Ti presentano Roberta. Dopo tre minuti il nome è già evaporato. Tu:","op":[{"t":"La chiami «cara» per tutta la sera.","ok":0,"r":"Strategia diffusa. Lei se ne accorge."},{"t":"«Scusa, mi ripeti il nome? Ci tengo a ricordarlo.»","ok":1,"r":"Capita a tutti, e chiederlo con un sorriso fa piacere. Poi richiamalo a mente tra qualche minuto."},{"t":"Speri che qualcuno la chiami ad alta voce.","ok":0,"r":"Funziona solo alle Poste, col numerino."}]},{"id":"q3","sch":"a3","q":"In fila da venti minuti. La signora davanti a te sospira. Tu:","op":[{"t":"Sospiri più forte: gara di sospiri.","ok":0,"r":"Pareggio. Nessuno vince."},{"t":"«Oggi si sono dati appuntamento tutti qui, eh?»","ok":1,"r":"Un commento su quello che condividete: il modo più semplice per aprire."},{"t":"Fingi una telefonata importantissima.","ok":0,"r":"La fila resta lunga uguale, ma più solitaria."}]},{"id":"q4","sch":"c2","q":"Tuo cugino: «Ho trovato lavoro a Milano!» Tu:","op":[{"t":"«Milano? Con quella nebbia?»","ok":0,"r":"La nebbia ce l'abbiamo anche noi. E lui ci è rimasto male."},{"t":"«Ah, bene.»","ok":0,"r":"Risposta tiepida: la notizia muore lì."},{"t":"«Ma è fantastico! Che lavoro? Quando inizi?»","ok":1,"r":"Entusiasmo e domande: così l'altro si sente capito e ha voglia di raccontarti ancora."}]},{"id":"q5","sch":"v4","q":"La chiacchierata sul pianerottolo con il vicino è stata piacevole, ma devi andare. Tu:","op":[{"t":"Guardi l'orologio ogni trenta secondi finché capisce.","ok":0,"r":"Capisce. E si offende un po'."},{"t":"«Che bello parlarti! Devo scappare, ma poi mi racconti il resto.»","ok":1,"r":"Chiudere con calore e lasciare un aggancio: buon ricordo garantito."},{"t":"Inventi che ti sta bollendo il latte.","ok":0,"r":"Sul pianerottolo? Poco credibile. E una scusa chiude la porta, invece di lasciarla aperta."}]},{"id":"q6","sch":"f1","q":"Ti viene in mente un vecchio amico che non senti da due anni. Tu:","op":[{"t":"Pensi «chissà se si ricorda di me» e lasci perdere.","ok":0,"r":"Probabilmente si ricorda, e sarebbe contento di sentirti."},{"t":"Gli scrivi: «Mi sei venuto in mente, come stai?»","ok":1,"r":"Un messaggio inatteso fa più piacere di quanto pensi chi lo manda."},{"t":"Aspetti il suo compleanno, tra undici mesi.","ok":0,"r":"C'è una scorciatoia: si chiama «oggi»."}]},{"id":"q7","sch":"v2","q":"Un'amica ti racconta che il trasloco l'ha sfinita. Tu:","op":[{"t":"«Dovevi chiamare una ditta, te l'avevo detto.»","ok":0,"r":"Consiglio non richiesto e pure in ritardo: doppio errore."},{"t":"«Quindi ti ha proprio sfinita… Qual è stata la parte peggiore?»","ok":1,"r":"Riformulare e invitare a raccontare fa sentire capiti più di un consiglio."},{"t":"«Io ho traslocato in un giorno solo.»","ok":0,"r":"Medaglia d'oro nei traslochi, medaglia di legno nell'ascolto."}]},{"id":"q8","sch":"c1","q":"Il collega ha preparato una presentazione chiara e ordinata. Tu:","op":[{"t":"Pensi che è stato bravo, e te lo tieni per te.","ok":0,"r":"Il complimento rimasto in testa non scalda nessuno."},{"t":"«Bella presentazione, ma la slide 7…»","ok":0,"r":"Il «ma» si è mangiato il complimento."},{"t":"«Mi è piaciuto come hai spiegato i numeri: chiarissimo.»","ok":1,"r":"Preciso e sincero: farà più piacere di quanto immagini."}]},{"id":"q9","sch":"v1","q":"Un conoscente ti racconta della sua passione per la pesca. Tu della pesca sai zero. Tu:","op":[{"t":"Annuisci e pensi alla spesa.","ok":0,"r":"Se ne accorge dopo dieci secondi."},{"t":"«Io preferisco il calcio.»","ok":0,"r":"Grazie per l'informazione. Fine."},{"t":"«Non ne so niente: qual è il momento più bello di una giornata di pesca?»","ok":1,"r":"Ammettere di non sapere e chiedere è il modo migliore per farlo parlare di ciò che ama."}]},{"id":"q10","sch":"c3","q":"Primo giorno a un corso. Ti presenti:","op":[{"t":"«Buongiorno. Piacere.» Stretta di mano da notaio.","ok":0,"r":"Corretto, ma la temperatura è di 4 gradi."},{"t":"«Ciao, piacere! Sono nuovo: mi sono già perso due volte per trovare l'aula.»","ok":1,"r":"Calore e un pizzico di autoironia: gli altri si rilassano subito."},{"t":"Non ti presenti: tanto lo scopriranno.","ok":0,"r":"Lo scopriranno, sì. Tra tre settimane."}]},{"id":"q11","sch":"a4","q":"Il giornalaio ti saluta ogni mattina da anni, ma non sai come si chiama. Tu:","op":[{"t":"Continui così: ormai è tardi per chiederlo.","ok":0,"r":"Non è mai tardi. È solo un po' buffo, e va benissimo."},{"t":"«Dopo tutti questi anni mi vergogno a chiederlo: come si chiama?»","ok":1,"r":"Dare un nome alla faccia: le chiacchiere con i conoscenti fanno bene all'umore."},{"t":"Lo chiami «capo».","ok":0,"r":"Lui ti chiama «dottore». Siete pari."}]},{"id":"q12","sch":"f2","q":"Un mese fa un amico ti aveva detto che aspettava un'operazione al ginocchio. Lo rivedi. Tu:","op":[{"t":"Parli del tempo.","ok":0,"r":"Lui si chiede se l'avevi ascoltato."},{"t":"«Com'è andata poi con il ginocchio?»","ok":1,"r":"Ricordarsi e chiedere notizie dimostra che ci tieni."},{"t":"«Io ho mal di schiena da mesi, sai?»","ok":0,"r":"Gara di acciacchi: perdete tutti e due."}]},{"id":"q13","sch":"f4","q":"Vorresti nuovi amici. Che cosa funziona di più?","op":[{"t":"Andare ogni sera in un posto diverso.","ok":0,"r":"Tante facce, nessuna che ti riconosce."},{"t":"Frequentare la stessa attività ogni settimana e fermarti a chiacchierare dopo.","ok":1,"r":"Le amicizie crescono con le ore passate insieme, meglio se tra chiacchiere e risate."},{"t":"Aspettare che ti chiamino.","ok":0,"r":"Strategia del divano. Risultato garantito: niente."}]},{"id":"q14","sch":"v1","q":"A una cena di gruppo c'è una persona che non ha ancora detto una parola. Tu:","op":[{"t":"Lasci stare: se vuole parlare, parlerà.","ok":0,"r":"Forse. O forse aspettava solo un invito."},{"t":"Le fai una domanda facile: «E tu, come conosci i padroni di casa?»","ok":1,"r":"Una domanda facile è un invito, non un'interrogazione: chi fa domande piace di più, e spesso chi taceva ha le storie migliori."},{"t":"Racconti la tua barzelletta più lunga per riempire il silenzio.","ok":0,"r":"Il silenzio è riempito. Anche la pazienza degli altri."}]},{"id":"q15","sch":"c4","q":"Al bar c'è il collega che ieri ti ha dato una mano. Tu:","op":[{"t":"Lo saluti con un cenno e paghi il tuo.","ok":0,"r":"Corretto, ma hai perso un'occasione da un euro e venti."},{" const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;};

function propose(s,rnd){
  const W=weekInfo(s),lv=W.ciclo?[2,3,3]:[1,2,3],recent=new Set();
  for(let i=1;i<=14;i++){const g=M.g[add(s,-i)];if(g&&g.s)recent.add(g.s);}
  let seed=rnd?Math.floor(Math.random()*1e9):hash(s+W.ab.id);const out=[],used=new Set();
  lv.forEach((l,k)=>{let pool=MD.sfide.filter(x=>x.ab===W.ab.id&&x.liv===l&&!out.includes(x.id));
    const fresh=pool.filter(x=>!recent.has(x.id)&&!used.has(x.sit));if(fresh.length)pool=fresh;else{const f2=pool.filter(x=>!used.has(x.sit));if(f2.length)pool=f2;}
    if(!pool.length)return;const x=pool[(seed>>>(k*5))%pool.length];out.push(x.id);used.add(x.sit);});
  return out;
}

function fonteH(f){return `<div class="fo"><span class="k">${FT[f.t]||"fonte"}</span>${esc(f.c)}${f.url?` <a href="${esc(f.url)}" target="_blank" rel="noopener">${f.url.includes("doi.org")?"DOI ›":"Apri ›"}</a>`:""}</div>`;}
function appH(a,lid,x){if(!a)return "";return `<details class="app" data-lid="${lid}"><summary>🔎 Da dove viene? Lo studio, come provarci, le fonti</summary>
  ${x?`<h4>📏 La regola</h4><p>${esc(x.princ)}</p><p class="es">${esc(x.es)}</p>`:""}
  <h4>🧪 Che cosa hanno scoperto</h4><p>${esc(a.come)}</p>
  <h4>✅ Prova così</h4><ol>${(a.prova||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
  <h4>⚠️ Attenzione</h4><p>${esc(a.att)}</p>
  <h4>📚 Fonti <span class="lbl" style="font-weight:600">(in inglese)</span></h4>${(a.fonti||[]).map(fonteH).join("")}</details>`;}
function curioH(x){const c=x.curio;return `<div class="cur"><b class="ct">${esc(c.tit)}</b><p>${esc(c.fatto)}</p><p class="trad">👉 <b>Tradotto:</b> ${esc(c.trad)}</p><span class="fr">💬 «${esc(x.frase)}»</span>${appH(x.app,x.id,x)}</div>`;}
function curioIntro(){const c=MD.intro_curio;return `<div class="cur"><b class="ct">${esc(c.tit)}</b><p>${esc(c.fatto)}</p><p class="trad">👉 <b>Tradotto:</b> ${esc(c.trad)}</p>${appH(MD.intro_app,"intro")}</div>`;}
function bibH(){const L=[],seen=new Set();[MD.intro_app].concat(MD.schede.map(s=>s.app)).forEach(a=>(a&&a.fonti||[]).forEach(f=>{if(!seen.has(f.c)){seen.add(f.c);L.push(f);}}));
  L.sort((a,b)=>a.c.localeCompare(b.c,"it"));return `<details class="card plain bib"><summary><h3 style="display:inline">📚 Tutte le fonti (${L.length})</h3></summary><p class="lbl" style="margin:6px 0">Studi pubblicati su riviste scientifiche con revisione, più qualche articolo che li spiega in breve.</p>${L.map(fonteH).join("")}</details>`;}
function vSapevi(){const W=weekInfo(today()),n=Object.keys(M.lette).length;
  return `<div class="card"><h3>🧠 Lo sapevi?</h3><p style="margin:0">Curiosità vere dalla psicologia delle relazioni, con la traduzione pratica. Sotto ognuna, «Da dove viene?» apre lo studio e le fonti.</p><p class="lbl" style="margin:6px 0 0">Approfondimenti aperti: ${n} di ${MD.schede.length+1}</p></div>
    <div class="card plain">${curioIntro()}</div>`+AB.map(a=>`<div class="card${a.id===W.ab.id?"":" plain"}"><h3>${a.ic} ${esc(a.n)}${a.id===W.ab.id?` <span class="pill m">questa settimana</span>`:""}</h3>${MD.schede.filter(x=>x.ab===a.id).map(curioH).join("")}</div>`).join("")+bibH();}

const QZ=Object.fromEntries(MD.quiz.map(q=>[q.id,q]));
function quizDay(s){const A=M.quiz.ans,L=MD.quiz,st=((dayN(s))%L.length+L.length)%L.length;for(let k=0;k<L.length;k++){const q=L[(st+k)%L.length];if(!(q.id in A))return q.id;}return L[st].id;}
function quizH(id,where){const q=QZ[id];if(!q)return "";const a=quizAns&&quizAns.id===id?quizAns.i:where==="oggi"&&id in M.quiz.pick?M.quiz.pick[id]:null,done=a!=null;
  const sch=q.sch==="intro"?{curio:MD.intro_curio}:MD.schede.find(x=>x.id===q.sch);
  return `<div class="qz"><p class="qq">${esc(q.q)}</p>${q.op.map((op,i)=>`<button class="qo${done?(op.ok?" ok":i===a?" no":" dim"):""}" data-qa="${id}:${i}"${done?" disabled":""}><b>${"ABC"[i]})</b> ${esc(op.t)}${done&&(op.ok||i===a)?`<span class="qr">${op.ok?"✅ ":"❌ "}${esc(op.r)}</span>`:""}</button>`).join("")}
    ${done&&sch?`<p class="lbl" style="margin:8px 0 0">🧠 Il perché: <b>${esc(sch.curio.tit)}</b> · <button class="lnk" data-tab="sapevi">Lo sapevi? ›</button></p>`:""}
    ${done&&where==="quiz"?`<div class="btns"><button class="btn pri" data-a="qnext">Prossima situazione ›</button></div>`:""}</div>`;}
function vQuiz(){const A=M.quiz.ans,ok=Object.values(A).filter(v=>v===1).length,n=Object.keys(A).length;
  if(!quizCur||!QZ[quizCur])quizCur=MD.quiz.find(q=>!(q.id in A))?.id||MD.quiz[0].id;
  return `<div class="card"><h3>🎭 Che cosa faresti?</h3><p style="margin:0">Situazioni di tutti i giorni, tre risposte: una giusta e due… memorabili. Conta la prima risposta.</p>

function stats(){const s={ab:{aprire:0,viva:0,vivo:0,calore:0},leoni:0,vol:0,fig:0,week:{},tot:0};
  Object.entries(M.g).forEach(([d,g])=>{if(!g||!g.s||!g.ok)return;s.tot++;const x=SF[g.s],ab=x?x.ab:g.ab;if(s.ab[ab]!=null)s.ab[ab]++;if(!x||x.liv===3)s.leoni++;if(g.s.startsWith("occ:")||(x&&x.sit==="vol"))s.vol++;if(+g.f===3)s.fig++;const m=monday(d);s.week[m]=(s.week[m]||0)+1;});
  s.inc=M.inc.filter(i=>i.chi).length;s.quiz=Object.values(M.quiz.ans).filter(v=>v===1).length;s.lette=Object.keys(M.lette).length;s.fav=Object.keys(M.fav).length;
  s.wmax=Math.max(0,...Object.values(s.week));s.giro=Object.values(s.ab).every(n=>n>0)?1:0;return s;}

/* ---------- azioni ---------- */
function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const g=dayG(today()),id=b.dataset.pick;if(g.s===id)return;g.rev=Array.from(new Set((g.rev||[]).concat(id)));g.s=id;if(SF[id])g.txt=SF[id].nome;save();render();});
  document.querySelectorAll("[data-qa]").forEach(b=>b.onclick=()=>{const [id,i]=b.dataset.qa.split(":"),q=QZ[id];if(!q)return;quizAns={id,i:+i};M.quiz.pick[id]=+i;if(!(id in M.quiz.ans))M.quiz.ans[id]=q.op[+i].ok?1:0;save();render();});
  document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{frCat=b.dataset.fc;frPick=null;render();});

}
function act(a){const t=today();
  if(a==="gnew"){const g=dayG(t);g.p=propose(t,true);g.rev=[];if(g.s&&!g.s.startsWith("occ:")){g.s=null;delete g.txt;}save();toast("🔀 Mazzo rimescolato");return render();}
  if(a==="qnext"){const A=M.quiz.ans,L=MD.quiz,i=L.findIndex(q=>q.id===quizCur);let nx=L.slice(i+1).concat(L.slice(0,i+1)).find(q=>!(q.id in A));if(!nx)nx=L[(i+1)%L.length];quizCur=nx.id;quizAns=null;return render();}

  if(a==="icancel"){incEdit=null;incOpen=false;return render();}

    const o={chi,d:$("iD").value||"",o:$("iO").value||"",dove:$("iDove").value.trim(),so:$("iSo").value.trim(),dom:[0,1,2].map(k=>$("iQ"+k).value.trim()),storia:$("iSt").value.trim()};
    if(incEdit){Object.assign(M.inc.find(i=>i.id===incEdit),o);}else M.inc.push(Object.assign({id:uid(),creato:t},o));
    incEdit=null;incOpen=false;save();toast("🍽️ Incontro salvato");return render();}
  if(a==="idel"){if(!confirm("Togliere questo incontro?"))return;M.inc=M.inc.filter(i=>i.id!==incEdit);incEdit=null;incOpen=false;save();return render();}
}

<script>
/* ===== Aggiornamento automatico e controllo versione (uguale in tutte le sezioni di Pianificazione: costruita da comune/barra.html) =====

   - in fondo a ogni sezione una riga sola (dati salvati, copia, versione); toccandola si aprono i dettagli:

(function(){
  "use strict";
  var V=window.APP_VERSION||"", BUILT=window.APP_BUILD||"";
  var st={state:"idle",last:null,remote:null,pending:false};
  function visible(id){var e=document.getElementById(id);if(!e||e.hidden)return false;if(e.classList&&e.classList.contains("hide"))return false;return getComputedStyle(e).display!=="none";}
  function busy(){var a=document.activeElement;return visible("sheet")||visible("modal")||visible("player")||!!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.type!=="file");}
  function fmtBuilt(){if(!BUILT)return "";try{return new Date(BUILT).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
  var TXT={idle:"",checking:"controllo in corso…",ok:"è l’ultima versione",new:"nuova versione trovata: aggiorno…",wait:"nuova versione pronta: si installa appena chiudi la finestra aperta",offline:"senza internet: controllo al prossimo collegamento"};
  function paint(){

      var sv=b.querySelector(".u-sv"); if(sv)sv.innerHTML=svTxt();
