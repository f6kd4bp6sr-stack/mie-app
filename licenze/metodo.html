liv":2,"sit":"nuove","nome":"🌷 Il complimento al negozio","t":"Fai un complimento preciso a chi gestisce un negozio o un bar per come lo tiene.","bonus":"«Si vede che ci tiene» è la frase magica."},{"id":"ca2c2","ab":"calore","liv":2,"sit":"colleghi","nome":"📝 Il bigliettino","t":"Lascia un bigliettino (o un messaggio) di ringraziamento a un collega per un aiuto ricevuto.","bonus":"Breve, preciso, firmato: tre ingredienti."},{"id":"ca2f2","ab":"calore","liv":2,"sit":"famiglia","nome":"🎁 Il ricordo affettuoso","t":"Racconta a un familiare un bel ricordo che hai di lui o di lei.","bonus":"Comincia con «Ti ricordi quella volta che…?»"},{"id":"ca2g2","ab":"calore","liv":2,"sit":"gruppi","nome":"🥂 Il brindisi al festeggiato","t":"In un gruppo, fai festeggiare a tutti un successo di qualcuno: «Brindiamo a…!»","bonus":"Il festeggiato arrossisce, gli altri sorridono: tutti contenti."},{"id":"ca3n2","ab":"calore","liv":3,"sit":"nuove","nome":"🦁 Il complimento allo sconosciuto","t":"Fai un complimento sincero e preciso a uno sconosciuto, non sull'aspetto: un cane ben educato, una bici curata, un bel gesto che hai visto.","bonus":"Poi saluta e vai: il complimento più bello è quello che non chiede niente in cambio."},{"id":"ca3c2","ab":"calore","liv":3,"sit":"colleghi","nome":"🏅 La lode che arriva in alto","t":"Scrivi due righe al responsabile di un collega o ex collega per dire che cosa ha fatto bene e perché ti è stato utile.","bonus":"Mandane una copia anche a lui: la lode che arriva al capo vale doppio."},{"id":"ca3f2","ab":"calore","liv":3,"sit":"famiglia","nome":"📸 La sorpresa su misura","t":"Organizza una piccola sorpresa per un familiare (la sua torta preferita, una gita, un album di foto).","bonus":"Il segreto è il dettaglio che solo tu conosci."},{"id":"ca3g2","ab":"calore","liv":3,"sit":"gruppi","nome":"🎤 Il brindisi breve","t":"A un pranzo o a una cena di gruppo, fai un brindisi di tre frasi con una cosa bella su chi ha organizzato.","bonus":"Tre frasi, non trenta: il pubblico ringrazia."},{"id":"ca3v2","ab":"calore","liv":3,"sit":"vol","nome":"☀️ I nomi del turno","t":"Durante un'attività di volontariato, impara il nome di almeno due persone che aiuti o con cui fai il turno.","bonus":"La prossima volta salutale per nome: ti ricorderanno."}],"intro_app":{"come":"Coppie di sconosciuti chiacchieravano per qualche minuto; poi ognuno diceva quanto gli era piaciuto l'altro e quanto pensava di essere piaciuto. In media si sottovalutavano: l'altro li aveva apprezzati più di quanto credessero. È successo anche tra compagni di alloggio all'università, per diversi mesi, e in uno studio successivo nei gruppi e nei team di lavoro.","prova":["Dopo un incontro, ricorda che probabilmente sei piaciuto più di quanto pensi.","Non rimuginare sui silenzi o sulle frasi venute male: di solito giudichi i tuoi passi falsi più severamente di quanto faccia l'altro."],"att":"È una tendenza media: non garantisce che ogni incontro vada bene, ma dice che la paura di non piacere è spesso esagerata.","fonti":[{"c":"Boothby, E. J., Cooney, G., Sandstrom, G. M., & Clark, M. S. (2018). The liking gap in conversations: Do people like us more than we think? Psychological Science, 29(11), 1742–1756.","t":"studio","url":"https://doi.org/10.1177/0956797618783714"},{"c":"Mastroianni, A. M., Cooney, G., Boothby, E. J., & Reece, A. G. (2021). The liking gap in groups and teams. Organizational Behavior and Human Decision Processes, 162, 109–122.","t":"studio","url":"https://doi.org/10.1016/j.obhdp.2020.10.013"},{"c":"Association for Psychological Science (2018). You probably made a better first impression than you think.","t":"articolo","url":"https://www.psychologicalscience.org/news/releases/you-probably-made-a-better-first-impression-than-you-think.html"}]},"intro_curio":{"tit":"Sei più simpatico di quanto credi","fatto":"Dopo una chiacchierata tra sconosciuti, in media pensiamo di essere piaciuti meno di quanto siamo piaciuti davvero. Gli psicologi lo chiamano «liking gap».","trad":"Quella frase venuta male l'hai notata soprattutto tu."},"frasi":[{"id":"rompi","ic":"🧊","n":"Per rompere il ghiaccio","f":["È la prima volta che vieni qui?","Che cosa ti porta da queste parti?","Mi consigli qualcosa? Non sono mai stato qui.","Qual è il tuo posto preferito per un caffè, qui intorno?","Come mai hai scelto questo corso?","Che bel cane: come si chiama?","Secondo te oggi piove o ci risparmia?","Bella giornata per una passeggiata, vero?","Abiti qui in zona?","C'è sempre tanta gente qui: è sempre così?"]},{"id":"rilancia","ic":"🔁","n":"Per rilanciare","f":["E poi com'è andata?","Che cosa ti è piaciuto di più?","Come ci sei arrivato?","Che cosa ti ha sorpreso?","Raccontami meglio questa storia.","E adesso che cosa ti aspetti?","Qual è stata la parte più difficile?","Come ti è venuta l'idea?","Che cosa hai imparato da quell'esperienza?","Ma dai! E com'è finita?"]},{"id":"silenzio","ic":"🆘","n":"Salvavita per i silenzi","f":["Qual è la cosa più inutile che hai comprato quest'anno?","Se domani potessi partire per un viaggio, dove andresti?","Che cosa ti piace fare in una giornata libera?","Stai leggendo o guardando qualcosa che ti piace?","Qual è il piatto che ti riesce meglio?","C'è qualcosa che aspetti con piacere nei prossimi mesi?","Com'è cambiato il quartiere da quando ci abiti?","Qual è stata la cosa più bella di questo periodo?","Qual è il posto di Torino che preferisci?","Qual è una cosa che hai imparato a fare da poco?","Qual è la cosa più strana che ti è capitata questa settimana?"]},{"id":"vivo","ic":"📲","n":"Per farsi vivo","f":["Mi sei venuto in mente: come stai?","Sono passato davanti a… e ho pensato a te!","Com'è andata poi con…?","Ti va un caffè una di queste mattine?","Ho ritrovato questa foto di qualche anno fa: te la ricordi?","Volevo dirti grazie per…","Ti va di sentirci al telefono uno di questi giorni?","Allora, quand'è che ci prendiamo quel caffè?"]},{"id":"complimento","ic":"🌟","n":"Per un complimento","f":["Mi piace come hai…","Si vede che ci hai messo cura.","Questa me la devi insegnare.","Hai avuto un'ottima idea a…","Mi hai fatto venire voglia di provarci anch'io.","Grazie: mi hai proprio aiutato.","Hai un talento per…","Ti vedo contento: che bello!"]},{"id":"chiudi","ic":"👋","n":"Per chiudere bene","f":["Mi ha fatto piacere parlare con te: riprendiamo presto!","Ti lascio andare, ma poi mi racconti com'è finita.","Che bella chiacchierata: alla prossima!","Sono contento di averti conosciuto.","Ci vediamo la settimana prossima?","Grazie del tempo, mi ha fatto bene.","Salutami tutti a casa!"]},{"id":"nomi","ic":"📛","n":"Per i nomi","f":["Scusa, mi ripeti il nome? Ci tengo a ricordarlo.","Piacere, io sono… e tu?","Ho una memoria da pesce rosso per i nomi: me lo ridici?","Come si scrive? Così me lo ricordo meglio.","Che bel nome: c'è una storia dietro?"]},{"id":"feste","ic":"🎉","n":"Alle feste e nei gruppi","f":["Come conosci i padroni di casa?","Che cosa ti ha portato qui stasera?","Hai già assaggiato quella torta? Ne vale la pena?","Ti presento…: anche lei è appassionata di…","Qual è stata la parte più bella della giornata, per te?"]},{"id":"telefono","ic":"📞","n":"Al telefono","f":["Ti disturbo? Ti rubo solo due minuti.","Ti ho chiamato perché mi andava di sentirti.","Raccontami: che cosa c'è di nuovo?","Allora ci aggiorniamo presto, d'accordo?"]},{"id":"ricevere","ic":"🙏","n":"Per ricevere un complimento","f":["Grazie, mi fa davvero piacere!","Grazie! Ci ho messo un po' di impegno.","Grazie, detto da te vale doppio.","Grazie per averlo notato."]},{"id":"scuse","ic":"🤗","n":"Per scusarsi con garbo","f":["Hai ragione, ho sbagliato: scusami.","Mi spiace per il ritardo, grazie di avermi aspettato.","Scusa, ti ho interrotto: continua pure.","Ieri sono stato brusco: scusami, non te lo meritavi."]},{"id":"no","ic":"🙅","n":"Per dire di no con gentilezza","f":["Grazie dell'invito! Stavolta non riesco, ma la prossima ci sono.","Mi piacerebbe, ma questa settimana sono pieno: facciamo la prossima?","Grazie, preferisco di no; però mi fa piacere che tu me l'abbia chiesto.","Oggi passo, ma tienimi presente per la prossima volta!"]}],"frasi_nota":"Le frasi danno del tu: con persone più grandi o in contesti formali, passa al lei.","ikigai":{"intro":"Ikigai (生き甲斐) vuol dire più o meno «ciò per cui vale la pena vivere»: in Giappone indica le piccole e grandi ragioni che danno senso alle giornate. Qui lo trovi insieme alle pratiche giapponesi che lo accompagnano (Morita e Naikan), alla meditazione e al flusso.","nota":"Sono pratiche di benessere per la vita di tutti i giorni. Morita e Naikan nascono come terapie: qui ne usiamo solo i principi, che non sostituiscono un professionista.","capitoli":[{"id":"cosa","ic":"🌸","tit":"Che cos'è davvero l'ikigai","sotto":"non un grande scopo, ma tante ragioni quotidiane","pronto":true,"princ":["«Iki» è vivere, «gai» è il valore, ciò che ripaga: l'ikigai è ciò che fa sentire che la giornata vale.","Non va trovato una volta per tutte: può essere una passeggiata, un orto, un nipote, un lavoro fatto bene, un caffè con un amico.","Si può avere più di un ikigai, e cambia con le età della vita: la pensione è un buon momento per guardarlo di nuovo."],"regole":["Cerca nelle piccole cose prima che nelle grandi.","Non serve che c'entri con il lavoro o con i soldi.","Conta di più farlo che definirlo."],"spiega":"«Iki» è vivere, «gai» è il valore. Il termine è antico, ma il primo grande libro sul tema è «Ikigai ni tsuite» («Sull'ikigai», 1966) della psichiatra giapponese Mieko Kamiya: lei distingueva l'oggetto che dà valore alla vita (una persona, un compito) dal sentimento di sentirla sensata. Il celebre schema a quattro cerchi (ciò che ami, in cui sei bravo, di cui il mondo ha bisogno, per cui ti pagano) non è giapponese: è un adattamento occidentale, nato quando nel 2014 il blogger Marc Winn mise la parola «ikigai» al centro di un diagramma dello «scopo» attribuito ad Andrés Zuzunaga. È utile come gioco di riflessione ma lontana dall'idea originale, dove l'ikigai può essere anche piccolissimo. Una ricerca giapponese (studio di Ohsaki, 2008) ha seguito per circa 7 anni 43.391 adulti: chi non dichiarava un ikigai ha avuto più decessi nel periodo. È un'associazione osservata, non la prova che l'ikigai allunghi la vita. Per la pensione: curare l'orto ogni mattina; aspettare il giovedì in cui si va a prendere il nipote a scuola.","es":{"t":"La lista delle piccole ragioni","min":5,"passi":["Scrivi 10 piccole cose che oggi ti hanno fatto piacere o che aspetti per domani.","Sottolinea quelle che dipendono da te.","Domani fanne almeno una, apposta."]},"fonti":[{"c":"Kamiya M. (1966), «Ikigai ni tsuite» (non risulta un'edizione italiana)","t":"libro"},{"c":"Sone T. e altri (2008), Sense of life worth living (ikigai) and mortality in Japan: Ohsaki Study, Psychosomatic Medicine 70(6) — 43.391 adulti, circa 7 anni","t":"studio","url":"https://pure.fujita-hu.ac.jp/en/publications/sense-of-life-worth-living-ikigai-and-mortality-in-japan-ohsaki-s/"}],"appro":{"storia":"La parola è giapponese e molto antica nell'uso comune. Il primo libro importante è del 1966: la psichiatra Mieko Kamiya, che lavorò anche con persone malate e isolate, notò che il senso della vita nasce spesso da cose semplici. Lo schema a quattro cerchi che oggi si vede ovunque è invece occidentale e recente: si è diffuso intorno al 2014.","come":"Funziona perché sposta lo sguardo dalla domanda grande («qual è il mio scopo?») a quelle piccole («che cosa mi fa alzare volentieri?»). Le risposte piccole si possono provare subito e cambiare. Può aiutare a dare ritmo alle giornate senza orari di lavoro, ma è un modo di riflettere, non una cura.","esempi":["Il caffè al bar sotto i portici, con le stesse due persone, ogni mattina verso le nove.","La passeggiata lungo il Po al pomeriggio, guardando com'è cambiata la luce.","Il sabato al mercato di Porta Palazzo a scegliere la verdura con calma.","Chiamare un vecchio collega ogni domenica sera."],"errori":["Aspettare un grande scopo e intanto trascurare le piccole gioie di oggi.","Usare lo schema a quattro cerchi come un test con una risposta giusta.","Confrontare il proprio ikigai con quello di altri."],"domande":["Quali tre momenti di questa settimana mi hanno fatto sentire che la giornata valeva?","Che cosa farei volentieri anche senza nessuno che me lo chieda?","Quale piccola ragione vorrei avere di più il prossimo mese?"]}},{"id":"pilastri","ic":"🏯","tit":"I 5 pilastri dell'ikigai","sotto":"il modo semplice di Ken Mogi","pronto":true,"princ":["1. Cominciare in piccolo: un passo minuscolo, fatto bene.","2. Lasciar andare l'io: meno «come appaio», più «che cosa sto facendo».","3. Armonia e sostenibilità: stare bene con le persone e con l'ambiente intorno, senza strafare.","4. La gioia delle piccole cose: il primo sorso di caffè, la luce del mattino.","5. Essere qui e ora: attenzione a ciò che stai facendo, adesso."],"regole":["Un pilastro alla volta, non tutti insieme.","Meglio cinque minuti ogni giorno che un'ora ogni tanto."],"spiega":"Il neuroscienziato giapponese Ken Mogi, nel libro uscito nel 2017 nel Regno Unito come «The Little Book of Ikigai» (negli Stati Uniti «Awakening Your Ikigai», 2018) e in italiano da Einaudi nel 2018 come «Il piccolo libro dell'ikigai», riassume l'ikigai in cinque pilastri. Non sono regole da rispettare, ma cinque modi di guardare la stessa giornata. Per esempio, riparare un oggetto con calma è cominciare in piccolo; farlo senza pensare a chi ti guarda è lasciar andare l'io; assaporare il primo caffè è la gioia delle piccole cose. Un'idea per la pensione: scegli il pilastro «qui e ora» e fai la passeggiata di ogni giorno senza telefono, guardando soltanto ciò che trovi lungo la strada. Un altro: «cominciare in piccolo» con dieci minuti di una cosa che rimandi da tempo, come riordinare un cassetto o suonare un brano.","es":{"t":"Un pilastro al giorno","min":2,"passi":["Al mattino scegli un pilastro, uno solo.","Durante il giorno cerca un momento in cui lo vivi davvero.","Alla sera scrivi una riga su com'è andata."]},"fonti":[{"c":"Mogi K. (2017), «The Little Book of Ikigai», Quercus (negli USA «Awakening Your Ikigai», 2018)","t":"libro","url":"https://www.hachette.co.uk/titles/ken-mogi/the-little-book-of-ikigai/9781786489043/"},{"c":"Mogi K. (2018), «Il piccolo libro dell'ikigai. La via giapponese alla felicità», Einaudi","t":"libro","url":"https://www.einaudi.it/catalogo-libri/filosofia/filosofia-contemporanea/il-piccolo-libro-dellikigai-ken-mogi-9788806237387/"}],"appro":{"storia":"Ken Mogi, nato nel 1962, è un neuroscienziato giapponese e scrittore. Nel suo libro del 2017 raccoglie cinque idee che osserva nella vita giapponese di ogni giorno: dai maestri di sushi agli artigiani, fino ai piccoli rituali del mattino. Non è una tradizione antica codificata, ma la sintesi di un autore contemporaneo.","come":"I cinque pilastri sono cinque «porte» diverse per entrare nella stessa giornata. Se una non ti parla, provane un'altra. Possono aiutare perché danno un compito piccolo e chiaro, e fanno notare ciò che già c'è. Non servono a misurarsi: sono spunti da provare con curiosità.","esempi":["Cominciare in piccolo: dieci minuti per sistemare le foto di famiglia in una scatola.","Il qui e ora: bere il caffè guardando fuori dalla finestra, senza telefono.","Gioia delle piccole cose: fermarsi un momento davanti a un tram storico che passa.","Armonia: salutare con un sorriso il portinaio, ogni giorno."],"errori":["Provare tutti e cinque i pilastri insieme e stancarsi presto.","Trasformarli in un dovere da spuntare, con rimprovero se si salta.","Cercare risultati grandi invece di notare cosa cambia."],"domande":["Quale pilastro mi è più naturale e quale mi sembra più strano?","In quale momento di oggi sono stato davvero «qui e ora»?","Qual è un piccolo inizio che rimando da tempo?"]}},{"id":"morita","ic":"🌊","tit":"Morita: vivere con le emozioni così come sono","sotto":"accettare (arugamama) e fare ciò che conta","pronto":true,"princ":["Shōma Morita fu uno psichiatra giapponese (1874-1938): la sua idea nasce come terapia, ma qui prendiamo solo alcuni principi di vita quotidiana.","«Arugamama» vuol dire accettare le cose come sono, comprese emozioni e pensieri: non si comandano, vanno e vengono come il tempo.","Non serve sentirsi pronti per agire: l'azione utile viene prima, e il buon umore spesso la segue.","Si guarda a ciò che conta (lo «scopo») e si fa il passo successivo, anche se dentro c'è un po' di fastidio o di pigrizia."],"regole":["Accetta ciò che senti, senza combatterlo.","Fai il passo piccolo che serve adesso.","Se un disagio è forte o dura, parlane con il medico."],"spiega":"Immagina una mattina in cui non hai voglia di uscire a camminare. L'abitudine è aspettare che la voglia arrivi. Il principio di Morita dice il contrario: riconosci che la voglia non c'è («oggi sono svogliato»), non discuti con te stesso, e metti le scarpe lo stesso, perché la camminata è ciò che conta per te. Le emozioni non sono nemici da vincere e non vanno nemmeno obbedite: sono come nuvole. Per chi va in pensione può essere utile quando manca la spinta data dagli orari del lavoro. Questa scheda non è una cura e non sostituisce un professionista: in italiano non abbiamo trovato libri specifici su Morita.","es":{"t":"Faccio lo stesso, con la svogliatezza","min":5,"passi":["Pensa a una cosa utile che rimandi perché «non ti senti».","Scrivi una riga: «Sento… e lo accetto».","Fai solo i primi cinque minuti di quella cosa.","Annota com'è andata: spesso la voglia arriva dopo."]},"fonti":[{"c":"Sugg H., Richards D., Frost J. (2020), What is Morita Therapy? The Nature, Origins, and Cross-cultural Application of a Unique Japanese Psychotherapy, Journal of Contemporary Psychotherapy","t":"articolo","url":"https://link.springer.com/article/10.1007/s10879-020-09464-6"}],"appro":{"storia":"Shōma Morita (1874-1938) era uno psichiatra giapponese e insegnò alla scuola di medicina Jikei di Tokyo. Intorno al 1920 mise a punto un metodo per persone molto in ansia, basato su riposo e poi su lavori pratici. Dal metodo vengono due idee ancora citate: accettare i sentimenti così come sono e agire lo stesso.","come":"L'idea è che combattere un'emozione la rende spesso più forte, mentre accoglierla e occuparsi di qualcosa di utile lascia che passi da sé. Può aiutare quando manca la voglia: non si aspetta di sentirsi pronti. È un principio di vita quotidiana, non una terapia, e non sostituisce un professionista.","esempi":["Oggi piove e non ho voglia: lo dico a me stesso e vado lo stesso a fare la spesa.","Sono un po' agitato per una pratica burocratica: lo accetto e compilo il primo modulo.","Mi sento giù senza motivo: noto la sensazione e innaffio le piante come ogni giorno.","Rimando una telefonata: faccio il numero e parlo un minuto."],"errori":["Scambiare l'accettazione con la rassegnazione: si accetta il sentimento, non si smette di agire.","Forzarsi a «stare bene» o a scacciare il fastidio.","Usarlo per ignorare un disagio forte o lungo, che va detto al medico."],"domande":["Quale emozione mi ha fermato di recente, e che cosa ho fatto lo stesso?","Che cosa conta davvero per me in questa settimana?","Quale piccolo gesto posso fare oggi anche senza averne voglia?"]}},{"id":"naikan","ic":"🪞","tit":"Naikan: le tre domande della sera","sotto":"che cosa ho ricevuto, che cosa ho dato, quali difficoltà ho causato","pronto":true,"princ":["Naikan («guardarsi dentro») fu messo a punto dal giapponese Ishin Yoshimoto negli anni Quaranta del Novecento; qui usiamo solo l'esercizio breve della sera.","Si ripensa a una giornata con tre domande: che cosa ho ricevuto da…? che cosa ho dato a…? quali difficoltà ho causato a…?","Si cerca un fatto concreto per ogni risposta, non un giudizio su di sé.","Di solito fa notare quanto aiuto, anche piccolo, c'è stato nella giornata."],"regole":["Fatti concreti, non colpe.","Una persona alla volta.","Dieci minuti bastano, in un posto tranquillo."],"spiega":"Le tre domande sono semplici, ma portano l'attenzione dove di solito non guardiamo. Scegli una persona (la moglie, un figlio, il vicino, il panettiere) e il giorno appena passato. Che cosa ho ricevuto da lei? Magari un caffè, un passaggio in auto, un messaggio. Che cosa le ho dato? Che difficoltà le ho causato? La terza domanda non serve a punirsi: aiuta a vedere la realtà intera, senza darsi troppo merito né troppa colpa. Molti trovano che porti gratitudine. Il metodo nasce come pratica intensiva e anche come terapia; qui è solo una breve riflessione serale. Se emergono pensieri pesanti, ci si ferma e se ne parla con il medico o con una persona di fiducia.","es":{"t":"Le tre domande della sera","min":10,"passi":["Siediti in un posto tranquillo e scegli una persona e il giorno di oggi.","Rispondi per iscritto: che cosa ho ricevuto da lei?","Poi: che cosa le ho dato? Quali difficoltà le ho causato?","Scrivi le risposte nel 📓 Diario, con un fatto concreto per ciascuna."]},"fonti":[{"c":"Krech G. (2023), «Naikan. Gratitudine, grazia e l'arte giapponese dell'autoriflessione», Mimesis","t":"libro","url":"https://www.macrolibrarsi.it/libri/__naikan-libro.php"},{"c":"Ozawa-de Silva C. (2015), Mindfulness of the kindness of others: the contemplative practice of Naikan in cultural context, Transcultural Psychiatry 52(4)","t":"articolo","url":"https://journals.sagepub.com/doi/10.1177/1363461514562922"}],"appro":{"storia":"Ishin Yoshimoto (1916-1988) era un uomo d'affari giapponese e sacerdote buddhista della scuola Jōdo Shinshū che, dagli anni Quaranta, sviluppò questo metodo di riflessione sulle relazioni. Ne nacquero ritiri di una settimana e anche un uso nelle carceri giapponesi. Oggi si pratica anche in Europa e negli Stati Uniti, in forme più brevi.","come":"Le tre domande portano l'attenzione sui fatti concreti: ciò che gli altri hanno fatto per noi, ciò che noi abbiamo fatto, i disagi che abbiamo causato. Può aiutare a vedere la giornata in modo più completo e a provare gratitudine. Qui è solo un esercizio serale breve, non una terapia.","esempi":["Ricevuto: mia moglie ha preparato la cena. Dato: ho portato giù la spazzatura. Disagio: sono rientrato tardi senza avvisare.","Ricevuto: il vicino mi ha tenuto il pacco. Dato: gli ho portato un po' di basilico.","Ricevuto: mia figlia mi ha mandato un messaggio. Dato: ho risposto subito.","Pensare al panettiere: il pane caldo, il resto contato con pazienza."],"errori":["Farne un esame di coscienza severo: si cercano fatti, non colpe.","Dimenticare la prima domanda e fermarsi solo ai propri errori.","Continuare se emergono pensieri pesanti, invece di fermarsi e parlarne."],"domande":["Chi ho dimenticato di ringraziare questa settimana?","Che cosa ho ricevuto oggi che di solito do per scontato?","Per quale piccolo disagio causato posso fare un gesto di rimedio?"],"studio":{"cosa":"Ozawa-de Silva, antropologa, ha studiato il Naikan intensivo in Giappone con lavoro sul campo e dati raccolti dai partecipanti. Le persone riferivano più gratitudine, più legame con gli altri e un migliore benessere mentale.","limiti":"Riguarda ritiri intensivi di una settimana (circa 14 ore al giorno), non l'esercizio breve della sera. Si basa su ciò che riferiscono i partecipanti: non dimostra che sia il metodo a causare i cambiamenti.","fonte":{"c":"Ozawa-de Silva C. (2015), Mindfulness of the kindness of others: the contemplative practice of Naikan in cultural context, Transcultural Psychiatry 52(4)","t":"studio","url":"https://journals.sagepub.com/doi/10.1177/1363461514562922"}}}},{"id":"flusso","ic":"🏞️","tit":"Il flusso: la corrente della vita","sotto":"immergersi in ciò che si fa, con la sfida giusta","pronto":true,"princ":["Lo psicologo Mihály Csíkszentmihályi chiama «flusso» lo stato in cui si è così immersi in un'attività che il resto sparisce.","Aiutano: un obiettivo chiaro, un riscontro immediato su come sta andando, una sfida adeguata alle proprie capacità, una concentrazione piena.","Spesso si perde il senso del tempo: un'ora sembra dieci minuti.","Se la sfida è troppo alta viene ansia, se è troppo bassa viene noia: il flusso sta nel canale in mezzo."],"regole":["Scegli attività che richiedono un po' di impegno, non troppo.","Togli le interruzioni (telefono lontano).","Alza o abbassa leggermente la difficoltà."],"spiega":"Il flusso non è un lusso: è una delle esperienze che più spesso fanno sentire la vita piena. Il libro di Héctor García e Francesc Miralles («Il metodo Ikigai» in italiano) lo riprende tra le chiavi dell'ikigai: trovare ciò che ci assorbe e dargli spazio. Per un pensionato gli esempi sono quotidiani: preparare l'orto con un piano per la giornata, costruire un mobile in falegnameria (il pezzo di legno ti dice subito se il taglio è giusto), imparare un brano alla chitarra, un cammino con una meta e un ritmo. Se ti annoi, aumenta un po' la difficoltà; se ti agiti, riduci il compito. Non serve che sia utile a qualcuno: basta che ti assorba.","es":{"t":"Trovare il canale","min":15,"passi":["Scegli un'attività che ti piace: orto, legno, musica, cammino.","Fissa un obiettivo piccolo e chiaro per oggi.","Togli le distrazioni e lavora senza controllare l'ora.","Poi scrivi: ansia, noia o flusso? Domani regola la difficoltà."]},"fonti":[{"c":"Csíkszentmihályi M. (1990; ed. it. 2021), «Flow. Psicologia dell'esperienza ottimale», ROI edizioni","t":"libro","url":"https://www.illibraio.it/libri/csikszentmihalyi-mihaly-flow-psicologia-dellesperienza-ottimale-9788836200382"},{"c":"García H., Miralles F. (2018), «Il metodo Ikigai. I segreti della filosofia giapponese per una vita lunga e felice», BUR","t":"libro","url":"https://www.macrolibrarsi.it/libri/__il-metodo-ikigai.php"},{"c":"Peifer C. e altri (2022), A Scoping Review of Flow Research, Frontiers in Psychology 13","t":"articolo","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2022.815665/full"}],"appro":{"storia":"Mihály Csíkszentmihályi (1934-2021), psicologo di origine ungherese che lavorò a Chicago, tra gli anni Sessanta e Settanta chiese ad artisti, scalatori, danzatori e giocatori di scacchi che cosa provassero quando erano più assorbiti. Descrisse lo stato che chiamò «flow» in un libro del 1975 e nel 1990 lo raccontò nel libro «Flow». Da allora è un tema molto studiato.","come":"Il flusso viene quando l'attività è chiara, ha un riscontro immediato e la difficoltà è giusta per le proprie capacità. Può aiutare a scegliere come usare il tempo libero: meno attività passive, più attività che assorbono. Non si può forzare, ma si possono preparare le condizioni.","esempi":["Montare una libreria seguendo le istruzioni passo passo, senza controllare l'ora.","Imparare a mano un pezzo semplice con la chitarra, battuta dopo battuta.","Una partita a scacchi o a carte con un avversario alla pari.","Camminare in collina sopra Torino con una meta e un ritmo regolare."],"errori":["Scegliere attività troppo facili e poi annoiarsi, o troppo difficili e scoraggiarsi.","Interrompersi di continuo per guardare il telefono.","Aspettarsi il flusso ogni volta: a volte semplicemente non arriva."],"domande":["Quando mi sono accorto che il tempo era volato, questa settimana?","Quale attività potrei rendere un po' più difficile, o un po' più facile?","Che cosa mi distrae di più mentre faccio ciò che mi piace?"],"studio":{"cosa":"Peifer e colleghi hanno riunito 252 studi sul flusso pubblicati tra il 2000 e il 2016, organizzandoli in tre livelli: persona, contesto e cultura. È una mappa di che cosa si è studiato finora.","limiti":"È una rassegna, non una prova. Gli autori dicono che servono più studi sperimentali e di lungo periodo per capire cause ed effetti.","fonte":{"c":"Peifer C. e altri (2022), A Scoping Review of Flow Research, Frontiers in Psychology 13","t":"studio","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2022.815665/full"}}}},{"id":"mente","ic":"🧘","tit":"Allenare la mente: meditazione per cominciare","sotto":"respiro, seduta breve, camminata lenta","pronto":true,"princ":["Per cominciare bastano 3-10 minuti, meglio ogni giorno alla stessa ora.","Respiro tranquillo: si osserva il respiro com'è, senza forzarlo né trattenerlo.","Si può stare seduti comodi su una sedia, oppure camminare lentamente, sentendo i piedi.","Quando la mente si distrae (succede sempre) si torna con gentilezza al respiro."],"regole":["Niente respirazioni forzate o prolungate.","Se compaiono disagio o pensieri pesanti, ci si ferma.","Se il disagio continua, se ne parla con il medico."],"spiega":"La meditazione, qui, è semplicemente allenare l'attenzione. Siediti con la schiena comoda, i piedi a terra, gli occhi socchiusi. Senti l'aria che entra e che esce, in un punto qualsiasi (narici, petto, pancia). Quando la mente parte, noti che è partita e torni: quel «tornare» è l'esercizio. In alternativa la camminata lenta: pochi metri avanti e indietro, attenzione ai piedi. Per la salute, l'ente americano NCCIH spiega che di solito i rischi sono pochi, ma che in una parte di persone possono comparire effetti spiacevoli come ansia o umore depresso, e che non va usata al posto delle cure o per rimandare una visita. Per questo, al primo disagio, ci si ferma.","es":{"t":"Cinque minuti di respiro","min":5,"passi":["Siediti comodo e metti un timer a 5 minuti.","Senti il respiro così com'è, senza cambiarlo.","Quando ti distrai, torna al respiro senza rimproverarti.","Alla fine apri gli occhi e scrivi una riga su come ti senti."]},"fonti":[{"c":"NCCIH (US National Institutes of Health), Meditation and Mindfulness: Effectiveness and Safety (ultimo aggiornamento 2022)","t":"articolo","url":"https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety"}],"appro":{"storia":"Le pratiche di attenzione al respiro vengono da antiche tradizioni contemplative dell'Asia, in particolare buddhiste, e in Giappone dallo zen. Dagli anni Settanta-Ottanta sono state adattate in forma laica in programmi occidentali, per esempio da Jon Kabat-Zinn negli Stati Uniti. Qui si usa la forma più semplice, senza aspetti religiosi.","come":"L'esercizio è tornare all'attenzione ogni volta che ci si distrae: è questo ripetuto «tornare» ad allenare. Può aiutare a rallentare e a notare ciò che si prova. Non è adatta a tutti e non sostituisce visite o cure: se dà disagio ci si ferma e se ne parla con il medico.","esempi":["Cinque minuti sulla sedia della cucina, dopo il caffè, guardando il respiro.","La camminata lenta in corridoio o sul balcone: dieci passi avanti e dieci indietro.","Sulla panchina al parco, ascoltare per due minuti solo i suoni intorno.","Prima di dormire, tre respiri tranquilli, senza forzarli."],"errori":["Pensare di dover «svuotare la mente»: la mente pensa, si torna al respiro.","Allungare in fretta i tempi o forzare il respiro.","Insistere se si prova ansia o agitazione, invece di fermarsi."],"domande":["Come mi sentivo prima e dopo i cinque minuti?","Quante volte la mente è partita e dove è andata?","A che ora del giorno mi è più facile fermarmi?"],"studio":{"cosa":"La pagina dell'ente americano NCCIH riassume le ricerche. Dice che di solito i rischi sono considerati pochi, ma una rassegna del 2020 ha concluso che circa l'8% dei partecipanti agli studi ha avuto un effetto negativo, soprattutto ansia o depressione.","limiti":"Molte ricerche sono preliminari o poco rigorose, e pochi studi hanno esaminato i possibili effetti dannosi.","fonte":{"c":"NCCIH (US National Institutes of Health), Meditation and Mindfulness: Effectiveness and Safety (ultimo aggiornamento 2022)","t":"articolo","url":"https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety"}}}},{"id":"pensione","ic":"🌅","tit":"Il mio ikigai nella pensione","sotto":"esercizi personali, collegati al 📓 Diario","pronto":true,"princ":["La pensione toglie orari e ruoli, ma lascia spazio per scegliere che cosa dà valore alle giornate.","Alcuni ruoli restano (marito, padre, nonno, amico), altri sono nuovi (volontario, ortolano, allievo).","Si parte dalle piccole ragioni di ogni giorno e si costruisce una settimana che ne contenga qualcuna.","Il 📓 Diario serve a tenere traccia di ciò che funziona."],"regole":["Poche cose, ma regolari.","Un impegno per sé, uno con gli altri, uno per il corpo.","Rivedi la settimana una volta al mese."],"spiega":"Tre esercizi. Le piccole ragioni: ogni sera scrivi nel 📓 Diario una cosa per cui valeva la pena alzarsi. I ruoli: fai due colonne, quelli che restano e quelli nuovi, e a fianco una cosa concreta per ciascuno. Una settimana tipo: disegna sette giorni e metti in ogni giorno una cosa per il corpo, una per la mente, una con altre persone. Non serve riempire tutto: lascia spazi liberi. Sul tema, lo studio giapponese di Ohsaki ha trovato più decessi tra chi non dichiarava un ikigai, ma è un'associazione e non dice che cosa fare. Per questo contano le tue scelte, non le medie.","es":{"t":"Ruoli e settimana tipo","min":15,"passi":["Elenca i ruoli che restano e quelli nuovi che ti incuriosiscono.","Per ciascuno scrivi un gesto concreto della settimana.","Disegna sette giorni e inserisci i gesti, lasciando spazi liberi.","Scrivi nel 📓 Diario cosa ti piace di più e cosa cambieresti."]},"fonti":[{"c":"Sone T. e altri (2008), Sense of life worth living (ikigai) and mortality in Japan: Ohsaki Study, Psychosomatic Medicine 70(6) — 43.391 adulti, circa 7 anni","t":"studio","url":"https://pure.fujita-hu.ac.jp/en/publications/sense-of-life-worth-living-ikigai-and-mortality-in-japan-ohsaki-s/"}],"appro":{"storia":"Queste pratiche non vengono da un'unica fonte: la lista delle piccole ragioni richiama Kamiya e Mogi, i ruoli e la settimana tipo sono esercizi comuni nella riflessione sul tempo libero. La parte sulla pensione è un adattamento pensato per questa scheda, con un appoggio al Diario.","come":"Dopo anni di orari fissi, la pensione lascia molto spazio e a volte disorienta. Scrivere ruoli e gesti concreti rende il tempo meno vuoto senza riempirlo del tutto. Può aiutare a notare cosa funziona. È un aiuto di organizzazione e riflessione, non una promessa di benessere.","esempi":["Ruolo che resta: padre. Gesto: pranzo della domenica con i figli, a turno a casa di uno.","Ruolo nuovo: volontario. Gesto: due ore al mese in un'associazione del quartiere.","Una settimana: lunedì camminata, mercoledì corso, sabato mercato e amici.","Lasciare vuoto il giovedì pomeriggio, per decidere sul momento."],"errori":["Riempire ogni giorno come un'agenda di lavoro e restare stanchi.","Voler cambiare tutto nei primi mesi, invece di provare una cosa alla volta.","Non rileggere il Diario: senza rilettura non si capisce cosa funziona."],"domande":["Quale ruolo mi manca di più e quale vorrei provare?","Come sarebbe una settimana che mi piacerebbe vivere?","Che cosa ho smesso di fare e che mi manca?"]}},{"id":"sfida","ic":"🎯","tit":"La sfida dei 7 giorni","sotto":"una pratica al giorno per una settimana","pronto":true,"princ":["Una pratica al giorno per sette giorni, tutte prese dalla scheda.","Ogni giorno richiede da 2 a 15 minuti.","Alla fine si rilegge il Diario e si sceglie che cosa tenere.","Non è una gara: se salti un giorno, riprendi dal giorno dopo."],"regole":["Una pratica al giorno, non di più.","Annota una riga nel 📓 Diario ogni sera.","Se qualcosa dà disagio, salta e passa oltre."],"spiega":"La sfida mette insieme le pratiche viste: ognuna è piccola e si può fare in casa. Alla fine di sette giorni avrai provato strumenti diversi e saprai quali ti si adattano. Non c'è punteggio. L'obiettivo è la scelta finale: tenere due o tre pratiche e lasciare le altre.","es":{"t":"I 7 giorni","min":15,"passi":["Giorno 1: lista delle piccole ragioni. Giorno 2: un pilastro di Mogi.","Giorno 3: arugamama (accetto ciò che sento e faccio il passo). Giorno 4: Naikan, le tre domande.","Giorno 5: un'attività di flusso. Giorno 6: meditazione di 5 minuti.","Giorno 7: rileggi il Diario e scegli che cosa tenere."]},"fonti":[{"c":"Mogi K. (2018), «Il piccolo libro dell'ikigai. La via giapponese alla felicità», Einaudi","t":"libro","url":"https://www.einaudi.it/catalogo-libri/filosofia/filosofia-contemporanea/il-piccolo-libro-dellikigai-ken-mogi-9788806237387/"},{"c":"Krech G. (2023), «Naikan. Gratitudine, grazia e l'arte giapponese dell'autoriflessione», Mimesis","t":"libro","url":"https://www.macrolibrarsi.it/libri/__naikan-libro.php"}],"appro":{"storia":"La sfida di sette giorni è un'idea di questa scheda: mette in fila, una al giorno, le pratiche descritte negli altri capitoli. Le pratiche vengono da fonti diverse: Kamiya e Mogi per le piccole ragioni e i pilastri, Morita per l'accettazione, Yoshimoto per il Naikan, Csíkszentmihályi per il flusso, le tradizioni contemplative per il respiro.","come":"Provare una cosa al giorno per una settimana permette di confrontare senza impegnarsi. Può aiutare a scegliere poche abitudini adatte a sé. La rilettura finale nel Diario è la parte più importante: è lì che si decide cosa tenere. Non è una gara e non ha obiettivi di salute.","esempi":["Giorno 4: dopo cena, le tre domande del Naikan sulla moglie, con tre fatti concreti.","Giorno 5: un'ora in falegnameria o in orto, telefono in un'altra stanza.","Giorno 6: cinque minuti di respiro dopo la passeggiata.","Giorno 7: rileggere il Diario con un caffè e sottolineare due cose da tenere."],"errori":["Recuperare di corsa i giorni saltati: si riprende semplicemente dal giorno dopo.","Giudicare una pratica dal primo giorno: alcune servono più volte.","Tenere tutto alla fine invece di scegliere due o tre cose."],"domande":["Quale giorno mi è piaciuto di più, e perché?","Quale pratica ho trovato più faticosa, e c'è un modo più leggero?","Quali due o tre cose voglio tenere per il prossimo mese?"]}},{"id":"letture","ic":"📚","tit":"Letture","sotto":"libri e studi con un riassunto, in italiano quando c'è","pronto":true,"princ":["Il piccolo libro dell'ikigai — Ken Mogi (Einaudi, 2018): i cinque pilastri spiegati con esempi di vita giapponese di ogni giorno.","Il metodo Ikigai — Héctor García e Francesc Miralles (BUR Rizzoli, 2018): nato dalle visite degli autori a Ogimi (Okinawa) e consigli su alimentazione, comunità e flusso.","Flow. Psicologia dell'esperienza ottimale — Mihály Csíkszentmihályi (ROI edizioni, 2021): spiega quando un'attività ci assorbe e rende felici.","Naikan. Gratitudine, grazia e l'arte giapponese dell'autoriflessione — Gregg Krech (Mimesis, 2023): guida alla riflessione serale con le tre domande.","Ikigai. Il segreto giapponese per vivere più a lungo — Yukari Mitsuhashi (Newton Compton, 2022): breve libro sulle piccole attività quotidiane che danno senso."],"regole":["Leggi un libro alla volta.","Sottolinea due idee da provare.","Non cercare risposte mediche nei libri."],"spiega":"I riassunti sono scritti con parole nostre; per i dettagli guarda i libri. Su Morita non abbiamo trovato un libro in italiano.","es":{"t":"Una pagina al giorno","min":10,"passi":["Scegli un libro della lista.","Leggi una pagina o due, lentamente.","Sottolinea una frase da provare.","Provala il giorno dopo e annotalo nel 📓 Diario."]},"fonti":[{"c":"Mogi K. (2018), «Il piccolo libro dell'ikigai. La via giapponese alla felicità», Einaudi","t":"libro","url":"https://www.einaudi.it/catalogo-libri/filosofia/filosofia-contemporanea/il-piccolo-libro-dellikigai-ken-mogi-9788806237387/"},{"c":"García H., Miralles F. (2018), «Il metodo Ikigai. I segreti della filosofia giapponese per una vita lunga e felice», BUR","t":"libro","url":"https://www.macrolibrarsi.it/libri/__il-metodo-ikigai.php"},{"c":"Csíkszentmihályi M. (1990; ed. it. 2021), «Flow. Psicologia dell'esperienza ottimale», ROI edizioni","t":"libro","url":"https://www.illibraio.it/libri/csikszentmihalyi-mihaly-flow-psicologia-dellesperienza-ottimale-9788836200382"},{"c":"Krech G. (2023), «Naikan. Gratitudine, grazia e l'arte giapponese dell'autoriflessione», Mimesis","t":"libro","url":"https://www.macrolibrarsi.it/libri/__naikan-libro.php"},{"c":"Mitsuhashi Y. (2022), «Ikigai. Il segreto giapponese per vivere più a lungo», Newton Compton","t":"libro","url":"https://www.ibs.it/ikigai-segreto-giapponese-per-vivere-libro-yukari-mitsuhashi/e/9788822764423"}]}]}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"long",day:"numeric",month:"long"});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}
const AB=MD.abilita,SF=Object.fromEntries(MD.sfide.map(x=>[x.id,x]));
const dayN=s=>diff("2026-01-05",s);

/* ---------- dati (pn-v1 → met) ---------- */
const KEY="pn-v1";
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):st.put(val,key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
const normM=m=>{ // incontri, quiz e medaglie restano salvati ma non si mostrano più
m=m&&typeof m==="object"?m:{};m.g=m.g&&typeof m.g==="object"?m.g:{};m.occ=m.occ&&typeof m.occ==="object"?m.occ:{};m.lette=m.lette||{};m.fav=m.fav||{};return m;};
let M=normM((lsJ(KEY)||{}).met);
let saveT=null;
function save(){const P=lsJ(KEY)||{ver:1};P.met=M;P.savedAt=new Date().toISOString();const t=JSON.stringify(P); // riparto sempre dall'ultima versione salvata: le altre sezioni restano intatte
  try{localStorage.setItem(KEY,t);}catch(e){toast("⚠️ Memoria piena: non salvato");return;}clearTimeout(saveT);saveT=setTimeout(()=>kv("readwrite","pianifica",t).catch(()=>{}),300);}
async function recover(){if(lsJ(KEY))return;try{const t=await kv("readonly","pianifica");if(t){localStorage.setItem(KEY,t);M=normM(JSON.parse(t).met);render();}}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- il percorso: un'abilità a settimana, poi si riparte con missioni più impegnative ---------- */
function startOf(){if(!M.start){M.start=monday(today());save();}return M.start;}
function weekInfo(s){const w=Math.max(0,Math.floor(diff(startOf(),s)/7));return{w,ab:AB[w%4],n:w%4+1,ciclo:Math.floor(w/4)};}
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;};
function propose(s,rnd){
  const W=weekInfo(s),lv=W.ciclo?[2,3,3]:[1,2,3],recent=new Set();
  for(let i=1;i<=21;i++){const g=M.g[add(s,-i)];if(g&&g.s)recent.add(g.s);}
  const seed=rnd?Math.floor(Math.random()*1e9):hash(s+W.ab.id);const out=[],used=new Set();
  lv.forEach((l,k)=>{let pool=MD.sfide.filter(x=>x.ab===W.ab.id&&x.liv===l&&!out.includes(x.id));
    const fresh=pool.filter(x=>!recent.has(x.id)&&!used.has(x.sit));if(fresh.length)pool=fresh;else{const f2=pool.filter(x=>!used.has(x.sit));if(f2.length)pool=f2;}
    if(!pool.length)return;const x=pool[(seed>>>(k*5))%pool.length];out.push(x.id);used.add(x.sit);});
  return out;
}
function dayG(s){let g=M.g[s];if(!g||!Array.isArray(g.p)){g=M.g[s]=Object.assign(g||{},{ab:weekInfo(s).ab.id,p:propose(s)});save();}return g;}
function occPrimo(s){const v=OCC&&(OCC.voci||[]).find(x=>"occ:"+x.id===s);return v?`<span class="lbl">${esc(v.primo)}</span>`:"";}

const FKEY="pn-metfold";let FOLD=(()=>{try{return JSON.parse(localStorage.getItem(FKEY)||"{}")||{};}catch(e){return {};}})();
function foldSave(){try{localStorage.setItem(FKEY,JSON.stringify(FOLD));}catch(e){}}
const winOpen=(k,def)=>k in FOLD?!!FOLD[k]:!!def;
function win(k,title,body,def,cls){return `<details class="card win ${cls||""}" data-fk="${k}"${winOpen(k,def)?" open":""}><summary><h3>${title}</h3><span class="chev" aria-hidden="true"></span></summary><div class="wb">${body}</div></details>`;}
function sub(k,title,body,def){return `<details class="subw" data-fk="${k}"${winOpen(k,def)?" open":""}><summary>${title}<span class="chev" aria-hidden="true"></span></summary><div class="sb">${body}</div></details>`;}
const tools=()=>`<div class="tools"><button class="btn sm" data-all="1">➕ Apri tutto</button><button class="btn sm" data-all="0">➖ Chiudi tutto</button></div>`;

/* ---------- interfaccia ---------- */
const TABS=[["oggi","🃏 Oggi"],["sapevi","🧠 Lo sapevi?"],["frasi","💬 Frasi di scorta"],["vol","🤲 Volontariato"],["iki","🌸 Ikigai"]];
let tab=(()=>{const ok=v=>TABS.some(t=>t[0]===v),h=(location.hash||"").slice(1);if(ok(h))return h;try{const v=localStorage.getItem("pn-metv");return ok(v)?v:"oggi";}catch(e){return "oggi";}})();
let frCat="tutte",frPick=null;
function setTab(t){tab=t;try{localStorage.setItem("pn-metv",t);}catch(e){}history.replaceState(null,"","#"+t);render();scrollTo({top:0});}
function render(){
  $("intro").textContent=MD.intro;
  $("tabs").innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${n}</button>`).join("");
  $("main").innerHTML=(MET_TAB_IMG[tab]?`<div class="pg-img">${MET_TAB_IMG[tab]}</div>`:"")+tools()+({oggi:vOggi,sapevi:vSapevi,frasi:vFrasi,vol:vVol,iki:vIki}[tab]||vOggi)();
  bind();
}
const LIVI=["","🌱","🌿","🦁"];
const livP=l=>`<span class="pill l${l}">${LIVI[l]} ${esc(MD.livelli[l])}</span>`;
const sitP=s=>`<span class="pill">${esc(MD.situazioni[s]||s)}</span>`;
const pickDay=(L,s,salt)=>L[((dayN(s)+(salt||0))%L.length+L.length)%L.length];

function vOggi(){
  const t=today(),W=weekInfo(t),g=dayG(t);
  let o=win("o-sett",`${W.ab.ic} Settimana ${W.n} di 4 · ${esc(W.ab.n)}`,`<div class="motto">«${esc(W.ab.motto)}»</div><div class="lbl" style="margin-top:4px">${esc(W.ab.sotto)}${W.ciclo?` · giro ${W.ciclo+1}: si alza l'asticella`:""}</div>
    <div class="steps">${AB.map((a,i)=>`<i class="${i===W.n-1?"on":i<W.n-1?"done":""}" title="${esc(a.n)}"></i>`).join("")}</div>`,true);
  // la missione
  let m;
  if(g.s&&g.ok){const x=SF[g.s];m=`<div class="done"><span class="tick">✅</span><div class="grow"><b>${esc(x?x.nome:"🤲 Primo passo")}</b><div>${esc(x?x.t:g.txt)}</div><div class="btns"><button class="btn sm" data-a="gundo">Non l'ho ancora fatta</button></div></div></div>`;}
  else{const rev=new Set(g.rev||[]);
    m=`<p class="lbl" style="margin:0 0 10px">Tre carte coperte, tre livelli. Girane una: è la tua missione. Se non ti convince, girane un'altra.</p><div class="sf">`+
      g.p.map(id=>{const x=SF[id];if(!x)return "";if(!rev.has(id)&&g.s!==id)return `<button class="mc back l${x.liv}" data-pick="${id}"><span class="lv">${LIVI[x.liv]}</span><b>${esc(MD.livelli[x.liv])}</b><span class="lbl">tocca per girare</span></button>`;
        return `<button class="mc front${g.s===id?" on":""}" data-pick="${id}"><span class="h">${livP(x.liv)}${sitP(x.sit)}</span><b class="nm">${esc(x.nome)}</b><span class="t">${esc(x.t)}</span>${x.bonus?`<span class="bo">✨ Bonus: ${esc(x.bonus)}</span>`:""}</button>`;}).join("")+
      (g.s&&g.s.startsWith("occ:")?`<button class="mc front on" data-pick="${esc(g.s)}"><span class="h">${livP(3)}${sitP("vol")}</span><b class="nm">🤲 Primo passo</b><span class="t">${esc(g.txt)}</span>${occPrimo(g.s)}</button>`:"")+
      `</div><div class="btns">${g.s?`<button class="btn ok" data-a="gdone">✓ Missione compiuta</button>`:""}<button class="btn sm" data-a="gnew">🔀 Rimescola il mazzo</button></div>
      <p class="lbl" style="margin:10px 0 0">Saltare un giorno va benissimo: niente serie da tenere, nessuno ti toglie punti.</p>`;}
  o+=win("o-missione",g.s&&g.ok?"🃏 Missione compiuta!":"🃏 Pesca la missione di oggi",m,true);
  // lo sapevi del giorno
  const L=[{intro:1}].concat(MD.schede.filter(x=>x.ab===W.ab.id)),c=pickDay(L,t);
  o+=win("o-sapevi","🧠 Lo sapevi?",(c.intro?curioIntro():curioBody(c))+`<p style="margin:8px 0 0"><button class="lnk" data-tab="sapevi">Tutte le ${MD.schede.length+1} curiosità ›</button></p>`,true);
  // la frase del giorno
  const F=ALLF(),fr=pickDay(F,t,7);
  o+=win("o-frase","💬 La frase di scorta di oggi",`<div class="fpick">«${esc(fr.f)}»${star(fr.f)}</div><p class="lbl" style="margin:8px 0 0">${fr.c.ic} ${esc(fr.c.n)} · <button class="lnk" data-tab="frasi">Tutte le frasi ›</button></p>`,true);
