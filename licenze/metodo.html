ancia con una domanda su di lui: «E tu come passi le giornate così?»","bonus":"Il meteo è l'antipasto, non il pranzo."},{"id":"vi1c2","ab":"viva","liv":1,"sit":"colleghi","nome":"☕ La pausa curiosa","t":"In pausa caffè, chiedi a un collega che cosa ha in programma per il fine settimana.","bonus":"Ricordatelo: lunedì gli chiedi com'è andata."},{"id":"vi1f2","ab":"viva","liv":1,"sit":"famiglia","nome":"🎬 Il consiglio della settimana","t":"Chiedi a un familiare che cosa ha visto, letto o ascoltato di bello ultimamente, e perché gli è piaciuto.","bonus":"Se ti consiglia qualcosa, provalo davvero e diglielo."},{"id":"vi1g2","ab":"viva","liv":1,"sit":"gruppi","nome":"👂 Il sale della conversazione","t":"In una conversazione di gruppo, fai almeno due domande agli altri prima di raccontare qualcosa di tuo.","bonus":"Si chiama dosare: come il sale."},{"id":"vi2n2","ab":"viva","liv":2,"sit":"nuove","nome":"🎓 Lezione gratuita","t":"Chiedi a qualcuno di spiegarti una cosa che sa fare bene (il suo lavoro, un hobby).","bonus":"Le persone si illuminano quando insegnano."},{"id":"vi2c2","ab":"viva","liv":2,"sit":"colleghi","nome":"🧭 Il consiglio richiesto","t":"Chiedi a un collega un consiglio su una cosa in cui è bravo.","bonus":"Chiedere un consiglio fa sentire l'altro stimato, e te più competente."},{"id":"vi2f2","ab":"viva","liv":2,"sit":"famiglia","nome":"🔦 La domanda di sostanza","t":"A cena con la famiglia o con un amico, fai una domanda più profonda del solito: «Di che cosa sei più contento quest'anno?»","bonus":"Con gli sconosciuti va meglio del previsto, dice uno studio: figurati in famiglia."},{"id":"vi2g2","ab":"viva","liv":2,"sit":"gruppi","nome":"🧶 Il filo comune","t":"In un gruppo, scopri una cosa in comune tra due persone e falla notare: «Ma allora anche voi…?»","bonus":"Hai appena cucito una conversazione."},{"id":"vi3n2","ab":"viva","liv":3,"sit":"nuove","nome":"🚂 Il compagno di viaggio","t":"In treno, in fila o in sala d'attesa, porta avanti una vera chiacchierata con uno sconosciuto per almeno cinque minuti.","bonus":"Se scendi alla tua fermata con un sorriso, missione compiuta."},{"id":"vi3c2","ab":"viva","liv":3,"sit":"colleghi","nome":"📖 La storia del collega","t":"Chiedi a un collega o ex collega come ha cominciato a fare il suo lavoro, e ascolta tutta la storia.","bonus":"Chiedi anche qual è stato il momento più strano."},{"id":"vi3f2","ab":"viva","liv":3,"sit":"famiglia","nome":"🕰️ La storia dietro la foto","t":"Prendi una vecchia foto di famiglia e fatti raccontare da un parente chi c'è, dove e quando, con almeno tre domande.","bonus":"Rileggigli la storia la volta dopo: scoprirai che si ricorda un altro pezzo."},{"id":"vi3g2","ab":"viva","liv":3,"sit":"gruppi","nome":"🍷 L'aperitivo senza telefono","t":"A un aperitivo o a una cena di gruppo, proponi: «Telefoni in tasca fino al caffè?»","bonus":"Se accettano, hai vinto la serata. Se ridono, hai vinto lo stesso."},{"id":"vi3v2","ab":"viva","liv":3,"sit":"vol","nome":"🙋 Il volontario esperto","t":"Chiedi a un volontario che conosci (o che incontri) che cosa gli ha dato di più il volontariato.","bonus":"Ascolta senza interrompere: spesso è la risposta più bella della settimana."},{"id":"fv1n2","ab":"vivo","liv":1,"sit":"nuove","nome":"👋 Ci rivediamo","t":"Quando rivedi una persona conosciuta di recente, salutala per nome.","bonus":"Se ricordi anche una cosa che ti aveva detto, è un colpo da maestro."},{"id":"fv1c2","ab":"vivo","liv":1,"sit":"colleghi","nome":"🎂 Auguri sinceri","t":"Segna nel Calendario i compleanni (o gli onomastici) di tre colleghi o ex colleghi e, se uno cade in questi giorni, mandagli due righe.","bonus":"Personalizza: «Auguri, e spero che la bici nuova funzioni!» batte «Auguri!!!»"},{"id":"fv1f2","ab":"vivo","liv":1,"sit":"famiglia","nome":"🎵 Ti ho pensato","t":"Manda a un familiare o a un amico una canzone, un articolo o una foto che ti ha fatto pensare a lui.","bonus":"Aggiungi una riga sul perché."},{"id":"fv1g2","ab":"vivo","liv":1,"sit":"gruppi","nome":"🗳️ Il sondaggio del gruppo","t":"Nella chat di un gruppo, fai una domanda leggera a tutti: «Qual è il miglior posto per un caffè in zona?»","bonus":"Le domande facili risvegliano anche le chat più addormentate."},{"id":"fv2n2","ab":"vivo","liv":2,"sit":"nuove","nome":"🔁 Promessa mantenuta","t":"Se hai detto a qualcuno «ti mando quel link» o «ti faccio sapere», fallo oggi.","bonus":"Le piccole promesse mantenute costruiscono la fiducia più in fretta di quelle grandi."},{"id":"fv2c2","ab":"vivo","liv":2,"sit":"colleghi","nome":"🧾 Il grazie a distanza","t":"Scrivi a un ex collega per ringraziarlo di una cosa che ti ha insegnato.","bonus":"Cita un episodio preciso: «Ti ricordi quando mi hai spiegato…?»"},{"id":"fv2f2","ab":"vivo","liv":2,"sit":"famiglia","nome":"📅 L'appuntamento fisso","t":"Proponi a un familiare o a un amico un appuntamento fisso: una telefonata la domenica, un caffè il giovedì.","bonus":"Le abitudini tengono vive le amicizie meglio delle buone intenzioni."},{"id":"fv2g2","ab":"vivo","liv":2,"sit":"gruppi","nome":"📸 L'album condiviso","t":"Dopo un ritrovo di gruppo, manda a tutti le foto con una frase calda.","bonus":"Scegli quelle in cui vengono bene gli altri, non tu."},{"id":"fv3n2","ab":"vivo","liv":3,"sit":"nuove","nome":"🚶 Il caffè che diventa abitudine","t":"Proponi a una persona conosciuta da poco di rivedervi ogni settimana per qualcosa (una passeggiata, un caffè, un corso).","bonus":"Le amicizie crescono con le ore insieme: questa è la scorciatoia."},{"id":"fv3c2","ab":"vivo","liv":3,"sit":"colleghi","nome":"📞 La telefonata lunga","t":"Telefona (non scrivere) a un ex collega che non senti da più di un anno.","bonus":"Se risponde la segreteria, lascia un messaggio allegro: vale lo stesso."},{"id":"fv3f2","ab":"vivo","liv":3,"sit":"famiglia","nome":"✉️ La lettera di carta","t":"Scrivi una lettera o una cartolina vera a un parente o a un amico lontano.","bonus":"Nell'epoca delle chat, una busta nella cassetta delle lettere è un piccolo evento."},{"id":"fv3g2","ab":"vivo","liv":3,"sit":"gruppi","nome":"🧭 Il gruppo nuovo","t":"Scegli un gruppo con incontri fissi (cammino, lettura, coro, bocce), contatta gli organizzatori e segna nel Calendario il primo incontro.","bonus":"Al primo incontro presentati ad almeno una persona; al secondo salutala per nome."},{"id":"fv3v2","ab":"vivo","liv":3,"sit":"vol","nome":"🗓️ Il turno fisso","t":"Se hai iniziato un volontariato, fissa un giorno della settimana e scrivilo nel Calendario.","bonus":"La costanza trasforma i compagni di turno in amici."},{"id":"ca1n2","ab":"calore","liv":1,"sit":"nuove","nome":"🙏 Grazie negli occhi","t":"Oggi ringrazia tre persone che ti servono (alla cassa, al bar, sull'autobus) guardandole negli occhi e sorridendo.","bonus":"Se il nome è scritto sul cartellino, usalo: punti extra."},{"id":"ca1c2","ab":"calore","liv":1,"sit":"colleghi","nome":"👏 L'applauso meritato","t":"Fai notare a un collega, davanti agli altri, una cosa che ha fatto bene.","bonus":"Le lodi in pubblico, le critiche in privato: regola antica e sempre valida."},{"id":"ca1f2","ab":"calore","liv":1,"sit":"famiglia","nome":"🫖 Il caffè servito","t":"Prepara un caffè o un tè a un familiare senza che te lo chieda.","bonus":"Il vassoio d'argento è facoltativo."},{"id":"ca1g2","ab":"calore","liv":1,"sit":"gruppi","nome":"😄 La risata condivisa","t":"In un gruppo, ridi di gusto a una battuta di un altro (se ti fa ridere davvero).","bonus":"La risata è contagiosa: lo dice la scienza, e anche la zia al pranzo di Natale."},{"id":"ca2n2","ab":"calore","liv":2,"sit":"nuove","nome":"🌷 Il complimento al negozio","t":"Fai un complimento preciso a chi gestisce un negozio o un bar per come lo tiene.","bonus":"«Si vede che ci tiene» è la frase magica."},{"id":"ca2c2","ab":"calore","liv":2,"sit":"colleghi","nome":"📝 Il bigliettino","t":"Lascia un bigliettino (o un messaggio) di ringraziamento a un collega per un aiuto ricevuto.","bonus":"Breve, preciso, firmato: tre ingredienti."},{"id":"ca2f2","ab":"calore","liv":2,"sit":"famiglia","nome":"🎁 Il ricordo affettuoso","t":"Racconta a un familiare un bel ricordo che hai di lui o di lei.","bonus":"Comincia con «Ti ricordi quella volta che…?»"},{"id":"ca2g2","ab":"calore","liv":2,"sit":"gruppi","nome":"🥂 Il brindisi al festeggiato","t":"In un gruppo, fai festeggiare a tutti un successo di qualcuno: «Brindiamo a…!»","bonus":"Il festeggiato arrossisce, gli altri sorridono: tutti contenti."},{"id":"ca3n2","ab":"calore","liv":3,"sit":"nuove","nome":"🦁 Il complimento allo sconosciuto","t":"Fai un complimento sincero e preciso a uno sconosciuto, non sull'aspetto: un cane ben educato, una bici curata, un bel gesto che hai visto.","bonus":"Poi saluta e vai: il complimento più bello è quello che non chiede niente in cambio."},{"id":"ca3c2","ab":"calore","liv":3,"sit":"colleghi","nome":"🏅 La lode che arriva in alto","t":"Scrivi due righe al responsabile di un collega o ex collega per dire che cosa ha fatto bene e perché ti è stato utile.","bonus":"Mandane una copia anche a lui: la lode che arriva al capo vale doppio."},{"id":"ca3f2","ab":"calore","liv":3,"sit":"famiglia","nome":"📸 La sorpresa su misura","t":"Organizza una piccola sorpresa per un familiare (la sua torta preferita, una gita, un album di foto).","bonus":"Il segreto è il dettaglio che solo tu conosci."},{"id":"ca3g2","ab":"calore","liv":3,"sit":"gruppi","nome":"🎤 Il brindisi breve","t":"A un pranzo o a una cena di gruppo, fai un brindisi di tre frasi con una cosa bella su chi ha organizzato.","bonus":"Tre frasi, non trenta: il pubblico ringrazia."},{"id":"ca3v2","ab":"calore","liv":3,"sit":"vol","nome":"☀️ I nomi del turno","t":"Durante un'attività di volontariato, impara il nome di almeno due persone che aiuti o con cui fai il turno.","bonus":"La prossima volta salutale per nome: ti ricorderanno."}],"domande_idee":["Qual è la cosa più inutile che hai comprato quest'anno?","Se domani potessi partire per un viaggio, dove andresti?","Che cosa ti piace fare in una giornata libera?","Stai leggendo o guardando qualcosa che ti piace?","Qual è il piatto che ti riesce meglio?","C'è qualcosa che aspetti con piacere nei prossimi mesi?","Com'è cambiato il quartiere da quando ci abiti?","Qual è stata la cosa più bella di questo periodo?","E poi com'è andata?","Che cosa ti è piaciuto di più?","Come ci sei arrivato?"],"intro_app":{"come":"Coppie di sconosciuti chiacchieravano per qualche minuto; poi ognuno diceva quanto gli era piaciuto l'altro e quanto pensava di essere piaciuto. In media si sottovalutavano: l'altro li aveva apprezzati più di quanto credessero. È successo anche tra compagni di alloggio all'università, per diversi mesi, e in uno studio successivo nei gruppi e nei team di lavoro.","prova":["Dopo un incontro, ricorda che probabilmente sei piaciuto più di quanto pensi.","Non rimuginare sui silenzi o sulle frasi venute male: di solito giudichi i tuoi passi falsi più severamente di quanto faccia l'altro."],"att":"È una tendenza media: non garantisce che ogni incontro vada bene, ma dice che la paura di non piacere è spesso esagerata.","fonti":[{"c":"Boothby, E. J., Cooney, G., Sandstrom, G. M., & Clark, M. S. (2018). The liking gap in conversations: Do people like us more than we think? Psychological Science, 29(11), 1742–1756.","t":"studio","url":"https://doi.org/10.1177/0956797618783714"},{"c":"Mastroianni, A. M., Cooney, G., Boothby, E. J., & Reece, A. G. (2021). The liking gap in groups and teams. Organizational Behavior and Human Decision Processes, 162, 109–122.","t":"studio","url":"https://doi.org/10.1016/j.obhdp.2020.10.013"},{"c":"Association for Psychological Science (2018). You probably made a better first impression than you think.","t":"articolo","url":"https://www.psychologicalscience.org/news/releases/you-probably-made-a-better-first-impression-than-you-think.html"}]},"intro_curio":{"tit":"Sei più simpatico di quanto credi","fatto":"Dopo una chiacchierata tra sconosciuti, in media pensiamo di essere piaciuti meno di quanto siamo piaciuti davvero. Gli psicologi lo chiamano «liking gap».","trad":"Quella frase venuta male l'hai notata soprattutto tu."},"frasi":[{"id":"rompi","ic":"🧊","n":"Per rompere il ghiaccio","f":["È la prima volta che vieni qui?","Che cosa ti porta da queste parti?","Mi consigli qualcosa? Non sono mai stato qui.","Qual è il tuo posto preferito per un caffè, qui intorno?","Come mai hai scelto questo corso?","Che bel cane: come si chiama?","Secondo te oggi piove o ci risparmia?","Bella giornata per una passeggiata, vero?","Abiti qui in zona?","C'è sempre tanta gente qui: è sempre così?"]},{"id":"rilancia","ic":"🔁","n":"Per rilanciare","f":["E poi com'è andata?","Che cosa ti è piaciuto di più?","Come ci sei arrivato?","Che cosa ti ha sorpreso?","Raccontami meglio questa storia.","E adesso che cosa ti aspetti?","Qual è stata la parte più difficile?","Come ti è venuta l'idea?","Che cosa hai imparato da quell'esperienza?","Ma dai! E com'è finita?"]},{"id":"silenzio","ic":"🆘","n":"Salvavita per i silenzi","f":["Qual è la cosa più inutile che hai comprato quest'anno?","Se domani potessi partire per un viaggio, dove andresti?","Che cosa ti piace fare in una giornata libera?","Stai leggendo o guardando qualcosa che ti piace?","Qual è il piatto che ti riesce meglio?","C'è qualcosa che aspetti con piacere nei prossimi mesi?","Com'è cambiato il quartiere da quando ci abiti?","Qual è stata la cosa più bella di questo periodo?","Qual è il posto di Torino che preferisci?","Qual è una cosa che hai imparato a fare da poco?","Qual è la cosa più strana che ti è capitata questa settimana?"]},{"id":"vivo","ic":"📲","n":"Per farsi vivo","f":["Mi sei venuto in mente: come stai?","Sono passato davanti a… e ho pensato a te!","Com'è andata poi con…?","Ti va un caffè una di queste mattine?","Ho ritrovato questa foto di qualche anno fa: te la ricordi?","Volevo dirti grazie per…","Ti va di sentirci al telefono uno di questi giorni?","Allora, quand'è che ci prendiamo quel caffè?"]},{"id":"complimento","ic":"🌟","n":"Per un complimento","f":["Mi piace come hai…","Si vede che ci hai messo cura.","Questa me la devi insegnare.","Hai avuto un'ottima idea a…","Mi hai fatto venire voglia di provarci anch'io.","Grazie: mi hai proprio aiutato.","Hai un talento per…","Ti vedo contento: che bello!"]},{"id":"chiudi","ic":"👋","n":"Per chiudere bene","f":["Mi ha fatto piacere parlare con te: riprendiamo presto!","Ti lascio andare, ma poi mi racconti com'è finita.","Che bella chiacchierata: alla prossima!","Sono contento di averti conosciuto.","Ci vediamo la settimana prossima?","Grazie del tempo, mi ha fatto bene.","Salutami tutti a casa!"]},{"id":"nomi","ic":"📛","n":"Per i nomi","f":["Scusa, mi ripeti il nome? Ci tengo a ricordarlo.","Piacere, io sono… e tu?","Ho una memoria da pesce rosso per i nomi: me lo ridici?","Come si scrive? Così me lo ricordo meglio.","Che bel nome: c'è una storia dietro?"]},{"id":"feste","ic":"🎉","n":"Alle feste e nei gruppi","f":["Come conosci i padroni di casa?","Che cosa ti ha portato qui stasera?","Hai già assaggiato quella torta? Ne vale la pena?","Ti presento…: anche lei è appassionata di…","Qual è stata la parte più bella della giornata, per te?"]},{"id":"telefono","ic":"📞","n":"Al telefono","f":["Ti disturbo? Ti rubo solo due minuti.","Ti ho chiamato perché mi andava di sentirti.","Raccontami: che cosa c'è di nuovo?","Allora ci aggiorniamo presto, d'accordo?"]},{"id":"ricevere","ic":"🙏","n":"Per ricevere un complimento","f":["Grazie, mi fa davvero piacere!","Grazie! Ci ho messo un po' di impegno.","Grazie, detto da te vale doppio.","Grazie per averlo notato."]},{"id":"scuse","ic":"🤗","n":"Per scusarsi con garbo","f":["Hai ragione, ho sbagliato: scusami.","Mi spiace per il ritardo, grazie di avermi aspettato.","Scusa, ti ho interrotto: continua pure.","Ieri sono stato brusco: scusami, non te lo meritavi."]},{"id":"no","ic":"🙅","n":"Per dire di no con gentilezza","f":["Grazie dell'invito! Stavolta non riesco, ma la prossima ci sono.","Mi piacerebbe, ma questa settimana sono pieno: facciamo la prossima?","Grazie, preferisco di no; però mi fa piacere che tu me l'abbia chiesto.","Oggi passo, ma tienimi presente per la prossima volta!"]}],"frasi_nota":"Le frasi danno del tu: con persone più grandi o in contesti formali, passa al lei."};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"long",day:"numeric",month:"long"});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}
const AB=MD.abilita,SF=Object.fromEntries(MD.sfide.map(x=>[x.id,x]));
const dayN=s=>diff("2026-01-05",s);

const KEY="pn-v1";
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):st.put(val,key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
const normM=m=>{ // incontri, quiz e medaglie restano salvati ma non si mostrano più
m=m&&typeof m==="object"?m:{};m.g=m.g&&typeof m.g==="object"?m.g:{};m.occ=m.occ&&typeof m.occ==="object"?m.occ:{};m.lette=m.lette||{};m.fav=m.fav||{};return m;};
let M=normM((lsJ(KEY)||{}).met);
let saveT=null;
function save(){const P=lsJ(KEY)||{ver:1};P.met=M;P.savedAt=new Date().toISOString();const t=JSON.stringify(P); // riparto sempre dall'ultima versione salvata: le altre sezioni restano intatte
  try{localStorage.setItem(KEY,t);}catch(e){toast("⚠️ Memoria piena: non salvato");return;}clearTimeout(saveT);saveT=setTimeout(()=>kv("readwrite","pianifica",t).catch(()=>{}),300);}
async function recover(){if(lsJ(KEY))return;try{const t=await kv("readonly","pianifica");if(t){localStorage.setItem(KEY,t);M=normM(JSON.parse(t).met);render();}}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- il percorso: un'abilità a settimana, poi si riparte con missioni più impegnative ---------- */
function startOf(){if(!M.start){M.start=monday(today());save();}return M.start;}
function weekInfo(s){const w=Math.max(0,Math.floor(diff(startOf(),s)/7));return{w,ab:AB[w%4],n:w%4+1,ciclo:Math.floor(w/4)};}
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;};
function propose(s,rnd){
  const W=weekInfo(s),lv=W.ciclo?[2,3,3]:[1,2,3],recent=new Set();
  for(let i=1;i<=21;i++){const g=M.g[add(s,-i)];if(g&&g.s)recent.add(g.s);}
  const seed=rnd?Math.floor(Math.random()*1e9):hash(s+W.ab.id);const out=[],used=new Set();
  lv.forEach((l,k)=>{let pool=MD.sfide.filter(x=>x.ab===W.ab.id&&x.liv===l&&!out.includes(x.id));
    const fresh=pool.filter(x=>!recent.has(x.id)&&!used.has(x.sit));if(fresh.length)pool=fresh;else{const f2=pool.filter(x=>!used.has(x.sit));if(f2.length)pool=f2;}
    if(!pool.length)return;const x=pool[(seed>>>(k*5))%pool.length];out.push(x.id);used.add(x.sit);});
  return out;
}
function dayG(s){let g=M.g[s];if(!g||!Array.isArray(g.p)){g=M.g[s]=Object.assign(g||{},{ab:weekInfo(s).ab.id,p:propose(s)});save();}return g;}
function occPrimo(s){const v=OCC&&(OCC.voci||[]).find(x=>"occ:"+x.id===s);return v?`<span class="lbl">${esc(v.primo)}</span>`:"";}
function sfTxt(g){if(!g||!g.s)return "";if(g.s.startsWith("occ:"))return g.txt||"";const x=SF[g.s];return x?x.nome+": "+x.t:"";}

/* ---------- finestre che si aprono e si chiudono (lo stato resta su questo iPad) ---------- */
const FKEY="pn-metfold";let FOLD=(()=>{try{return JSON.parse(localStorage.getItem(FKEY)||"{}")||{};}catch(e){return {};}})();
function foldSave(){try{localStorage.setItem(FKEY,JSON.stringify(FOLD));}catch(e){}}
const winOpen=(k,def)=>k in FOLD?!!FOLD[k]:!!def;
function win(k,title,body,def,cls){return `<details class="card win ${cls||""}" data-fk="${k}"${winOpen(k,def)?" open":""}><summary><h3>${title}</h3><span class="chev" aria-hidden="true"></span></summary><div class="wb">${body}</div></details>`;}
function sub(k,title,body,def){return `<details class="subw" data-fk="${k}"${winOpen(k,def)?" open":""}><summary>${title}<span class="chev" aria-hidden="true"></span></summary><div class="sb">${body}</div></details>`;}
const tools=()=>`<div class="tools"><button class="btn sm" data-all="1">➕ Apri tutto</button><button class="btn sm" data-all="0">➖ Chiudi tutto</button></div>`;

/* ---------- interfaccia ---------- */
const TABS=[["oggi","🃏 Oggi"],["sapevi","🧠 Lo sapevi?"],["frasi","💬 Frasi di scorta"],["vol","🤲 Volontariato"]];
let tab=(()=>{const ok=v=>TABS.some(t=>t[0]===v),h=(location.hash||"").slice(1);if(ok(h))return h;try{const v=localStorage.getItem("pn-metv");return ok(v)?v:"oggi";}catch(e){return "oggi";}})();
let frCat="tutte",frPick=null;
function setTab(t){tab=t;try{localStorage.setItem("pn-metv",t);}catch(e){}history.replaceState(null,"","#"+t);render();scrollTo({top:0});}
function render(){
  $("intro").textContent=MD.intro;
  $("tabs").innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${n}</button>`).join("");
  $("main").innerHTML=tools()+({oggi:vOggi,sapevi:vSapevi,frasi:vFrasi,vol:vVol}[tab]||vOggi)();
  bind();
}
const LIVI=["","🌱","🌿","🦁"];
const livP=l=>`<span class="pill l${l}">${LIVI[l]} ${esc(MD.livelli[l])}</span>`;
const sitP=s=>`<span class="pill">${esc(MD.situazioni[s]||s)}</span>`;
const pickDay=(L,s,salt)=>L[((dayN(s)+(salt||0))%L.length+L.length)%L.length];

function vOggi(){
  const t=today(),W=weekInfo(t),g=dayG(t);
  let o=win("o-sett",`${W.ab.ic} Settimana ${W.n} di 4 · ${esc(W.ab.n)}`,`<div class="motto">«${esc(W.ab.motto)}»</div><div class="lbl" style="margin-top:4px">${esc(W.ab.sotto)}${W.ciclo?` · giro ${W.ciclo+1}: si alza l'asticella`:""}</div>
    <div class="steps">${AB.map((a,i)=>`<i class="${i===W.n-1?"on":i<W.n-1?"done":""}" title="${esc(a.n)}"></i>`).join("")}</div>`,true);
  // la missione
  let m;
  if(g.s&&g.ok){const x=SF[g.s];m=`<div class="done"><span class="tick">✅</span><div class="grow"><b>${esc(x?x.nome:"🤲 Primo passo")}</b><div>${esc(x?x.t:g.txt)}</div><div class="btns"><button class="btn sm" data-a="gundo">Non l'ho ancora fatta</button></div></div></div>`;}
  else{const rev=new Set(g.rev||[]);
    m=`<p class="lbl" style="margin:0 0 10px">Tre carte coperte, tre livelli. Girane una: è la tua missione. Se non ti convince, girane un'altra.</p><div class="sf">`+
      g.p.map(id=>{const x=SF[id];if(!x)return "";if(!rev.has(id)&&g.s!==id)return `<button class="mc back l${x.liv}" data-pick="${id}"><span class="lv">${LIVI[x.liv]}</span><b>${esc(MD.livelli[x.liv])}</b><span class="lbl">tocca per girare</span></button>`;
        return `<button class="mc front${g.s===id?" on":""}" data-pick="${id}"><span class="h">${livP(x.liv)}${sitP(x.sit)}</span><b class="nm">${esc(x.nome)}</b><span class="t">${esc(x.t)}</span>${x.bonus?`<span class="bo">✨ Bonus: ${esc(x.bonus)}</span>`:""}</button>`;}).join("")+
      (g.s&&g.s.startsWith("occ:")?`<button class="mc front on" data-pick="${esc(g.s)}"><span class="h">${livP(3)}${sitP("vol")}</span><b class="nm">🤲 Primo passo</b><span class="t">${esc(g.txt)}</span>${occPrimo(g.s)}</button>`:"")+
      `</div><div class="btns">${g.s?`<button class="btn ok" data-a="gdone">✓ Missione compiuta</button>`:""}<button class="btn sm" data-a="gnew">🔀 Rimescola il mazzo</button></div>
      <p class="lbl" style="margin:10px 0 0">Saltare un giorno va benissimo: niente serie da tenere, nessuno ti toglie punti.</p>`;}
  o+=win("o-missione",g.s&&g.ok?"🃏 Missione compiuta!":"🃏 Pesca la missione di oggi",m,true);
  // lo sapevi del giorno
  const L=[{intro:1}].concat(MD.schede.filter(x=>x.ab===W.ab.id)),c=pickDay(L,t);
  o+=win("o-sapevi","🧠 Lo sapevi?",(c.intro?curioIntro():curioBody(c))+`<p style="margin:8px 0 0"><button class="lnk" data-tab="sapevi">Tutte le ${MD.schede.length+1} curiosità ›</button></p>`,true);
  // la frase del giorno
  const F=ALLF(),fr=pickDay(F,t,7);
  o+=win("o-frase","💬 La frase di scorta di oggi",`<div class="fpick">«${esc(fr.f)}»${star(fr.f)}</div><p class="lbl" style="margin:8px 0 0">${fr.c.ic} ${esc(fr.c.n)} · <button class="lnk" data-tab="frasi">Tutte le frasi ›</button></p>`,true);
  // missione già fatta nella settimana
  const days=[...Array(7)].map((_,i)=>add(monday(t),i)),n=days.filter(s=>M.g[s]&&M.g[s].ok).length;
  o+=win("o-ritmo","📅 La tua settimana",`<div class="week7">${days.map(s=>`<span class="${M.g[s]&&M.g[s].ok?"ok":s===t?"oggi":""}" title="${esc(fmt(s))}">${["L","M","M","G","V","S","D"][(parse(s).getDay()+6)%7]}</span>`).join("")}</div><p class="lbl" style="margin:8px 0 0">${n?`${n} ${n===1?"missione compiuta":"missioni compiute"} questa settimana.`:"Ancora nessuna missione questa settimana: il mazzo ti aspetta."} Ricorda: dopo una chiacchierata, di solito sei piaciuto più di quanto pensi.</p>`,false);
  return o;
}

/* ---------- 🧠 Lo sapevi? (la scienza resta dietro «Da dove viene?») ---------- */
const FT={studio:"📄 studio",articolo:"📰 spiegato in breve",libro:"📘 libro"};
function fonteH(f){return `<div class="fo"><span class="k">${FT[f.t]||"fonte"}</span>${esc(f.c)}${f.url?` <a href="${esc(f.url)}" target="_blank" rel="noopener">${f.url.includes("doi.org")?"DOI ›":"Apri ›"}</a>`:""}</div>`;}
function appH(a,lid,x){if(!a)return "";return sub("app-"+lid,"🔎 Da dove viene? Lo studio, come provarci, le fonti",`
  ${x?`<h4>📏 La regola</h4><p>${esc(x.princ)}</p><p class="es">${esc(x.es)}</p>`:""}
  <h4>🧪 Che cosa hanno scoperto</h4><p>${esc(a.come)}</p>
  <h4>✅ Prova così</h4><ol>${(a.prova||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
  <h4>⚠️ Attenzione</h4><p>${esc(a.att)}</p>
  <h4>📚 Fonti <span class="lbl" style="font-weight:600">(in inglese)</span></h4>${(a.fonti||[]).map(fonteH).join("")}`,false);}
function curioBody(x,noTit){const c=x.curio;return `${noTit?"":`<b class="ct">${esc(c.tit)}</b>`}<p>${esc(c.fatto)}</p><p class="trad">👉 <b>Tradotto:</b> ${esc(c.trad)}</p><span class="fr">💬 «${esc(x.frase)}»</span>${appH(x.app,x.id,x)}`;}
function curioIntro(noTit){const c=MD.intro_curio;return `${noTit?"":`<b class="ct">${esc(c.tit)}</b>`}<p>${esc(c.fatto)}</p><p class="trad">👉 <b>Tradotto:</b> ${esc(c.trad)}</p>${appH(MD.intro_app,"intro")}`;}
function bibH(){const L=[],seen=new Set();[MD.intro_app].concat(MD.schede.map(s=>s.app)).forEach(a=>(a&&a.fonti||[]).forEach(f=>{if(!seen.has(f.c)){seen.add(f.c);L.push(f);}}));
  L.sort((a,b)=>a.c.localeCompare(b.c,"it"));return win("s-fonti",`📚 Tutte le fonti (${L.length})`,`<p class="lbl" style="margin:0 0 6px">Studi pubblicati su riviste scientifiche con revisione, qualche libro e qualche articolo che li spiega in breve.</p>${L.map(fonteH).join("")}`,false,"bib");}
function vSapevi(){const W=weekInfo(today());
  let o=win("s-intro","🧠 Lo sapevi?",`<p style="margin:0">Curiosità vere dalla psicologia delle relazioni, con la traduzione pratica. Tocca il titolo di una curiosità per aprirla; sotto, «Da dove viene?» apre lo studio e le fonti.</p>`+sub("c-intro","💡 "+esc(MD.intro_curio.tit),curioIntro(1),true),true);
  o+=AB.map(a=>{const L=MD.schede.filter(x=>x.ab===a.id);return win("s-"+a.id,`${a.ic} ${esc(a.n)} <span class="pill${a.id===W.ab.id?" m":""}">${L.length} curiosità${a.id===W.ab.id?" · questa settimana":""}</span>`,
    `<div class="motto" style="margin-bottom:6px">«${esc(a.motto)}»</div>`+L.map(x=>sub("c-"+x.id,"🧠 "+esc(x.curio.tit),curioBody(x,1),false)).join(""),a.id===W.ab.id);}).join("");
  return o+bibH();}

/* ---------- 💬 Frasi di scorta ---------- */
const ALLF=()=>MD.frasi.flatMap(c=>c.f.map(f=>({c,f})));
const star=f=>`<button class="star${M.fav[f]?" on":""}" data-fav="${esc(f)}" aria-label="preferita">${M.fav[f]?"★":"☆"}</button>`;
function frRow(f){return `<div class="row"><div class="grow">«${esc(f)}»</div>${star(f)}</div>`;}
function vFrasi(){const fav=Object.keys(M.fav),tot=ALLF().length;
  let o=win("f-pesca",`🎲 Pesca una frase <span class="pill">${tot} frasi</span>`,`<p style="margin:0">Il kit di pronto soccorso per le chiacchiere: quando il discorso si spegne, ne peschi una. Tocca ☆ per tenere le tue preferite.</p><p class="lbl" style="margin:4px 0 0">${esc(MD.frasi_nota||"")}</p>
    <div class="btns">${[["tutte","Tutte"]].concat(MD.frasi.map(c=>[c.id,c.ic+" "+c.n])).map(([k,n])=>`<button class="btn sm${frCat===k?" pri":""}" data-fc="${k}">${esc(n)}</button>`).join("")}</div>
    <div class="btns"><button class="btn pri" data-a="fpick">🎲 Pesca</button></div>${frPick?`<div class="fpick">«${esc(frPick)}»${star(frPick)}</div>`:""}`,true);
  if(fav.length)o+=win("f-fav",`⭐ Le tue preferite <span class="pill m">${fav.length}</span>`,fav.map(frRow).join(""),true);
  o+=MD.frasi.map(c=>win("f-"+c.id,`${c.ic} ${esc(c.n)} <span class="pill">${c.f.length}</span>`,c.f.map(frRow).join(""),false)).join("");
  return o;}

/* ---------- 🤲 volontariato (file pubblico, aggiornato una volta a settimana) ---------- */
const OKEY="pn-occ";let OCC=lsJ(OKEY),occBusy=false;
async function occPull(){if(occBusy||navigator.onLine===false)return;occBusy=true;
  try{const r=await fetch("occasioni-torino.json",{cache:"no-store"});if(r.ok){const o=await r.json();if(o&&o.app==="pianificazione-occasioni"){OCC=o;try{localStorage.setItem(OKEY,JSON.stringify(o));}catch(e){}if(tab==="vol")render();}}}catch(e){}occBusy=false;}
const ST=[["","—"],["interessa","⭐ mi interessa"],["contattato","📞 ho contattato"],["iniziato","🤲 ho iniziato"],["no","✖️ non fa per me"]];
const STI=Object.fromEntries(ST);
function vVol(){
  if(!OCC)return `<div class="card"><p class="empty">Sto scaricando le occasioni… serve internet la prima volta.</p></div>`;
  const AT=Object.fromEntries(AB.map(a=>[a.id,a])),V=OCC.voci||[];
  let o=win("v-intro",`🤲 Volontariato a Torino <span class="pill">${V.length} realtà</span>`,`<p style="margin:0">Fare volontariato vuol dire incontrare persone nuove ogni settimana, con uno scopo comune: è la palestra più naturale per il Metodo (e le missioni «Da leoni» ringraziano). Tocca una realtà per aprirla.</p>
    <p class="lbl" style="margin:8px 0 0">Controllate sulle pagine ufficiali · ultimo aggiornamento ${OCC.updated?new Date(OCC.updated).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}):"—"} · solo informazioni, nessun consiglio. Le tue scelte e le note restano su questo iPad.</p>`,true);
  const an=(OCC.annunci||[]).filter(a=>!a.scade||a.scade>=today());
  if(an.length)o+=win("v-annunci",`📣 Annunci <span class="pill m">${an.length}</span>`,an.map(a=>sub("va-"+a.id,esc(a.n),`<p>${esc(a.cosa||"")}</p>${a.primo?`<div class="primo"><b>Primo passo:</b> ${esc(a.primo)}</div>`:""}<div class="lbl">${a.scade?"Fino al "+fmt(a.scade,{day:"numeric",month:"long"})+" · ":""}Fonte: <a class="lnk" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.fonte||"pagina")}</a></div>`,false)).join(""),true);
  o+=V.map(v=>{const my=M.occ[v.id]||{};return win("v-"+v.id,`${esc(v.n)}${my.st?` <span class="pill m">${esc(STI[my.st]||"")}</span>`:""}`,`
    <div class="meta">${v.contatto==="alto"?`<span class="pill m">👥 molto contatto con le persone</span>`:`<span class="pill">👥 contatto medio</span>`}${(v.ab||[]).map(a=>AT[a]?`<span class="pill">allena ${AT[a].ic} ${esc(AT[a].n)}</span>`:"").join("")}</div>
    <p>${esc(v.cosa)}</p><p><b>Impegno:</b> ${esc(v.impegno)}</p><p><b>Requisiti:</b> ${esc(v.requisiti)}</p>
    <div class="primo"><b>Primo passo:</b> ${esc(v.primo)}</div>
    <div class="form"><label>Per me<select data-ost="${esc(v.id)}">${ST.map(([k,n])=>`<option value="${k}"${(my.st||"")===k?" selected":""}>${n}</option>`).join("")}</select></label><label>Nota<input data-onote="${esc(v.id)}" maxlength="160" value="${esc(my.n||"")}" placeholder="facoltativa"></label></div>
    <div class="btns"><button class="btn sm" data-osf="${esc(v.id)}">🃏 Il primo passo è la missione di oggi</button></div>
    <div class="lbl" style="margin-top:8px">Fonte: <a class="lnk" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.fonte)}</a> · controllato il ${fmt(v.ctrl,{day:"numeric",month:"long",year:"numeric"})}</div>`,false,"occ");}).join("");
  return o;
}

/* ---------- azioni ---------- */
function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  document.querySelectorAll("details[data-fk]").forEach(d=>d.ontoggle=()=>{FOLD[d.dataset.fk]=d.open?1:0;foldSave();});
  document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const v=b.dataset.all==="1";document.querySelectorAll("#main details[data-fk]").forEach(d=>{d.open=v;FOLD[d.dataset.fk]=v?1:0;});foldSave();});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const g=dayG(today()),id=b.dataset.pick;if(g.s===id)return;g.rev=Array.from(new Set((g.rev||[]).concat(id)));g.s=id;if(SF[id])g.txt=SF[id].nome;save();render();});
  document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{frCat=b.dataset.fc;frPick=null;render();});
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const f=b.dataset.fav;if(M.fav[f])delete M.fav[f];else M.fav[f]=1;save();render();});
  document.querySelectorAll("[data-ost]").forEach(e=>e.onchange=()=>{const m=M.occ[e.dataset.ost]||(M.occ[e.dataset.ost]={});m.st=e.value;m.at=today();save();toast("Salvato");});
  document.querySelectorAll("[data-onote]").forEach(e=>e.onchange=()=>{const m=M.occ[e.dataset.onote]||(M.occ[e.dataset.onote]={});m.n=e.value.trim();save();toast("Salvato");});
  document.querySelectorAll("[data-osf]").forEach(b=>b.onclick=()=>{const v=(OCC.voci||[]).find(x=>x.id===b.dataset.osf);if(!v)return;const g=dayG(today());if(g.ok&&!confirm("Hai già compiuto la missione di oggi: la sostituisco con questo primo passo?"))return;g.s="occ:"+v.id;g.txt="Fai il primo passo con "+v.n;g.rev=g.rev||[];g.ok=false;save();FOLD["o-missione"]=1;foldSave();setTab("oggi");toast("🃏 È la missione di oggi");});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));
}
function act(a){const t=today();
  if(a==="gnew"){const g=dayG(t);g.p=propose(t,true);g.rev=[];if(g.s&&!g.s.startsWith("occ:")){g.s=null;delete g.txt;}save();toast("🔀 Mazzo rimescolato");return render();}
  if(a==="gdone"){const g=dayG(t);g.ok=true;g.at=new Date().toISOString();save();toast(["✅ Missione compiuta!","✅ Bravo, agente della simpatia!","✅ Fatto: il mondo è un po' più cordiale."][Math.floor(Math.random()*3)]);return render();}
  if(a==="gundo"){const g=dayG(t);g.ok=false;save();return render();}
  if(a==="fpick"){const L=ALLF().filter(x=>frCat==="tutte"||x.c.id===frCat);let p=L[Math.floor(Math.random()*L.length)].f;if(L.length>1)while(p===frPick)p=L[Math.floor(Math.random()*L.length)].f;frPick=p;return render();}
}
window.addEventListener("pageshow",e=>{if(e.persisted){M=normM((lsJ(KEY)||{}).met);render();}});
const busy=()=>/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(!busy()){M=normM((lsJ(KEY)||{}).met);render();}occPull();}});
render();recover();occPull();
</script>
<script>
/* ===== Aggiornamento automatico e controllo versione (uguale in tutte le sezioni di Pianificazione: costruita da comune/barra.html) =====
   - all'apertura, al ritorno sull'app e ogni 30 minuti legge version.json saltando ogni copia vecchia (anche quella del server di GitHub);

      h+="<p style=\"margin:8px 0\">"+(c.err?"⚠️ <b>"+esc(c.err)+"</b><br>":"✅ <b>Attiva.</b> ")+"Ultima copia: <b>"+when(c.last)+"</b>"+(c.size?" · "+Math.max(1,Math.round(c.size*0.75/1024))+" KB":"")+(c.nofiles?"<br>I file delle pratiche sono troppi per la copia automatica: restano nella copia su File/iCloud.":"")+"</p>"+
        "<p style=\"margin:0 0 8px;color:#6b7280;font-size:14px\">Contiene tutto: Licenze, Calendario, Scadenze, Pensione con i suoi file (e le vecchie Pratiche), 📓 Diario, Benessere, Tai Chi e Progressi. È cifrata con la tua parola della copia: senza, nessuno la legge (nemmeno GitHub).</p>"+

    try{if(typeof window.__flush==="function")window.__flush();}catch(e){}
    setTimeout(function(){location.replace(location.pathname+"?v="+encodeURIComponent(v));},350);

    if(!/^https?:/.test(location.protocol))return;

        if(manual||!busy()){st.state="new";paint();apply(st.remote);}
        else{st.state="wait";st.pending=true;paint();}
      }else{st.state="ok";paint();}
    }).catch(function(){st.state="offline";paint();});
  }

  }
  check(false);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")check(false);});
  window.addEventListener("pageshow",function(e){if(e.persisted)check(false);});
  setInterval(function(){check(false);},30*60*1000);
})();
