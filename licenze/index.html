/* ================= BLOCCO CON FACE ID (comune a tutte le pagine di Pianificazione) =================
   - usa una passkey del dispositivo (WebAuthn): l'iPad chiede Face ID, o il codice dell'iPad se il volto non viene riconosciuto;
   - nessun server: la chiave pubblica resta su questo dispositivo e la firma si verifica qui;
   - codice di riserva (4–8 cifre) se la passkey non fosse disponibile;
   - si riblocca dopo 5 minuti fuori dall'app. I dati restano dove sono: il blocco protegge l'apertura, non cifra i dati. */
/* chiavi di Pianificazione con il prefisso dell'app (prima erano «mie-app-…», nome condiviso con il sito): spostate una volta sola */
(function(){try{[["mie-app-lastSnap","pn-lastSnap"],["mie-app-lastBackup","pn-lastBackup"],["mie-app-copia-cloud","pn-copia-cloud"]].forEach(function(p){var v=localStorage.getItem(p[0]);if(v!=null){if(localStorage.getItem(p[1])==null)localStorage.setItem(p[1],v);localStorage.removeItem(p[0]);}});}catch(e){}})();
(function(){
  "use strict";
  var KEY="pn-lock", SES="pn-unlocked", IDLE=5*60*1000;
  function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
  var C=cfg(), root=document.documentElement;
  function unlocked(){try{var t=+sessionStorage.getItem(SES)||0;return t&&Date.now()-t<IDLE;}catch(e){return false;}}
  function mark(){try{sessionStorage.setItem(SES,String(Date.now()));}catch(e){}}
  if(C&&C.on&&!unlocked())root.classList.add("locked");
  var b64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
  var unb64=function(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
  async function sha(t){var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return b64(h);}
  // firma ES256 (DER) → formato grezzo r|s per WebCrypto
  function der2raw(d){var i=2;if(d[1]&0x80)i+=d[1]&0x7f;function int(){i++;var l=d[i++];var v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);var o=new Uint8Array(32);o.set(v,32-v.length);return o;}var r=int(),s=int(),out=new Uint8Array(64);out.set(r,0);out.set(s,32);return out;}
  async function verify(pkB64,authData,clientJSON,sig){
    try{var key=await crypto.subtle.importKey("spki",unb64(pkB64),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
      var ch=new Uint8Array(await crypto.subtle.digest("SHA-256",clientJSON)),ad=new Uint8Array(authData),data=new Uint8Array(ad.length+ch.length);data.set(ad,0);data.set(ch,ad.length);
      return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,der2raw(new Uint8Array(sig)),data);}catch(e){return null;}
  }
  function done(){mark();root.classList.remove("locked");try{window.dispatchEvent(new Event("pn-unlocked"));}catch(e){}}
  function msg(t){var e=document.getElementById("lkMsg");if(e)e.textContent=t;}
  var busy=false;
  async function faceId(){
    C=cfg(); if(!C||!C.id){showPin();return;}
    if(busy)return; busy=true; msg("Guarda l’iPad…");
    try{
      var chal=rnd(32);
      var a=await navigator.credentials.get({publicKey:{challenge:chal,rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb64(C.id)}],userVerification:"required",timeout:60000}});
      var r=a.response,cj=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
      if(cj.type!=="webauthn.get"||cj.challenge!==b64(chal))throw new Error("risposta non valida");
      var flags=new Uint8Array(r.authenticatorData)[32];if(!(flags&4))throw new Error("verifica del volto non fatta");
      if(C.pk){var ok=await verify(C.pk,r.authenticatorData,r.clientDataJSON,r.signature);if(ok===false)throw new Error("firma non valida");}
      done();
    }catch(e){msg(e&&e.name==="NotAllowedError"?"Tocca «Sblocca con Face ID» per riprovare, o usa il codice di riserva.":"Non riuscito: riprova o usa il codice di riserva.");}
    busy=false;
  }
  function showPin(){var b=document.getElementById("lkPinBox");if(b){b.hidden=false;var i=document.getElementById("lkPin");if(i)i.focus();}}
  async function pin(){var v=(document.getElementById("lkPin").value||"").trim();C=cfg();
    if(C&&C.pin&&await sha("pn-pin:"+v)===C.pin){done();document.getElementById("lkPin").value="";document.getElementById("lkErr").textContent="";}
    else{document.getElementById("lkErr").textContent="Codice sbagliato";}}
  function wire(){
    var g=document.getElementById("lkGo");if(!g)return;
    g.onclick=faceId;document.getElementById("lkAlt").onclick=showPin;document.getElementById("lkPinGo").onclick=pin;
    document.getElementById("lkPin").onkeydown=function(e){if(e.key==="Enter")pin();};
    if(root.classList.contains("locked"))faceId();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",wire);else wire();
  // si riblocca dopo 5 minuti fuori dall'app
  document.addEventListener("visibilitychange",function(){C=cfg();if(!C||!C.on)return;
    if(document.visibilityState==="hidden"){if(!root.classList.contains("locked"))mark();}else if(!unlocked()){root.classList.add("locked");msg("Sblocca con Face ID per continuare.");faceId();}});
  setInterval(function(){if(!root.classList.contains("locked")&&document.visibilityState==="visible")mark();},30000);

  /* ---------- attivazione (usata dalla pagina Pianificazione → 🔒 Blocco) ---------- */
  window.__pnLock={
    cfg:cfg,
    available:async function(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}},
    enable:async function(pinCode){
      if(!/^\d{4,8}$/.test(pinCode||""))throw new Error("Il codice di riserva deve avere da 4 a 8 cifre");
      var c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"Pianificazione",id:location.hostname},
        user:{id:rnd(16),name:"pianificazione",displayName:"Pianificazione"},pubKeyCredParams:[{type:"public-key",alg:-7}],
        authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000,attestation:"none"}});
      var pk=null;try{pk=c.response.getPublicKey?b64(c.response.getPublicKey()):null;}catch(e){}
      localStorage.setItem(KEY,JSON.stringify({on:true,id:b64(c.rawId),pk:pk,pin:await sha("pn-pin:"+pinCode),at:new Date().toISOString()}));mark();return true;
    },
    disable:function(){localStorage.removeItem(KEY);try{sessionStorage.removeItem(SES);}catch(e){}},
    lockNow:function(){try{sessionStorage.removeItem(SES);}catch(e){}if(cfg())root.classList.add("locked");msg("Sblocca con Face ID per continuare.");}
  };
})();

<script>
/* ================= PIANIFICAZIONE =================
   Sezioni: 📆 Calendario (punto di partenza: giorno, settimana, mese, anno, scadenze; il giorno contiene benessere e Tai Chi,
   il giorno di oggi anche il riepilogo; dentro ci sono gli impegni e le attività fisse della famiglia) · ⚙️ Impostazioni
   (blocco con Face ID, Calendario dell'iPad, copie). I vecchi indirizzi #scad, #ben, #sic, #oggi, #fam portano al posto giusto.
   Tutti i dati restano su questo dispositivo: localStorage «pn-v1» + copia nel database del dispositivo (IndexedDB «licenze-marco», voce «pianifica»)
   + copie giornaliere e copia su File/iCloud insieme a Licenze, Tai Chi e Progressi (barra in fondo). Nessun dato personale nel codice. */
"use strict";
/* 💶 Conti: sezione nascosta, codice e dati conservati per il futuro (sezioni/conti.js). Con true torna visibile:
   menu, pagamenti nel Calendario, riquadro di oggi, pagamenti nel file per il Calendario dell'iPad. */
const CONTI_ON=false;
/* 🗂️ Pratiche tolta il 25/10/2026 (scelta del proprietario): i dati restano nelle copie, la sezione non compare più */
const PRAT_ON=false;
const HOL={"2026-11-01":"Ognissanti","2026-12-08":"Immacolata","2026-12-25":"Natale","2026-12-26":"S. Stefano",
"2027-01-01":"Capodanno","2027-01-06":"Epifania","2027-03-28":"Pasqua","2027-03-29":"Pasquetta",
"2027-04-25":"Liberazione","2027-05-01":"Festa del Lavoro","2027-06-02":"Festa della Repubblica"};
const DEF={start:"",end:"",bal:{lo25:0,lo26:0,lo27:0,rl26:0,rl27:0},defIn:"08:00",defOut:"14:00",days:{},week:{}};
const PROV_START="";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"short",day:"numeric",month:"short"});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- dati e salvataggio ---------- */
const KEY="pn-v1";
const DEF_PN={ver:1,scad:[],fam:{att:[],ev:[]},conti:{ric:[],mov:[],hide:false},ben:{d:{}},ics:{sent:{}},cal:{at:null,ev:[]},savedAt:null};
function normalize(o){const d=JSON.parse(JSON.stringify(DEF_PN));if(o&&typeof o==="object"){Object.assign(d,o);d.fam=Object.assign({att:[],ev:[]},o.fam||{});d.conti=Object.assign({ric:[],mov:[],hide:false},o.conti||{});d.ben=Object.assign({d:{}},o.ben||{});d.ics=Object.assign({sent:{}},o.ics||{});d.cal=Object.assign({at:null,ev:[]},o.cal||{});d.scad=Array.isArray(o.scad)?o.scad:[];}return d;}
let P=normalize(lsJ(KEY));
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):(val===undefined?st.delete(key):st.put(val,key));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
let saveT=null;
function save(){P.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>{kv("readwrite","pianifica",JSON.stringify(P)).catch(()=>{});},400);paintSaved();}
window.__flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}kv("readwrite","pianifica",JSON.stringify(P)).catch(()=>{});};
function paintSaved(){const e=$("pnSaved");if(e)e.textContent=P.savedAt?"✓ Salvato su questo dispositivo · "+new Date(P.savedAt).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";}
async function recover(){ // se il browser avesse perso la memoria principale, riprendo la copia del database
  if(lsJ(KEY))return;
  try{const t=await kv("readonly","pianifica");if(t){P=normalize(JSON.parse(t));localStorage.setItem(KEY,t);render();toast("Dati di Pianificazione recuperati dalla copia");}}catch(e){}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- lettura (solo lettura) delle altre sezioni ---------- */
function licS(){const s=lsJ("licenze-marco-v1");if(!s)return null;const o=JSON.parse(JSON.stringify(DEF));Object.assign(o,s);o.bal=Object.assign({},DEF.bal,s.bal||{});o.days=s.days||{};o.week=s.week||{};o.ev=s.ev||{};if(!o.end)o.end=add(today(),365);return o;}
const kind=s=>{if(HOL[s])return "FEST";const w=parse(s).getDay();return(w===0||w===6)?"WE":"LAV";};
const NOMI={P:"in ufficio",LP:"licenza (anni precedenti)",LO:"licenza (anno in corso)",RL:"recupero festivo",AL:"altra assenza"};
function licCalc(S){ // stesso calcolo della sezione Licenze: saldi consumati giorno per giorno fino al congedo
  const st=S.start||today(),en=S.end,t=today(),b=Object.assign({},S.bal);let pLeft=0;
  for(let s=st;s<=en;s=add(s,1)){if(kind(s)!=="LAV")continue;const c=(S.days[s]&&S.days[s].c)||"P",y27=s>="2027-01-01";
    if(c==="LP"){if(b.lo25>0)b.lo25--;else if(y27&&b.lo26>0)b.lo26--;}
    else if(c==="LO"){if(!y27){if(b.lo26>0)b.lo26--;}else if(b.lo27>0)b.lo27--;}
    else if(c==="RL"){if(b.rl26>0)b.rl26--;else if(y27&&b.rl27>0)b.rl27--;}
    else if(c==="P"&&s>t&&s<en)pLeft++;}
  return{unpl:b.lo25+b.lo26+b.lo27+b.rl26+b.rl27,pLeft,toEnd:diff(t,en),start:st,end:en};
}
function licDay(S,s){ // che cosa faccio quel giorno
  const k=kind(s);if(!S)return{k,c:null,t:k==="LAV"?"":k==="WE"?"fine settimana":"festivo"};
  const st=S.start||today();if(s<st||s>S.end)return{k,c:"OUT",t:s<st?"prima del rientro":"in congedo"};
  if(k!=="LAV")return{k,c:null,t:k==="WE"?"fine settimana":(HOL[s]||"festivo")};
  const c=(S.days[s]&&S.days[s].c)||"P",d=S.days[s]||{},w=S.week[monday(s)]||{};
  return{k,c,t:NOMI[c]||c,i:d.in||w.in||S.defIn,o:d.out||w.out||S.defOut};
}
function absBlocks(S){ // assenze consecutive (con weekend e festivi in mezzo) da oggi al congedo
  if(!S)return[];const out=[];let cur=null;const st=S.start||today(),from=today()>st?today():st;
  for(let s=from;s<=S.end;s=add(s,1)){const d=licDay(S,s),off=d.k!=="LAV"||d.c!=="P";

    else{if(cur&&cur.abs)out.push(cur);cur=null;}}
  if(cur&&cur.abs)out.push(cur);
  return out;
}

  const pad=x=>{const m=String(x).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0"):String(x);};
  const days=(Array.isArray(d.days)?d.days:Object.keys(d.days||{})).map(pad).filter(x=>x>=add(today(),-14));return{l,days};}
/* ---------- 📅 la settimana di «Il mio mondo»: solo numeri (giorni, risposte, nozioni per materia) ---------- */

/* ----------------------------- *

/* given a stream and two trees, inflate a block of data */

  C().mov.forEach(m=>{if(m.d<from||m.d>to||isTransfer(m))return;const v=+m.imp||0;if(m.tipo==="e")e+=v;else{u+=v;per[m.cat]=(per[m.cat]||0)+v;}});return{e,u,per};}
function monthTotals(ym){const a=monthActual(ym);if(C().mov.some(m=>m.d.slice(0,7)===ym))return a;
  let e=0,u=0;C().ric.forEach(r=>{const n=ricDates(r,ym+"-01",monthEnd(ym)).length;if(r.tipo==="e")e+=n*(+r.imp||0);else u+=n*(+r.imp||0);});return{e,u,per:{},prev:true};}
function lastMonths(n){const out=[],d=parse(today());d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(iso(x).slice(0,7));}return out;}

const H={date:/^(data( dell'?)?( operazione| contabile| movimento| registrazione| transazione)?|booking date|transaction date|date|data op\.?)$/,valuta:/valuta|value date/,
  amount:/^(importo( netto| in euro| eur| movimento)?|amount|ammontare|valore)$/,credit:/^(entrate|avere|accrediti?|entrata|importo avere)$/,debit:/^(uscite|dare|addebiti?|uscita|importo dare)$/,bcat:/^(categoria|moneymap|categoria moneymap|category)$/,
  desc:/descrizione|causale|partner name|payee|payment reference|dettagli|beneficiario|tipologia|merchant|esercente/,status:/^(stato( operazione)?|status)$/};
const low=v=>String(v==null?"":v).replace(/^\uFEFF/,"").trim().toLowerCase();
/* intestazioni normalizzate: «Data_Operazione», «Entrate (€)», «Importo Netto (€)» → «data operazione», «entrate», «importo netto» */
const hnorm=v=>low(v).replace(/[_]+/g," ").replace(/\((?:€|eur|euro)\)/g,"").replace(/[€:]/g,"").replace(/\s+/g," ").trim();
function detect(rows){let best=null;
  for(let i=0;i<Math.min(rows.length,60);i++){const r=(rows[i]||[]).map(hnorm);let date=-1,amount=-1,credit=-1,debit=-1,status=-1,bcat=-1;const desc=[];
    r.forEach((h,j)=>{if(!h)return;if(H.valuta.test(h))return;if(date<0&&H.date.test(h))date=j;else if(amount<0&&H.amount.test(h))amount=j;else if(credit<0&&H.credit.test(h))credit=j;else if(debit<0&&H.debit.test(h))debit=j;else if(status<0&&H.status.test(h))status=j;else if(bcat<0&&H.bcat.test(h))bcat=j;else if(H.desc.test(h))desc.push(j);});
    const score=(date>=0)*2+((amount>=0)||(credit>=0||debit>=0))*2+(desc.length>0);
    if(date>=0&&(amount>=0||credit>=0||debit>=0)&&(!best||score>best.score))best={row:i,score,date,amount,credit,debit,status,bcat,desc:desc.slice(0,2)};}
  return best;}
function parseDateCell(v){if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,10);}
  const s=String(v||"").trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return y+"-"+pad(+m[2])+"-"+pad(+m[1]);}return null;}
function parseAmt(v){if(typeof v==="number")return v;let s=String(v||"").replace(/[€\s]|eur/gi,"").trim();if(!s)return null;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}if(/^[-−]/.test(s)){neg=true;s=s.slice(1);}if(/^\+/.test(s))s=s.slice(1);
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");if(lc>ld)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");
  const n=parseFloat(s);return isNaN(n)?null:(neg?-n:n);}
let IMP=null; // importazione in corso: {acc,rows,map,file}
function buildImport(){const I=IMP,a=C().acc.find(x=>x.id===I.acc),M=I.map,out=[],seen=new Set(C().mov.map(m=>m.h)),occ={};let dup=0,skip=0,pend=0;
  for(let i=M.row+1;i<I.rows.length;i++){const r=I.rows[i]||[];const d=parseDateCell(r[M.date]);if(!d){skip++;continue;}
    let v=null;if(M.amount>=0)v=parseAmt(r[M.amount]);else{const cr=M.credit>=0?parseAmt(r[M.credit]):null,db=M.debit>=0?parseAmt(r[M.debit]):null;v=(cr?Math.abs(cr):0)-(db?Math.abs(db):0);if(!cr&&!db)v=null;}
    if(v==null||!v){skip++;continue;}
    const desc=M.desc.map(j=>String(r[j]==null?"":r[j]).trim()).filter(Boolean).filter((x,k,arr)=>arr.indexOf(x)===k).join(" · ")||"(senza descrizione)";
    if(/^totale/i.test(desc)){skip++;continue;}
    const st=M.status>=0?low(r[M.status]):"",p=/autorizzat|in lavorazione|pending|prenotat|da contabilizzare/.test(st)?1:0;
    const h0=movHash(a.id,d,v,desc),nth=occ[h0]=(occ[h0]||0)+1,h=nth>1?h0+"#"+nth:h0; // due spese identiche nello stesso file contano entrambe
    if(seen.has(h)){dup++;continue;}if(p)pend++;
    const bc=M.bcat>=0?String(r[M.bcat]||""):"";
    out.push({id:uid(),d,t:desc,imp:Math.round(Math.abs(v)*100)/100,tipo:v>0?"e":"u",cat:isOwn(desc,v)?"giro":guessCat(desc+" | "+bc,v),acc:a.id,h,src:"file",p});}
  // nello stesso file: un movimento «in attesa» che compare anche contabilizzato si tiene una volta sola
  const booked=out.filter(m=>!m.p);const fin=out.filter(m=>!m.p||!booked.some(b=>b.tipo===m.tipo&&cents(b.imp)===cents(m.imp)&&Math.abs(diff(b.d,m.d))<=6&&!b._used&&(b._used=1)));
  booked.forEach(b=>delete b._used);const dropped=out.length-fin.length;
  return{out:fin,dup:dup+dropped,skip,pend:pend-dropped};}
function commitImport(){const R=buildImport(),c=C();
  // movimenti «in attesa» già presenti che ora arrivano contabilizzati: sostituiti
  R.out.filter(m=>!m.p).forEach(m=>{const k=c.mov.findIndex(x=>x.p&&x.acc===m.acc&&x.tipo===m.tipo&&cents(x.imp)===cents(m.imp)&&Math.abs(diff(x.d,m.d))<=6);if(k>=0)c.mov.splice(k,1);});
  if(!c.own){ // nome dell'intestatario: dal beneficiario degli accrediti (es. stipendio «Ben: Cognome Nome»), resta sull'iPad
    const f={};R.out.filter(m=>m.tipo==="e").forEach(m=>{const x=String(m.t).toLowerCase().match(/\bben\w*:?\s+([a-zà-ù']+\s+[a-zà-ù']+)/);if(x)f[x[1]]=(f[x[1]]||0)+1;});
    const top=Object.entries(f).sort((a,b)=>b[1]-a[1])[0];if(top&&top[1]>=2)c.own=top[0];}
  c.mov.push(...R.out);
  if(c.own)c.mov.forEach(m=>{if(m.cat!=="giro"&&isOwn(m.t,m.tipo==="e"?m.imp:-m.imp))m.cat="giro";});const a=c.acc.find(x=>x.id===IMP.acc);a.map=Object.assign({},IMP.map,{sig:IMP.sig});c.bmap[a.bank]=Object.assign({},IMP.map,{sig:IMP.sig});a.last=today();IMP=null;save();toast("📥 "+R.out.length+" movimenti importati"+(R.dup?" · "+R.dup+" già presenti":"")+(a.rec||a.tipo==="credito"?"":" · ora imposta il saldo con «Riconcilia»"));return R;}
async function readImportFile(file,accId){const u8=new Uint8Array(await file.arrayBuffer());const rows=await Fogli.readTable(u8);
  if(!C().own){for(const r of rows.slice(0,15)){const t=String((r||[])[0]||"");const m=t.match(/intestazi\w*[^:]*:\s*(.+)$/i)||t.match(/^intestatario:\s*(.+)$/i);if(m){C().own=m[1].trim();save();break;}}}
  const a=C().acc.find(x=>x.id===accId),bm=C().bmap[a.bank],det=detect(rows),sigOf=r=>(rows[r]||[]).map(low).join("|");

    manual=true;const r0=Math.max(0,rows.findIndex(r=>(r||[]).filter(x=>x!==""&&x!=null).length>=3));map={row:r0,date:-1,amount:-1,credit:-1,debit:-1,desc:[],status:-1,bcat:-1};}

function varEstimate(){const ms=lastMonths(4).slice(0,3);let tot=0,n=0;ms.forEach(ym=>{const a=monthActual(ym);if(!a.u)return;let ru=0;C().ric.forEach(r=>{if(r.tipo!=="e")ru+=ricDates(r,ym+"-01",monthEnd(ym)).length*(+r.imp||0);});tot+=Math.max(0,a.u-ru);n++;});return n?Math.round(tot/n):null;}
function projection(){const c=C(),D=projDefaults(),v=D.var!=null&&D.var!==""?+D.var:(varEstimate()||0),out=[];let bal=totBal();

  for(let i=1;i<=D.mesi;i++){const m=new Date(d0.getFullYear(),d0.getMonth()+i,1),ym=iso(m).slice(0,7),from=ym+"-01",to=monthEnd(ym);let e=0,u=0;
    c.ric.forEach(r=>{const ds=ricDates(r,from,to);ds.forEach(d=>{if(r.id===D.stip&&D.dal&&d>=D.dal)return;if(r.tipo==="e")e+=+r.imp||0;else u+=+r.imp||0;});});

    return `<div class="card"><h3>📄 ${esc(IMP.file)} → ${esc(accLabel(c.acc.find(a=>a.id===IMP.acc)))}</h3><p class="lbl">${IMP.manual?"<b>Non ho riconosciuto da solo le colonne di questo file.</b> Scegli tu la riga dei titoli e le colonne di data, importo e descrizione: le ricordo per i prossimi file di questa banca.":IMP.from?"Colonne come l’ultima volta per "+esc(IMP.from)+". Se una è sbagliata, cambiala.":"Controlla le colonne: le ho riconosciute da sole. Se una è sbagliata, cambiala."}</p>
      <div class="form"><label>Riga dei titoli<select data-map="row">${IMP.rows.slice(0,25).map((r,j)=>`<option value="${j}"${j===M.row?" selected":""}>${j+1}: ${esc((r||[]).filter(x=>x!==""&&x!=null).slice(0,3).join(" · ").slice(0,40)||"(vuota)")}</option>`).join("")}</select></label><label>Data<select data-map="date">${opt(M.date)}</select></label><label>Importo (con segno)<select data-map="amount">${opt(M.amount,"— usa Entrate/Uscite —")}</select></label>
      <label>Entrate<select data-map="credit">${opt(M.credit)}</select></label><label>Uscite<select data-map="debit">${opt(M.debit)}</select></label>
      <label>Descrizione<select data-map="desc0">${opt(M.desc[0])}</select></label><label>Descrizione 2<select data-map="desc1">${opt(M.desc[1])}</select></label><label>Stato<select data-map="status">${opt(M.status)}</select></label></div>
      <div class="kpi" style="margin-top:10px"><div><b>${R.out.length}</b><span>movimenti nuovi</span></div><div><b>${R.dup}</b><span>già presenti (saltati)</span></div><div><b>${R.pend}</b><span>in attesa di contabilizzazione</span></div><div><b>${R.skip}</b><span>righe non movimento</span></div></div>
      <div style="margin-top:10px">${R.out.slice(0,8).map(m=>`<div class="row"><div class="grow"><b>${esc(m.t)}</b><small>${fmt(m.d)} · ${catName(m.cat)}</small></div><span class="amt ${m.tipo==="e"?"e":"u"}">${m.tipo==="e"?"+":"−"}${euro(m.imp)}</span></div>`).join("")}</div>
      <div class="btns"><button class="btn pri" id="impGo"${R.out.length?"":" disabled"}>Importa ${R.out.length} movimenti</button><button class="btn" id="impNo">Annulla</button></div></div>`;}
  return `<div class="card"><h3>📥 Importa i movimenti della banca</h3><p class="lbl">Scarica i movimenti dal sito della banca (Excel o CSV) e scegli il file qui. Il file viene letto solo su questo iPad. I doppioni vengono saltati, quindi puoi importare anche periodi che si sovrappongono.</p>
    <div class="form"><label>In quale conto o carta<select id="impAcc">${accActive().map(a=>`<option value="${a.id}">${esc(accLabel(a))}</option>`).join("")}</select></label><label>File<input id="impFile" type="file" accept=".csv,.txt,.xls,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label></div>
    <p class="lbl" id="impHelp">${esc(impHelp(accActive()[0]))}</p></div>
    <div class="card"><h3>Ultime importazioni</h3>${accActive().map(a=>`<div class="row"><div class="grow">${esc(accLabel(a))}</div><span class="lbl">${a.last?"il "+fmt(a.last):"mai"}</span></div>`).join("")}</div>`;}
let ACC_ED=null; // conto in modifica
function accForm(a){const c=C(),id=a?"e":"a",bk=a?a.bank:"fineco",tp=a?a.tipo:"conto";
  return `<div class="form">
    <label>Banca<select id="${id}B">${allBanks().map(b=>`<option value="${b.id}"${b.id===bk?" selected":""}>${esc(b.n)}</option>`).join("")}</select></label>
    <label>Tipo<select id="${id}T">${Object.entries(TIPI_ACC).map(([k,v])=>`<option value="${k}"${k===tp?" selected":""}>${v}</option>`).join("")}</select></label>
    <label>Nome<input id="${id}N" maxlength="40" value="${a?esc(a.n):""}" placeholder="es. Conto principale"></label>
    <label>Ultime 4 cifre (carte)<input id="${id}4" maxlength="4" inputmode="numeric" pattern="[0-9]*" value="${a&&a.l4?esc(a.l4):""}" placeholder="es. 1234"></label>
    ${a?`<label>Saldo iniziale €<input id="eS" type="text" inputmode="decimal" value="${String(Math.round((+a.s0||0)*100)/100).replace(".",",")}"></label><label>Saldo alla data<input id="eD" type="date" value="${a.d0||""}"></label>`:`<label>Saldo di oggi €<input id="aS" type="text" inputmode="decimal" placeholder="0,00"></label>`}
    <label>Carta addebitata su<select id="${id}L"><option value="">—</option>${accActive().filter(x=>x.tipo==="conto"&&(!a||x.id!==a.id)).map(x=>`<option value="${x.id}"${a&&a.link===x.id?" selected":""}>${esc(x.n)}</option>`).join("")}</select></label>
    <label class="wide" data-wallet ${tp==="wallet"?"":"hidden"}><span><input type="checkbox" id="${id}G"${a&&a.giro?" checked":""} style="width:auto;margin-right:6px">Le ricariche dal conto sono giroconti (importo anche i movimenti di questo portafoglio)</span></label>
    <label class="wide" data-wallet ${tp==="wallet"?"":"hidden"}>Parole che riconoscono le ricariche nel conto (separate da virgola)<input id="${id}K" maxlength="80" value="${a&&a.key?esc(a.key):""}" placeholder="es. satispay"></label></div>`;}
function cAcc(){const c=C(),act=accActive(),arch=c.acc.filter(a=>a.arch);
  const row=a=>{const link=a.link?c.acc.find(x=>x.id===a.link):null,b=bankOf(a.bank);
    if(ACC_ED===a.id)return `<div class="card" style="border-color:var(--accent)"><h3>✏️ ${esc(a.n)}</h3>${accForm(a)}<div class="btns"><button class="btn pri" id="eSave">Salva</button><button class="btn" id="eArch">${a.arch?"Ripristina":"📦 Archivia (conto chiuso)"}</button><button class="btn" id="eNo">Annulla</button></div>
      <p class="lbl">Archiviato, il conto sparisce dagli elenchi e dal totale, ma i suoi movimenti restano nelle statistiche. «Togli» invece cancella anche i movimenti.</p></div>`;
    return `<div class="row"><span class="pill" style="background:${b[1]};color:#fff">${esc(b[0])}</span><div class="grow"><b>${esc(accLabel(a))}</b><small>${TIPI_ACC[a.tipo]||""}${link?" · addebitata su "+esc(link.n):""}${a.tipo==="wallet"?(a.giro?" · ricariche = giroconti":" · ricariche contate come spesa"):""}</small></div><span class="amt ${accBal(a)>=0?"e":"u"}">${euro(accBal(a))}</span><button class="btn sm" data-aed="${a.id}">✏️ Modifica</button>${a.arch?"":`<button class="btn sm" data-arec="${a.id}">Riconcilia</button>`}<button class="btn sm" data-adel="${a.id}">Togli</button></div>`;};
  return `<div class="card"><h3>I tuoi conti e carte</h3>${act.length?act.map(row).join(""):'<p class="empty">Nessun conto ancora.</p>'}</div>
  ${arch.length?`<details class="card"${arch.some(a=>a.id===ACC_ED)?" open":""}><summary><b>📦 Archiviati (${arch.length})</b></summary>${arch.map(row).join("")}</details>`:""}
  <div class="card"><h3>➕ Aggiungi conto o carta</h3>${accForm(null)}
    <div class="btns"><button class="btn pri" id="aAddAcc">Aggiungi</button></div>
    <p class="lbl">Le carte di debito (N26, bancomat) addebitano ogni spesa sul conto: basta importare il conto. Per le carte di credito importa il file della carta: l’addebito mensile sul conto viene escluso dai totali, così non conti la spesa due volte. Per la carta di credito il saldo è il debito del periodo (negativo). Per un <b>portafoglio</b> (PayPal, Satispay…): se importi anche i suoi movimenti, spunta «le ricariche sono giroconti», così le spese si contano una volta sola.</p></div>
  <div class="card"><h3>🏦 Le tue banche</h3><p class="lbl">Aggiungi qualsiasi banca o servizio con un nome e un colore: compare nell’elenco delle banche.</p>
    ${c.banks.length?c.banks.map(b=>`<div class="row"><span class="pill" style="background:${b.col};color:#fff">${esc(b.n)}</span><div class="grow"><small>${c.acc.filter(a=>a.bank===b.id).length} conti</small></div><input type="color" data-bcol="${b.id}" value="${b.col}" aria-label="Colore" style="width:44px;height:34px;border:0;background:none"><button class="btn sm" data-bren="${b.id}">Rinomina</button><button class="btn sm" data-bdel="${b.id}">Togli</button></div>`).join(""):'<p class="empty">Nessuna banca aggiunta.</p>'}
    <div class="form" style="margin-top:8px"><label>Nome<input id="bN" maxlength="30" placeholder="es. Intesa, Poste, Revolut, Satispay"></label><label>Colore<input id="bC" type="color" value="#7a4fd1" style="height:42px"></label></div>
    <div class="btns"><button class="btn pri" id="bAdd">Aggiungi banca</button></div></div>`;}
function cBud(){const c=C(),a=monthActual(today().slice(0,7)),avg={};lastMonths(4).slice(0,3).forEach(ym=>{const x=monthActual(ym);Object.entries(x.per).forEach(([k,v])=>avg[k]=(avg[k]||0)+v/3);});
  return `<div class="card"><h3>Budget mensile per categoria</h3><p class="lbl">Lascia vuoto dove non vuoi un tetto. Accanto: speso questo mese e media degli ultimi 3 mesi.</p>
    ${KCATS.filter(k=>!["stipendio","entrate","giro","saldocarta"].includes(k[0])).map(k=>`<div class="row"><div class="grow"><b>${k[1]} ${k[2]}</b><small>questo mese ${euro(a.per[k[0]]||0)} · media ${euro(avg[k[0]]||0)}</small></div><input data-bud="${k[0]}" type="text" inputmode="decimal" value="${c.bud[k[0]]||""}" placeholder="€" style="width:110px;border:1px solid var(--line);border-radius:10px;padding:8px"></div>`).join("")}</div>
  <div class="card"><h3>Regole imparate</h3>${c.rules.length?c.rules.map((r,i)=>`<div class="row"><div class="grow">«${esc(r.k)}» → ${catName(r.cat)}</div><button class="btn sm" data-rdel="${i}">Togli</button></div>`).join(""):'<p class="empty">Quando cambi la categoria di un movimento, l’app ti chiede se usarla sempre per quel nome.</p>'}</div>`;}
function cRic(){const c=C(),t=today();
  return `<div class="card">${c.ric.length?c.ric.map(r=>{const L=ricLeft(r);return `<div class="row"><div class="grow"><b>${r.kind==="rata"?"📑 ":r.kind==="tratt"?"✂️ ":""}${esc(r.t)}</b><small>${(FREQ[r.freq]||FREQ.m)[0]} · dal ${fmt(r.d0,{day:"numeric",month:"short",year:"numeric"})}${r.fine?" · fino al "+fmt(r.fine,{day:"numeric",month:"short",year:"numeric"}):""}${L?" · restano "+L.n+" ("+euro(L.tot)+")":""}</small></div><span class="amt ${r.tipo==="e"?"e":"u"}">${r.tipo==="e"?"+":"−"}${euro(r.imp)}</span><button class="btn sm" data-cdel="ric:${r.id}">Togli</button></div>`;}).join(""):'<p class="empty">Nessuna voce ricorrente.</p>'}</div>
  <div class="card"><h3>➕ Voce ricorrente, rata o trattenuta</h3><div class="form">
    <label>Voce<input id="rT" maxlength="60" placeholder="es. stipendio, affitto, rata auto"></label><label>Importo €<input id="rI" type="text" inputmode="decimal" placeholder="0,00"></label>
    <label>Tipo<select id="rTp"><option value="u">uscita</option><option value="e">entrata</option></select></label><label>Genere<select id="rK"><option value="">ricorrente</option><option value="rata">rata / finanziamento</option><option value="tratt">trattenuta sullo stipendio</option></select></label>
    <label>Ogni<select id="rF">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></label><label>Prima data<input id="rD" type="date" value="${t}"></label><label>Ultima data (facoltativa)<input id="rE" type="date"></label>
    <label>Categoria<select id="rC">${KCATS.map(k=>`<option value="${k[0]}">${k[1]} ${k[2]}</option>`).join("")}</select></label></div>
    <div class="btns"><button class="btn pri" id="rAdd">Aggiungi</button></div><p class="lbl">Rate e trattenute con l’ultima data mostrano quante ne restano e spariscono da sole dalla proiezione quando finiscono.</p></div>`;}
function cProj(){const c=C(),R=projection(),D=R.D,neg=R.rows.find(r=>r.bal<0),S=typeof licS==="function"?licS():null;
  return `<div class="card"><h3>Impostazioni</h3><p class="lbl">La proiezione parte dal saldo di oggi di tutti i conti e somma, mese per mese, le voci ricorrenti (con le rate che finiscono), la nuova entrata dopo il congedo e una stima delle spese variabili. Gli importi sono quelli che inserisci tu.</p><div class="form">
    <label>Quale voce è lo stipendio<select id="pS"><option value="">—</option>${c.ric.filter(r=>r.tipo==="e").map(r=>`<option value="${r.id}"${r.id===D.stip?" selected":""}>${esc(r.t)} (${euro(r.imp)})</option>`).join("")}</select></label>
    <label>Smette dal<input id="pD" type="date" value="${D.dal}">${S&&S.end?`<small class="lbl">congedo nelle Licenze: ${fmt(S.end,{day:"numeric",month:"long",year:"numeric"})}</small>`:""}</label>
    <label>Nuova entrata mensile € (es. pensione)<input id="pN" type="text" inputmode="decimal" value="${D.nuovo}" placeholder="0,00"></label>
    <label>Spese variabili al mese €<input id="pV" type="text" inputmode="decimal" value="${D.var!=null&&D.var!==""?D.var:""}" placeholder="stima: ${euro(varEstimate()||0)}"></label>
    <label>Mesi<select id="pM">${[12,24,36].map(n=>`<option${n===D.mesi?" selected":""}>${n}</option>`).join("")}</select></label></div>
    <h3 style="margin-top:12px">Entrate una tantum</h3>${(D.extra||[]).map((x,i)=>`<div class="row"><div class="grow">${esc(x.t)}<small>${fmt(x.d,{day:"numeric",month:"short",year:"numeric"})}</small></div><span class="amt e">+${euro(x.imp)}</span><button class="btn sm" data-xdel="${i}">Togli</button></div>`).join("")}
    <div class="form"><label>Che cosa<input id="xT" placeholder="es. liquidazione"></label><label>Importo €<input id="xI" type="text" inputmode="decimal"></label><label>Mese previsto<input id="xD" type="date"></label></div><div class="btns"><button class="btn" id="xAdd">Aggiungi una tantum</button></div></div>
  <div class="card"><h3>Saldo previsto</h3>${lineChart(R.rows)}${neg?`<p style="color:var(--warn);font-weight:700">⚠️ Con questi numeri il saldo andrebbe sotto zero a ${MESE(neg.ym)}.</p>`:`<p class="lbl">Con questi numeri il saldo resta sopra zero per ${D.mesi} mesi.</p>`}</div>
  <div class="card"><h3>Mese per mese</h3>${R.rows.map(r=>`<div class="row"><div class="grow"><b>${MESE(r.ym)}</b>${D.dal&&r.ym===D.dal.slice(0,7)?' <span class="pill lp">congedo</span>':""}</div><span class="amt e">+${euro(r.e)}</span><span class="amt u">−${euro(r.u)}</span><span class="amt ${r.bal>=0?"":"u"}" style="min-width:110px;text-align:right">${euro(r.bal)}</span></div>`).join("")}</div>`;}

/* ---------- eventi ---------- */
const num=v=>{const n=parseAmt(v);return n==null?null:n;};
function bindConti(){const c=C();if(typeof bindStat==="function")bindStat();
  document.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{CT=b.dataset.ct;try{sessionStorage.setItem("pn-ct",CT);}catch(e){}if(cur!=="conti")go("conti");else render();});
  if($("cHide"))$("cHide").onclick=()=>{c.hide=!c.hide;save();render();};
  // movimenti
  [["fM","ym"],["fA","acc"],["fC","cat"]].forEach(([id,k])=>{if($(id))$(id).onchange=e=>{movF[k]=e.target.value;render();};});
  if($("fQ"))$("fQ").onchange=e=>{movF.q=e.target.value;render();};
  document.querySelectorAll("[data-mcat]").forEach(s=>s.onchange=()=>{const m=c.mov.find(x=>x.id===s.dataset.mcat);if(!m)return;m.cat=s.value;
    const key=normDesc(m.t).split(" ").filter(w=>w.length>3&&!/^(pagamento|acquisto|carta|bonifico|addebito|presso|visa|debit|pos|sepa)$/.test(w))[0];
    if(key&&confirm("Usare sempre «"+catName(s.value)+"» per i movimenti con «"+key+"»?")){c.rules=c.rules.filter(r=>r.k!==key);c.rules.unshift({k:key,cat:s.value});c.mov.forEach(x=>{if(x.id!==m.id&&normDesc(x.t).includes(key))x.cat=s.value;});}
    save();render();});
  document.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=()=>{if(!confirm("Togliere questo movimento?"))return;c.mov=c.mov.filter(x=>x.id!==b.dataset.mdel);save();render();});
  if($("mAdd"))$("mAdd").onclick=()=>{const t=$("mT").value.trim(),i=num($("mI").value);if(!t||!(i>0)){toast("Scrivi che cosa e importo");return;}const tp=$("mTp").value,acc=$("mA").value,d=$("mD").value||today();
    c.mov.push({id:uid(),d,t,imp:i,tipo:tp,cat:guessCat(t,tp==="e"?i:-i),acc,h:movHash(acc||"-",d,tp==="e"?i:-i,t),src:"man"});save();render();toast("Aggiunto");};
  // importazione
  if($("impAcc"))$("impAcc").onchange=e=>{const a=c.acc.find(x=>x.id===e.target.value);$("impHelp").textContent=impHelp(a);};
  if($("impFile"))$("impFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await readImportFile(f,$("impAcc").value);render();}catch(err){toast(err.message||"File non leggibile");}};
  document.querySelectorAll("[data-map]").forEach(s=>s.onchange=()=>{const k=s.dataset.map,v=+s.value;if(k==="desc0"||k==="desc1"){const d=IMP.map.desc.slice();d[k==="desc0"?0:1]=v;IMP.map.desc=d.filter(x=>x>=0);}else IMP.map[k]=v;if(k==="row")IMP.sig=(IMP.rows[v]||[]).map(low).join("|");render();});
  if($("impGo"))$("impGo").onclick=()=>{commitImport();CT="mov";movF={ym:"",acc:"",cat:"",q:""};render();};
  if($("impNo"))$("impNo").onclick=()=>{IMP=null;render();};
  // conti e carte
  const showWallet=pre=>{const t=$(pre+"T");if(!t)return;const f=()=>document.querySelectorAll("[data-wallet]").forEach(x=>{if(x.closest(".card").contains(t))x.hidden=t.value!=="wallet";});t.addEventListener("change",f);};
  showWallet("a");showWallet("e");
  const l4=v=>String(v||"").replace(/\D/g,"").slice(-4);
  if($("aAddAcc"))$("aAddAcc").onclick=()=>{const b=$("aB").value,tp=$("aT").value,bn=bankOf(b)[0],n=$("aN").value.trim()||(bn+" "+(tp==="conto"?"conto":tp==="contanti"||tp==="wallet"?"":tp==="deposito"?"deposito":"carta")).trim(),s=num($("aS").value)||0;
    c.acc.push({id:uid(),n,bank:b,tipo:tp,link:isCard(tp)?$("aL").value:"",l4:l4($("a4").value),giro:tp==="wallet"&&$("aG").checked?1:0,key:tp==="wallet"?($("aK").value.trim()||bn.toLowerCase()):"",s0:s,d0:today(),rec:$("aS").value.trim()?1:0});save();render();toast("Aggiunto");};
  document.querySelectorAll("[data-aed]").forEach(b=>b.onclick=()=>{ACC_ED=b.dataset.aed;render();const e=$("eN");if(e)e.scrollIntoView({block:"center"});});
  if($("eNo"))$("eNo").onclick=()=>{ACC_ED=null;render();};
  if($("eSave"))$("eSave").onclick=()=>{const a=c.acc.find(x=>x.id===ACC_ED);if(!a)return;const n=$("eN").value.trim();if(!n){toast("Scrivi un nome");return;}const s0=num($("eS").value);if(s0==null){toast("Saldo non valido");return;}
    const tp=$("eT").value;Object.assign(a,{n,bank:$("eB").value,tipo:tp,l4:l4($("e4").value),link:isCard(tp)?$("eL").value:"",s0,d0:$("eD").value||a.d0,giro:tp==="wallet"&&$("eG").checked?1:0,key:tp==="wallet"?($("eK").value.trim()||bankOf($("eB").value)[0].toLowerCase()):""});
    ACC_ED=null;save();render();toast("Salvato");};
  if($("eArch"))$("eArch").onclick=()=>{const a=c.acc.find(x=>x.id===ACC_ED);if(!a)return;a.arch=a.arch?0:1;ACC_ED=null;save();render();toast(a.arch?"📦 Archiviato: i movimenti restano nelle statistiche":"Ripristinato");};
  // banche tue
  if($("bAdd"))$("bAdd").onclick=()=>{const n=$("bN").value.trim();if(!n){toast("Scrivi il nome della banca");return;}if(allBanks().some(b=>b.n.toLowerCase()===n.toLowerCase())){toast("C’è già");return;}
    c.banks.push({id:"b"+uid(),n,col:$("bC").value||"#7a4fd1"});save();render();toast("Banca aggiunta: ora scegli «"+n+"» nel nuovo conto");};
  document.querySelectorAll("[data-bcol]").forEach(i=>i.onchange=()=>{const b=c.banks.find(x=>x.id===i.dataset.bcol);if(b){b.col=i.value;save();render();}});
  document.querySelectorAll("[data-bren]").forEach(x=>x.onclick=()=>{const b=c.banks.find(y=>y.id===x.dataset.bren);const v=b&&prompt("Nuovo nome per «"+b.n+"»:",b.n);if(v&&v.trim()){b.n=v.trim();save();render();}});
  document.querySelectorAll("[data-bdel]").forEach(x=>x.onclick=()=>{const id=x.dataset.bdel,n=c.acc.filter(a=>a.bank===id).length;if(n){toast("Ci sono "+n+" conti di questa banca: cambiali o toglili prima");return;}c.banks=c.banks.filter(b=>b.id!==id);delete c.bmap[id];save();render();});
  document.querySelectorAll("[data-adel]").forEach(b=>b.onclick=()=>{const n=c.mov.filter(m=>m.acc===b.dataset.adel).length;if(!confirm("Togliere questo conto"+(n?" e i suoi "+n+" movimenti":"")+"?"))return;c.acc=c.acc.filter(a=>a.id!==b.dataset.adel);c.mov=c.mov.filter(m=>m.acc!==b.dataset.adel);save();render();});

/* ================= 📊 STATISTICHE e 💡 RISPARMIO =================
   Calcoli fatti sui movimenti importati (giroconti tra i propri conti esclusi). Nessun consiglio di investimento:
   numeri e strategie generali di gestione del bilancio, le decisioni restano dell'utente. */
let SP=12; // periodo in mesi
const STOP=/^(sepa|direct|debit|addebito|sdd|fattura|fattur|a|vs|carico|da|per|mand|srl|spa|s|p|a|sa|rl|sarl|et|ci|cie|carta|pagamento|visa|presso|it|lt|torino|bonifico|istantaneo|italia|estero|beneficiario|ord|ben|di|del|della|e|il|la|in|su|the)$/;
function merchKey(t){let s=String(t||"").toLowerCase();if(s.includes(" · "))s=s.split(" · ").slice(1).join(" ");
  const w=s.replace(/[^a-zàèéìòù ]/g," ").split(/\s+/).filter(x=>x.length>2&&!STOP.test(x));return w.slice(0,2).map(x=>x[0].toUpperCase()+x.slice(1)).join(" ")||"Altro";}
function periodMonths(n){return lastMonths(n+1).slice(0,n);} // mesi completi (escluso il mese in corso)
function outMov(ms){const set=new Set(ms);return C().mov.filter(m=>m.tipo==="u"&&!isTransfer(m)&&set.has(m.d.slice(0,7)));}
function stats(n){const ms=periodMonths(n),A=ms.map(ym=>Object.assign({ym},monthActual(ym))).filter(x=>x.e||x.u);
  const k=A.length||1,E=A.reduce((s,x)=>s+x.e,0)/k,U=A.reduce((s,x)=>s+x.u,0)/k;
  const per={};A.forEach(x=>Object.entries(x.per).forEach(([c,v])=>per[c]=(per[c]||0)+v));
  const half=Math.floor(A.length/2),rec=A.slice(-Math.min(3,half)),pre=A.slice(-2*Math.min(3,half),-Math.min(3,half));
  const trend={};Object.keys(per).forEach(c=>{const r=rec.reduce((s,x)=>s+(x.per[c]||0),0)/(rec.length||1),p=pre.reduce((s,x)=>s+(x.per[c]||0),0)/(pre.length||1);trend[c]=p>0?(r-p)/p:null;});
  const mv=outMov(ms),small=mv.filter(m=>m.imp<10);
  const giro=C().mov.filter(m=>m.cat==="giro"&&m.tipo==="u"&&ms.includes(m.d.slice(0,7))).reduce((s,m)=>s+m.imp,0)/k;
  const best=A.slice().sort((a,b)=>(b.e-b.u)-(a.e-a.u));
  const merch={};mv.forEach(m=>{const key=merchKey(m.t);merch[key]=(merch[key]||0)+m.imp;});
  return{ms,A,k,E,U,per,trend,small:{n:small.length,tot:small.reduce((s,m)=>s+m.imp,0)},giro,best:best[0],worst:best[best.length-1],merch:Object.entries(merch).sort((a,b)=>b[1]-a[1]).slice(0,10)};}
/* addebiti che si ripetono quasi ogni mese con importi simili: spese fisse */
function recurring(n){const ms=periodMonths(Math.max(n,6)),g={};outMov(ms).forEach(m=>{const k=merchKey(m.t);(g[k]=g[k]||[]).push(m);});
  const out=[];Object.entries(g).forEach(([k,L])=>{const months=new Set(L.map(m=>m.d.slice(0,7)));if(months.size<Math.max(3,ms.length*.55))return;
    const perM={};L.forEach(m=>perM[m.d.slice(0,7)]=(perM[m.d.slice(0,7)]||0)+m.imp);const vals=Object.values(perM),mean=vals.reduce((a,b)=>a+b,0)/vals.length,sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
    const sorted=L.slice().sort((a,b)=>a.d<b.d?-1:1),last=sorted[sorted.length-1],lastM=perM[last.d.slice(0,7)],prevVals=Object.entries(perM).filter(([m])=>m<last.d.slice(0,7)).map(x=>x[1]),prevMed=prevVals.length?prevVals.slice().sort((a,b)=>a-b)[Math.floor(prevVals.length/2)]:lastM;
    out.push({k,cat:last.cat,mens:mean*months.size/ms.length,last:lastM,lastD:last.d,stable:sd/mean<.35,up:prevMed&&lastM>prevMed*1.1?prevMed:null,stopped:diff(last.d,today())>45,n:L.length});});
  return out.sort((a,b)=>b.mens-a.mens);}
const pct=x=>(x>0?"+":"")+Math.round(x*100)+"%";
function cStat(){const S=stats(SP),tot=Object.values(S.per).reduce((a,b)=>a+b,0)||1,sav=S.E-S.U;
  if(!S.A.length)return `<div class="card"><p class="empty">Servono movimenti importati di almeno un mese completo.</p></div>`;
  const sel=`<div class="btns" style="margin:0 0 10px">${[3,6,12,24].map(n=>`<button class="btn sm${n===SP?" pri":""}" data-sp="${n}">${n} mesi</button>`).join("")}</div>`;
  return sel+`<div class="kpi"><div><b class="amt e">${euro(S.E)}</b><span>entrate medie al mese</span></div><div><b class="amt u">${euro(S.U)}</b><span>uscite medie al mese</span></div>
    <div><b class="amt ${sav>=0?"e":"u"}">${euro(sav)}</b><span>avanzo medio al mese</span></div><div><b>${S.E?Math.round(sav/S.E*100):0}%</b><span>quota delle entrate che resta</span></div>
    <div><b class="amt">${euro(S.giro)}</b><span>spostati ogni mese verso altri tuoi conti</span></div></div>
  ${S.giro>50?`<p class="lbl">I soldi spostati verso altri tuoi conti non sono contati come spese: importa anche quei conti per vedere dove finiscono.</p>`:""}
  <h2>Mese per mese</h2><div class="card">${S.A.map(x=>`<div class="row"><div class="grow"><b>${MESE(x.ym)}</b></div><span class="amt e">+${euro(x.e)}</span><span class="amt u">−${euro(x.u)}</span><span class="amt ${x.e-x.u>=0?"e":"u"}" style="min-width:100px;text-align:right">${euro(x.e-x.u)}</span></div>`).join("")}
    <p class="lbl">Mese migliore: ${MESE(S.best.ym)} (${euro(S.best.e-S.best.u)}) · mese più pesante: ${MESE(S.worst.ym)} (${euro(S.worst.e-S.worst.u)})</p></div>
  <h2>Categorie</h2><div class="card">${Object.entries(S.per).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const tr=S.trend[c];return `<div class="row"><div class="grow"><b>${catName(c)}</b><div style="height:7px;border-radius:5px;background:var(--seg);margin-top:5px"><div style="height:7px;border-radius:5px;width:${Math.round(v/tot*100)}%;background:var(--accent)"></div></div></div><span class="lbl" style="min-width:44px;text-align:right">${Math.round(v/tot*100)}%</span><span class="amt" style="min-width:96px;text-align:right">${euro(v/S.k)}/mese</span><span class="pill ${tr==null?"":tr>.1?"warn":tr<-.1?"ok":""}" title="ultimi 3 mesi rispetto ai 3 precedenti">${tr==null?"—":pct(tr)}</span></div>`;}).join("")}
    <p class="lbl">Percentuale = quota sul totale delle uscite. Etichetta a destra: ultimi 3 mesi rispetto ai 3 precedenti.</p></div>
  <h2>Dove spendi di più</h2><div class="card">${S.merch.map(([k,v])=>`<div class="row"><div class="grow">${esc(k)}</div><span class="amt">${euro(v/S.k)}/mese</span><span class="lbl">${euro(v)} in ${S.k} mesi</span></div>`).join("")}</div>
  <div class="kpi"><div><b>${S.small.n}</b><span>spese sotto 10 € nel periodo</span></div><div><b class="amt">${euro(S.small.tot)}</b><span>totale delle spese piccole</span></div></div>`;}
function cRisp(){const S=stats(12),R=recurring(12),act=R.filter(r=>!r.stopped),fix=act.reduce((s,r)=>s+r.mens,0),varM=Math.max(0,S.U-fix);
  const debts=act.filter(r=>r.cat==="rate"||/cofidis|unicredit|findomestic|agos|compass|prestito|finanz/.test(r.k)),debtM=debts.reduce((s,r)=>s+r.mens,0);
  const cashM=(S.per.contanti||0)/S.k,sav=S.E-S.U,ef=fix*3,ef6=fix*6;
  const ideas=[];
  if(debtM)ideas.push(["📑","Rate e finanziamenti",`Pesano ${euro(debtM)} al mese (${S.E?Math.round(debtM/S.E*100):0}% delle entrate). Quando una rata finisce, sposta la stessa cifra nel risparmio con un bonifico automatico: il bilancio non cambia e il risparmio cresce da solo. Se ne hai più di una, chiudere prima quella col tasso più alto (TAEG) fa pagare meno interessi in tutto.`]);
  act.filter(r=>r.up).forEach(r=>ideas.push(["📈",r.k,`L'ultimo addebito (${euro(r.last)}) è più alto del solito (${euro(r.up)}). Vale la pena controllare se è cambiato il contratto o il premio.`]));
  if(cashM>40)ideas.push(["💵","Prelievi e ricariche",`${euro(cashM)} al mese escono come contanti o ricariche (es. Satispay): da qui non si vede come vengono spesi. Un tetto mensile in Budget aiuta a tenerli d'occhio.`]);
  const contr=act.filter(r=>["casa","auto","abbonamenti"].includes(r.cat));if(contr.length)ideas.push(["🔎","Contratti da rivedere una volta all'anno",`${contr.map(r=>esc(r.k)).join(", ")}: insieme ${euro(contr.reduce((s,r)=>s+r.mens,0))} al mese. Per luce e gas il confronto ufficiale delle offerte è il Portale Offerte di ARERA (ilportaleofferte.it); per assicurazione e telefono conviene chiedere un preventivo prima del rinnovo.`]);
  if(S.small.n>20)ideas.push(["☕","Spese piccole",`${S.small.n} spese sotto 10 € in un anno, per ${euro(S.small.tot)}: prese una per una sembrano niente, sommate fanno ${euro(S.small.tot/12)} al mese.`]);
  ideas.push(["🏦","Pagati per primi",`Il giorno in cui arriva lo stipendio, un bonifico automatico verso un conto separato mette da parte una cifra fissa prima di spendere. Con l'avanzo medio attuale (${euro(sav)} al mese) puoi partire da una parte di quella cifra.`]);
  ideas.push(["🛟","Fondo per le emergenze",`Una regola diffusa è avere da parte 3–6 mesi di spese fisse: per te tra ${euro(ef)} e ${euro(ef6)}. Saldo attuale sui conti: ${euro(totBal())}.`]);
  const cats=Object.entries(S.per).filter(([c])=>!["rate","banca","tasse","contanti"].includes(c)).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<div class="kpi"><div><b class="amt">${euro(fix)}</b><span>spese fisse al mese (addebiti che tornano ogni mese)</span></div><div><b class="amt">${euro(varM)}</b><span>spese variabili al mese</span></div><div><b class="amt ${sav>=0?"e":"u"}">${euro(sav)}</b><span>avanzo medio (ultimi 12 mesi)</span></div><div><b class="amt">${euro(sav*12)}</b><span>avanzo in un anno, a questo ritmo</span></div></div>
  ${S.giro>100?`<div class="card" style="border-color:var(--soon)"><b>⚠️ Avanzo da leggere con attenzione</b><p style="margin:4px 0 0">Ogni mese in media ${euro(S.giro)} vanno verso altri tuoi conti (giroconti) e qui non sono contati come spese. Se su quei conti vengono spesi, l'avanzo reale è più basso: importa anche quei conti (es. N26) per avere il quadro completo.</p></div>`:""}
  <h2>Spese fisse trovate</h2><div class="card">${R.length?R.map(r=>`<div class="row"><div class="grow"><b>${esc(r.k)}</b><small>${catName(r.cat)} · ultimo ${fmt(r.lastD,{day:"numeric",month:"short",year:"numeric"})}${r.stopped?" · <b>sembra terminato</b>":""}${r.up?' · <b style="color:var(--warn)">aumentato</b>':""}</small></div><span class="amt u">${euro(r.mens)}/mese</span><span class="lbl">${euro(r.mens*12)}/anno</span></div>`).join(""):'<p class="empty">Servono almeno 3 mesi di movimenti.</p>'}</div>
  <h2>💡 Dove si può risparmiare</h2>${ideas.map(([i,t,x])=>`<div class="card"><h3>${i} ${esc(t)}</h3><p style="margin:0">${x}</p></div>`).join("")}
  <h2>🎚️ Prova a ridurre</h2><div class="card"><p class="lbl">Sposta i cursori: vedi quanto risparmieresti al mese e in un anno, e in quanto tempo arrivi a un obiettivo.</p>
    ${cats.map(([c,v])=>`<div class="row"><div class="grow"><b>${catName(c)}</b><small>${euro(v/S.k)} al mese</small></div><input type="range" min="0" max="50" step="5" value="0" data-cut="${c}" data-v="${(v/S.k).toFixed(2)}" style="width:160px"><span class="lbl" data-cutl="${c}" style="min-width:44px">0%</span></div>`).join("")}

  <p class="lbl">Sono calcoli sui tuoi movimenti, non consigli finanziari: per scelte su prestiti, investimenti o pensione conviene sentire la banca o un consulente.</p>`;}

/* ---------- 📆 CALENDARIO: il punto da cui si parte ----------
   Vista Giorno · Settimana · Mese · Anno · Scadenze. Mostra insieme Licenze e presenze, Scadenze, Pratiche,
   Famiglia, eventi del Calendario dell'iPad, Benessere e Tai Chi, «Il mio mondo» (e i pagamenti, se Conti è visibile).
   Ogni modifica fatta su un giorno scrive nella sezione di origine (Licenze, Scadenze, Famiglia, Benessere, Tai Chi),
   così tutta l'app resta allineata. Il collegamento con il Calendario dell'iPad si imposta in ⚙️ Impostazioni. */
const CV=[["giorno","Giorno"],["sett","Settimana"],["mese","Mese"],["anno","Anno"],["scad","Scadenze"]];

const CODES=[["P","🏢","In ufficio"],["LP","🏖️","Licenza anni prec."],["LO","🏖️","Licenza anno in corso"],["RL","🔁","Recupero festivo"],["AL","📝","Altra assenza"]];

/* ---- scrittura nelle Licenze (stessa memoria della sezione Licenze: browser + database del dispositivo) ---- */
function licWrite(fn){const s=lsJ(LKEY);if(!s)return false;s.days=s.days||{};fn(s);s.savedAt=new Date().toISOString();const t=JSON.stringify(s);
  try{localStorage.setItem(LKEY,t);}catch(e){return false;}kv("readwrite","stato",t).catch(()=>{});return true;}
function licEditable(S,s){const st=S.start||today();return s>=st&&s<=S.end&&kind(s)==="LAV"&&s!==S.end;}
function licSetCode(s,c){return licWrite(S=>{const d=S.days[s]||{},from=d.c||"P";if(from===c)return;if(c==="P")delete d.c;else d.c=c;
  if(Object.keys(d).length)S.days[s]=d;else delete S.days[s];S.log=(S.log||[]);S.log.push({t:new Date().toISOString(),s,from,to:c});if(S.log.length>60)S.log=S.log.slice(-60);});}
function licSetField(s,k,v){return licWrite(S=>{const d=S.days[s]||{};if(v)d[k]=v;else delete d[k];if(Object.keys(d).length)S.days[s]=d;else delete S.days[s];});}
function licOver(S){ // giorni di licenza oltre i saldi (stesso ordine di consumo della sezione Licenze)
  const st=S.start||today(),b=Object.assign({},S.bal);let over=0;
  for(let s=st;s<=S.end;s=add(s,1)){if(kind(s)!=="LAV")continue;const c=(S.days[s]&&S.days[s].c)||"P",y27=s>="2027-01-01";
    if(c==="LP"){if(b.lo25>0)b.lo25--;else if(y27&&b.lo26>0)b.lo26--;else over++;}
    else if(c==="LO"){if(!y27){if(b.lo26>0)b.lo26--;else over++;}else if(b.lo27>0)b.lo27--;else over++;}
    else if(c==="RL"){if(b.rl26>0)b.rl26--;else if(y27&&b.rl27>0)b.rl27--;else over++;}}
  return over;}

function valeCal(){const p=lsJ("prog-mm-v1"),inb=lsJ(VIN),d=p?((p.state&&p.state.data)||p.data||{}):{};
  const days=new Set([].concat(Array.isArray(d.days)?d.days:[],inb&&Array.isArray(inb.days)?inb.days:[]).map(x=>{const m=String(x).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0"):String(x);}));
  return{days,diary:d.diary&&typeof d.diary==="object"?d.diary:{}};}
const VMOOD={felice:["😄","felice"],serena:["😊","serena"],orgogliosa:["🤩","orgogliosa"],carica:["💪","carica"],cosi:["😐","così così"],stanca:["😴","stanca"],triste:["😢","triste"],arrabbiata:["😠","arrabbiata"],preoccupata:["😟","preoccupata"]};

function scadOn(s){const out=[];scadOpen().forEach(x=>{let d=x.d,g=0;while(d&&d<s&&g++<400){d=nextDate(d,x.ric);}if(d===s)out.push({x,proj:d!==x.d});});return out;}
function tcOn(s){return tcSessions().filter(x=>x.d===s);}
function dayData(s,V){
  const S=licS(),L=S?licDay(S,s):{k:kind(s),c:null,t:""},it=[];
  if(S&&S.ev&&S.ev[s])it.push({ic:"📅",t:S.ev[s],c:"lic",k:"licev"});
  if(S&&s===S.end)it.push({ic:"🎉",t:"Congedo",c:"lic",k:"congedo"});
  if(HOL[s])it.push({ic:"🇮🇹",t:HOL[s],c:"hol",k:"hol"});
  scadOn(s).forEach(o=>it.push({ic:(CAT[o.x.cat]||CAT.altro)[0],t:o.x.t,c:o.proj?"scad proj":scadState(o.x)==="warn"?"scad warn":"scad",k:"scad",id:o.x.id,proj:o.proj,sub:RIC[o.x.ric]&&o.x.ric!=="no"?RIC[o.x.ric]:""}));
  if(CONTI_ON)try{C().ric.forEach(r=>{if(ricDates(r,s,s).length)it.push({ic:r.tipo==="e"?"💰":"💶",t:r.t,amt:(r.tipo==="e"?"+":"−")+euro(r.imp),c:"pay"+(r.tipo==="e"?" in":""),k:"pay",id:r.id});});}catch(e){}
  famOn(s).forEach(a=>it.push({ic:"👨‍👧",t:(a.chi?a.chi+": ":"")+a.t,o:a.o||"",f:a.f||"",c:"fam",k:a.tipo==="att"?"att":"fev",id:a.id,sub:[a.tipo==="att"?(+a.ogni===2?"ogni 2 settimane":"ogni settimana"):"",a.acc?"🚗 "+a.acc:""].filter(Boolean).join(" · ")}));
  if(typeof pensOn==="function")pensOn(s).forEach(a=>it.push({ic:"🎖️",t:a.t,c:"pens",k:"pens",id:a.id}));
  if(typeof cassaOn==="function")cassaOn(s).forEach(x=>it.push(x));
  if(PRAT_ON&&typeof pratOn==="function")pratOn(s).forEach(x=>it.push({ic:"🗂️",t:x.passo.t,c:"prat",k:"prat",id:x.id,sub:x.t}));
  calOn(s).forEach(e=>it.push({ic:calIc(e),t:e.t,o:e.o||"",f:e.f||"",c:"ipad",k:"ipad",sub:[e.cal,e.loc].filter(Boolean).join(" · ")}));
  const dn=(P.dn||{})[s];
  it.sort((a,b)=>(a.o||"99")<(b.o||"99")?-1:(a.o||"99")>(b.o||"99")?1:0);
  const V2=V||valeCal(),vd=V2.diary[s];
  const mg=((P.met&&P.met.g)||{})[s];
  return{S,L,it,dn,met:mg&&mg.s?mg:null,ben:benDay(s),tc:tcOn(s),vstudy:V2.days.has(s),vmood:vd&&typeof vd==="object"&&VMOOD[vd.m]?vd:null};
}
const offDay=L=>L&&(L.k!=="LAV"||(L.c&&L.c!=="P"&&L.c!=="OUT"));

/* ---- vista principale ---- */
function calTitle(){const d=parse(calD);
  if(calV==="giorno")return cap(fmt(calD,{weekday:"long",day:"numeric",month:"long",year:"numeric"}));
  if(calV==="sett"){const m=monday(calD),e=add(m,6);return parse(m).getDate()+(m.slice(5,7)!==e.slice(5,7)?" "+MESI_L[+m.slice(5,7)-1]:"")+" – "+parse(e).getDate()+" "+MESI_L[+e.slice(5,7)-1]+" "+e.slice(0,4);}
  if(calV==="mese")return cap(MESI_L[d.getMonth()])+" "+d.getFullYear();
  if(calV==="scad")return "Scadenze";
  return String(d.getFullYear());}
function calStep(n){const d=parse(calD);
  if(calV==="giorno")calD=add(calD,n);else if(calV==="sett")calD=add(calD,7*n);
  else if(calV==="mese"){d.setDate(1);d.setMonth(d.getMonth()+n);calD=iso(d);}else{d.setFullYear(d.getFullYear()+n);calD=iso(d);}
}
function vCal(){
  if(calFixed)return calFixedView();
  const late=lateN(),sc=calV==="scad";
  let o=`<div class="cal-head"><h1>${sc?"📌":"📆"} ${esc(calTitle())}</h1>
    <div class="cal-ctl"><div class="seg" role="tablist">${CV.map(([k,n])=>`<button role="tab" data-cv="${k}" class="${calV===k?"on":""}" aria-selected="${calV===k}">${n}${k==="scad"&&late?`<span class="n">${late}</span>`:""}</button>`).join("")}</div>
    ${sc?"":`<div class="cal-nav"><button class="btn sm" data-ca="prev" aria-label="Precedente">‹</button><button class="btn sm" data-ca="today">Oggi</button><button class="btn sm" data-ca="next" aria-label="Successivo">›</button></div>`}</div></div>`;
  if(P.cal.wait)o+=`<div class="btns" style="margin:0 0 10px"><button class="btn pri" data-ca="paste">📥 Tocca qui per inserire gli eventi del Calendario</button></div>`;
  o+=icsNag();
  if(!(calV==="giorno"&&calD===today()))o+=ghWarn(); // chiave GitHub scaduta o in scadenza: si vede in ogni vista
  o+=sc?vScad():calV==="giorno"?calDayView(calD):calV==="sett"?calWeekView():calV==="anno"?calYearView():calMonthView();
  if(!sc)o+=`<div class="cal-foot"><button class="btn sm" data-ca="run">🔄 Aggiorna dal Calendario dell’iPad</button><button class="btn sm" data-ca="paste">📥 Incolla dagli appunti</button><button class="btn sm" data-ca="fixed">👨‍👧 Attività fisse</button><button class="btn sm" data-go="set">ℹ️ Come si collega</button>
    ${P.cal.at?`<p class="lbl">Eventi dell’iPad aggiornati ${rel(P.cal.at.slice(0,10))} alle ${new Date(P.cal.at).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</p>`:""}</div>`;
  return o;
}
function cellChips(D,max){const it=D.it.filter(x=>x.k!=="hol"),n=it.length,sh=it.slice(0,max);
  return sh.map(x=>`<span class="cc ${x.c}" title="${esc((x.o?x.o+" ":"")+x.t)}">${x.ic} ${esc(x.k==="att"||x.k==="fev"?x.t.replace(/^[^:]{1,20}:\s*/,""):x.t)}</span>`).join("")+(n>max?`<span class="cc more">+${n-max}</span>`:"")+`<span class="md">${it.slice(0,5).map(x=>`<i class="${x.c.split(" ")[0]}"></i>`).join("")}</span>`;}
function cellIcons(D){return (D.vmood?VMOOD[D.vmood.m][0]:"")+(D.tc.length?"🧘":"")+(D.met&&D.met.ok?"🤝":"")+(D.ben.umore?UMORE[D.ben.umore-1]:"")+(D.dn?"📝":"");}
function calMonthView(){
  const d=parse(calD),y=d.getFullYear(),m=d.getMonth(),first=iso(new Date(y,m,1)),last=iso(new Date(y,m+1,0)),t=today(),V=valeCal();
  let s=monday(first),cells="";
  while(s<=last||((parse(s).getDay()+6)%7)!==0){
    const D=dayData(s,V),inM=s.slice(0,7)===first.slice(0,7),lab=D.L&&D.S?(D.L.c==="P"?"":D.L.c&&D.L.c!=="OUT"?D.L.c:""):"";
    cells+=`<button class="mc${inM?"":" out"}${s===t?" today":""}${s===calSel?" sel":""}${offDay(D.L)?(D.L.k==="LAV"?" lic":" we"):""}${HOL[s]?" hol":""}" data-cd="${s}" aria-label="${esc(fmt(s,{weekday:"long",day:"numeric",month:"long"}))}">
      <span class="mn"><b>${parse(s).getDate()}</b>${lab?`<em class="code">${lab}</em>`:""}${HOL[s]?`<em class="holn">${esc(HOL[s])}</em>`:""}</span>${cellChips(D,3)}<span class="mi">${cellIcons(D)}${D.vstudy?"<i class='vs' title='Ha studiato'>📊</i>":""}</span></button>`;
    s=add(s,1);}
  return `<div class="cal-mo"><div><div class="mgrid">${GIORNI.map(g=>`<div class="mh">${g.slice(0,3)}</div>`).join("")}${cells}</div>
    <p class="lbl cal-leg"><span class="lg lic"></span> licenza / a casa · <span class="lg we"></span> fine settimana e festivi · 📊 Il mio mondo · 🧘 Tai Chi · 🤝 missione del Metodo · 📝 nota</p></div>
    <div class="cal-side">${dayEditor(calSel,true)}</div></div>`;
}
function calWeekView(){const m=monday(calD),t=today(),V=valeCal();
  return `<div class="week cal-wk">${[...Array(7)].map((_,i)=>{const s=add(m,i),D=dayData(s,V);
    return `<button class="day${s===t?" today":""}${offDay(D.L)&&D.S?" together":""}" data-cday="${s}"><b class="dn">${fmt(s,{weekday:"long",day:"numeric"})}</b>
      ${D.S?`<span class="ev ${D.L.c==="P"?"job":"off"}">${D.L.c==="P"?"🏢 "+esc(D.L.i||"")+"–"+esc(D.L.o||""):"🏡 "+esc(D.L.t)}</span>`:HOL[s]?`<span class="ev off">🇮🇹 ${esc(HOL[s])}</span>`:""}
      ${D.it.filter(x=>x.k!=="hol").map(x=>`<span class="cc ${x.c}">${x.ic} ${esc(x.o?x.o+" ":"")}${esc(x.t)}${x.amt?" "+x.amt:""}</span>`).join("")}
      <span class="mi">${cellIcons(D)}${D.vstudy?"📊":""}</span></button>`;}).join("")}</div>`;}
function calYearView(){const y=parse(calD).getFullYear(),t=today(),S=licS();
  let o=`<div class="ygrid">`;
  for(let m=0;m<12;m++){const first=iso(new Date(y,m,1)),last=iso(new Date(y,m+1,0));let s=first,cells='<i class="x"></i>'.repeat((parse(first).getDay()+6)%7),nl=0;
    while(s<=last){const L=S?licDay(S,s):{k:kind(s)},hasS=scadOn(s).length,cls=(L.c&&L.c!=="P"&&L.c!=="OUT"&&L.k==="LAV")?"lic":L.k!=="LAV"?"we":"";if(cls==="lic")nl++;
      cells+=`<button class="${cls}${s===t?" today":""}${S&&s===S.end?" end":""}" data-cday="${s}" title="${esc(fmt(s,{weekday:"long",day:"numeric",month:"long"}))}">${parse(s).getDate()}${hasS?"<u></u>":""}</button>`;s=add(s,1);}
    o+=`<div class="ym"><button class="ymt" data-cmon="${first}">${cap(MESI_L[m])}${nl?` <small>${nl} gg a casa</small>`:""}</button><div class="ymg">${["L","M","M","G","V","S","D"].map(g=>`<i class="h">${g}</i>`).join("")}${cells}</div></div>`;}
  return o+`</div><p class="lbl cal-leg"><span class="lg lic"></span> licenza / a casa · <span class="lg we"></span> fine settimana e festivi · <u class="lgu"></u> scadenza · ⭐ congedo. Tocca un mese o un giorno.</p>`;}

  // lavoro
  if(S){const L=D.L,ed=licEditable(S,s);
    o+=`<div class="row"><span class="pill ${L.c==="P"?"":"lp"}">${L.c==="P"?"🏢":L.c==="OUT"?"—":L.k!=="LAV"?"🏡":"🏖️"}</span><div class="grow"><b>${esc(L.c==="P"?"In ufficio":cap(L.t||""))}</b>${L.c==="P"?`<small>${esc(L.i||"")}–${esc(L.o||"")}${(S.days[s]||{}).n?" · "+esc(S.days[s].n):""}</small>`:(S.days[s]||{}).n?`<small>${esc(S.days[s].n)}</small>`:""}</div>${ed?`<button class="btn sm" data-ca="lav">${calOpenLav?"Chiudi":"Cambia"}</button>`:""}</div>`;

  const it=D.it;

  if(D.dn)o+=`<div class="row"><span class="pill">📝</span><div class="grow">${esc(D.dn)}</div><button class="btn sm" data-ca="add:nota">Modifica</button></div>`;
  // aggiungi
  o+=`<div class="addbar">${[["scad","📌 Scadenza"]].concat(CONTI_ON?[["pay","💶 Pagamento"]]:[],[["fam","👨‍👧 Impegno"],["nota","📝 Nota"]]).map(([k,n])=>`<button class="btn sm${calAdd===k?" pri":""}" data-ca="add:${k}">${n}</button>`).join("")}</div>`;
  if(calAdd==="scad")o+=`<div class="form addf"><label class="wide">Che cosa<input id="caT" maxlength="120" placeholder="es. revisione auto, rinnovo documento"></label><label>Categoria<select id="caC">${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join("")}</select></label><label>Si ripete<select id="caR">${Object.entries(RIC).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label><label>Avvisami<select id="caA">${[[0,"il giorno stesso"],[1,"1 giorno prima"],[3,"3 giorni prima"],[7,"1 settimana prima"],[14,"2 settimane prima"],[30,"1 mese prima"]].map(([k,v])=>`<option value="${k}"${k===7?" selected":""}>${v}</option>`).join("")}</select></label><div class="btns wide"><button class="btn pri" data-ca="save:scad">Aggiungi la scadenza</button></div></div>`;

      <label>Fino al (se si ripete)<input id="caFi" type="date" value="${esc(E&&E.fino||"")}"></label><label>Chi accompagna<input id="caAc" maxlength="40" value="${esc(E&&E.acc||"")}" placeholder="facoltativo"></label>

  if(calAdd==="nota")o+=`<div class="form addf"><label class="wide">Nota del giorno<textarea id="caN" rows="2" maxlength="300">${esc(D.dn||"")}</textarea></label><div class="btns wide"><button class="btn pri" data-ca="save:nota">Salva la nota</button>${D.dn?'<button class="btn danger" data-ca="save:notadel">Togli</button>':""}</div></div>`;

      <details class="benx"><summary>Sonno, passi, energia${D.ben.sonno?" · "+String(D.ben.sonno).replace(".",",")+" h":""}</summary><div class="form">

        <label>Energia (1–5)<select data-bf="energia"><option value="">—</option>${[1,2,3,4,5].map(n=>`<option${+D.ben.energia===n?" selected":""}>${n}</option>`).join("")}</select></label>
        <label class="wide">Nota su come stai<input data-bf="note" maxlength="200" value="${esc(D.ben.note||"")}" placeholder="facoltativa"></label></div></details></div></div>`;}

  if(s<=t){const g=D.met;
    if(g)o+=`<div class="row"><span class="pill cc met">🤝</span><div class="grow"><b>${g.ok?"✓ ":""}Missione: ${esc(g.txt||"")}</b><small>${g.ok?"compiuta":"da fare"}</small></div><a class="lnk" href="metodo.html#oggi">Metodo ›</a></div>`;

/* ---- azioni ---- */
function bindCal(){
  const R=()=>render();
  if(calFixed)bindFixed();
  document.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{setCalV(b.dataset.cv);if(calV==="giorno")calD=calSel;R();});

/* ---- 💶 Cassa: da oggi a due anni dopo la decorrenza, aggiornata passo passo ----

   incassi della scheda nel loro mese (senza doppioni con il Cedolino). Movimenti miei in P.pens.mov (una volta o ricorrenti, anche nel Calendario).
   P.pens.cassa: ini {d,imp} punto di partenza, saldi {ym: saldo reale a fine mese}, spunte {chiave: {ok, imp}}, sposta {chiave: ym}, rit, pens. */
/* le date vengono dai dati sull'iPad (scheda e impostazioni), mai dal codice pubblico */
const decYM=()=>((((typeof PENS==="function"?PENS().dati:null)||{}).decor)||"").slice(0,7)||ymAdd(today().slice(0,7),1);

const CS_FREQ={una:["una volta",0],m:["ogni mese",1],"2m":["ogni 2 mesi",2],"3m":["ogni 3 mesi",3],"6m":["ogni 6 mesi",6],a:["ogni anno",12]};

const ymAdd=(ym,n)=>{let[y,m]=ym.split("-").map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+String(m).padStart(2,"0");};
const ymDays=ym=>{const[y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate();};
const dayIn=(ym,d)=>ym+"-"+String(Math.max(1,Math.min(+d||1,ymDays(ym)))).padStart(2,"0");
const ymLab=(ym,long)=>parse(ym+"-01").toLocaleDateString("it-IT",long?{month:"long",year:"numeric"}:{month:"short",year:"2-digit"});
const has=v=>v!=null&&v!=="";
function movDates(x,from,to){if(!x||!x.da)return[];const st=CS_FREQ[x.freq]?CS_FREQ[x.freq][1]:0,end=x.a&&x.a<to?x.a:to,out=[];
  if(!st)return x.da>=from&&x.da<=end?[x.da]:[];
  for(let ym=x.da.slice(0,7),i=0;i<600;i++,ym=ymAdd(ym,st)){const d=dayIn(ym,x.da.slice(8,10));if(d>end)break;if(d>=from)out.push(d);}return out;}

/* ---------- 🔄 Scheda che si aggiorna da sola ----------
   File pubblico «scheda-pensione.cifrata.json» (AES-256-GCM). La chiave (32 byte, base64url) sta solo su questo iPad
   in «pn-scheda-chiave», fuori dalle copie: senza chiave il file è illeggibile. Arriva con il collegamento …/licenze/#sk=<chiave>
   (la parte dopo # non lascia mai l'iPad) o incollata a mano. Lo aggiornano Claude e l'attività delle 13 · 17 · 23
   (strumenti/scheda_cifrata.py); qui si unisce con pensMerge: spunte, note, importi reali, esito e documenti restano. */
const SK_KEY="pn-scheda-chiave",SK_META="pn-scheda-meta",SK_AAD="pianificazione-scheda-v1";let skBusy=false;
const skKey=()=>{try{return localStorage.getItem(SK_KEY)||"";}catch(e){return "";}};
const skMeta=()=>lsJ(SK_META)||{};
const skSetMeta=m=>{try{localStorage.setItem(SK_META,JSON.stringify(Object.assign(skMeta(),m)));}catch(e){}};
function b64u(s){s=String(s).replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function skValid(k){try{return /^[A-Za-z0-9_-]{43}$/.test(k)&&b64u(k).length===32;}catch(e){return false;}}
function skFromHash(k){try{k=decodeURIComponent(k||"").trim();}catch(e){k="";}
  if(!skValid(k)){setTimeout(()=>toast("Il collegamento della scheda non è valido"),700);return;}
  try{localStorage.setItem(SK_KEY,k);localStorage.removeItem(SK_META);}catch(e){}pensV="doc";try{sessionStorage.setItem("pn-pensv","doc");}catch(e){}
  setTimeout(()=>schedaFetch(true),400);}
async function skOpen(o,k){const key=await crypto.subtle.importKey("raw",b64u(k),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(o.iv),additionalData:new TextEncoder().encode(SK_AAD)},key,b64u(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));}
async function schedaFetch(force){const k=skKey();if(!k||skBusy||navigator.onLine===false)return;const M=skMeta();
  if(!force&&M.checked&&Date.now()-new Date(M.checked).getTime()<30*60e3)return;
  skBusy=true;let err="";

    if(!o||o.app!=="pianificazione-scheda-cifrata"||!o.iv||!o.ct){err="file";throw 0;}
    const mine=P.pens&&+P.pens.rev||0;
    if(o.rev>mine){let s;try{s=await skOpen(o,k);}catch(e){err="chiave";throw e;}
      if(!s||s.app!=="pianificazione-pensione"||!s.pens||s.v!==o.rev){err="file";throw 0;}
      pensMerge(s.pens);P.pens.rev=o.rev;P.pens.revAt=o.updated;save();

    skSetMeta({checked:new Date().toISOString(),pub:o.rev,err:""});}
  catch(e){skSetMeta({checked:new Date().toISOString(),err:err||"rete"});if(force)toast(err==="chiave"?"La chiave non apre la scheda":err==="file"?"Il file della scheda non è valido":"Scheda non raggiungibile ora");}
  finally{skBusy=false;if(cur==="pens"||cur==="cal")softRender();}}
