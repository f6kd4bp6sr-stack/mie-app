"🌅","n":"Un anno dopo","d":["Rileggi la tua lettera: che cosa si è avverato?","Chi sei adesso, in poche parole?","Che cosa vuoi per il secondo anno?"]}],"insieme":[{"id":"giornata","t":"Una giornata tipo che vorremmo, dal mattino alla sera"},{"id":"casa","t":"Che cosa cambia in casa: orari, spazi, faccende"},{"id":"spazi","t":"Il tempo per ciascuno e il tempo per noi"},{"id":"progetto","t":"Un progetto da fare insieme quest'anno"},{"id":"pensieri","t":"Che cosa ci preoccupa, detto con calma"},{"id":"festa","t":"Come festeggiare l'ultimo giorno di servizio"},{"id":"amici","t":"Le persone da vedere più spesso"},{"id":"viaggio","t":"Un viaggio o una gita da regalarci"}],"lettera":"Scrivi una lettera al te stesso che ha appena lasciato il servizio: che cosa speri, che cosa ti raccomandi, che cosa non vuoi dimenticare.","termometro":[["😟","Fatica"],["😕","Così così"],["😐","Né bene né male"],["🙂","Bene"],["😄","Molto bene"]],"gentile":"Da qualche settimana il termometro segna basso. Capita, in un passaggio così. Parlarne con qualcuno di fiducia può aiutare: una persona cara, un amico, il medico di famiglia."};
/* ---------- 📓 DIARIO DEL PASSAGGIO: dal servizio alla pensione, una domanda alla settimana ----------
   Tre fasi (verso l'uscita · il salto · il primo anno) calcolate dalla data dell'ultimo giorno di servizio:
   la prende dalla Pensione (scheda) o dalle Licenze (congedo), oppure la scrivi qui. Nel codice non ci sono date.
   Parti: 📝 Settimana (domanda, 🌡️ termometro, «un mese fa»), 🌱 Dall'idea all'abitudine, 🧪 Giornate di prova (giorni di licenza),
   👫 Il futuro insieme, ⏳ Tappe e lettera, 🔁 Rileggi.
   Dati SOLO su questo iPad: localStorage «pn-diario-v1» + copia nel database del dispositivo (voce «diario»).
   Vanno nella ☁️ copia automatica cifrata; NON nella copia su File/iCloud (che non è cifrata). Domande: sezioni/diario_domande.json */
const DIA_KEY="pn-diario-v1";
const DIA_DEF={v:1,cess:"",sett:{},idee:[],prove:[],insieme:{},tappe:{},lettera:{t:"",sig:null,open:null}};
const DIA_V=[["sett","📝 Settimana"],["idee","🌱 Idee"],["prove","🧪 Prove"],["insieme","👫 Insieme"],["tappe","⏳ Tappe e lettera"],["rileggi","🔁 Rileggi"]];
const DIA_TEMI=Object.keys(DIA_D.temi);
function diaNorm(o){const d=JSON.parse(JSON.stringify(DIA_DEF));if(o&&typeof o==="object"){Object.assign(d,o);
  ["sett","insieme","tappe"].forEach(k=>{if(!d[k]||typeof d[k]!=="object"||Array.isArray(d[k]))d[k]={};});
  ["idee","prove"].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});d.lettera=Object.assign({t:"",sig:null,open:null},o.lettera||{});}return d;}
let DIA=diaNorm(lsJ(DIA_KEY)),diaV="sett",diaIdeaPasso=null,diaProva=null,diaTema="",diaChangeOk=false;
let diaT=null;
function diaSave(msg){DIA.savedAt=new Date().toISOString();const j=JSON.stringify(DIA);try{localStorage.setItem(DIA_KEY,j);}catch(e){}
  clearTimeout(diaT);diaT=setTimeout(()=>{kv("readwrite","diario",j).catch(()=>{});},400);if(msg)toast(msg);}
(async function diaRecover(){if(lsJ(DIA_KEY))return;try{const t=await kv("readonly","diario");if(t){DIA=diaNorm(JSON.parse(t));localStorage.setItem(DIA_KEY,t);if(cur==="dia")render();}}catch(e){}})();
window.addEventListener("storage",e=>{if(e.key===DIA_KEY){DIA=diaNorm(lsJ(DIA_KEY));if(cur==="dia")softRender();}});

/* ---- date e fasi ---- */
function diaCessAuto(){try{return typeof cessAt==="function"?cessAt():"";}catch(e){return "";}}
function diaCess(){return DIA.cess||diaCessAuto()||"";}
function diaFase(t){const c=diaCess();if(!c)return "verso";const n=diff(c,t);return n< -30?"verso":n<=30?"salto":"anno";}
const diaWk=t=>monday(t||today());
const diaQ=id=>DIA_D.domande.find(q=>q.id===id);
const diaTemaOf=wk=>DIA_TEMI[((Math.floor(diff("2026-01-05",wk)/7)%DIA_TEMI.length)+DIA_TEMI.length)%DIA_TEMI.length];
function diaPick(tema,f,wk,skip){const used=new Set(Object.values(DIA.sett).map(x=>x&&x.q).filter(Boolean));
  const pool=DIA_D.domande.filter(q=>q.tema===tema&&q.fase===f&&q.id!==skip);let fresh=pool.filter(q=>!used.has(q.id));
  if(!fresh.length)fresh=pool.length?pool:DIA_D.domande.filter(q=>q.fase===f&&q.id!==skip);
  let h=7;for(const ch of wk)h=(h*31+ch.charCodeAt(0))|0;return fresh[Math.abs(h)%fresh.length];}
/* la domanda di una settimana si fissa la prima volta che si guarda, così resta la stessa per tutta la settimana */
function diaWeekQ(wk){const w=DIA.sett[wk];if(w&&w.q&&diaQ(w.q))return diaQ(w.q);const q=diaPick(diaTemaOf(wk),diaFase(wk),wk);
  if(q&&wk<=diaWk()){DIA.sett[wk]=Object.assign({},w||{},{q:q.id});diaSave();}return q;}
const diaDone=wk=>{const w=DIA.sett[wk];return !!(w&&w.t&&w.t.trim());};
const diaWords=s=>(String(s||"").trim().match(/\S+/g)||[]).length;
function diaTappe(){const c=diaCess();return c?DIA_D.tappe.map(x=>Object.assign({},x,{dt:add(c,x.giorni)})):[];}
function diaLeaveDays(from,days){const S=licS();if(!S||typeof licDay!=="function")return[];const out=[];
  for(let s=from,i=0;i<days;i++,s=add(s,1)){if(S.end&&s>S.end)break;const d=licDay(S,s);if(d.k==="LAV"&&d.c&&d.c!=="P")out.push(s);}return out;}
const diaFmtL=s=>fmt(s,{weekday:"long",day:"numeric",month:"long",year:"numeric"});

/* ---- vista ---- */
function vDia(){const t=today(),f=diaFase(t),F=DIA_D.fasi[f],c=diaCess();
  let o=`<h1>📓 Diario del passaggio</h1><p class="sub">Dal servizio alla pensione: una domanda alla settimana, le idee che diventano abitudini, le giornate di prova. Qui scrivi solo per te.</p>`;
  o+=`<div class="dia-fasi">${Object.keys(DIA_D.fasi).map(k=>`<span class="pill${k===f?" dia-on":""}">${DIA_D.fasi[k][0]} ${esc(DIA_D.fasi[k][1])}</span>`).join("")}<span class="lbl">${c?`Ultimo giorno di servizio: <b>${fmt(c,{day:"numeric",month:"long",year:"numeric"})}</b> · ${rel(c)}`:"Scrivi in fondo la data dell'ultimo giorno di servizio"}</span></div>`;
  o+=`<div class="seg" role="tablist" style="margin:12px 0 14px;width:max-content;max-width:100%">${DIA_V.map(([k,n])=>`<button role="tab" data-dv="${k}" class="${diaV===k?"on":""}" aria-selected="${diaV===k}">${n}</button>`).join("")}</div>`;
  o+=({sett:diaSett,idee:diaIdee,prove:diaProve,insieme:diaInsieme,tappe:diaTappeV,rileggi:diaRileggi}[diaV]||diaSett)();
  o+=diaFoot();
  return o;}

function diaSett(){const t=today(),wk=diaWk(t),q=diaWeekQ(wk),w=DIA.sett[wk]||{},T=DIA_D.temi[q.tema],dom=add(wk,6);
  let o=`<div class="card k-dia nofold dia-q"><div class="lbl">${T[0]} ${esc(T[1])} · settimana dal ${fmt(wk,{day:"numeric",month:"short"})} al ${fmt(dom,{day:"numeric",month:"short"})}</div>
    <p class="dia-qt">${esc(q.t)}</p>
    <textarea id="diaTxt" rows="6" placeholder="Scrivi come viene, anche poche righe. Puoi dettare con il microfono della tastiera.">${esc(w.t||"")}</textarea>
    <div class="dia-bar"><button class="btn pri" id="diaSave">Salva</button>${!diaDone(wk)?`<button class="btn sm" id="diaAltra">Un'altra domanda</button>`:""}<span class="lbl" id="diaInfo">${w.at?"Salvata "+rel(w.at.slice(0,10)):""}</span></div></div>`;
  /* termometro */
  o+=`<div class="card k-dia"><h3>🌡️ Come sto con il passaggio <span class="lbl">facoltativo</span></h3><div class="dia-temp">${DIA_D.termometro.map(([e,n],i)=>`<button class="${w.temp===i+1?"on":""}" data-temp="${i+1}" aria-label="${esc(n)}"><span>${e}</span><small>${esc(n)}</small></button>`).join("")}</div>${diaTempChart()}${diaGentle()}<p class="lbl" style="margin:6px 0 0">Non è un test e non dà voti: serve solo a vedere l'andamento nel tempo.</p></div>`;
  /* rileggere */
  const m1=diaWk(add(t,-28)),y1=diaWk(add(t,-364)),old=[[y1,"Un anno fa"],[m1,"Un mese fa"]].filter(([k])=>diaDone(k));
  if(old.length)o+=`<div class="card k-dia"><h3>🔁 Rileggi</h3>${old.map(([k,n])=>{const x=DIA.sett[k],qq=diaQ(x.q);return `<div class="row dia-old"><div class="grow"><b>${n} scrivevi</b><small>${qq?esc(qq.t):""}</small><p>${esc(x.t)}</p></div></div>`;}).join("")}</div>`;
  return o;}
function diaTempWeeks(n){const out=[];let wk=diaWk();for(let i=0;i<n;i++){out.unshift(wk);wk=add(wk,-7);}return out;}
function diaTempChart(){const W=diaTempWeeks(26),v=W.map(k=>(DIA.sett[k]||{}).temp||0);if(v.filter(Boolean).length<2)return "";
  const w=600,h=120,x=i=>16+i*(w-32)/(W.length-1),y=n=>h-14-(n-1)*(h-28)/4,pts=v.map((n,i)=>n?[x(i),y(n)]:null).filter(Boolean);
  return `<svg class="dia-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Andamento del termometro nelle ultime settimane">${[1,2,3,4,5].map(n=>`<line x1="16" x2="${w-16}" y1="${y(n)}" y2="${y(n)}" stroke="var(--line)"/>`).join("")}<polyline fill="none" stroke="var(--dia)" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--dia)"/>`).join("")}</svg><div class="dia-ax"><span>26 settimane fa</span><span>questa settimana</span></div>`;}
/* tre settimane di fila con il termometro basso (1 o 2): una riga gentile, nient'altro */
function diaGentle(){const W=diaTempWeeks(3).map(k=>(DIA.sett[k]||{}).temp||0);return W.every(n=>n&&n<=2)?`<p class="dia-gentle">💬 ${esc(DIA_D.gentile)}</p>`:"";}

function diaIdee(){const L=DIA.idee,st={idea:["💡","Idee"],passo:["👣","Primo passo fatto"],abit:["🔁","Abitudini"]};
  let o=`<div class="card k-dia nofold"><p class="lbl" style="margin-top:0">Ogni progetto per il dopo passa da <b>idea</b> a <b>primo passo fatto</b> (con la data), poi diventa <b>abitudine</b>. Così si vede la differenza tra un piano e una cosa cominciata. Per esempio: Tai Chi al mattino, un turno di volontariato del 🤝 Metodo, un corso, una passeggiata fissa.</p>
    <div class="form"><label class="wide">Nuova idea<input id="diaIdea" maxlength="120" placeholder="che cosa vorresti fare"></label><button class="btn pri" id="diaIdeaAdd">Aggiungi</button></div></div>`;
  o+=`<div class="kpi" style="margin:12px 0">${Object.keys(st).map(k=>`<div><b>${L.filter(x=>x.st===k).length}</b><span>${st[k][0]} ${st[k][1]}</span></div>`).join("")}</div>`;
  Object.keys(st).forEach(k=>{const R=L.filter(x=>x.st===k);if(!R.length)return;
    o+=`<div class="card k-dia"><h3>${st[k][0]} ${st[k][1]}</h3>${R.map(x=>{const ed=diaIdeaPasso===x.id;return `<div class="row dia-idea"><div class="grow"><b>${esc(x.t)}</b>${x.passo&&x.passo.d?`<small>primo passo ${fmt(x.passo.d,{day:"numeric",month:"short",year:"numeric"})}${x.passo.t?": "+esc(x.passo.t):""}</small>`:""}${x.abitDa?`<small>abitudine dal ${fmt(x.abitDa,{day:"numeric",month:"short",year:"numeric"})}</small>`:""}
      ${ed?`<div class="form" style="margin-top:8px"><label>Quando<input type="date" id="diaPD" value="${today()}"></label><label class="wide">Che cosa hai fatto<input id="diaPT" maxlength="160" placeholder="per esempio: mi sono iscritto, ho chiamato, ho provato"></label><button class="btn pri" data-ipok="${x.id}">Salva</button><button class="btn" data-ipno="1">Annulla</button></div>`:""}</div>
      <div class="dia-acts">${k==="idea"&&!ed?`<button class="btn sm pri" data-ipasso="${x.id}">👣 Primo passo</button>`:""}${k==="passo"?`<button class="btn sm ok" data-iabit="${x.id}">🔁 È un'abitudine</button>`:""}${k!=="idea"?`<button class="btn sm" data-iback="${x.id}" aria-label="Torna indietro">↩︎</button>`:""}<button class="btn sm danger" data-idel="${x.id}" aria-label="Togli">✕</button></div></div>`;}).join("")}</div>`;});
  if(!L.length)o+=`<p class="empty">Ancora nessuna idea: scrivi la prima qui sopra.</p>`;
  return o;}

function diaProve(){const t=today(),P2=DIA.prove,next=diaLeaveDays(t,120).filter(d=>!P2.some(p=>p.d===d)).slice(0,6),todo=P2.filter(p=>p.d<=t&&!p.com).sort((a,b)=>a.d<b.d?1:-1),fut=P2.filter(p=>p.d>t).sort((a,b)=>a.d<b.d?-1:1),done=P2.filter(p=>p.com).sort((a,b)=>a.d<b.d?1:-1);

    ${next.length?`<div class="dia-chips">${next.map(d=>`<button class="btn sm" data-pnew="${d}">🧪 ${fmt(d,{weekday:"short",day:"numeric",month:"short"})}</button>`).join("")}</div>`:`<p class="empty">Nessun giorno di licenza nei prossimi mesi nelle Licenze.</p>`}
    <div class="form" style="margin-top:8px"><label>Un'altra data<input type="date" id="diaPDate" min="${t}"></label><button class="btn" id="diaPOther">Prepara la prova</button></div></div>`;

  if(todo.length)o+=`<div class="card k-dia"><h3>💬 Com'è andata?</h3>${todo.map(p=>`<div class="row" style="flex-wrap:wrap"><div class="grow"><b>${diaFmtL(p.d)}</b><small>${esc(p.piano||"")}</small><textarea data-pcom="${p.id}" rows="3" placeholder="com'è andata, che cosa ti è piaciuto, che cosa cambieresti"></textarea></div><button class="btn sm pri" data-pcomok="${p.id}">Salva</button></div>`).join("")}</div>`;

  return o;}

function diaInsieme(){const I=DIA.insieme,n=DIA_D.insieme.filter(x=>(I[x.id]||"").trim()).length;
  let o=`<div class="card k-dia nofold"><p class="lbl" style="margin-top:0">Tracce da usare in due, con calma: si scrive quello che decidete o che vi viene in mente, anche un poco alla volta. Con «Condividi» il testo si manda come messaggio.</p></div>`;

function diaTappeV(){const t=today(),c=diaCess(),T=diaTappe(),L=DIA.lettera,apre=c?add(c,1):null;
  let o="";

/* ---------- 🗞️ STAMPA DI OGGI: le notizie principali, generali e di Torino ----------

   File pubblico stampa-oggi.json, scritto dall'attività programmata alle 6 (edizione del mattino) e alle 22 (edizione della sera)

   Sull'iPad resta una copia (pn-stampa) per quando manca internet; quali notizie hai aperto: pn-stampa-lette (solo su questo iPad). */
const ST_KEY="pn-stampa",ST_LKEY="pn-stampa-lette";
const ST_SEZ=[["italia","🇮🇹","Italia"],["mondo","🌍","Mondo"],["estero","🌐","Stampa estera"],["economia","💶","Economia"],["torino","🏙️","Torino"],["piemonte","🏔️","Piemonte"],["eventi","🎟️","Cose da fare a Torino e in Piemonte"],["spettacoli","🎬","Cinema e teatro a Torino"],["concerti","🎵","Concerti nei prossimi mesi"],["cultura","🎭","Cultura"],["sport","⚽","Sport"]];

const stData=()=>lsJ(ST_KEY)||{sezioni:{}};
/* articoli stranieri: titolo e sintesi sono già in italiano; «leggi tradotto» apre l'originale tradotto in italiano da Google Traduttore */
const stTrad=u=>"https://translate.google.com/translate?sl=auto&tl=it&u="+encodeURIComponent(u);

async function stFetch(force){const N=stData();if(stBusy||navigator.onLine===false)return;if(!force&&N.checked&&Date.now()-new Date(N.checked).getTime()<20*60e3)return;
  stBusy=true;try{const r=await fetch("stampa-oggi.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const o=await r.json();if(o.app!=="stampa-oggi"||!o.sezioni)throw 0;
    const before=N.updated;o.checked=new Date().toISOString();try{localStorage.setItem(ST_KEY,JSON.stringify(o));}catch(e){}if(o.updated!==before&&(cur==="st"||cur==="cal"))softRender();if(force)toast(o.updated!==before?"🗞️ Edizione nuova":"Già aggiornata");}
  catch(e){try{N.checked=new Date().toISOString();localStorage.setItem(ST_KEY,JSON.stringify(N));}catch(x){}if(force)toast("Non riesco a scaricare l'edizione: riprova con internet");}finally{stBusy=false;}}
setTimeout(stFetch,1800);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)stFetch();});
const stAll=()=>{const S=stData().sezioni||{};return ST_SEZ.flatMap(([k])=>(S[k]||[]).map(n=>Object.assign({sez:k},n)));};

  return (N.edizione==="sera"?"🌙 Edizione della sera":"☀️ Edizione del mattino")+" · "+d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})+", "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});}

  return o;}

function auD(){P.auto=P.auto||{};const A=P.auto;A.chk=A.chk||{};A.opz=A.opz||[];return A;}
const auNum=v=>{const n=parseFloat(String(v==null?"":v).replace(/\./g,"").replace(",","."));return isFinite(n)?n:0;};

function vAuto(){

function bindAuto(){
  const A=auD();
  if($("auSave"))$("auSave").onclick=()=>{A.scad=$("auScad").value||"";A.ora=$("auOra").value||"";A.luogo=$("auLuogo").value.trim();A.km=$("auKm").value.trim();
    const s=P.scad.find(x=>x.id==="auto-riconsegna");if(s&&A.scad){s.d=A.scad;s.note=[A.ora,A.luogo].filter(Boolean).join(" · ");}
    save();render();toast("🚗 Salvato");};
  if($("auCal"))$("auCal").onclick=()=>{let s=P.scad.find(x=>x.id==="auto-riconsegna");const note=[A.ora,A.luogo].filter(Boolean).join(" · ");
    if(s){s.d=A.scad;s.note=note;s.done=false;}else P.scad.push({id:"auto-riconsegna",t:"🚗 Riconsegna dell’auto a noleggio",d:A.scad,cat:"auto",ric:"",av:7,note,done:false});
    save();render();toast("📌 Nelle Scadenze del Calendario, con avviso 7 giorni prima");};
  document.querySelectorAll("[data-auc]").forEach(c=>c.onchange=()=>{A.chk[c.dataset.auc]=c.checked?1:0;save();render();});
  document.querySelectorAll("[data-aue]").forEach(b=>b.onclick=()=>{auEdit=+b.dataset.aue;render();});
  if($("auOSave"))$("auOSave").onclick=()=>{const o={};AU_CAMPI.forEach(([k,,ty])=>{const v=$("auO-"+k).value.trim();o[k]=ty==="num"?(v===""?"":auNum(v)):v;});
    if(!o.n&&!o.can){toast("Scrivi almeno il nome o il canone");return;}
    if(auEdit>=0)A.opz[auEdit]=o;else A.opz.push(o);auEdit=-1;save();render();toast("🔢 Offerta salvata");};
  if($("auODel"))$("auODel").onclick=()=>{A.opz.splice(auEdit,1);auEdit=-1;save();render();};
  if($("auONo"))$("auONo").onclick=()=>{auEdit=-1;render();};
}

/* ---------- 🎓 Corsi online (3/11/2026, richiesta del proprietario) ----------
   Corsi gratuiti di università italiane e straniere che si seguono in italiano. La lista è in sezioni/corsi_dati.json
   (CO_D, controllata da strumenti/verifica_corsi.py a ogni build). Sull'iPad resta solo lo stato dei corsi (P.corsi). */
const CO_AREE={ia:["🤖","IA e digitale"],pens:["🌿","Pensione e tempo libero"]};
const CO_ST={da:["⭐","Da seguire"],in:["▶️","In corso"],ok:["✅","Finito"]};
function coD(){P.corsi=P.corsi||{};const C=P.corsi;C.st=C.st||{};C.f=C.f||{};return C;}
/* 4/11/2026 (scelta del proprietario): la ricerca arriva a lotti di 10; i corsi dei lotti precedenti che non hai segnato (⭐ ▶️ ✅) spariscono e non vengono più proposti */
const coLotto=()=>Math.max(1,...CO_D.corsi.map(c=>c.lotto||1));
const coVisibile=(c,C)=>(c.lotto||1)>=coLotto()||!!C.st[c.id];
function coFiltra(C){const f=C.f;return CO_D.corsi.filter(c=>coVisibile(c,C)&&(!f.a||c.area===f.a)&&(!f.t||c.tipo===f.t)&&(!f.it||c.lingua!=="Sottotitoli in italiano")&&(!f.at||c.attestato==="Gratis")&&(!f.st||C.st[c.id]));}
function coCard(c,C){const s=C.st[c.id];
  return `<div class="co-c${s?" co-"+s:""}"><b>${esc(c.titolo)}</b><div class="co-e">${c.tipo==='Università popolare'?'🏛️ ':''}${esc(c.ente)}${c.paese!=="Italia"?" · "+esc(c.paese):""} · ${esc(c.piattaforma)}</div>`+
    `<div class="co-t"><span>${c.lingua==="Sottotitoli in italiano"?"💬":"🇮🇹"} ${esc(c.lingua)}</span><span>${c.modalita==='Online'?'💻 Online':'📍 '+esc(c.modalita)+(c.citta?' · '+esc(c.citta):'')}</span><span>${esc(c.livello)}</span><span>⏱️ ${esc(c.durata)}</span><span>${esc(c.formato)}</span><span>🎓 attestato: ${esc(c.attestato)}</span></div>`+
    `<p>${esc(c.sintesi)}</p><div class="co-b"><a class="btn sm" href="${esc(c.url)}" target="_blank" rel="noopener">Apri il corso ›</a>`+
    Object.keys(CO_ST).map(k=>`<button class="btn sm${s===k?" on":""}" data-cos="${esc(c.id)}" data-v="${k}" title="${CO_ST[k][1]}">${CO_ST[k][0]}</button>`).join("")+
    `</div><div class="lbl">Controllato il ${new Date(c.verificato+"T12:00").toLocaleDateString("it-IT")}</div></div>`;}
function coQuota(){const Q=CO_D.a_quota||[];if(!Q.length)return "";

function vCorsi(){
  const C=coD(),f=C.f,L=CO_D.corsi.filter(c=>coVisibile(c,C)),R=coFiltra(C),LN=coLotto(),nuovi=L.filter(c=>(c.lotto||1)===LN&&!C.st[c.id]).length;
  let o=`<h1>🎓 Corsi online</h1><p class="sub">Corsi gratuiti e aperti a tutti, senza essere studenti universitari: università italiane e straniere e università popolari, in italiano. Tocca ⭐ ▶️ ✅ per segnare i tuoi: lo stato resta su questo iPad.</p>`;
  if(!L.length)return o+`<div class="card k-corsi nofold"><h2>📚 La lista è in preparazione</h2><p>${esc(CO_D.criteri)}</p><p class="empty">I corsi arrivano dopo la ricerca e il controllo: ogni corso viene aperto sulla pagina ufficiale prima di entrare nella lista.</p></div>`;

  o+=`<div class="card k-corsi nofold co-f"><div class="co-fr">`+
    `<button class="og-p${!f.a?" on":""}" data-cof="a" data-v="">Tutti · ${L.length}</button>`+
    Object.keys(CO_AREE).map(a=>`<button class="og-p${f.a===a?" on":""}" data-cof="a" data-v="${a}">${CO_AREE[a][0]} ${CO_AREE[a][1]} · ${L.filter(c=>c.area===a).length}</button>`).join("")+
    [['','Tutti gli enti'],['Università','🎓 Università'],['Università popolare','🏛️ Università popolari']].map(([v,t])=>`<button class="og-p${(f.t||'')===v?' on':''}" data-cof="t" data-v="${v}">${t}</button>`).join('')+
    `<label class="co-ck"><input type="checkbox" data-cok="it"${f.it?" checked":""}> solo in italiano (senza sottotitoli)</label>`+
    `<label class="co-ck"><input type="checkbox" data-cok="at"${f.at?" checked":""}> attestato gratis</label>`+
    `<label class="co-ck"><input type="checkbox" data-cok="st"${f.st?" checked":""}> solo i miei (${mie.length})</label></div>`+
    (nuovi?`<div class="lbl">🆕 <b>${nuovi} corsi da scegliere</b>: segna con ⭐ quelli che ti interessano. Alla prossima ricerca gli altri spariscono e non verranno più proposti; quelli segnati restano.</div>`:"")+
    (mie.length?`<div class="lbl">I miei corsi: ⭐ ${nn("da")} da seguire · ▶️ ${nn("in")} in corso · ✅ ${nn("ok")} finiti</div>`:"")+
    `<div class="lbl">${esc(CO_D.criteri)}${CO_D.updated?" Lista aggiornata il "+new Date(CO_D.updated+"T12:00").toLocaleDateString("it-IT")+".":""}</div></div>`;
  if(!R.length)return o+`<p class="empty">Nessun corso con questi filtri.</p>`+coQuota();
  const temi=[].concat(...Object.keys(CO_AREE).map(a=>CO_D.temi[a]));
  o+=`<div class="cols4">`+temi.map(t=>{const g=R.filter(c=>c.tema===t);if(!g.length)return "";
    return `<div class="card k-corsi"><h3>${esc(t)} <span class="pill">${g.length}</span></h3>${g.map(c=>coCard(c,C)).join("")}</div>`;}).join("")+`</div>`+coQuota();
  return o;
}
function bindCorsi(){
  const C=coD();

}

/* ---------- eventi dal Calendario dell'iPad (tramite il Comando Rapido «Aggiorna Pianificazione») ----------
   Il Comando Rapido copia negli appunti una riga per evento: inizio§fine§titolo§calendario§tutto il giorno§luogo
   (date in ISO 8601). Qui si incollano: sostituiscono la copia precedente, senza doppioni. */
const SC_NAME="Aggiorna Pianificazione";
/* date come le scrive Comandi Rapidi: ISO 8601, «05/10/26, 09:50», «5 ott 2026 alle ore 09:50», «5 ottobre 2026, 9:50», «Oct 5, 2026 at 9:50 AM» */
const MESI_IT=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"],MESI_EN=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseWhen(x){
  x=String(x||"").trim().toLowerCase();if(!x)return null;
  let m=x.match(/^(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{2}):(\d{2}))?/);
  if(m)return{d:m[1]+"-"+m[2]+"-"+m[3],t:m[4]?m[4]+":"+m[5]:""};
  const tm=(x.match(/(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?\s*$/)||x.match(/(?:alle|ore|at|,)\s*(?:ore\s*)?(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?/));
  let t="";if(tm){let h=+tm[1];if(tm[3]==="p"&&h<12)h+=12;if(tm[3]==="a"&&h===12)h=0;t=pad(h)+":"+tm[2];}
  const Y=y=>{y=+y;return y<100?2000+y:y;};
  m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m)return{d:Y(m[3])+"-"+pad(+m[2])+"-"+pad(+m[1]),t};
  m=x.match(/^(\d{1,2})\s+([a-zà-ù]{3,})\.?\s+(\d{4})/);
  if(m){const k=MESI_IT.indexOf(m[2].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[1]),t};}
  m=x.match(/^([a-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if(m){const k=MESI_EN.indexOf(m[1].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[2]),t};}
  return null;
}
function parseCal(txt){
  const out=[],seen=new Set();
  String(txt||"").split(/\r?\n/).forEach(l=>{const f=l.split("§").map(z=>z.trim());if(f.length<2)return;
    // formati accettati: inizio§fine§titolo§calendario§luogo  (anche: inizio§titolo§calendario, e la vecchia riga con «tutto il giorno»)
    let S=parseWhen(f[0]),E=parseWhen(f[1]),t,cal,loc,adf=null;
    if(E){t=f[2]||"";cal=f[3]||"";if(/^(s[iì]|no|yes|true|false|1|0|vero|falso)$/i.test(f[4]||"")){adf=/^(s[iì]|yes|true|1|vero)$/i.test(f[4]);loc=f[5]||"";}else loc=f[4]||"";}
    else{t=f[1]||"";cal=f[2]||"";loc=f[3]||"";E=S;}
    if(!S||!t)return;
    if(/festivit|holiday/i.test(cal))return; // le festività le conosce già l'app
    const ad=adf!=null?adf:(!S.t||S.t==="00:00")&&(!E.t||E.t==="00:00"||E.t==="23:59");
    const k=S.d+"T"+(S.t||"")+"|"+t;if(seen.has(k))return;seen.add(k);
    let ed=E.d||S.d;if(ad&&E.t==="00:00"&&ed>S.d)ed=add(ed,-1);
    out.push({k,d:S.d,o:ad?"":S.t,f:ad||E.d!==S.d?"":E.t,ed,t,cal,ad,loc:loc.split("\n")[0]});});
  return out.sort((a,b)=>(a.d+(a.o||""))<(b.d+(b.o||""))?-1:1);
}
function importCal(txt){const ev=parseCal(txt);if(!ev.length){toast("Negli appunti non ci sono eventi del Comando Rapido");return false;}
  P.cal={at:new Date().toISOString(),ev};P.cal.wait=false;save();render();toast("📆 "+ev.length+" eventi dal Calendario");return true;}
async function pasteCal(){try{const t=await navigator.clipboard.readText();importCal(t);}catch(e){toast("Non riesco a leggere gli appunti: incolla nel riquadro");go("cal");setTimeout(()=>{const a=$("calPaste");if(a)a.focus();},200);}}

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
function fold(l){ // righe al massimo di 75 byte (UTF-8), senza spezzare i caratteri
  const enc=new TextEncoder(),out=[];let cur="",n=0;for(const ch of l){const b=enc.encode(ch).length;if(n+b>(out.length?73:74)){out.push(cur);cur=" ";n=1;}cur+=ch;n+=b;}out.push(cur);return out.join("\r\n");}
