<style>

.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 0}

details.csm2{padding:10px 0 10px 4px;border-top:1px solid var(--line)}details.csm2:first-of-type{border-top:0}details.csm2[open]{padding-bottom:14px}

.cs-cp{background:var(--pens-bg);border-radius:10px;padding-left:6px;padding-right:6px}.cs-add{align-items:center;margin-top:8px}.cs-add .pin{flex:0 1 160px;min-width:120px}.cs-add .lbl{margin:0}
.csm-h .n{background:var(--scad);color:#fff;border-radius:10px;font-size:11px;line-height:1;padding:3px 7px;font-weight:700}
.cs-ch{width:100%;height:auto;display:block;margin-top:6px;touch-action:pan-y}.cs-ch .cg{stroke:var(--line);stroke-width:1}.cs-ch .cg.z{stroke:var(--muted);stroke-dasharray:4 4}
.cs-ch .ct{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}.cs-ch .oc{fill:var(--cal);font-weight:700}.cs-ch .cv{stroke:var(--pens);stroke-width:1;stroke-dasharray:3 3}.cs-ch .co{stroke:var(--cal);stroke-width:1}
.cs-ch .cl{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.cs-ch .cl.p{stroke:var(--chp)}.cs-ch .cl.s{stroke:var(--cal)}.cs-ch .cx{stroke:var(--muted);stroke-width:1}
.cs-ch .cm{stroke:var(--card);stroke-width:2}.cs-ch .cm.p{fill:var(--chp)}.cs-ch .cm.s{fill:var(--cal)}.cs-ch .cm.v{fill:var(--ink)}
.cs-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}.cs-leg span{display:flex;align-items:center;gap:6px}.cs-leg .sw{width:16px;height:3px;border-radius:2px;display:inline-block}.cs-leg .sw.p{background:var(--chp)}.cs-leg .sw.s{background:var(--cal)}.cs-leg .sw.v{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.cs-tip{font-size:13px;color:var(--muted);margin:4px 0 0;min-height:18px}.cs-tip b{color:var(--ink)}
.pill.inv{background:var(--inv-bg);color:var(--inv)}.iq{padding:10px 0;border-top:1px solid var(--line)}.iq b{display:block;margin-bottom:6px}.iqo{display:flex;flex-wrap:wrap;gap:6px}

.ibt{position:relative;height:12px;margin:6px 0 4px;border-radius:6px;background:var(--seg);overflow:hidden}.ibt i{position:absolute;top:0;bottom:0;border-radius:6px}.ibt .rng{background:var(--inv-bg);box-shadow:inset 0 0 0 1px var(--inv)}.ibt .mid{left:0;background:var(--inv);opacity:.85}
.ib small{color:var(--muted);font-size:12.5px;display:block}.idt summary{cursor:pointer;color:var(--inv);font-size:13px;margin-top:4px}.idt p{margin:4px 0;font-size:14px}

.ptab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.ptab th{font-size:12.5px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}.ptab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.ptab td small{display:block;color:var(--muted);font-size:12px}

.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--seg);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--c,var(--cal));color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:var(--warn-bg);color:var(--warn)}

<script>
/* ================= BLOCCO CON FACE ID (comune a tutte le pagine di Pianificazione) =================
   - usa una passkey del dispositivo (WebAuthn): l'iPad chiede Face ID, o il codice dell'iPad se il volto non viene riconosciuto;
   - nessun server: la chiave pubblica resta su questo dispositivo e la firma si verifica qui;
   - codice di riserva (4–8 cifre) se la passkey non fosse disponibile;
   - si riblocca dopo 5 minuti fuori dall'app. I dati restano dove sono: il blocco protegge l'apertura, non cifra i dati. */
/* chiavi di Pianificazione con il prefisso dell'app (prima erano «mie-app-…», nome condiviso con il sito): spostate una volta sola */
(function(){try{[["mie-app-lastSnap","pn-lastSnap"],["mie-app-lastBackup","pn-lastBackup"],["mie-app-copia-cloud","pn-copia-cloud"]].forEach(function(p){var v=localStorage.getItem(p[0]);if(v!=null){if(localStorage.getItem(p[1])==null)localStorage.setItem(p[1],v);localStorage.removeItem(p[0]);}});}catch(e){}})();
(function(){
  "use strict";
  var KEY="pn-lock", SES="pn-unlocked", IDLE=5*60*1000;
  function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
  var C=cfg(), root=document.documentElement;
  function unlocked(){try{var t=+sessionStorage.getItem(SES)||0;return t&&Date.now()-t<IDLE;}catch(e){return false;}}
  function mark(){try{sessionStorage.setItem(SES,String(Date.now()));}catch(e){}}
  if(C&&C.on&&!unlocked())root.classList.add("locked");
  var b64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
  var unb64=function(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
  async function sha(t){var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return b64(h);}
  // firma ES256 (DER) → formato grezzo r|s per WebCrypto
  function der2raw(d){var i=2;if(d[1]&0x80)i+=d[1]&0x7f;function int(){i++;var l=d[i++];var v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);var o=new Uint8Array(32);o.set(v,32-v.length);return o;}var r=int(),s=int(),out=new Uint8Array(64);out.set(r,0);out.set(s,32);return out;}
  async function verify(pkB64,authData,clientJSON,sig){
    try{var key=await crypto.subtle.importKey("spki",unb64(pkB64),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
      var ch=new Uint8Array(await crypto.subtle.digest("SHA-256",clientJSON)),ad=new Uint8Array(authData),data=new Uint8Array(ad.length+ch.length);data.set(ad,0);data.set(ch,ad.length);
      return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,der2raw(new Uint8Array(sig)),data);}catch(e){return null;}
  }
  function done(){mark();root.classList.remove("locked");try{window.dispatchEvent(new Event("pn-unlocked"));}catch(e){}}
  function msg(t){var e=document.getElementById("lkMsg");if(e)e.textContent=t;}
  var busy=false;
  async function faceId(){
    C=cfg(); if(!C||!C.id){showPin();return;}
    if(busy)return; busy=true; msg("Guarda l’iPad…");
    try{
      var chal=rnd(32);
      var a=await navigator.credentials.get({publicKey:{challenge:chal,rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb64(C.id)}],userVerification:"required",timeout:60000}});
      var r=a.response,cj=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
      if(cj.type!=="webauthn.get"||cj.challenge!==b64(chal))throw new Error("risposta non valida");
      var flags=new Uint8Array(r.authenticatorData)[32];if(!(flags&4))throw new Error("verifica del volto non fatta");
      if(C.pk){var ok=await verify(C.pk,r.authenticatorData,r.clientDataJSON,r.signature);if(ok===false)throw new Error("firma non valida");}
      done();
    }catch(e){msg(e&&e.name==="NotAllowedError"?"Tocca «Sblocca con Face ID» per riprovare, o usa il codice di riserva.":"Non riuscito: riprova o usa il codice di riserva.");}
    busy=false;
  }
  function showPin(){var b=document.getElementById("lkPinBox");if(b){b.hidden=false;var i=document.getElementById("lkPin");if(i)i.focus();}}
  async function pin(){var v=(document.getElementById("lkPin").value||"").trim();C=cfg();
    if(C&&C.pin&&await sha("pn-pin:"+v)===C.pin){done();document.getElementById("lkPin").value="";document.getElementById("lkErr").textContent="";}
    else{document.getElementById("lkErr").textContent="Codice sbagliato";}}
  function wire(){
    var g=document.getElementById("lkGo");if(!g)return;
    g.onclick=faceId;document.getElementById("lkAlt").onclick=showPin;document.getElementById("lkPinGo").onclick=pin;
    document.getElementById("lkPin").onkeydown=function(e){if(e.key==="Enter")pin();};
    if(root.classList.contains("locked"))faceId();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",wire);else wire();
  // si riblocca dopo 5 minuti fuori dall'app
  document.addEventListener("visibilitychange",function(){C=cfg();if(!C||!C.on)return;
    if(document.visibilityState==="hidden"){if(!root.classList.contains("locked"))mark();}else if(!unlocked()){root.classList.add("locked");msg("Sblocca con Face ID per continuare.");faceId();}});
  setInterval(function(){if(!root.classList.contains("locked")&&document.visibilityState==="visible")mark();},30000);

  /* ---------- attivazione (usata dalla pagina Pianificazione → 🔒 Blocco) ---------- */
  window.__pnLock={
    cfg:cfg,
    available:async function(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}},
    enable:async function(pinCode){
      if(!/^\d{4,8}$/.test(pinCode||""))throw new Error("Il codice di riserva deve avere da 4 a 8 cifre");
      var c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"Pianificazione",id:location.hostname},
        user:{id:rnd(16),name:"pianificazione",displayName:"Pianificazione"},pubKeyCredParams:[{type:"public-key",alg:-7}],
        authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000,attestation:"none"}});
      var pk=null;try{pk=c.response.getPublicKey?b64(c.response.getPublicKey()):null;}catch(e){}
      localStorage.setItem(KEY,JSON.stringify({on:true,id:b64(c.rawId),pk:pk,pin:await sha("pn-pin:"+pinCode),at:new Date().toISOString()}));mark();return true;
    },
    disable:function(){localStorage.removeItem(KEY);try{sessionStorage.removeItem(SES);}catch(e){}},
    lockNow:function(){try{sessionStorage.removeItem(SES);}catch(e){}if(cfg())root.classList.add("locked");msg("Sblocca con Face ID per continuare.");}
  };
})();
</script>

<script>
/* ================= PIANIFICAZIONE =================
   Sezioni: 📆 Calendario (punto di partenza: giorno, settimana, mese, anno, scadenze; il giorno contiene benessere e Tai Chi,
   il giorno di oggi anche il riepilogo; dentro ci sono gli impegni e le attività fisse della famiglia) · 🗂️ Pratiche · ⚙️ Impostazioni
   (blocco con Face ID, Calendario dell'iPad, copie). I vecchi indirizzi #scad, #ben, #sic, #oggi, #fam portano al posto giusto.
   Tutti i dati restano su questo dispositivo: localStorage «pn-v1» + copia nel database del dispositivo (IndexedDB «licenze-marco», voce «pianifica»)
   + copie giornaliere e copia su File/iCloud insieme a Licenze, Tai Chi e Progressi (barra in fondo). Nessun dato personale nel codice. */
"use strict";
/* 💶 Conti: sezione nascosta, codice e dati conservati per il futuro (sezioni/conti.js). Con true torna visibile:
   menu, pagamenti nel Calendario, riquadro di oggi, pagamenti nel file per il Calendario dell'iPad. */
const CONTI_ON=false;
const HOL={"2026-11-01":"Ognissanti","2026-12-08":"Immacolata","2026-12-25":"Natale","2026-12-26":"S. Stefano",
"2027-01-01":"Capodanno","2027-01-06":"Epifania","2027-03-28":"Pasqua","2027-03-29":"Pasquetta",
"2027-04-25":"Liberazione","2027-05-01":"Festa del Lavoro","2027-06-02":"Festa della Repubblica"};
const DEF={start:"",end:"",bal:{lo25:0,lo26:0,lo27:0,rl26:0,rl27:0},defIn:"08:00",defOut:"14:00",days:{},week:{}};
const PROV_START="";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"short",day:"numeric",month:"short"});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const rel=d=>{const n=diff(today(),d);return n===0?"oggi":n===1?"domani":n===-1?"ieri":n<0?(-n)+" giorni fa":"tra "+n+" giorni";};
const euro=n=>(Math.round((+n||0)*100)/100).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const GIORNI=["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}

/* ---------- dati e salvataggio ---------- */
const KEY="pn-v1";
const DEF_PN={ver:1,scad:[],fam:{att:[],ev:[]},conti:{ric:[],mov:[],hide:false},ben:{d:{}},ics:{sent:{}},cal:{at:null,ev:[]},savedAt:null};
function normalize(o){const d=JSON.parse(JSON.stringify(DEF_PN));if(o&&typeof o==="object"){Object.assign(d,o);d.fam=Object.assign({att:[],ev:[]},o.fam||{});d.conti=Object.assign({ric:[],mov:[],hide:false},o.conti||{});d.ben=Object.assign({d:{}},o.ben||{});d.ics=Object.assign({sent:{}},o.ics||{});d.cal=Object.assign({at:null,ev:[]},o.cal||{});d.scad=Array.isArray(o.scad)?o.scad:[];}return d;}
let P=normalize(lsJ(KEY));
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):(val===undefined?st.delete(key):st.put(val,key));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
let saveT=null;
function save(){P.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>{kv("readwrite","pianifica",JSON.stringify(P)).catch(()=>{});},400);paintSaved();}
window.__flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}kv("readwrite","pianifica",JSON.stringify(P)).catch(()=>{});};
function paintSaved(){const e=$("pnSaved");if(e)e.textContent=P.savedAt?"✓ Salvato su questo dispositivo · "+new Date(P.savedAt).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";}
async function recover(){ // se il browser avesse perso la memoria principale, riprendo la copia del database
  if(lsJ(KEY))return;
  try{const t=await kv("readonly","pianifica");if(t){P=normalize(JSON.parse(t));localStorage.setItem(KEY,t);render();toast("Dati di Pianificazione recuperati dalla copia");}}catch(e){}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- lettura (solo lettura) delle altre sezioni ---------- */
function licS(){const s=lsJ("licenze-marco-v1");if(!s)return null;const o=JSON.parse(JSON.stringify(DEF));Object.assign(o,s);o.bal=Object.assign({},DEF.bal,s.bal||{});o.days=s.days||{};o.week=s.week||{};o.ev=s.ev||{};if(!o.end)o.end=add(today(),365);return o;}
const kind=s=>{if(HOL[s])return "FEST";const w=parse(s).getDay();return(w===0||w===6)?"WE":"LAV";};
const NOMI={P:"in ufficio",LP:"licenza (anni precedenti)",LO:"licenza (anno in corso)",RL:"recupero festivo",AL:"altra assenza"};
function licCalc(S){ // stesso calcolo della sezione Licenze: saldi consumati giorno per giorno fino al congedo
  const st=S.start||today(),en=S.end,t=today(),b=Object.assign({},S.bal);let pLeft=0;
  for(let s=st;s<=en;s=add(s,1)){if(kind(s)!=="LAV")continue;const c=(S.days[s]&&S.days[s].c)||"P",y27=s>="2027-01-01";
    if(c==="LP"){if(b.lo25>0)b.lo25--;else if(y27&&b.lo26>0)b.lo26--;}
    else if(c==="LO"){if(!y27){if(b.lo26>0)b.lo26--;}else if(b.lo27>0)b.lo27--;}
    else if(c==="RL"){if(b.rl26>0)b.rl26--;else if(y27&&b.rl27>0)b.rl27--;}
    else if(c==="P"&&s>t&&s<en)pLeft++;}
  return{unpl:b.lo25+b.lo26+b.lo27+b.rl26+b.rl27,pLeft,toEnd:diff(t,en),start:st,end:en};

/* ================= 📊 STATISTICHE e 💡 RISPARMIO =================
   Calcoli fatti sui movimenti importati (giroconti tra i propri conti esclusi). Nessun consiglio di investimento:
   numeri e strategie generali di gestione del bilancio, le decisioni restano dell'utente. */
let SP=12; // periodo in mesi
const STOP=/^(sepa|direct|debit|addebito|sdd|fattura|fattur|a|vs|carico|da|per|mand|srl|spa|s|p|a|sa|rl|sarl|et|ci|cie|carta|pagamento|visa|presso|it|lt|torino|bonifico|istantaneo|italia|estero|beneficiario|ord|ben|di|del|della|e|il|la|in|su|the)$/;
function merchKey(t){let s=String(t||"").toLowerCase();if(s.includes(" · "))s=s.split(" · ").slice(1).join(" ");
  const w=s.replace(/[^a-zàèéìòù ]/g," ").split(/\s+/).filter(x=>x.length>2&&!STOP.test(x));return w.slice(0,2).map(x=>x[0].toUpperCase()+x.slice(1)).join(" ")||"Altro";}
function periodMonths(n){return lastMonths(n+1).slice(0,n);} // mesi completi (escluso il mese in corso)
function outMov(ms){const set=new Set(ms);return C().mov.filter(m=>m.tipo==="u"&&!isTransfer(m)&&set.has(m.d.slice(0,7)));}
function stats(n){const ms=periodMonths(n),A=ms.map(ym=>Object.assign({ym},monthActual(ym))).filter(x=>x.e||x.u);
  const k=A.length||1,E=A.reduce((s,x)=>s+x.e,0)/k,U=A.reduce((s,x)=>s+x.u,0)/k;
  const per={};A.forEach(x=>Object.entries(x.per).forEach(([c,v])=>per[c]=(per[c]||0)+v));
  const half=Math.floor(A.length/2),rec=A.slice(-Math.min(3,half)),pre=A.slice(-2*Math.min(3,half),-Math.min(3,half));
  const trend={};Object.keys(per).forEach(c=>{const r=rec.reduce((s,x)=>s+(x.per[c]||0),0)/(rec.length||1),p=pre.reduce((s,x)=>s+(x.per[c]||0),0)/(pre.length||1);trend[c]=p>0?(r-p)/p:null;});
  const mv=outMov(ms),small=mv.filter(m=>m.imp<10);
  const giro=C().mov.filter(m=>m.cat==="giro"&&m.tipo==="u"&&ms.includes(m.d.slice(0,7))).reduce((s,m)=>s+m.imp,0)/k;

function bindCal(){
  const R=()=>render();
  if(calFixed)bindFixed();
  document.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{setCalV(b.dataset.cv);if(calV==="giorno")calD=calSel;R();});
  document.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{calSel=b.dataset.cd;calAdd="";calEdit=null;calOpenLav=false;R();
    if(!matchMedia("(min-width:1100px)").matches){const p=document.querySelector(".cal-side");if(p)p.scrollIntoView({behavior:"smooth",block:"start"});}});
  document.querySelectorAll("[data-cday]").forEach(b=>b.onclick=e=>{e.stopPropagation();calSel=calD=b.dataset.cday;setCalV("giorno");calAdd="";calOpenLav=false;R();window.scrollTo(0,0);});
  document.querySelectorAll("[data-cmon]").forEach(b=>b.onclick=()=>{calD=b.dataset.cmon;setCalV("mese");R();});
  document.querySelectorAll("[data-ca]").forEach(b=>b.onclick=()=>{const a=b.dataset.ca,s=calV==="giorno"?calD:calSel;
    if(a==="prev"||a==="next"){calStep(a==="prev"?-1:1);if(calV==="giorno")calSel=calD;return R();}
    if(a==="today"){calD=calSel=today();return R();}
    if(a==="icsgo")return exportIcs(false);
    if(a==="icsnot"){try{localStorage.setItem("pn-icsnag",String(Date.now()+7*864e5));}catch(e){}return R();}
    if(a==="run")return runShortcut();
    if(a==="paste")return pasteCal();
    if(a==="lav"){calOpenLav=!calOpenLav;return R();}
    if(a.startsWith("add:")){const k=a.slice(4);calEdit=null;calAdd=calAdd===k?"":k;R();const f=document.getElementById("caT")||document.getElementById("caN");if(f)f.focus();return;}
    if(a==="save:scad"){const t=$("caT").value.trim();if(!t)return toast("Scrivi che cosa");P.scad.push({id:uid(),t,d:s,cat:$("caC").value,ric:$("caR").value,av:+$("caA").value,note:"",done:false});calAdd="";save();R();return toast("📌 Scadenza aggiunta");}
    if(a==="save:pay"){const t=$("caT").value.trim(),i=parseFloat(String($("caI").value).replace(/\./g,"").replace(",","."));if(!t||!(i>0))return toast("Scrivi voce e importo");
      const f=$("caF").value,one=f==="1";C().ric.push({id:uid(),t,imp:Math.round(i*100)/100,tipo:$("caTp").value,kind:"",freq:one?"m":f,d0:s,fine:one?s:($("caE").value||""),cat:"altro"});calAdd="";save();R();return toast("💶 Pagamento aggiunto in Conti");}
    if(a==="save:fam"){const t=$("caT").value.trim();if(!t)return toast("Scrivi che cosa");const o={t,chi:$("caC2").value.trim(),o:$("caO").value,f:$("caF2").value,acc:$("caAc").value.trim()},rp=$("caRp").value,fi=$("caFi").value;
      if(calEdit){const L=calEdit.k==="att"?P.fam.att:P.fam.ev,E=L.find(x=>x.id===calEdit.id);if(E){Object.assign(E,o);if(calEdit.k==="att"){E.ogni=rp==="2"?2:1;E.fino=fi||"";}}calEdit=null;calAdd="";save();R();return toast("Modificato");}
      if(rp==="0")P.fam.ev.push(Object.assign({id:uid(),d:s},o));else P.fam.att.push(Object.assign({id:uid(),g:(parse(s).getDay()+6)%7+1,dal:s,ogni:rp==="2"?2:1,fino:fi||"",pause:[]},o));
      calAdd="";save();R();return toast(rp==="0"?"👨‍👧 Impegno aggiunto":"👨‍👧 Attività fissa aggiunta");}
    if(a.startsWith("fedit:")){const[,k,id]=a.split(":");calEdit={k,id};calAdd="fam";return R();}
    if(a==="fcancel"){calEdit=null;calAdd="";return R();}
    if(a==="fskip"&&calEdit){const E=P.fam.att.find(x=>x.id===calEdit.id);if(E){(E.pause=E.pause||[]).push({da:s,a:s});}calEdit=null;calAdd="";save();R();return toast("Tolta solo per questo giorno");}
    if(a==="fdel"&&calEdit){if(!confirm(calEdit.k==="att"?"Togliere questa attività da tutte le settimane?":"Togliere questo impegno?"))return;if(calEdit.k==="att")P.fam.att=P.fam.att.filter(x=>x.id!==calEdit.id);else P.fam.ev=P.fam.ev.filter(x=>x.id!==calEdit.id);calEdit=null;calAdd="";save();R();return toast("Tolto");}
    if(a==="fixed"){calFixed=true;R();return window.scrollTo(0,0);}
    if(a==="fixback"){calFixed=false;return R();}
    if(a==="save:nota"||a==="save:notadel"){P.dn=P.dn||{};const v=a==="save:notadel"?"":$("caN").value.trim();if(v)P.dn[s]=v;else delete P.dn[s];calAdd="";save();R();return toast(v?"📝 Nota salvata":"Nota tolta");}
  });
  document.querySelectorAll("[data-lc]").forEach(b=>b.onclick=()=>{const s=calV==="giorno"?calD:calSel;if(licSetCode(s,b.dataset.lc)){toast("Licenze aggiornate");R();}});
  document.querySelectorAll("[data-lt]").forEach(inp=>inp.onchange=()=>{const s=calV==="giorno"?calD:calSel;if(licSetField(s,inp.dataset.lt,inp.value.trim())){toast("Licenze aggiornate");R();}});
  const BF={sonno:v=>{const n=parseFloat(String(v).replace(",","."));return n>0&&n<=16?n:"";},passi:v=>v?+v:"",energia:v=>v?+v:"",note:v=>v.trim()};
  document.querySelectorAll("[data-bf]").forEach(inp=>inp.onchange=()=>{const s=calV==="giorno"?calD:calSel,k=inp.dataset.bf;setBen(s,k,BF[k](inp.value));toast("Salvato");if(k!=="note")setTimeout(R,50);});
  document.querySelectorAll("[data-cmood]").forEach(b=>b.onclick=()=>{const s=calV==="giorno"?calD:calSel,v=+b.dataset.cmood;setBen(s,"umore",+benDay(s).umore===v?"":v);R();toast("Umore salvato");});
  document.querySelectorAll("[data-tc]").forEach(b=>b.onclick=()=>{const s=calV==="giorno"?calD:calSel,k=b.dataset.tc,m=lsJ("tc_sessions")||{};

function pratSave(msg){save();render();if(msg)toast(msg);}
function bindPrat(){
  document.querySelectorAll("[data-psel]").forEach(b=>b.onclick=()=>{pratSel=b.dataset.psel;pratEditPasso=false;render();window.scrollTo(0,0);});

  document.querySelectorAll("[data-pa]").forEach(b=>b.onclick=async()=>{const a=b.dataset.pa;
    if(a==="new"){pratNew=!pratNew;render();const f=$("pnT");if(f)f.focus();return;}
    if(a==="cancel"){pratNew=false;return render();}
    if(a==="create"){const t=$("pnT").value.trim();if(!t)return toast("Scrivi il nome della pratica");const m=$("pnM").value,pt=$("pnP").value.trim(),pd=$("pnD").value;
      const o={id:uid(),t,mod:m,stato:"corso",passo:pt?{t:pt,d:pd}:null,docs:(PRAT_MOD[m]||PRAT_MOD.altro)[2].map(t=>({t,ok:false})),cont:[],log:[{id:uid(),d:today(),t:"Pratica aperta"}],files:[],note:"",creata:today()};
      PR().push(o);pratNew=false;pratSel=o.id;window.scrollTo(0,0);return pratSave("Pratica creata");}
    if(a==="back"){pratSel=null;return render();}
    if(!x)return;

    if(a==="passocancel"){pratEditPasso=false;return render();}
    if(a==="passosave"){const t=$("ppT").value.trim(),d=$("ppD").value;x.passo=t?{t,d}:null;pratEditPasso=false;return pratSave(t?"Prossimo passo salvato":"");}
    if(a==="passodone"){if(x.passo){(x.log=x.log||[]).push({id:uid(),d:today(),t:"✓ "+x.passo.t});x.passo=null;}pratEditPasso=true;return pratSave("Fatto: scrivi il passo successivo");}
    if(a==="docadd"){const t=$("pdT").value.trim();if(!t)return;(x.docs=x.docs||[]).push({t,ok:false});return pratSave();}
    if(a==="contadd"){const n=$("pcN").value.trim();if(!n)return toast("Scrivi l’ufficio o la persona");(x.cont=x.cont||[]).push({n,tel:$("pcT").value.trim(),mail:$("pcM").value.trim(),note:$("pcO").value.trim()});return pratSave("Contatto aggiunto");}

    if(a==="del"){if(!confirm("Eliminare la pratica «"+x.t+"» con documenti, contatti, diario e file?"))return;(x.files||[]).forEach(f=>kv("readwrite","pf-"+f.id,undefined).catch(()=>{}));P.prat=PR().filter(y=>y.id!==x.id);pratSel=null;return pratSave("Pratica eliminata");}
  });
  if(!x)return;
  document.querySelectorAll("[data-pf]").forEach(el=>el.onchange=()=>{const k=el.dataset.pf,v=el.value.trim();if(k==="t"&&!v)return;x[k]=v;if(k==="stato"&&v==="chiusa")(x.log=x.log||[]).push({id:uid(),d:today(),t:"Pratica chiusa"});pratSave(k==="note"?"Note salvate":"");});

    const id=uid();try{await kv("readwrite","pf-"+id,f);}catch(e){return toast("Non riesco a salvare il file su questo iPad");}
    (x.files=x.files||[]).push({id,n:f.name||"file",type:f.type||"",size:f.size,at:new Date().toISOString()});pratSave("File aggiunto");if(window.__pfRefresh)window.__pfRefresh();};

/* visore dentro l'app: nell'app sulla schermata Home non c'è il tasto «indietro», quindi il file non si apre in una pagina nuova */
function pratView(blob,meta){const u=URL.createObjectURL(blob),ov=document.createElement("div"),img=/image/.test(meta.type||blob.type);
  ov.className="pview";ov.innerHTML=`<div class="pvbar"><b>${esc(meta.n)}</b><span style="flex:1"></span>${navigator.share?'<button class="btn sm" id="pvSh">📤 Condividi / Salva</button>':`<a class="btn sm" href="${u}" download="${esc(meta.n)}">⬇️ Scarica</a>`}<button class="btn sm pri" id="pvX">Chiudi</button></div>`+
    (img?`<div class="pvbody"><img src="${u}" alt="${esc(meta.n)}"></div>`:`<iframe class="pvbody" src="${u}" title="${esc(meta.n)}"></iframe>`);
  document.body.appendChild(ov);const close=()=>{ov.remove();URL.revokeObjectURL(u);};
  ov.querySelector("#pvX").onclick=close;
  const sh=ov.querySelector("#pvSh");if(sh)sh.onclick=async()=>{try{const f=new File([blob],meta.n||"file",{type:meta.type||blob.type});await navigator.share({files:[f],title:meta.n});}catch(e){if(!e||e.name!=="AbortError")toast("Condivisione non riuscita");}};}

/* ---------- 🎖️ PENSIONE: il passaggio dal servizio alla pensione ----------
   Adempimenti con scadenze (compaiono nel Calendario e nel file per il Calendario dell'iPad), leve ancora attivabili,
   cifre stimate con il confronto con gli importi reali, cronologia degli incassi, cassa mese per mese fino al TFS,
   documenti allegati (PDF). Tutto resta su questo dispositivo (pn-v1 → «pens»; file nel database, chiavi «pf-…»):

  const ck=R.coeff&&coeffs.some(x=>x[0]===R.coeff)?R.coeff:(cUff?"U":"B"),tk=R.tasso&&tassi.some(x=>x[0]===R.tasso)?R.tasso:(tUff?"U":"1"),qa=(C.quotaA||[]),qk=R.qa!=null&&qa[+R.qa]?+R.qa:Math.min(1,qa.length-1);

/* ---------- 🔄 Scheda che si aggiorna da sola ----------
   File pubblico «scheda-pensione.cifrata.json» (AES-256-GCM). La chiave (32 byte, base64url) sta solo su questo iPad
   in «pn-scheda-chiave», fuori dalle copie: senza chiave il file è illeggibile. Arriva con il collegamento …/licenze/#sk=<chiave>
   (la parte dopo # non lascia mai l'iPad) o incollata a mano. Lo aggiornano Claude e l'attività delle 13 · 17 · 23
   (strumenti/scheda_cifrata.py); qui si unisce con pensMerge: spunte, note, importi reali, esito e documenti restano. */
const SK_KEY="pn-scheda-chiave",SK_META="pn-scheda-meta",SK_AAD="pianificazione-scheda-v1";let skBusy=false;
const skKey=()=>{try{return localStorage.getItem(SK_KEY)||"";}catch(e){return "";}};
const skMeta=()=>lsJ(SK_META)||{};
const skSetMeta=m=>{try{localStorage.setItem(SK_META,JSON.stringify(Object.assign(skMeta(),m)));}catch(e){}};
function b64u(s){s=String(s).replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function skValid(k){try{return /^[A-Za-z0-9_-]{43}$/.test(k)&&b64u(k).length===32;}catch(e){return false;}}
function skFromHash(k){try{k=decodeURIComponent(k||"").trim();}catch(e){k="";}
  if(!skValid(k)){setTimeout(()=>toast("Il collegamento della scheda non è valido"),700);return;}
  try{localStorage.setItem(SK_KEY,k);localStorage.removeItem(SK_META);}catch(e){}pensV="doc";try{sessionStorage.setItem("pn-pensv","doc");}catch(e){}
  setTimeout(()=>schedaFetch(true),400);}
async function skOpen(o,k){const key=await crypto.subtle.importKey("raw",b64u(k),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(o.iv),additionalData:new TextEncoder().encode(SK_AAD)},key,b64u(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));}
async function schedaFetch(force){const k=skKey();if(!k||skBusy||navigator.onLine===false)return;const M=skMeta();
  if(!force&&M.checked&&Date.now()-new Date(M.checked).getTime()<30*60e3)return;
  skBusy=true;let err="";
  try{let o;try{const r=await fetch("scheda-pensione.cifrata.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;o=await r.json();}catch(e){err="rete";throw e;}
    if(!o||o.app!=="pianificazione-scheda-cifrata"||!o.iv||!o.ct){err="file";throw 0;}
    const mine=P.pens&&+P.pens.rev||0;
    if(o.rev>mine){let s;try{s=await skOpen(o,k);}catch(e){err="chiave";throw e;}
      if(!s||s.app!=="pianificazione-pensione"||!s.pens||s.v!==o.rev){err="file";throw 0;}
      pensMerge(s.pens);P.pens.rev=o.rev;P.pens.revAt=o.updated;save();
      toast("🎖️ Scheda pensione aggiornata (rev. "+o.rev+")");}
    skSetMeta({checked:new Date().toISOString(),pub:o.rev,err:""});}
  catch(e){skSetMeta({checked:new Date().toISOString(),err:err||"rete"});if(force)toast(err==="chiave"?"La chiave non apre la scheda":err==="file"?"Il file della scheda non è valido":"Scheda non raggiungibile ora");}
  finally{skBusy=false;if(cur==="pens"||cur==="cal")softRender();}}
function skCard(){const k=skKey(),M=skMeta(),p=P.pens||{},when=s=>s?new Date(s).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  if(!k)return `<div class="card k-pens"><h3>🔄 Aggiornamento automatico della scheda</h3><p class="lbl" style="margin-top:0">Apri il collegamento della scheda oppure incolla qui la chiave: da quel momento la scheda si aggiorna da sola quando cambia, e le tue spunte, note e importi restano. La chiave resta solo su questo iPad.</p>
    <div class="form"><label>Chiave della scheda<input id="skIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="43 caratteri"></label></div><div class="btns"><button class="btn sm pri" data-sk="on">Attiva</button></div></div>`;
  const err=M.err==="chiave"?"⚠️ La chiave non apre la scheda pubblicata: disattiva e incolla la chiave nuova.":M.err==="file"?"⚠️ Il file pubblicato non è valido: riprovo al prossimo controllo.":M.err==="rete"?"Ultimo controllo senza rete: riprovo da solo.":"";
  const mods=(p.modifiche||[]).slice(-6).reverse();
  return `<div class="card k-pens"><h3>🔄 Aggiornamento automatico della scheda</h3>
    <div class="row"><span class="pill pens">rev. ${esc(String(p.rev||"—"))}</span><div class="grow"><b>Attivo</b><small>${p.revAt?"scheda del "+when(p.revAt)+" · ":""}${M.checked?"controllata il "+when(M.checked):"non ancora controllata"}</small></div><button class="btn sm" data-sk="now">Controlla ora</button></div>
    ${err?`<p class="lbl" style="color:var(--scad)">${err}</p>`:""}
    ${mods.length?`<details data-k="skmod"><summary>Ultime modifiche della scheda</summary>${mods.map(m=>`<div class="row"><span class="pill">rev. ${esc(String(m.rev))}</span><div class="grow">${esc(m.t||"")}<small>${when(m.at)}${/^https:\/\//.test(m.fonte||"")?` · <a href="${esc(m.fonte)}" target="_blank" rel="noopener">fonte</a>`:""}</small></div></div>`).join("")}</details>`:""}
    <p class="lbl" style="margin:8px 0 0">Controllo a ogni apertura (al massimo ogni mezz’ora). Le modifiche arrivano da Claude e dall’attività delle 13, 17 e 23.</p>
    <div class="btns"><button class="btn sm" data-sk="off">Disattiva</button></div></div>`;}
function bindSk(){document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{const a=b.dataset.sk;
  if(a==="on"){const i=$("skIn"),v=(i&&i.value||"").trim();if(!skValid(v))return toast("La chiave non è valida (43 caratteri)");try{localStorage.setItem(SK_KEY,v);localStorage.removeItem(SK_META);}catch(e){}schedaFetch(true);render();}

function grow(cap,mens,anni,r,s,mesiPac){let v=cap,vers=cap,tassaCed=0;const n=Math.round(anni*12),pts=[{m:0,v}];
  for(let m=1;m<=n;m++){let rr;if(s.id==="pac"){const inB=Math.min(1,m/(mesiPac||24));rr=(1-inB)*(mk("cdl")-0.5)+inB*r;}else rr=r;
    const g=v*((rr-(s.ter||0))/100)/12;v+=g;if(s.id==="btp")tassaCed+=Math.max(0,g)*s.tax/100;v+=mens;vers+=mens;
    if(m%12===0||m===n){const fr=m%12===0?1:(m%12)/12;v-=(s.fix?(v>5000?s.fix*fr:0):v*(s.boll||0)/100*fr);}
    if(m%12===0||m===n)pts.push({m,v});}
  const gain=v-vers,tax=s.id==="btp"?tassaCed:Math.max(0,gain)*s.tax/100,net=v-(s.id==="btp"?tassaCed:tax);return{lordo:v,net,vers,gain:net-vers,tax,pts};}

  const real=v=>v/Math.pow(1+infl/100,anni);return{s,p:res[0],m:res[1],o:res[2],real:real(res[1].net),infl,worst:cap*(s.peg||0)};}

/* ---------- eventi dal Calendario dell'iPad (tramite il Comando Rapido «Aggiorna Pianificazione») ----------
   Il Comando Rapido copia negli appunti una riga per evento: inizio§fine§titolo§calendario§tutto il giorno§luogo
   (date in ISO 8601). Qui si incollano: sostituiscono la copia precedente, senza doppioni. */
const SC_NAME="Aggiorna Pianificazione";
/* date come le scrive Comandi Rapidi: ISO 8601, «05/10/26, 09:50», «5 ott 2026 alle ore 09:50», «5 ottobre 2026, 9:50», «Oct 5, 2026 at 9:50 AM» */
const MESI_IT=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"],MESI_EN=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseWhen(x){
  x=String(x||"").trim().toLowerCase();if(!x)return null;
  let m=x.match(/^(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{2}):(\d{2}))?/);
  if(m)return{d:m[1]+"-"+m[2]+"-"+m[3],t:m[4]?m[4]+":"+m[5]:""};
  const tm=(x.match(/(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?\s*$/)||x.match(/(?:alle|ore|at|,)\s*(?:ore\s*)?(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?/));
  let t="";if(tm){let h=+tm[1];if(tm[3]==="p"&&h<12)h+=12;if(tm[3]==="a"&&h===12)h=0;t=pad(h)+":"+tm[2];}
  const Y=y=>{y=+y;return y<100?2000+y:y;};
  m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m)return{d:Y(m[3])+"-"+pad(+m[2])+"-"+pad(+m[1]),t};
  m=x.match(/^(\d{1,2})\s+([a-zà-ù]{3,})\.?\s+(\d{4})/);
  if(m){const k=MESI_IT.indexOf(m[2].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[1]),t};}
  m=x.match(/^([a-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if(m){const k=MESI_EN.indexOf(m[1].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[2]),t};}
  return null;
}
function parseCal(txt){
  const out=[],seen=new Set();
  String(txt||"").split(/\r?\n/).forEach(l=>{const f=l.split("§").map(z=>z.trim());if(f.length<2)return;
    // formati accettati: inizio§fine§titolo§calendario§luogo  (anche: inizio§titolo§calendario, e la vecchia riga con «tutto il giorno»)
    let S=parseWhen(f[0]),E=parseWhen(f[1]),t,cal,loc,adf=null;
    if(E){t=f[2]||"";cal=f[3]||"";if(/^(s[iì]|no|yes|true|false|1|0|vero|falso)$/i.test(f[4]||"")){adf=/^(s[iì]|yes|true|1|vero)$/i.test(f[4]);loc=f[5]||"";}else loc=f[4]||"";}
    else{t=f[1]||"";cal=f[2]||"";loc=f[3]||"";E=S;}
    if(!S||!t)return;
    if(/festivit|holiday/i.test(cal))return; // le festività le conosce già l'app
    const ad=adf!=null?adf:(!S.t||S.t==="00:00")&&(!E.t||E.t==="00:00"||E.t==="23:59");

<script>
/* ===== Aggiornamento automatico e controllo versione (uguale in tutte le sezioni di Pianificazione: costruita da comune/barra.html) =====
   - all'apertura, al ritorno sull'app e ogni 30 minuti legge version.json saltando ogni copia vecchia (anche quella del server di GitHub);

(function(){

      ".updbar .u-line{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:8px 14px;border-radius:999px;max-width:100%}"+

    if(!/^https?:/.test(location.protocol))return;
    st.state="checking";paint();
    if(window.__swreg)window.__swreg.update().catch(function(){});
    fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
      st.last=new Date();st.remote=v&&v.v;
      if(st.remote&&st.remote!==V){
        if(manual||!busy()){st.state="new";paint();apply(st.remote);}
        else{st.state="wait";st.pending=true;paint();}
      }else{st.state="ok";paint();}
    }).catch(function(){st.state="offline";paint();});
  }
  setInterval(function(){if(st.pending&&!busy()){st.pending=false;st.state="new";paint();apply(st.remote);}},5000);
  if(location.search.indexOf("v=")>=0&&history.replaceState){try{history.replaceState(null,"",location.pathname+location.hash);}catch(e){}}
  setTimeout(snapAll,3000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")snapAll();else paint();});
  window.addEventListener("pagehide",snapAll);
  setInterval(snapAll,15*60*1000);
  window.__snapAll=snapAll;
  window.__exportAll=exportAll;
  if(window.claude||window.top!==window){ // dentro Claude: niente aggiornamento automatico, solo la versione
    if(document.readyState!=="loading")bar();else document.addEventListener("DOMContentLoaded",bar);
    return;
  }
  if(document.readyState!=="loading")bar();else document.addEventListener("DOMContentLoaded",bar);
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").then(function(reg){window.__swreg=reg;}).catch(function(){});
  }
  check(false);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")check(false);});
  window.addEventListener("pageshow",function(e){if(e.persisted)check(false);});
  setInterval(function(){check(false);},30*60*1000);
})();
</script>
