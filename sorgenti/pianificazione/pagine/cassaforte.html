<script>
/* =====================================================================
   🔐 CASSAFORTE di Pianificazione — un solo file, nessuna libreria, nessuna rete.
   La segretezza sta SOLO nella cifratura dei dati sull'iPad (il codice è pubblico).

   INTEGRAZIONE (per il resto dell'app, stessa origine)
   - window.CF_OCR = {disponibile:false, leggi:async(blob)=>testo}: quando un motore OCR sarà disponibile,
     metterlo qui (disponibile:true): la cassaforte lo userà da sola al posto del «testo dal vivo».
   - localStorage "cf-avvisi-v1" = {n, prossima:"AAAA-MM", agg:"AAAA-MM-GG"}: UNICO riassunto non sensibile fuori dalla cassaforte
     (n = elementi in finestra di avviso o scaduti; nessun tipo, nessun numero).
   - Chiavi delle app: la cassaforte tiene una COPIA cifrata (K2) di: "prog-gh-v1" (.token, .exp), "pn-copia-cloud" (.gist, .key),
     "prog-link-v1" (.gist, .key), "pn-scheda-chiave" (stringa). Le chiavi di lavoro in localStorage restano dove sono e non cambiano.
     «Rimetti sull'iPad» riscrive solo quelle mancanti. Mai scritte nel registro.
   - Lettera sigillata del Diario: il Diario scrive localStorage "cf-in-lettera" = {t, sig, apre:"AAAA-MM-GG"} e apre cassaforte.html#lettera.
     Dopo l'apertura con Face ID la cassaforte la cifra con K1, la rilegge per verifica, cancella "cf-in-lettera"
     e scrive "cf-lettera" = {sig, apre, inCassa:true} (senza testo). Se la cassaforte non è configurata, "cf-in-lettera" resta dov'è.
   - Dati: IndexedDB "cassaforte-v1" (kv, items): solo testo cifrato AES-256-GCM. K1 = livello 1 (Face ID), K2 = livello 2 (PIN).
   ===================================================================== */
'use strict';
if (top !== self) { document.documentElement.replaceChildren(); throw 0; } // mai dentro un altro sito
window.CF_OCR = window.CF_OCR || {disponibile:false, leggi:async function(blob){ throw new Error('OCR non disponibile'); }};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function E(t, a) {
  const e = document.createElement(t);
  if (a) for (const x in a) {
    const v = a[x];
    if (x === 'class') e.className = v; else if (x === 'html') e.innerHTML = v;
    else if (x.slice(0, 2) === 'on') e.addEventListener(x.slice(2), v);
    else if (v === true) e.setAttribute(x, ''); else if (v !== false && v != null) e.setAttribute(x, v);
  }
  for (let i = 2; i < arguments.length; i++) [].concat(arguments[i]).forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const oggi = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dIt = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const ymd8 = () => oggi().replace(/-/g, '');
function addMesi(iso, m) { const d = new Date(iso + 'T12:00:00'); const g = d.getDate(); d.setMonth(d.getMonth() + m); if (d.getDate() !== g) d.setDate(0); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const giorniTra = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);

/* ---------- cifratura ---------- */
const te = new TextEncoder(), td = new TextDecoder(), SC = crypto.subtle;
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = u => { const a = new Uint8Array(u); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KU = ['encrypt', 'decrypt', 'wrapKey', 'unwrapKey'];
const aadB = a => a == null ? null : te.encode(a);
const P = (iv, a) => { const p = {name: 'AES-GCM', iv}; if (a != null) p.additionalData = aadB(a); return p; }; // a = etichetta autenticata (AAD)
async function cifra(key, u8, a) { const iv = rnd(12); const c = await SC.encrypt(P(iv, a), key, u8); return {iv: b64(iv), c: b64(c)}; }
async function decifra(key, o, a) { return new Uint8Array(await SC.decrypt(P(ub64(o.iv), a), key, ub64(o.c))); }
const cJ = (k, o, a) => cifra(k, te.encode(JSON.stringify(o)), a);
const dJ = async (k, o, a) => JSON.parse(td.decode(await decifra(k, o, a)));
const aadI = (id, c) => 'item:' + id + ':' + c;
const nuovaK = () => SC.generateKey({name: 'AES-GCM', length: 256}, true, KU);
async function avvolgi(wk, K, nome) { const iv = rnd(12); const c = await SC.wrapKey('raw', K, wk, P(iv, 'wrap:' + nome)); return {iv: b64(iv), c: b64(c)}; }
// di sessione: NON estraibili. svolgiEstr serve solo per riavvolgere subito dopo il recupero e poi si scarta.
const svolgi = (wk, o, nome) => SC.unwrapKey('raw', ub64(o.c), wk, P(ub64(o.iv), 'wrap:' + nome), {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
const svolgiEstr = (wk, o, nome) => SC.unwrapKey('raw', ub64(o.c), wk, P(ub64(o.iv), 'wrap:' + nome), {name: 'AES-GCM', length: 256}, true, ['encrypt', 'decrypt']);
const cat = (a, b) => { const r = new Uint8Array(a.length + b.length); r.set(a); r.set(b, a.length); return r; };
async function pinBits(pin, salt, iter) {
  const m = await SC.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await SC.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter}, m, 256));
}
async function hkey(bits, info, salt) {
  const m = await SC.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  return SC.deriveKey({name: 'HKDF', hash: 'SHA-256', salt: salt || new Uint8Array(32), info: te.encode(info)}, m, {name: 'AES-GCM', length: 256}, false, ['wrapKey', 'unwrapKey', 'encrypt', 'decrypt']);
}
const sha256hex = async s => Array.from(new Uint8Array(await SC.digest('SHA-256', te.encode(s)))).map(x => x.toString(16).padStart(2, '0')).join('');
const ALF = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 caratteri, senza I O 0 1
function nuovaRec() { const b = rnd(24); let s = ''; for (let i = 0; i < 24; i++) s += ALF[b[i] & 31]; return s; }
const recFmt = s => s.match(/.{4}/g).join('-');
const recNorm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const recKey = (rec, saltRec) => hkey(te.encode(recNorm(rec)), 'cassaforte-recupero', saltRec);

/* ---------- archivio IndexedDB ---------- */
const S = {cfg: null, K1: null, K2: null, prf: null, items: [], archivio: [], lettere: [], gate: false, ult: Date.now(), limite: 60000, pausa: 0, k2fine: 0, onL2: [], dlgs: [], urlsW: [], nascosta: 0};
function db() {
  return S.db || (S.db = new Promise((ok, ko) => {
    const r = indexedDB.open('cassaforte-v1', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('items', {keyPath: 'id'}); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }));
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((ok, ko) => { const t = d.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); });
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const itAll = () => tx('items', 'readonly', s => s.getAll());
const itPut = r => tx('items', 'readwrite', s => s.put(r));
const itDel = id => tx('items', 'readwrite', s => s.delete(id));
/* ---------- riconoscimento dal testo (parser) ---------- */
const CFP = (() => {
  const W = [7, 3, 1];
  const mv = c => c === '<' ? 0 : /\d/.test(c) ? +c : c.charCodeAt(0) - 55;
  const mchk = s => { let t = 0; for (let i = 0; i < s.length; i++) t += mv(s[i]) * W[i % 3]; return t % 10; };
  const mok = (f, c) => /^\d$/.test(c || '') && mchk(f) === +c;
  const luhn = s => { if (!/^\d{12,19}$/.test(s)) return false; let t = 0, d = false; for (let i = s.length - 1; i >= 0; i--) { let n = +s[i]; if (d) { n *= 2; if (n > 9) n -= 9; } t += n; d = !d; } return t % 10 === 0; };
  const DISP = [1, 0, 5, 7, 9, 13, 15, 17, 19, 21, 2, 4, 18, 20, 11, 3, 6, 8, 12, 14, 16, 10, 22, 25, 24, 23];
  function cfOk(cf) {
    if (!/^[A-Z]{6}[0-9LMNP-V]{2}[A-EHLMPR-T][0-9LMNP-V]{2}[A-Z][0-9LMNP-V]{3}[A-Z]$/.test(cf)) return false;
    let t = 0;
    for (let i = 0; i < 15; i++) { const c = cf[i]; const v = /\d/.test(c) ? +c : c.charCodeAt(0) - 65; t += (i % 2 === 0) ? DISP[v] : v; }
    return String.fromCharCode(65 + t % 26) === cf[15];
  }
  const dvalid = (y, m, d) => { if (y < 1900 || y > 2100 || m < 1 || m > 12 || d < 1) return false; return d <= new Date(y, m, 0).getDate(); };
  const iso = (y, m, d) => y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  const ultimoGiorno = (y, m) => iso(y, m, new Date(y, m, 0).getDate());
  const MESI = {GEN: 1, FEB: 2, MAR: 3, APR: 4, MAG: 5, GIU: 6, LUG: 7, AGO: 8, SET: 9, OTT: 10, NOV: 11, DIC: 12, JAN: 1, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, DEC: 12};
  function mrzData(s) { // AAMMGG di scadenza -> 20AA
    if (!/^\d{6}$/.test(s)) return null; const y = 2000 + +s.slice(0, 2), m = +s.slice(2, 4), d = +s.slice(4, 6);
    return dvalid(y, m, d) ? iso(y, m, d) : null;
  }
  function righeMRZ(t) {
    return t.split(/\r?\n/).map(l => l.replace(/\s+/g, '').toUpperCase().replace(/[«‹]/g, '<')).filter(l => l.length >= 28 && l.length <= 46 && /^[A-Z0-9<]+$/.test(l) && l.includes('<'))
      .map(l => l.length <= 32 ? l.padEnd(30, '<').slice(0, 30) : l.padEnd(44, '<').slice(0, 44));
  }
  function mrz(t) {
    const R = righeMRZ(t);
