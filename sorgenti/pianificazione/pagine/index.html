.cs-am{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}.cs-am small{color:var(--muted);font-size:12px}.cs-am small.u{color:var(--scad)}

.csm-h .n{background:var(--scad);color:#fff;border-radius:10px;font-size:11px;line-height:1;padding:3px 7px;font-weight:700}
.cs-ch{width:100%;height:auto;display:block;margin-top:6px;touch-action:pan-y}.cs-ch .cg{stroke:var(--line);stroke-width:1}.cs-ch .cg.z{stroke:var(--muted);stroke-dasharray:4 4}
.cs-ch .ct{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}.cs-ch .oc{fill:var(--cal);font-weight:700}.cs-ch .cv{stroke:var(--pens);stroke-width:1;stroke-dasharray:3 3}.cs-ch .co{stroke:var(--cal);stroke-width:1}
.cs-ch .cl{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.cs-ch .cl.p{stroke:var(--chp)}.cs-ch .cl.s{stroke:var(--cal)}.cs-ch .cx{stroke:var(--muted);stroke-width:1}
.cs-ch .cu{fill:var(--chp);opacity:.09}.cs-leg .sw.u{height:9px;background:var(--chp);opacity:.25}.cs-ch .cm{stroke:var(--card);stroke-width:2}.cs-ch .cm.p{fill:var(--chp)}.cs-ch .cm.s{fill:var(--cal)}.cs-ch .cm.v{fill:var(--ink)}

.cs-tip{font-size:13px;color:var(--muted);margin:4px 0 0;min-height:18px}.cs-tip b{color:var(--ink)}
.pill.inv{background:var(--inv-bg);color:var(--inv)}.iq{padding:10px 0;border-top:1px solid var(--line)}.iq b{display:block;margin-bottom:6px}.iqo{display:flex;flex-wrap:wrap;gap:6px}

<!--@NAV-->
<div class="wrap">
  <nav class="sect" id="side" aria-label="Sezioni"></nav>
  <main id="main"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= PIANIFICAZIONE =================
   Sezioni: 📆 Calendario (punto di partenza: giorno, settimana, mese, anno, scadenze; il giorno contiene benessere e Tai Chi,
   il giorno di oggi anche il riepilogo; dentro ci sono gli impegni e le attività fisse della famiglia) · ⚙️ Impostazioni
   (blocco con Face ID, Calendario dell'iPad, copie). I vecchi indirizzi #scad, #ben, #sic, #oggi, #fam portano al posto giusto.
   Tutti i dati restano su questo dispositivo: localStorage «pn-v1» + copia nel database del dispositivo (IndexedDB «licenze-marco», voce «pianifica»)
   + copie giornaliere e copia su File/iCloud insieme a Licenze, Tai Chi e Progressi (barra in fondo). Nessun dato personale nel codice. */
"use strict";
/* 💶 Conti: sezione nascosta, codice e dati conservati per il futuro (sezioni/conti.js). Con true torna visibile:
   menu, pagamenti nel Calendario, riquadro di oggi, pagamenti nel file per il Calendario dell'iPad. */
const CONTI_ON=false;
/* 🗂️ Pratiche tolta il 25/10/2026 (scelta del proprietario): i dati restano nelle copie, la sezione non compare più */
const PRAT_ON=false;
/*@LICENZE_DATI*/
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"short",day:"numeric",month:"short"});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const rel=d=>{const n=diff(today(),d);return n===0?"oggi":n===1?"domani":n===-1?"ieri":n<0?(-n)+" giorni fa":"tra "+n+" giorni";};
const euro=n=>(Math.round((+n||0)*100)/100).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const GIORNI=["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}

/* ---------- dati e salvataggio ---------- */
const KEY="pn-v1";
const DEF_PN={ver:1,scad:[],fam:{att:[],ev:[]},conti:{ric:[],mov:[],hide:false},ben:{d:{}},ics:{sent:{}},cal:{at:null,ev:[]},savedAt:null};
function normalize(o){const d=JSON.parse(JSON.stringify(DEF_PN));if(o&&typeof o==="object"){Object.assign(d,o);d.fam=Object.assign({att:[],ev:[]},o.fam||{});d.conti=Object.assign({ric:[],mov:[],hide:false},o.conti||{});d.ben=Object.assign({d:{}},o.ben||{});d.ics=Object.assign({sent:{}},o.ics||{});d.cal=Object.assign({at:null,ev:[]},o.cal||{});d.scad=Array.isArray(o.scad)?o.scad:[];}return d;}
let P=normalize(lsJ(KEY));
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):(val===undefined?st.delete(key):st.put(val,key));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
let saveT=null;
function save(){P.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>{kv("readwrite","pianifica",JSON.stringify(P)).catch(()=>{});},400);paintSaved();}
window.__flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}kv("readwrite","pianifica",JSON.stringify(P)).catch(()=>{});};
function paintSaved(){const e=$("pnSaved");if(e)e.textContent=P.savedAt?"✓ Salvato su questo dispositivo · "+new Date(P.savedAt).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";}
async function recover(){ // se il browser avesse perso la memoria principale, riprendo la copia del database
  if(lsJ(KEY))return;
  try{const t=await kv("readonly","pianifica");if(t){P=normalize(JSON.parse(t));localStorage.setItem(KEY,t);render();toast("Dati di Pianificazione recuperati dalla copia");}}catch(e){}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- lettura (solo lettura) delle altre sezioni ---------- */
function licS(){const s=lsJ("licenze-marco-v1");if(!s)return null;const o=JSON.parse(JSON.stringify(DEF));Object.assign(o,s);o.bal=Object.assign({},DEF.bal,s.bal||{});o.days=s.days||{};o.week=s.week||{};o.ev=s.ev||{};if(!o.end)o.end=add(today(),365);return o;}
const kind=s=>{if(HOL[s])return "FEST";const w=parse(s).getDay();return(w===0||w===6)?"WE":"LAV";};
const NOMI={P:"in ufficio",LP:"licenza (anni precedenti)",LO:"licenza (anno in corso)",RL:"recupero festivo",AL:"altra assenza"};
function licCalc(S){ // stesso calcolo della sezione Licenze: saldi consumati giorno per giorno fino al congedo
  const st=S.start||today(),en=S.end,t=today(),b=Object.assign({},S.bal);let pLeft=0;
  for(let s=st;s<=en;s=add(s,1)){if(kind(s)!=="LAV")continue;const c=(S.days[s]&&S.days[s].c)||"P",y27=s>="2027-01-01";
    if(c==="LP"){if(b.lo25>0)b.lo25--;else if(y27&&b.lo26>0)b.lo26--;}
    else if(c==="LO"){if(!y27){if(b.lo26>0)b.lo26--;}else if(b.lo27>0)b.lo27--;}
    else if(c==="RL"){if(b.rl26>0)b.rl26--;else if(y27&&b.rl27>0)b.rl27--;}
    else if(c==="P"&&s>t&&s<en)pLeft++;}
  return{unpl:b.lo25+b.lo26+b.lo27+b.rl26+b.rl27,pLeft,toEnd:diff(t,en),start:st,end:en};
}
function licDay(S,s){ // che cosa faccio quel giorno
  const k=kind(s);if(!S)return{k,c:null,t:k==="LAV"?"":k==="WE"?"fine settimana":"festivo"};
  const st=S.start||today();if(s<st||s>S.end)return{k,c:"OUT",t:s<st?"prima del rientro":"in congedo"};
  if(k!=="LAV")return{k,c:null,t:k==="WE"?"fine settimana":(HOL[s]||"festivo")};
  const c=(S.days[s]&&S.days[s].c)||"P",d=S.days[s]||{},w=S.week[monday(s)]||{};
  return{k,c,t:NOMI[c]||c,i:d.in||w.in||S.defIn,o:d.out||w.out||S.defOut};
}
function absBlocks(S){ // assenze consecutive (con weekend e festivi in mezzo) da oggi al congedo
  if(!S)return[];const out=[];let cur=null;const st=S.start||today(),from=today()>st?today():st;
  for(let s=from;s<=S.end;s=add(s,1)){const d=licDay(S,s),off=d.k!=="LAV"||d.c!=="P";
    if(off){if(!cur)cur={from:s,to:s,abs:0,codes:{}};cur.to=s;if(d.k==="LAV"){cur.abs++;cur.codes[d.c]=(cur.codes[d.c]||0)+1;}}
    else{if(cur&&cur.abs)out.push(cur);cur=null;}}
  if(cur&&cur.abs)out.push(cur);
  return out;
}
function tcSessions(){const m=lsJ("tc_sessions")||{};return Object.values(m).filter(x=>x&&(x.saved||(x.doneIdx||[]).length>=3));}
function valeSum(d){let l=0;try{Object.values((d.path&&d.path.sum)||{}).forEach(e=>l+=(+e.l||0));}catch(e){}
  const pad=x=>{const m=String(x).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0"):String(x);};
  const days=(Array.isArray(d.days)?d.days:Object.keys(d.days||{})).map(pad).filter(x=>x>=add(today(),-14));return{l,days};}
/* ---------- 📅 la settimana di «Il mio mondo»: solo numeri (giorni, risposte, nozioni per materia) ---------- */
const VMAT={mate:"🔢 Matematica",ita:"📖 Italiano",eng:"🇬🇧 Inglese",storia:"🏛️ Storia",geo:"🗺️ Geografia",scienze:"🔬 Scienze",civica:"🤝 Ed. civica",soldi:"🐷 Soldi e risparmio",lavo:"🧼 Perché mi lavo",vesto:"👗 Come mi vesto",tecno:"💡 Tecnologia",arte:"🎨 Arte",musica:"🎵 Musica",media:"🎒 Verso la 1ª media",sport:"⛸️ Sport",roblox:"🧱 Roblox"};
const VUNIT=u=>u==="parlo"?"eng":/^sci-/.test(u)?"scienze":/^sp-/.test(u)?"sport":u;
/* domande da fare a cena (con la risposta), per le materie studiate nella settimana */
const VCENA={
  mate:[["Quanto fa 7 × 8?","56"],["Come si trova il perimetro di un quadrato?","Si somma il lato 4 volte (lato × 4)"],["Quanto fa la metà di 3,40?","1,70"]],
  ita:[["Qual è il plurale di «uovo»?","Uova"],["Dimmi un nome collettivo","Per esempio gregge, flotta, sciame"],["In «Il gatto dorme», chi compie l’azione?","Il gatto: è il soggetto"]],
  eng:[["Come si dice «ho freddo» in inglese?","I'm cold"],["Come chiedi «che tempo fa?» in inglese?","What's the weather like?"],["Dimmi in inglese «mettiti la sciarpa»","Put on your scarf!"]],
  storia:[["Per che cosa erano famosi i Fenici?","Navigatori e mercanti; diffusero un alfabeto"],["Come si chiamava la scrittura degli antichi Egizi?","I geroglifici"]],
  geo:[["Qual è il capoluogo del Piemonte?","Torino"],["Qual è il fiume più lungo d’Italia?","Il Po"]],
  scienze:[["A che cosa serve il cuore?","Spinge il sangue in tutto il corpo"],["Che cosa fanno le piante con la luce del sole?","Producono il loro nutrimento (fotosintesi)"]],
  civica:[["Che cos’è la Costituzione?","La legge più importante dello Stato"]],
  soldi:[["Paghi 2,50 € con una moneta da 5 €: quanto resto ricevi?","2,50 €"],["Che differenza c’è tra un bisogno e un desiderio?","Un bisogno serve davvero (cibo, scarpe che vanno bene); un desiderio si può aspettare"],["Se risparmi 2 € a settimana, quanto hai dopo 5 settimane?","10 €"]],
  lavo:[["Per quanto tempo ci si lavano le mani?","Circa 40 secondi, con il sapone"]],
  vesto:[["Che cosa ti metti se fa freddo e nevica?","Strati caldi: maglione, giacca, guanti, sciarpa, cappello"]]};
function valeWeekData(d,prev){const out={},t=today(),from=add(t,-14);
  const pd=d["prog-days"]||{},pdx={};Object.keys(pd).filter(x=>x>=from).forEach(x=>pdx[x]=pd[x]);out.pdays=pdx;
  const su={};try{Object.entries((d.path&&d.path.sum)||{}).forEach(([u,e])=>{const k=VUNIT(u),x=su[k]||(su[k]={l:0,d:0});x.l+=+e.l||0;x.d+=+e.d||0;});}catch(e){}out.su=su;
  const h=(prev&&Array.isArray(prev.hist)?prev.hist:[]).filter(x=>x.d>=add(t,-30)&&x.d!==t);h.push({d:t,su:Object.fromEntries(Object.entries(su).map(([k,v])=>[k,v.l]))});out.hist=h.slice(-31);return out;}
function valeWeek(){let w=lsJ(VIN);const p=lsJ("prog-mm-v1");
  if((!w||!w.pdays)&&p){const d=(p.state&&p.state.data)||p.data||{};w=Object.assign({saved:p.saved},valeSum(d),valeWeekData(d,null));}
  if(!w||!w.pdays)return null;const t=today(),from=add(t,-6),per={};let ok=0,ko=0;const days=new Set((w.days||[]).filter(x=>x>=from));

/* ---------- eventi dal Calendario dell'iPad (tramite il Comando Rapido «Aggiorna Pianificazione») ----------
   Il Comando Rapido copia negli appunti una riga per evento: inizio§fine§titolo§calendario§tutto il giorno§luogo
   (date in ISO 8601). Qui si incollano: sostituiscono la copia precedente, senza doppioni. */
const SC_NAME="Aggiorna Pianificazione";
/* date come le scrive Comandi Rapidi: ISO 8601, «05/10/26, 09:50», «5 ott 2026 alle ore 09:50», «5 ottobre 2026, 9:50», «Oct 5, 2026 at 9:50 AM» */
const MESI_IT=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"],MESI_EN=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseWhen(x){
  x=String(x||"").trim().toLowerCase();if(!x)return null;
  let m=x.match(/^(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{2}):(\d{2}))?/);
  if(m)return{d:m[1]+"-"+m[2]+"-"+m[3],t:m[4]?m[4]+":"+m[5]:""};
  const tm=(x.match(/(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?\s*$/)||x.match(/(?:alle|ore|at|,)\s*(?:ore\s*)?(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?/));
  let t="";if(tm){let h=+tm[1];if(tm[3]==="p"&&h<12)h+=12;if(tm[3]==="a"&&h===12)h=0;t=pad(h)+":"+tm[2];}
  const Y=y=>{y=+y;return y<100?2000+y:y;};
  m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m)return{d:Y(m[3])+"-"+pad(+m[2])+"-"+pad(+m[1]),t};
  m=x.match(/^(\d{1,2})\s+([a-zà-ù]{3,})\.?\s+(\d{4})/);
  if(m){const k=MESI_IT.indexOf(m[2].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[1]),t};}
  m=x.match(/^([a-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if(m){const k=MESI_EN.indexOf(m[1].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[2]),t};}
  return null;
}
function parseCal(txt){
  const out=[],seen=new Set();
  String(txt||"").split(/\r?\n/).forEach(l=>{const f=l.split("§").map(z=>z.trim());if(f.length<2)return;
    // formati accettati: inizio§fine§titolo§calendario§luogo  (anche: inizio§titolo§calendario, e la vecchia riga con «tutto il giorno»)
    let S=parseWhen(f[0]),E=parseWhen(f[1]),t,cal,loc,adf=null;
    if(E){t=f[2]||"";cal=f[3]||"";if(/^(s[iì]|no|yes|true|false|1|0|vero|falso)$/i.test(f[4]||"")){adf=/^(s[iì]|yes|true|1|vero)$/i.test(f[4]);loc=f[5]||"";}else loc=f[4]||"";}
    else{t=f[1]||"";cal=f[2]||"";loc=f[3]||"";E=S;}
    if(!S||!t)return;
    if(/festivit|holiday/i.test(cal))return; // le festività le conosce già l'app
    const ad=adf!=null?adf:(!S.t||S.t==="00:00")&&(!E.t||E.t==="00:00"||E.t==="23:59");
    const k=S.d+"T"+(S.t||"")+"|"+t;if(seen.has(k))return;seen.add(k);
    let ed=E.d||S.d;if(ad&&E.t==="00:00"&&ed>S.d)ed=add(ed,-1);
    out.push({k,d:S.d,o:ad?"":S.t,f:ad||E.d!==S.d?"":E.t,ed,t,cal,ad,loc:loc.split("\n")[0]});});
  return out.sort((a,b)=>(a.d+(a.o||""))<(b.d+(b.o||""))?-1:1);
}

  if(k==="scad"){setCalV("scad");return "cal";}
  if(k==="sic")return "set";
  return ALL_SECT.includes(k)?k:"cal";}

/* ---------- 🪟 finestre: ogni riquadro con un titolo si apre e si chiude; lo stato resta su questo iPad (pn-fold) ---------- */
const FOLD_KEY="pn-fold";let foldSt=lsJ(FOLD_KEY)||{};
function foldCards(m){m.querySelectorAll(":scope > h2").forEach(h=>{const c=h.nextElementSibling;if(!c||c.tagName!=="DIV"||!c.classList.contains("card")||(c.firstElementChild&&c.firstElementChild.tagName==="H3"))return;const t=document.createElement("h3");t.innerHTML=h.innerHTML;c.prepend(t);h.remove();});
  m.querySelectorAll(".card").forEach(c=>{if(c.tagName==="DETAILS"||c.classList.contains("nofold")||c.parentElement.closest(".card"))return;const h=c.firstElementChild;if(!h||h.tagName!=="H3")return;
    const d=document.createElement("details");d.className=c.className+" fold";for(const a of [...c.attributes])if(a.name!=="class")d.setAttribute(a.name,a.value);
    const s=document.createElement("summary");s.appendChild(h);d.appendChild(s);while(c.firstChild)d.appendChild(c.firstChild);
    const k=cur+"|"+(h.textContent||"").replace(/[\d·,()€.%:+−-]+/g,"").replace(/\s+/g," ").trim().slice(0,40);d.dataset.fk=k;d.open=foldSt[k]!==false;c.replaceWith(d);});
  m.querySelectorAll("details.csb").forEach(d=>{const k=cur+"|"+d.dataset.k;d.dataset.fk=k;if(k in foldSt)d.open=foldSt[k];});
  m.querySelectorAll("details[data-fk]").forEach(d=>d.addEventListener("toggle",()=>{foldSt[d.dataset.fk]=d.open;try{localStorage.setItem(FOLD_KEY,JSON.stringify(foldSt));}catch(e){}}));}

    <div class="row"><span class="pill">2</span><div class="grow">Qui tocca <b>Aggiungi le novità</b>: si apre il file. Scegli <b>Aggiungi tutti</b> e il calendario <b>Pianificazione</b>. Se compare la condivisione, scegli <b>Calendario</b> o salvalo su File e aprilo da lì.</div></div>
    <div class="row"><span class="pill">3</span><div class="grow">Le volte successive tocca di nuovo <b>Aggiungi le novità</b>: entrano solo gli eventi nuovi o cambiati, così non si duplicano.</div></div>
    <p class="lbl">Se cambi molto (per esempio ripianifichi le licenze), cancella il calendario Pianificazione nell’app Calendario, ricrealo e usa «Tutto da capo».</p></div></details>`;
}
/* ---------- ⚙️ Impostazioni: blocco con Face ID, Calendario dell'iPad, copie ---------- */
function vSet(){
  const L=window.__pnLock,c=L&&L.cfg();
  let o=`<h1>⚙️ Impostazioni</h1><p class="sub">Le cose da sistemare una volta: blocco, collegamento con il Calendario dell’iPad, copie di sicurezza.</p>`;
  o+=c&&c.on?`<div class="card k-set"><h3>🔒 Blocco con Face ID · attivo</h3><p class="lbl">Attivato il ${new Date(c.at).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})}. All’apertura di Pianificazione, Licenze, Tai Chi e Progressi l’iPad chiede il volto; dopo 5 minuti fuori dall’app si blocca di nuovo. Se Face ID non riconosce il volto, l’iPad propone il suo codice; in più c’è il tuo codice di riserva.</p>
    <div class="btns"><button class="btn pri" id="lkNow">🔒 Blocca adesso</button><button class="btn danger" id="lkOff">Disattiva il blocco</button></div></div>`
  :`<div class="card k-set"><h3>🔒 Blocco con Face ID</h3><p class="lbl">All’apertura dell’app l’iPad chiede il volto; dopo 5 minuti fuori dall’app si blocca di nuovo. Protegge l’apertura: la protezione più forte resta il codice dell’iPad.</p><p class="lbl" id="lkAv">Controllo se questo iPad può usare Face ID…</p><div class="form">
    <label>Codice di riserva (4–8 cifre)<input id="lkP1" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
    <label>Ripeti il codice<input id="lkP2" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label></div>
    <div class="btns"><button class="btn pri" id="lkOn">🔒 Attiva con Face ID</button></div>
    <p class="lbl">Il codice di riserva serve solo se la passkey non fosse disponibile (per esempio su un altro dispositivo): scrivilo in un posto sicuro.</p></div>`;
  o+=`<div class="card k-set setl"><h3>💾 Copie di sicurezza</h3><p class="lbl" id="setSv"></p><div class="btns"><button class="btn pri" data-sa="bk">💾 Salva copia su File / iCloud</button><button class="btn" data-sa="cb">☁️ Copia automatica</button></div></div>`;
  return o+vCalImport()+vCalExport();
}
/* ---------- eventi ---------- */
function bind(){
  if(cur!=="prat")document.querySelectorAll("[data-psel]").forEach(b=>b.onclick=()=>{pratSel=b.dataset.psel;go("prat");});
  if(PRAT_ON&&cur==="prat"&&typeof bindPrat==="function")bindPrat();
  if(cur==="pens")bindPens();
  if(cur==="inv")bindInv();
  if(cur==="dia")bindDia();
  if(cur==="cd")bindCd();
  if(cur==="st")bindSt();
  if(cur==="cal"&&typeof bindCal==="function")bindCal();
  if(cur==="cal"&&calV==="scad")bindScad();
  if(CONTI_ON&&typeof bindConti==="function"&&cur==="conti")bindConti();
  if($("setSv")&&window.__svTxt)$("setSv").innerHTML=window.__svTxt();
  document.querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>{if(b.dataset.sa==="bk"&&window.__exportAll)window.__exportAll();if(b.dataset.sa==="cb"&&window.__cbPanel)window.__cbPanel();});
  if($("lkAv")&&window.__pnLock)window.__pnLock.available().then(ok=>{const e=$("lkAv");if(e)e.textContent=ok?"✓ Questo iPad può usare Face ID (o il suo codice).":"⚠️ Qui Face ID non è disponibile per le app web: puoi usare solo il codice di riserva.";});
  if($("lkOn"))$("lkOn").onclick=async()=>{const a=$("lkP1").value.trim(),b=$("lkP2").value.trim();if(!/^\d{4,8}$/.test(a)){toast("Il codice deve avere da 4 a 8 cifre");return;}if(a!==b){toast("I due codici non coincidono");return;}
    try{await window.__pnLock.enable(a);toast("🔒 Blocco attivato");render();}catch(e){toast(e&&e.name==="NotAllowedError"?"Face ID annullato":"Non riuscito: "+(e&&e.message||e));}};
  if($("lkOff"))$("lkOff").onclick=()=>{if(!confirm("Disattivare il blocco con Face ID?"))return;window.__pnLock.disable();render();toast("Blocco disattivato");};
  if($("lkNow"))$("lkNow").onclick=()=>window.__pnLock.lockNow();
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{if(b.dataset.s==="prat")pratSel=null;go(b.dataset.s);});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-gonews]").forEach(b=>b.onclick=()=>{pensV="news";go("pens");});
  document.querySelectorAll("[data-gocassa]").forEach(b=>b.onclick=()=>{pensV="cassa";try{sessionStorage.setItem("pn-pensv","cassa");}catch(e){}go("pens");});
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>doneScad(b.dataset.done));
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{const x=P.scad.find(y=>y.id===b.dataset.undo);if(x){x.done=false;delete x.doneAt;save();render();}});
  document.querySelectorAll("[data-opt]").forEach(c=>c.onchange=()=>{P.ics.opt=Object.assign({abs:true,app:true,scad:true,pens:true,prat:true,pay:true,fam:true},P.ics.opt||{});P.ics.opt[c.dataset.opt]=c.checked;save();render();});
  if($("calRun"))$("calRun").onclick=runShortcut;
  if($("calClip"))$("calClip").onclick=pasteCal;
  if($("calPasteBtn"))$("calPasteBtn").onclick=pasteCal;
  if($("calPasteGo"))$("calPasteGo").onclick=()=>{importCal($("calPaste").value);};
  if($("calSym"))$("calSym").onclick=()=>{const old=()=>{try{const t=document.createElement("textarea");t.value="§";t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();return ok;}catch(e){return false;}};
    const done=ok=>toast(ok?"§ copiato":"Non riesco a copiare: tieni premuto sul simbolo § e scegli Copia");
    try{navigator.clipboard.writeText("§").then(()=>done(true),()=>done(old()));}catch(e){done(old());}};
  if($("calClear"))$("calClear").onclick=()=>{if(!confirm("Togliere gli eventi presi dal Calendario?"))return;P.cal={at:null,ev:[]};save();render();};
  document.querySelectorAll("[data-c2s]").forEach(b=>b.onclick=()=>{const e=(P.cal.ev||[]).find(x=>x.k===b.dataset.c2s);if(!e)return;P.scad.push({id:uid(),t:e.t,d:e.d,cat:/lavoro/i.test(e.cal)?"pratica":"altro",ric:"no",av:1,note:e.loc||"",done:false,fromCal:1});save();render();toast("Aggiunta alle scadenze");});
  if($("icsNew"))$("icsNew").onclick=()=>exportIcs(false);
  if($("icsAll"))$("icsAll").onclick=()=>exportIcs(true);
}
function bindScad(){
  if($("sSave"))$("sSave").onclick=()=>{const t=$("sT").value.trim(),d=$("sD").value;if(!t||!d){toast("Scrivi che cosa e la data");return;}
    const o={t,d,cat:$("sC").value,ric:$("sR").value,av:+$("sA").value,note:$("sN").value.trim()};
    if(editId){Object.assign(P.scad.find(y=>y.id===editId),o);editId=null;toast("Modificata");}else{P.scad.push(Object.assign({id:uid(),done:false},o));toast("Scadenza aggiunta");}save();render();};
  if($("sCancel"))$("sCancel").onclick=()=>{editId=null;render();};
  if($("sDel"))$("sDel").onclick=()=>{if(!confirm("Eliminare questa scadenza?"))return;P.scad=P.scad.filter(y=>y.id!==editId);editId=null;save();render();toast("Eliminata");};
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render();const f=$("scadForm");if(f)f.scrollIntoView({behavior:"smooth",block:"start"});});
}
async function exportIcs(all){
  const opt=P.ics.opt||{abs:true,app:true,scad:true,pens:true,prat:true,pay:true,fam:true},items=icsItems(opt),list=all?items:items.filter(i=>P.ics.sent[i.uid]!==i.sig);
  if(!list.length){toast("Niente di nuovo da aggiungere");return;}
  const txt=icsText(list),fn="pianificazione-"+today()+".ics",mark=()=>{if(all)P.ics.sent={};list.forEach(i=>P.ics.sent[i.uid]=i.sig);save();render();};
  try{const f=new File([txt],fn,{type:"text/calendar"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Pianificazione"});mark();return;}}catch(e){if(e&&e.name==="AbortError")return;}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();mark();}catch(e){toast("Non riesco a creare il file");}
}
window.addEventListener("hashchange",()=>{const k=(location.hash||"").slice(1);if(k&&k!==cur){cur=mapOld(k);render();}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){softRender();valePull(false);newsFetch(false);schedaFetch(false);}});
let wNarrow=window.innerWidth<640;window.addEventListener("resize",()=>{const n=window.innerWidth<640;if(n!==wNarrow){wNarrow=n;if(cur==="pens")softRender();}});
window.addEventListener("online",()=>valePull(false));setInterval(()=>valePull(false),30*60e3);
window.__pn={dayData,licOver,icsItems,icsText,licCalc,licS,absBlocks,nextPayments,monthTotals,proj:()=>projection(),CONTI_ON,get P(){return P;}};
render(); recover(); setTimeout(()=>valePull(false),800); setTimeout(ghDaily,1500); setTimeout(()=>newsFetch(false),1200); setTimeout(()=>schedaFetch(false),1700);
</script>
