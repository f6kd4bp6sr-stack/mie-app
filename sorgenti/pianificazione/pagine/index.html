<script>
/* ================= PIANIFICAZIONE =================
   Sezioni: 📆 Calendario (punto di partenza: giorno, settimana, mese, anno, scadenze; il giorno contiene benessere e Tai Chi,
   il giorno di oggi anche il riepilogo; dentro ci sono gli impegni e le attività fisse della famiglia) · ⚙️ Impostazioni
   (blocco con Face ID, Calendario dell'iPad, copie). I vecchi indirizzi #scad, #ben, #sic, #oggi, #fam portano al posto giusto.
   Tutti i dati restano su questo dispositivo: localStorage «pn-v1» + copia nel database del dispositivo (IndexedDB «licenze-marco», voce «pianifica»)
   + copie giornaliere e copia su File/iCloud insieme a Licenze, Tai Chi e Progressi (barra in fondo). Nessun dato personale nel codice. */
"use strict";
/* 💶 Conti e 🗂️ Pratiche: interfaccia tolta il 7/11/2026 (erano spente dal 25/10). I dati restano: P.conti (lo legge la Pensione,
   contoStorico) e P.prat con i file «pf-…» restano nel salvataggio, nelle copie e nel ripristino; pratView sta in sezioni/pratiche.js. */
/*@LICENZE_DATI*/
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"short",day:"numeric",month:"short"});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const rel=d=>{const n=diff(today(),d);return n===0?"oggi":n===1?"domani":n===-1?"ieri":n<0?(-n)+" giorni fa":"tra "+n+" giorni";};

/* ---------- dati e salvataggio ---------- */
const KEY="pn-v1";
const DEF_PN={ver:1,scad:[],fam:{att:[],ev:[]},conti:{ric:[],mov:[],hide:false},ben:{d:{}},ics:{sent:{}},cal:{at:null,ev:[]},savedAt:null};

/* ---------- eventi dal Calendario dell'iPad (tramite il Comando Rapido «Aggiorna Pianificazione») ----------
   Il Comando Rapido copia negli appunti una riga per evento: inizio§fine§titolo§calendario§tutto il giorno§luogo
   (date in ISO 8601). Qui si incollano: sostituiscono la copia precedente, senza doppioni. */

/* date come le scrive Comandi Rapidi: ISO 8601, «05/10/26, 09:50», «5 ott 2026 alle ore 09:50», «5 ottobre 2026, 9:50», «Oct 5, 2026 at 9:50 AM» */
const MESI_IT=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"],MESI_EN=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseWhen(x){
  x=String(x||"").trim().toLowerCase();if(!x)return null;
  let m=x.match(/^(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{2}):(\d{2}))?/);
  if(m)return{d:m[1]+"-"+m[2]+"-"+m[3],t:m[4]?m[4]+":"+m[5]:""};
  const tm=(x.match(/(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?\s*$/)||x.match(/(?:alle|ore|at|,)\s*(?:ore\s*)?(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?/));
  let t="";if(tm){let h=+tm[1];if(tm[3]==="p"&&h<12)h+=12;if(tm[3]==="a"&&h===12)h=0;t=pad(h)+":"+tm[2];}
  const Y=y=>{y=+y;return y<100?2000+y:y;};
  m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m)return{d:Y(m[3])+"-"+pad(+m[2])+"-"+pad(+m[1]),t};

function parseCal(txt){

    let S=parseWhen(f[0]),E=parseWhen(f[1]),t,cal,loc,adf=null;
    if(E){t=f[2]||"";cal=f[3]||"";if(/^(s[iì]|no|yes|true|false|1|0|vero|falso)$/i.test(f[4]||"")){adf=/^(s[iì]|yes|true|1|vero)$/i.test(f[4]);loc=f[5]||"";}else loc=f[4]||"";}
    else{t=f[1]||"";cal=f[2]||"";loc=f[3]||"";E=S;}
    if(!S||!t)return;
    if(/festivit|holiday/i.test(cal))return; // le festività le conosce già l'app
    const ad=adf!=null?adf:(!S.t||S.t==="00:00")&&(!E.t||E.t==="00:00"||E.t==="23:59");

    out.push({k,d:S.d,o:ad?"":S.t,f:ad||E.d!==S.d?"":E.t,ed,t,cal,ad,loc:loc.split("\n")[0]});});

    <label>Si ripete<select id="sR">${Object.entries(RIC).map(([k,v])=>`<option value="${k}"${x&&x.ric===k?" selected":""}>${v}</option>`).join("")}</select></label>
    <label>Avvisami<select id="sA">${[[0,"il giorno stesso"],[1,"1 giorno prima"],[3,"3 giorni prima"],[7,"1 settimana prima"],[14,"2 settimane prima"],[30,"1 mese prima"]].map(([k,v])=>`<option value="${k}"${(x?+x.av:7)===k?" selected":""}>${v}</option>`).join("")}</select></label>
    <label class="wide">Note (facoltative)<input id="sN" maxlength="300" placeholder="ufficio, numero di pratica, documenti da portare…" value="${esc(x?x.note||"":"")}"></label>
  </div><div class="btns"><button class="btn pri" id="sSave">${x?"Salva modifiche":"Aggiungi"}</button>${x?'<button class="btn" id="sCancel">Annulla</button><button class="btn danger" id="sDel">Elimina</button>':""}</div></div>`;
  const ce=(P.cal.ev||[]).filter(e=>e.d>=t&&diff(t,e.d)<=30&&calIc(e)!=="🎂");
  if(ce.length)o+=`<details class="more"><summary>📆 Dal Calendario dell’iPad (${ce.length}, prossimi 30 giorni)</summary><div class="card k-ipad">${ce.map(e=>`<div class="row"><span class="pill">${fmt(e.d,{weekday:"short",day:"numeric",month:"short"})}${e.o?" "+esc(e.o):""}</span><div class="grow"><b>${calIc(e)} ${esc(e.t)}</b><small>${esc(e.cal)}${e.loc?" · "+esc(e.loc):""} · ${rel(e.d)}</small></div><button class="btn sm" data-c2s="${esc(e.k)}">➕ Scadenza</button></div>`).join("")}</div></details>`;
  const done=P.scad.filter(y=>y.done).sort((a,b)=>a.doneAt<b.doneAt?1:-1).slice(0,10);
  if(done.length)o+=`<details class="more"><summary>Fatte (${done.length})</summary><div class="card">${done.map(y=>`<div class="row"><button class="chk done" data-undo="${y.id}" aria-label="Riapri">✓</button><div class="grow"><b>${esc(y.t)}</b><small>fatta il ${fmt(y.doneAt)}</small></div></div>`).join("")}</div></details>`;
  return o;
}
function vCalImport(){
  return `<h2>📆 Calendario dell’iPad</h2><p class="sub">In entrata: gli eventi del Calendario dell’iPad compaiono nel Calendario di Pianificazione. In uscita: assenze, scadenze e impegni diventano promemoria nel Calendario dell’iPad.</p><div class="card k-ipad" id="calGuide"><h3>📥 Prendi gli eventi dal Calendario dell’iPad</h3>
  <p class="lbl">Un’app web non può leggere da sola il Calendario: lo fa un Comando Rapido, che copia gli eventi negli appunti. Si crea una volta sola.</p><details class="more"${P.cal.at?"":" open"}><summary>Come crearlo, passo per passo</summary>
  <div class="row"><span class="pill">1</span><div class="grow">Apri <b>Comandi Rapidi</b> → <b>+</b> → chiamalo esattamente <b>${SC_NAME}</b>.</div></div>
  <div class="row"><span class="pill">2</span><div class="grow">Aggiungi <b>Trova eventi di Calendario</b>: tocca «Aggiungi filtro» → <b>Data di inizio</b> «è nei prossimi» <b>60 giorni</b>; nessun altro filtro (le festività le salta l’app, che le conosce già). Ordina per <b>Data di inizio</b>, limite 300.</div></div>
  <div class="row"><span class="pill">3</span><div class="grow">Aggiungi <b>Ripeti con ognuno</b>. Dentro, aggiungi <b>Testo</b> e scrivi, usando le variabili di «Elemento ripetuto»:<br><code>Data di inizio§Data di fine§Titolo§Calendario§Luogo</code><br>Le date vanno bene così come le propone l’iPad, senza cambiare formato. Il simbolo § copialo con il pulsante qui sotto.</div></div>
  <div class="row"><span class="pill">4</span><div class="grow">Dopo «Fine ripetizione» aggiungi <b>Combina testo</b> (con «Nuova riga») e poi <b>Copia negli appunti</b>.</div></div>
  <div class="row"><span class="pill">5</span><div class="grow">Nel Calendario di Pianificazione tocca <b>🔄 Aggiorna dal Calendario dell’iPad</b>: parte il Comando Rapido; torna qui con «◀ Pianificazione» in alto a sinistra e tocca <b>📥 Tocca qui per inserire gli eventi</b> (iPad chiede «Incolla»: consenti).</div></div>
  <div class="row"><span class="pill">6</span><div class="grow">Facoltativo, ogni mattina da solo: Comandi Rapidi → <b>Automazione</b> → <b>Ora del giorno</b> 7:00 → <b>Esegui subito</b> → «${SC_NAME}». Poi in Pianificazione basta <b>📥 Incolla dagli appunti</b>.</div></div></details>
  <div class="form" style="margin-top:10px"><label class="wide">Oppure incolla qui il testo copiato<textarea id="calPaste" rows="3" placeholder="2026-10-06T17:00:00+02:00§…"></textarea></label></div>
  <div class="btns"><button class="btn pri" id="calPasteGo">Inserisci</button><button class="btn" id="calSym">Copia il simbolo §</button>${P.cal.at?'<button class="btn danger" id="calClear">Togli gli eventi importati</button>':""}</div></div>`;
}
function vCalExport(){
  const opt=P.ics.opt||{abs:true,app:true,scad:true,pens:true,prat:true,pay:true,fam:true},items=icsItems(opt),news=items.filter(i=>P.ics.sent[i.uid]!==i.sig);
  const lab={abs:"🏖️ Periodi a casa (dalle Licenze)",app:"📅 Appuntamenti delle Licenze e congedo",scad:"📌 Scadenze (con promemoria)",pens:"🎖️ Adempimenti e leve della Pensione",fam:"👨‍👧 Attività della famiglia"};lab.dia="📓 Diario: la domanda della domenica sera e le tappe";
  return `<div class="card k-ipad" id="icsBox"><h3>📤 Manda i promemoria al Calendario</h3><p class="lbl" style="margin-top:0">Un file da aggiungere al Calendario dell’iPad: i promemoria arrivano anche ad app chiusa e su tutti i dispositivi con iCloud.</p><h3 style="color:var(--ink);font-size:15px;margin-top:10px">Che cosa mettere nel Calendario</h3>${Object.keys(lab).map(k=>`<label class="row" style="cursor:pointer"><input type="checkbox" data-opt="${k}"${(k==="dia"?opt[k]!==false:opt[k])?" checked":""} style="width:22px;height:22px"><span class="grow">${lab[k]}</span></label>`).join("")}
    <div class="kpi" style="margin-top:10px"><div><b>${items.length}</b><span>eventi in tutto</span></div><div><b>${news.length}</b><span>nuovi o cambiati dall’ultima volta</span></div></div>
    <div class="btns"><button class="btn pri" id="icsNew"${news.length?"":" disabled"}>📆 Aggiungi le novità (${news.length})</button><button class="btn" id="icsAll">Tutto da capo (${items.length})</button></div></div>
  <details class="more"><summary>Come si fa (una volta sola)</summary><div class="card k-ipad">
    <div class="row"><span class="pill">1</span><div class="grow">Nell’app Calendario crea un calendario chiamato <b>Pianificazione</b> (Calendari → Aggiungi calendario).</div></div>
    <div class="row"><span class="pill">2</span><div class="grow">Qui tocca <b>Aggiungi le novità</b>: si apre il file. Scegli <b>Aggiungi tutti</b> e il calendario <b>Pianificazione</b>. Se compare la condivisione, scegli <b>Calendario</b> o salvalo su File e aprilo da lì.</div></div>
    <div class="row"><span class="pill">3</span><div class="grow">Le volte successive tocca di nuovo <b>Aggiungi le novità</b>: entrano solo gli eventi nuovi o cambiati, così non si duplicano.</div></div>
    <p class="lbl">Se cambi molto (per esempio ripianifichi le licenze), cancella il calendario Pianificazione nell’app Calendario, ricrealo e usa «Tutto da capo».</p></div></details>`;
}
/* ---------- ⚙️ Impostazioni: blocco con Face ID, Calendario dell'iPad, copie ---------- */
function vSet(){
  const L=window.__pnLock,c=L&&L.cfg();
  let o=`<h1>⚙️ Impostazioni</h1><p class="sub">Le cose da sistemare una volta: blocco, collegamento con il Calendario dell’iPad, copie di sicurezza.</p>`;
  o+=c&&c.on?`<div class="card k-set"><h3>🔒 Blocco con Face ID · attivo</h3><p class="lbl">Attivato il ${new Date(c.at).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})}. All’apertura di Pianificazione, Licenze, Tai Chi e Progressi l’iPad chiede il volto; dopo 5 minuti fuori dall’app si blocca di nuovo. Se Face ID non riconosce il volto, l’iPad propone il suo codice; in più c’è il tuo codice di riserva.</p>
    <div class="btns"><button class="btn pri" id="lkNow">🔒 Blocca adesso</button><button class="btn danger" id="lkOff">Disattiva il blocco</button></div></div>`
  :`<div class="card k-set"><h3>🔒 Blocco con Face ID</h3><p class="lbl">All’apertura dell’app l’iPad chiede il volto; dopo 5 minuti fuori dall’app si blocca di nuovo. Protegge l’apertura: la protezione più forte resta il codice dell’iPad.</p><p class="lbl" id="lkAv">Controllo se questo iPad può usare Face ID…</p><div class="form">
    <label>Codice di riserva (4–8 cifre)<input id="lkP1" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
    <label>Ripeti il codice<input id="lkP2" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label></div>
    <div class="btns"><button class="btn pri" id="lkOn">🔒 Attiva con Face ID</button></div>
    <p class="lbl">Il codice di riserva serve solo se la passkey non fosse disponibile (per esempio su un altro dispositivo): scrivilo in un posto sicuro.</p></div>`;
  o+=`<div class="card k-set setl"><h3>💾 Copie di sicurezza</h3><p class="lbl" id="setSv"></p><div class="btns"><button class="btn pri" data-sa="bk">💾 Salva copia su File / iCloud</button><button class="btn" data-sa="cb">☁️ Copia automatica</button></div></div>`;
  return o+vCalImport()+vCalExport();
}
/* ---------- eventi ---------- */
function bind(){
  if(cur==="pens")bindPens();
  if(cur==="inv")bindInv();
  if(cur==="dia")bindDia();
  if(cur==="cd")bindCd();
  if(cur==="st")bindSt();
  if(cur==="auto")bindAuto();
  if(cur==="corsi")bindCorsi();
  if(cur==="tl")bindTl();
  if(cur==="cal"&&typeof bindCal==="function")bindCal();
  if(cur==="oggi"&&typeof bindCal==="function"){bindCal();document.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{setCalV(b.dataset.cv);if(calV==="giorno")calD=calSel;go("cal");});}
  if(cur==="cal"&&calV==="scad")bindScad();
  if($("setSv")&&window.__svTxt)$("setSv").innerHTML=window.__svTxt();
  document.querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>{if(b.dataset.sa==="bk"&&window.__exportAll)window.__exportAll();if(b.dataset.sa==="cb"&&window.__cbPanel)window.__cbPanel();});
  if($("lkAv")&&window.__pnLock)window.__pnLock.available().then(ok=>{const e=$("lkAv");if(e)e.textContent=ok?"✓ Questo iPad può usare Face ID (o il suo codice).":"⚠️ Qui Face ID non è disponibile per le app web: puoi usare solo il codice di riserva.";});
  if($("lkOn"))$("lkOn").onclick=async()=>{const a=$("lkP1").value.trim(),b=$("lkP2").value.trim();if(!/^\d{4,8}$/.test(a)){toast("Il codice deve avere da 4 a 8 cifre");return;}if(a!==b){toast("I due codici non coincidono");return;}
    try{await window.__pnLock.enable(a);toast("🔒 Blocco attivato");render();}catch(e){toast(e&&e.name==="NotAllowedError"?"Face ID annullato":"Non riuscito: "+(e&&e.message||e));}};
  if($("lkOff"))$("lkOff").onclick=()=>{if(!confirm("Disattivare il blocco con Face ID?"))return;window.__pnLock.disable();render();toast("Blocco disattivato");};
  if($("lkNow"))$("lkNow").onclick=()=>window.__pnLock.lockNow();
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>go(b.dataset.s));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if($("ogHealth"))$("ogHealth").onclick=()=>{if(window.pnHealth)window.pnHealth();};
  document.querySelectorAll("[data-gonews]").forEach(b=>b.onclick=()=>{pensV="news";go("pens");});
  document.querySelectorAll("[data-gocassa]").forEach(b=>b.onclick=()=>{pensV="cassa";try{sessionStorage.setItem("pn-pensv","cassa");}catch(e){}go("pens");});
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>doneScad(b.dataset.done));
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{const x=P.scad.find(y=>y.id===b.dataset.undo);if(x){x.done=false;delete x.doneAt;save();render();}});
  document.querySelectorAll("[data-opt]").forEach(c=>c.onchange=()=>{P.ics.opt=Object.assign({abs:true,app:true,scad:true,pens:true,prat:true,pay:true,fam:true},P.ics.opt||{});P.ics.opt[c.dataset.opt]=c.checked;save();render();});
  if($("calPasteGo"))$("calPasteGo").onclick=()=>{importCal($("calPaste").value);};
  if($("calSym"))$("calSym").onclick=()=>{const old=()=>{try{const t=document.createElement("textarea");t.value="§";t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();return ok;}catch(e){return false;}};
    const done=ok=>toast(ok?"§ copiato":"Non riesco a copiare: tieni premuto sul simbolo § e scegli Copia");
    try{navigator.clipboard.writeText("§").then(()=>done(true),()=>done(old()));}catch(e){done(old());}};
  if($("calClear"))$("calClear").onclick=()=>{if(!confirm("Togliere gli eventi presi dal Calendario?"))return;P.cal={at:null,ev:[]};save();render();};
  document.querySelectorAll("[data-c2s]").forEach(b=>b.onclick=()=>{const e=(P.cal.ev||[]).find(x=>x.k===b.dataset.c2s);if(!e)return;P.scad.push({id:uid(),t:e.t,d:e.d,cat:/lavoro/i.test(e.cal)?"pratica":"altro",ric:"no",av:1,note:e.loc||"",done:false,fromCal:1});save();render();toast("Aggiunta alle scadenze");});
  if($("icsNew"))$("icsNew").onclick=()=>exportIcs(false);
  if($("icsAll"))$("icsAll").onclick=()=>exportIcs(true);
}
function bindScad(){
  if($("sSave"))$("sSave").onclick=()=>{const t=$("sT").value.trim(),d=$("sD").value;if(!t||!d){toast("Scrivi che cosa e la data");return;}
    const o={t,d,cat:$("sC").value,ric:$("sR").value,av:+$("sA").value,note:$("sN").value.trim()};
    if(editId){Object.assign(P.scad.find(y=>y.id===editId),o);editId=null;toast("Modificata");}else{P.scad.push(Object.assign({id:uid(),done:false},o));toast("Scadenza aggiunta");}save();render();};
  if($("sCancel"))$("sCancel").onclick=()=>{editId=null;render();};
  if($("sDel"))$("sDel").onclick=()=>{if(!confirm("Eliminare questa scadenza?"))return;P.scad=P.scad.filter(y=>y.id!==editId);editId=null;save();render();toast("Eliminata");};
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render();const f=$("scadForm");if(f)f.scrollIntoView({behavior:"smooth",block:"start"});});
}
async function exportIcs(all){
  const opt=P.ics.opt||{abs:true,app:true,scad:true,pens:true,prat:true,pay:true,fam:true},items=icsItems(opt),list=all?items:items.filter(i=>P.ics.sent[i.uid]!==i.sig);
  if(!list.length){toast("Niente di nuovo da aggiungere");return;}
  const txt=icsText(list),fn="pianificazione-"+today()+".ics",mark=()=>{if(all)P.ics.sent={};list.forEach(i=>P.ics.sent[i.uid]=i.sig);save();render();};
  try{const f=new File([txt],fn,{type:"text/calendar"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Pianificazione"});mark();return;}}catch(e){if(e&&e.name==="AbortError")return;}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();mark();}catch(e){toast("Non riesco a creare il file");}
}
window.addEventListener("hashchange",()=>{const k=(location.hash||"").slice(1);if(k&&k!==cur){cur=mapOld(k);render();}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){softRender();valePull(false);newsFetch(false);schedaFetch(false);}});
let wNarrow=window.innerWidth<640;window.addEventListener("resize",()=>{const n=window.innerWidth<640;if(n!==wNarrow){wNarrow=n;if(cur==="pens")softRender();}});
window.addEventListener("online",()=>valePull(false));setInterval(()=>valePull(false),30*60e3);
window.__pn={dayData,licOver,icsItems,icsText,licCalc,licS,absBlocks,get P(){return P;}};
render(); recover(); setTimeout(()=>valePull(false),800); setTimeout(ghDaily,1500); setTimeout(()=>newsFetch(false),1200); setTimeout(()=>schedaFetch(false),1700);
</script>
