<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pianificazione">

<title>Metodo</title>
<style>
:root{--m:#b86e00;--m-bg:#fff1dc;--bg:#f4f5f9;--card:#fff;--ink:#16191f;--muted:#687180;--line:#e6e8ee;--seg:#eceef3;--ok:#2e7d5b;--ok-bg:#e1f3e9;--warn:#d6342c;--warn-bg:#fdeceb;
  --shadow:0 1px 2px rgba(20,24,32,.05),0 4px 16px rgba(20,24,32,.05);--l1:#2e7d5b;--l1-bg:#e1f3e9;--l2:#1f5fae;--l2-bg:#e3edf9;--l3:#b8336a;--l3-bg:#fbe6ef}
@media (prefers-color-scheme:dark){:root{--m:#f0a43a;--m-bg:#3a2a12;--bg:#0f1115;--card:#1a1d23;--ink:#eef0f4;--muted:#9aa3af;--line:#2b3039;--seg:#242830;--ok:#5cc494;--ok-bg:#173226;--warn:#ff8a80;--warn-bg:#3d1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.4);--l1:#5cc494;--l1-bg:#173226;--l2:#7ea6f0;--l2-bg:#1b2a44;--l3:#f07ab3;--l3-bg:#3d1a2b}
  .mtabs button.on,.btn.pri{color:#1b1306}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:8px 16px 0}
h1{font-size:28px;margin:10px 2px 2px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:800}
.sub{color:var(--muted);margin:0 2px 14px;font-size:15px}
.mtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 16px}.mtabs::-webkit-scrollbar{display:none}
.mtabs button{border:0;font:inherit;font-weight:700;font-size:15.5px;background:var(--card);color:var(--ink);padding:10px 15px;border-radius:14px;box-shadow:var(--shadow);white-space:nowrap;cursor:pointer}
.mtabs button.on{background:var(--m);color:#fff}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:inset 0 4px 0 var(--m),var(--shadow)}
.card.plain{box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{color:var(--muted);font-size:13.5px}
.pill{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--seg);color:var(--ink);white-space:nowrap}
.pill.m{background:var(--m-bg);color:var(--m)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.l1{background:var(--l1-bg);color:var(--l1)}.pill.l2{background:var(--l2-bg);color:var(--l2)}.pill.l3{background:var(--l3-bg);color:var(--l3)}
.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--seg);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--m);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:var(--warn-bg);color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lnk{font:inherit;font-size:14px;font-weight:700;color:var(--m);background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.week{display:flex;gap:14px;align-items:center}
.week .big{font-size:40px;line-height:1}
.steps{display:flex;gap:6px;margin-top:10px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--seg)}.steps i.on{background:var(--m)}.steps i.done{background:var(--m);opacity:.4}
.sf{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.motto{font-style:italic;color:var(--m);font-weight:650}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:-4px 0 10px}
details.win{padding:0}details.win>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px}details.win>summary::-webkit-details-marker{display:none}
details.win>summary h3{margin:0;flex:1}details.win>.wb{padding:0 16px 16px}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--seg);display:grid;place-items:center;transition:transform .2s}.chev::before{content:"";width:8px;height:8px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:translateY(-2px) rotate(45deg)}
details[open]>summary>.chev{transform:rotate(180deg)}
details.subw{border-top:1px solid var(--line)}details.subw:first-of-type{border-top:0}details.subw>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 0;font-weight:700;font-size:16px}details.subw>summary::-webkit-details-marker{display:none}
details.subw>summary .chev{width:26px;height:26px;margin-left:auto}details.subw>.sb{padding:0 0 12px}details.subw details.subw{background:var(--seg);border-radius:12px;padding:0 12px;margin-top:8px;border:0}details.subw details.subw>summary{color:var(--m);font-size:15px}
.fr{display:inline-block;background:var(--m-bg);color:var(--m);font-weight:700;border-radius:10px;padding:4px 10px;margin:2px 0 6px}.ct{font-size:17px}.trad{color:var(--m)}.wb p,.sb p{margin:6px 0}
.week7{display:flex;gap:6px}.week7 span{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--seg);font-weight:800;color:var(--muted)}.week7 span.ok{background:var(--m);color:#fff}.week7 span.oggi{box-shadow:inset 0 0 0 2px var(--m);color:var(--m)}
.mc{font:inherit;color:var(--ink);border-radius:18px;padding:16px;cursor:pointer;display:grid;gap:8px;align-content:start;text-align:left;min-height:170px;border:2px solid var(--line);background:var(--card)}
.mc.back{place-items:center;align-content:center;text-align:center;border:0;color:#fff;background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 10px,transparent 10px 20px),var(--m)}
.mc.back.l1{background-color:var(--l1)}.mc.back.l1,.mc.back.l2,.mc.back.l3{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 10px,transparent 10px 20px)}.mc.back.l2{background-color:var(--l2)}.mc.back.l3{background-color:var(--l3)}
.mc.back .lv{font-size:44px;line-height:1}.mc.back b{font-size:18px}.mc.back .lbl{color:rgba(255,255,255,.85)}
.mc.front{animation:flip .35s ease-out}.mc.front.on{border-color:var(--m);background:var(--m-bg)}
@keyframes flip{from{transform:rotateY(80deg);opacity:.3}to{transform:none;opacity:1}}
.mc .nm{font-size:18px}.mc .t{font-size:16px;line-height:1.35}.mc .bo{font-size:14px;color:var(--muted);font-style:italic}.mc .h{display:flex;gap:6px;flex-wrap:wrap}
.cur{padding:4px 0 10px;border-top:1px solid var(--line)}.cur:first-of-type{border-top:0}.card>.cur:first-child{border-top:0}.cur .ct{font-size:17px}.cur p{margin:6px 0}.cur .trad{color:var(--m)}
.qq{font-size:17px;font-weight:650;margin:0 0 10px}.qo{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 8px;cursor:pointer}
.qo.ok{border-color:var(--ok);background:var(--ok-bg)}.qo.no{border-color:var(--warn);background:var(--warn-bg)}.qo.dim{opacity:.55}.qo .qr{display:block;margin-top:4px;font-size:14.5px}
.fpick{margin-top:12px;font-size:21px;font-weight:700;background:var(--m-bg);color:var(--ink);border-radius:16px;padding:16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.star{font:inherit;font-size:22px;background:none;border:0;cursor:pointer;color:var(--muted);padding:0 4px}.star.on{color:#e0a100}
.medg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.med{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;gap:4px;opacity:.55;filter:grayscale(1)}.med.on{opacity:1;filter:none;box-shadow:inset 0 4px 0 var(--m),var(--shadow)}
.med .mi{font-size:34px}.med small{color:var(--muted)}
details.bib>summary{cursor:pointer;list-style:none}details.bib>summary::-webkit-details-marker{display:none}
.sfc{text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:grid;gap:8px;align-content:start}
.sfc.on{border-color:var(--m);background:var(--m-bg)}
.sfc .t{font-size:16.5px;font-weight:650;line-height:1.35}
.sfc .h{display:flex;gap:6px;flex-wrap:wrap}
.done{display:flex;gap:12px;align-items:flex-start}
.done .tick{font-size:30px;line-height:1}
.faces{display:flex;gap:8px;margin-top:6px}
.faces button{font-size:28px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:4px 10px;cursor:pointer}
.faces button.on{border-color:var(--m);background:var(--m-bg)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.form .wide{grid-column:1/-1}
.form input,.form textarea,.form select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);color:var(--ink);width:100%;min-height:42px}
.form textarea{resize:vertical}
.sch{border-top:1px solid var(--line);padding:12px 0}.sch:first-of-type{border-top:0;padding-top:4px}
.sch b.t{font-size:16.5px}
.sch .es{font-style:italic;margin:6px 0;color:var(--ink)}
.sch .fr{display:inline-block;background:var(--m-bg);color:var(--m);font-weight:700;border-radius:10px;padding:4px 10px;margin:2px 0 6px}
.sch .bs{font-size:13.5px;color:var(--muted)}
details.app{margin-top:8px;border-radius:12px;background:var(--seg);padding:8px 12px}details.app>summary{cursor:pointer;font-weight:700;color:var(--m);list-style:none}details.app>summary::-webkit-details-marker{display:none}
details.app>summary::before{content:"▸ "}details.app[open]>summary::before{content:"▾ "}
details.app h4{margin:10px 0 4px;font-size:14px}details.app p,details.app ol,details.app ul{margin:4px 0;font-size:15px}details.app ol,details.app ul{padding-left:22px}
.fo{font-size:14px;line-height:1.4;margin:4px 0}.fo a{color:var(--m);font-weight:700;text-decoration:none;word-break:break-word}.fo .k{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:0 6px;margin-right:4px;background:var(--card);color:var(--muted)}
.bib .fo{padding:8px 0;border-top:1px solid var(--line)}.bib .fo:first-of-type{border-top:0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}.row small{display:block;color:var(--muted)}
.row .fc{font-size:24px;line-height:1.2}
.empty{color:var(--muted);margin:4px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0}
.kpi div{background:var(--seg);border-radius:14px;padding:10px 12px}.kpi b{display:block;font-size:24px}.kpi span{font-size:13px;color:var(--muted)}
.occ .meta{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.occ p{margin:6px 0}
.occ .primo{background:var(--m-bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#16191f;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:600px){h1{font-size:24px}.mtabs button{font-size:14.5px;padding:9px 12px}}
</style>

<body>
<!--@NAV-->
<div class="wrap">
  <h1>🤝 Metodo</h1>
  <p class="sub" id="intro"></p>
  <nav class="mtabs" id="tabs" aria-label="Parti del Metodo"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= 🤝 METODO =================
   Allenamento alla simpatia, in tono ironico: 4 abilità, una a settimana (👋 Aprire · 💬 Tenere viva la chiacchierata · 🔁 Farsi vivo ·
   😊 Calore), poi si riparte con missioni più impegnative. 🃏 Oggi: 3 carte coperte (Riscaldamento, Si fa sul serio, Da leoni),
   la curiosità e la frase del giorno. 🧠 Lo sapevi? (curiosità con la scienza e le fonti dietro «Da dove viene?»). 💬 Frasi di scorta.
   🤲 Volontariato a Torino (file pubblico occasioni-torino.json, ricontrollato dall'attività programmata).
   Ogni finestra si apre e si chiude; lo stato resta su questo iPad (pn-metfold). Contenuti in sezioni/metodo_dati.json, controllati a ogni
   build da strumenti/verifica_metodo.py. Dati personali solo su questo dispositivo: localStorage «pn-v1» → «met» (+ database «licenze-marco»,
   voce «pianifica»), quindi nelle copie giornaliere e su iCloud. Nessun dato personale nel codice. */
"use strict";
const MD=/*@METODO_DATI*/null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"long",day:"numeric",month:"long"});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}
const AB=MD.abilita,SF=Object.fromEntries(MD.sfide.map(x=>[x.id,x]));
const dayN=s=>diff("2026-01-05",s);

/* ---------- dati (pn-v1 → met) ---------- */
const KEY="pn-v1";
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):st.put(val,key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
const normM=m=>{ // incontri, quiz e medaglie restano salvati ma non si mostrano più
m=m&&typeof m==="object"?m:{};m.g=m.g&&typeof m.g==="object"?m.g:{};m.occ=m.occ&&typeof m.occ==="object"?m.occ:{};m.lette=m.lette||{};m.fav=m.fav||{};return m;};
let M=normM((lsJ(KEY)||{}).met);
let saveT=null;
function save(){const P=lsJ(KEY)||{ver:1};P.met=M;P.savedAt=new Date().toISOString();const t=JSON.stringify(P); // riparto sempre dall'ultima versione salvata: le altre sezioni restano intatte
  try{localStorage.setItem(KEY,t);}catch(e){toast("⚠️ Memoria piena: non salvato");return;}clearTimeout(saveT);saveT=setTimeout(()=>kv("readwrite","pianifica",t).catch(()=>{}),300);}
async function recover(){if(lsJ(KEY))return;try{const t=await kv("readonly","pianifica");if(t){localStorage.setItem(KEY,t);M=normM(JSON.parse(t).met);render();}}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- il percorso: un'abilità a settimana, poi si riparte con missioni più impegnative ---------- */
function startOf(){if(!M.start){M.start=monday(today());save();}return M.start;}
function weekInfo(s){const w=Math.max(0,Math.floor(diff(startOf(),s)/7));return{w,ab:AB[w%4],n:w%4+1,ciclo:Math.floor(w/4)};}
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;};
function propose(s,rnd){
  const W=weekInfo(s),lv=W.ciclo?[2,3,3]:[1,2,3],recent=new Set();
  for(let i=1;i<=21;i++){const g=M.g[add(s,-i)];if(g&&g.s)recent.add(g.s);}
  const seed=rnd?Math.floor(Math.random()*1e9):hash(s+W.ab.id);const out=[],used=new Set();
  lv.forEach((l,k)=>{let pool=MD.sfide.filter(x=>x.ab===W.ab.id&&x.liv===l&&!out.includes(x.id));
    const fresh=pool.filter(x=>!recent.has(x.id)&&!used.has(x.sit));if(fresh.length)pool=fresh;else{const f2=pool.filter(x=>!used.has(x.sit));if(f2.length)pool=f2;}
    if(!pool.length)return;const x=pool[(seed>>>(k*5))%pool.length];out.push(x.id);used.add(x.sit);});
  return out;
}
function dayG(s){let g=M.g[s];if(!g||!Array.isArray(g.p)){g=M.g[s]=Object.assign(g||{},{ab:weekInfo(s).ab.id,p:propose(s)});save();}return g;}
function occPrimo(s){const v=OCC&&(OCC.voci||[]).find(x=>"occ:"+x.id===s);return v?`<span class="lbl">${esc(v.primo)}</span>`:"";}
function sfTxt(g){if(!g||!g.s)return "";if(g.s.startsWith("occ:"))return g.txt||"";const x=SF[g.s];return x?x.nome+": "+x.t:"";}

/* ---------- finestre che si aprono e si chiudono (lo stato resta su questo iPad) ---------- */
const FKEY="pn-metfold";let FOLD=(()=>{try{return JSON.parse(localStorage.getItem(FKEY)||"{}")||{};}catch(e){return {};}})();
function foldSave(){try{localStorage.setItem(FKEY,JSON.stringify(FOLD));}catch(e){}}
const winOpen=(k,def)=>k in FOLD?!!FOLD[k]:!!def;
function win(k,title,body,def,cls){return `<details class="card win ${cls||""}" data-fk="${k}"${winOpen(k,def)?" open":""}><summary><h3>${title}</h3><span class="chev" aria-hidden="true"></span></summary><div class="wb">${body}</div></details>`;}
function sub(k,title,body,def){return `<details class="subw" data-fk="${k}"${winOpen(k,def)?" open":""}><summary>${title}<span class="chev" aria-hidden="true"></span></summary><div class="sb">${body}</div></details>`;}
const tools=()=>`<div class="tools"><button class="btn sm" data-all="1">➕ Apri tutto</button><button class="btn sm" data-all="0">➖ Chiudi tutto</button></div>`;

/* ---------- interfaccia ---------- */
const TABS=[["oggi","🃏 Oggi"],["sapevi","🧠 Lo sapevi?"],["frasi","💬 Frasi di scorta"],["vol","🤲 Volontariato"]];
let tab=(()=>{const ok=v=>TABS.some(t=>t[0]===v),h=(location.hash||"").slice(1);if(ok(h))return h;try{const v=localStorage.getItem("pn-metv");return ok(v)?v:"oggi";}catch(e){return "oggi";}})();
let frCat="tutte",frPick=null;
function setTab(t){tab=t;try{localStorage.setItem("pn-metv",t);}catch(e){}history.replaceState(null,"","#"+t);render();scrollTo({top:0});}
function render(){
  $("intro").textContent=MD.intro;
  $("tabs").innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${n}</button>`).join("");
  $("main").innerHTML=tools()+({oggi:vOggi,sapevi:vSapevi,frasi:vFrasi,vol:vVol}[tab]||vOggi)();
  bind();
}
const LIVI=["","🌱","🌿","🦁"];
const livP=l=>`<span class="pill l${l}">${LIVI[l]} ${esc(MD.livelli[l])}</span>`;
const sitP=s=>`<span class="pill">${esc(MD.situazioni[s]||s)}</span>`;
const pickDay=(L,s,salt)=>L[((dayN(s)+(salt||0))%L.length+L.length)%L.length];

function vOggi(){
  const t=today(),W=weekInfo(t),g=dayG(t);
  let o=win("o-sett",`${W.ab.ic} Settimana ${W.n} di 4 · ${esc(W.ab.n)}`,`<div class="motto">«${esc(W.ab.motto)}»</div><div class="lbl" style="margin-top:4px">${esc(W.ab.sotto)}${W.ciclo?` · giro ${W.ciclo+1}: si alza l'asticella`:""}</div>
    <div class="steps">${AB.map((a,i)=>`<i class="${i===W.n-1?"on":i<W.n-1?"done":""}" title="${esc(a.n)}"></i>`).join("")}</div>`,true);
  // la missione
  let m;
  if(g.s&&g.ok){const x=SF[g.s];m=`<div class="done"><span class="tick">✅</span><div class="grow"><b>${esc(x?x.nome:"🤲 Primo passo")}</b><div>${esc(x?x.t:g.txt)}</div><div class="btns"><button class="btn sm" data-a="gundo">Non l'ho ancora fatta</button></div></div></div>`;}
  else{const rev=new Set(g.rev||[]);
    m=`<p class="lbl" style="margin:0 0 10px">Tre carte coperte, tre livelli. Girane una: è la tua missione. Se non ti convince, girane un'altra.</p><div class="sf">`+
      g.p.map(id=>{const x=SF[id];if(!x)return "";if(!rev.has(id)&&g.s!==id)return `<button class="mc back l${x.liv}" data-pick="${id}"><span class="lv">${LIVI[x.liv]}</span><b>${esc(MD.livelli[x.liv])}</b><span class="lbl">tocca per girare</span></button>`;
        return `<button class="mc front${g.s===id?" on":""}" data-pick="${id}"><span class="h">${livP(x.liv)}${sitP(x.sit)}</span><b class="nm">${esc(x.nome)}</b><span class="t">${esc(x.t)}</span>${x.bonus?`<span class="bo">✨ Bonus: ${esc(x.bonus)}</span>`:""}</button>`;}).join("")+
      (g.s&&g.s.startsWith("occ:")?`<button class="mc front on" data-pick="${esc(g.s)}"><span class="h">${livP(3)}${sitP("vol")}</span><b class="nm">🤲 Primo passo</b><span class="t">${esc(g.txt)}</span>${occPrimo(g.s)}</button>`:"")+
      `</div><div class="btns">${g.s?`<button class="btn ok" data-a="gdone">✓ Missione compiuta</button>`:""}<button class="btn sm" data-a="gnew">🔀 Rimescola il mazzo</button></div>
      <p class="lbl" style="margin:10px 0 0">Saltare un giorno va benissimo: niente serie da tenere, nessuno ti toglie punti.</p>`;}
  o+=win("o-missione",g.s&&g.ok?"🃏 Missione compiuta!":"🃏 Pesca la missione di oggi",m,true);
  // lo sapevi del giorno
  const L=[{intro:1}].concat(MD.schede.filter(x=>x.ab===W.ab.id)),c=pickDay(L,t);
  o+=win("o-sapevi","🧠 Lo sapevi?",(c.intro?curioIntro():curioBody(c))+`<p style="margin:8px 0 0"><button class="lnk" data-tab="sapevi">Tutte le ${MD.schede.length+1} curiosità ›</button></p>`,true);
  // la frase del giorno
  const F=ALLF(),fr=pickDay(F,t,7);
  o+=win("o-frase","💬 La frase di scorta di oggi",`<div class="fpick">«${esc(fr.f)}»${star(fr.f)}</div><p class="lbl" style="margin:8px 0 0">${fr.c.ic} ${esc(fr.c.n)} · <button class="lnk" data-tab="frasi">Tutte le frasi ›</button></p>`,true);
  // missione già fatta nella settimana
  const days=[...Array(7)].map((_,i)=>add(monday(t),i)),n=days.filter(s=>M.g[s]&&M.g[s].ok).length;
  o+=win("o-ritmo","📅 La tua settimana",`<div class="week7">${days.map(s=>`<span class="${M.g[s]&&M.g[s].ok?"ok":s===t?"oggi":""}" title="${esc(fmt(s))}">${["L","M","M","G","V","S","D"][(parse(s).getDay()+6)%7]}</span>`).join("")}</div><p class="lbl" style="margin:8px 0 0">${n?`${n} ${n===1?"missione compiuta":"missioni compiute"} questa settimana.`:"Ancora nessuna missione questa settimana: il mazzo ti aspetta."} Ricorda: dopo una chiacchierata, di solito sei piaciuto più di quanto pensi.</p>`,false);
  return o;
}

/* ---------- 🧠 Lo sapevi? (la scienza resta dietro «Da dove viene?») ---------- */
const FT={studio:"📄 studio",articolo:"📰 spiegato in breve",libro:"📘 libro"};
function fonteH(f){return `<div class="fo"><span class="k">${FT[f.t]||"fonte"}</span>${esc(f.c)}${f.url?` <a href="${esc(f.url)}" target="_blank" rel="noopener">${f.url.includes("doi.org")?"DOI ›":"Apri ›"}</a>`:""}</div>`;}
function appH(a,lid,x){if(!a)return "";return sub("app-"+lid,"🔎 Da dove viene? Lo studio, come provarci, le fonti",`
  ${x?`<h4>📏 La regola</h4><p>${esc(x.princ)}</p><p class="es">${esc(x.es)}</p>`:""}
  <h4>🧪 Che cosa hanno scoperto</h4><p>${esc(a.come)}</p>
  <h4>✅ Prova così</h4><ol>${(a.prova||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
  <h4>⚠️ Attenzione</h4><p>${esc(a.att)}</p>
  <h4>📚 Fonti <span class="lbl" style="font-weight:600">(in inglese)</span></h4>${(a.fonti||[]).map(fonteH).join("")}`,false);}
function curioBody(x,noTit){const c=x.curio;return `${noTit?"":`<b class="ct">${esc(c.tit)}</b>`}<p>${esc(c.fatto)}</p><p class="trad">👉 <b>Tradotto:</b> ${esc(c.trad)}</p><span class="fr">💬 «${esc(x.frase)}»</span>${appH(x.app,x.id,x)}`;}
function curioIntro(noTit){const c=MD.intro_curio;return `${noTit?"":`<b class="ct">${esc(c.tit)}</b>`}<p>${esc(c.fatto)}</p><p class="trad">👉 <b>Tradotto:</b> ${esc(c.trad)}</p>${appH(MD.intro_app,"intro")}`;}
function bibH(){const L=[],seen=new Set();[MD.intro_app].concat(MD.schede.map(s=>s.app)).forEach(a=>(a&&a.fonti||[]).forEach(f=>{if(!seen.has(f.c)){seen.add(f.c);L.push(f);}}));
  L.sort((a,b)=>a.c.localeCompare(b.c,"it"));return win("s-fonti",`📚 Tutte le fonti (${L.length})`,`<p class="lbl" style="margin:0 0 6px">Studi pubblicati su riviste scientifiche con revisione, qualche libro e qualche articolo che li spiega in breve.</p>${L.map(fonteH).join("")}`,false,"bib");}
function vSapevi(){const W=weekInfo(today());
  let o=win("s-intro","🧠 Lo sapevi?",`<p style="margin:0">Curiosità vere dalla psicologia delle relazioni, con la traduzione pratica. Tocca il titolo di una curiosità per aprirla; sotto, «Da dove viene?» apre lo studio e le fonti.</p>`+sub("c-intro","💡 "+esc(MD.intro_curio.tit),curioIntro(1),true),true);
  o+=AB.map(a=>{const L=MD.schede.filter(x=>x.ab===a.id);return win("s-"+a.id,`${a.ic} ${esc(a.n)} <span class="pill${a.id===W.ab.id?" m":""}">${L.length} curiosità${a.id===W.ab.id?" · questa settimana":""}</span>`,
    `<div class="motto" style="margin-bottom:6px">«${esc(a.motto)}»</div>`+L.map(x=>sub("c-"+x.id,"🧠 "+esc(x.curio.tit),curioBody(x,1),false)).join(""),a.id===W.ab.id);}).join("");
  return o+bibH();}

/* ---------- 💬 Frasi di scorta ---------- */
const ALLF=()=>MD.frasi.flatMap(c=>c.f.map(f=>({c,f})));
const star=f=>`<button class="star${M.fav[f]?" on":""}" data-fav="${esc(f)}" aria-label="preferita">${M.fav[f]?"★":"☆"}</button>`;
function frRow(f){return `<div class="row"><div class="grow">«${esc(f)}»</div>${star(f)}</div>`;}
function vFrasi(){const fav=Object.keys(M.fav),tot=ALLF().length;
  let o=win("f-pesca",`🎲 Pesca una frase <span class="pill">${tot} frasi</span>`,`<p style="margin:0">Il kit di pronto soccorso per le chiacchiere: quando il discorso si spegne, ne peschi una. Tocca ☆ per tenere le tue preferite.</p><p class="lbl" style="margin:4px 0 0">${esc(MD.frasi_nota||"")}</p>
    <div class="btns">${[["tutte","Tutte"]].concat(MD.frasi.map(c=>[c.id,c.ic+" "+c.n])).map(([k,n])=>`<button class="btn sm${frCat===k?" pri":""}" data-fc="${k}">${esc(n)}</button>`).join("")}</div>
    <div class="btns"><button class="btn pri" data-a="fpick">🎲 Pesca</button></div>${frPick?`<div class="fpick">«${esc(frPick)}»${star(frPick)}</div>`:""}`,true);
  if(fav.length)o+=win("f-fav",`⭐ Le tue preferite <span class="pill m">${fav.length}</span>`,fav.map(frRow).join(""),true);
  o+=MD.frasi.map(c=>win("f-"+c.id,`${c.ic} ${esc(c.n)} <span class="pill">${c.f.length}</span>`,c.f.map(frRow).join(""),false)).join("");
  return o;}

/* ---------- 🤲 volontariato (file pubblico, aggiornato una volta a settimana) ---------- */
const OKEY="pn-occ";let OCC=lsJ(OKEY),occBusy=false;
async function occPull(){if(occBusy||navigator.onLine===false)return;occBusy=true;
  try{const r=await fetch("occasioni-torino.json",{cache:"no-store"});if(r.ok){const o=await r.json();if(o&&o.app==="pianificazione-occasioni"){OCC=o;try{localStorage.setItem(OKEY,JSON.stringify(o));}catch(e){}if(tab==="vol")render();}}}catch(e){}occBusy=false;}
const ST=[["","—"],["interessa","⭐ mi interessa"],["contattato","📞 ho contattato"],["iniziato","🤲 ho iniziato"],["no","✖️ non fa per me"]];
const STI=Object.fromEntries(ST);
function vVol(){
  if(!OCC)return `<div class="card"><p class="empty">Sto scaricando le occasioni… serve internet la prima volta.</p></div>`;
  const AT=Object.fromEntries(AB.map(a=>[a.id,a])),V=OCC.voci||[];
  let o=win("v-intro",`🤲 Volontariato a Torino <span class="pill">${V.length} realtà</span>`,`<p style="margin:0">Fare volontariato vuol dire incontrare persone nuove ogni settimana, con uno scopo comune: è la palestra più naturale per il Metodo (e le missioni «Da leoni» ringraziano). Tocca una realtà per aprirla.</p>
    <p class="lbl" style="margin:8px 0 0">Controllate sulle pagine ufficiali · ultimo aggiornamento ${OCC.updated?new Date(OCC.updated).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}):"—"} · solo informazioni, nessun consiglio. Le tue scelte e le note restano su questo iPad.</p>`,true);
  const an=(OCC.annunci||[]).filter(a=>!a.scade||a.scade>=today());
  if(an.length)o+=win("v-annunci",`📣 Annunci <span class="pill m">${an.length}</span>`,an.map(a=>sub("va-"+a.id,esc(a.n),`<p>${esc(a.cosa||"")}</p>${a.primo?`<div class="primo"><b>Primo passo:</b> ${esc(a.primo)}</div>`:""}<div class="lbl">${a.scade?"Fino al "+fmt(a.scade,{day:"numeric",month:"long"})+" · ":""}Fonte: <a class="lnk" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.fonte||"pagina")}</a></div>`,false)).join(""),true);
  o+=V.map(v=>{const my=M.occ[v.id]||{};return win("v-"+v.id,`${esc(v.n)}${my.st?` <span class="pill m">${esc(STI[my.st]||"")}</span>`:""}`,`
    <div class="meta">${v.contatto==="alto"?`<span class="pill m">👥 molto contatto con le persone</span>`:`<span class="pill">👥 contatto medio</span>`}${(v.ab||[]).map(a=>AT[a]?`<span class="pill">allena ${AT[a].ic} ${esc(AT[a].n)}</span>`:"").join("")}</div>
    <p>${esc(v.cosa)}</p><p><b>Impegno:</b> ${esc(v.impegno)}</p><p><b>Requisiti:</b> ${esc(v.requisiti)}</p>
    <div class="primo"><b>Primo passo:</b> ${esc(v.primo)}</div>
    <div class="form"><label>Per me<select data-ost="${esc(v.id)}">${ST.map(([k,n])=>`<option value="${k}"${(my.st||"")===k?" selected":""}>${n}</option>`).join("")}</select></label><label>Nota<input data-onote="${esc(v.id)}" maxlength="160" value="${esc(my.n||"")}" placeholder="facoltativa"></label></div>
    <div class="btns"><button class="btn sm" data-osf="${esc(v.id)}">🃏 Il primo passo è la missione di oggi</button></div>
    <div class="lbl" style="margin-top:8px">Fonte: <a class="lnk" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.fonte)}</a> · controllato il ${fmt(v.ctrl,{day:"numeric",month:"long",year:"numeric"})}</div>`,false,"occ");}).join("");
  return o;
}

/* ---------- azioni ---------- */
function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  document.querySelectorAll("details[data-fk]").forEach(d=>d.ontoggle=()=>{FOLD[d.dataset.fk]=d.open?1:0;foldSave();});
  document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const v=b.dataset.all==="1";document.querySelectorAll("#main details[data-fk]").forEach(d=>{d.open=v;FOLD[d.dataset.fk]=v?1:0;});foldSave();});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const g=dayG(today()),id=b.dataset.pick;if(g.s===id)return;g.rev=Array.from(new Set((g.rev||[]).concat(id)));g.s=id;if(SF[id])g.txt=SF[id].nome;save();render();});
  document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{frCat=b.dataset.fc;frPick=null;render();});
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const f=b.dataset.fav;if(M.fav[f])delete M.fav[f];else M.fav[f]=1;save();render();});
  document.querySelectorAll("[data-ost]").forEach(e=>e.onchange=()=>{const m=M.occ[e.dataset.ost]||(M.occ[e.dataset.ost]={});m.st=e.value;m.at=today();save();toast("Salvato");});
  document.querySelectorAll("[data-onote]").forEach(e=>e.onchange=()=>{const m=M.occ[e.dataset.onote]||(M.occ[e.dataset.onote]={});m.n=e.value.trim();save();toast("Salvato");});
  document.querySelectorAll("[data-osf]").forEach(b=>b.onclick=()=>{const v=(OCC.voci||[]).find(x=>x.id===b.dataset.osf);if(!v)return;const g=dayG(today());if(g.ok&&!confirm("Hai già compiuto la missione di oggi: la sostituisco con questo primo passo?"))return;g.s="occ:"+v.id;g.txt="Fai il primo passo con "+v.n;g.rev=g.rev||[];g.ok=false;save();FOLD["o-missione"]=1;foldSave();setTab("oggi");toast("🃏 È la missione di oggi");});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));
}
function act(a){const t=today();
  if(a==="gnew"){const g=dayG(t);g.p=propose(t,true);g.rev=[];if(g.s&&!g.s.startsWith("occ:")){g.s=null;delete g.txt;}save();toast("🔀 Mazzo rimescolato");return render();}
  if(a==="gdone"){const g=dayG(t);g.ok=true;g.at=new Date().toISOString();save();toast(["✅ Missione compiuta!","✅ Bravo, agente della simpatia!","✅ Fatto: il mondo è un po' più cordiale."][Math.floor(Math.random()*3)]);return render();}
  if(a==="gundo"){const g=dayG(t);g.ok=false;save();return render();}
  if(a==="fpick"){const L=ALLF().filter(x=>frCat==="tutte"||x.c.id===frCat);let p=L[Math.floor(Math.random()*L.length)].f;if(L.length>1)while(p===frPick)p=L[Math.floor(Math.random()*L.length)].f;frPick=p;return render();}
}
window.addEventListener("pageshow",e=>{if(e.persisted){M=normM((lsJ(KEY)||{}).met);render();}});
const busy=()=>/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(!busy()){M=normM((lsJ(KEY)||{}).met);render();}occPull();}});
render();recover();occPull();
</script>
