<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pianificazione">
<meta name="theme-color" content="#f4f5f9">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Metodo</title>
<style>
:root{--m:#b86e00;--m-bg:#fff1dc;--bg:#f4f5f9;--card:#fff;--ink:#16191f;--muted:#687180;--line:#e6e8ee;--seg:#eceef3;--ok:#2e7d5b;--ok-bg:#e1f3e9;--warn:#d6342c;--warn-bg:#fdeceb;
  --shadow:0 1px 2px rgba(20,24,32,.05),0 4px 16px rgba(20,24,32,.05);--l1:#2e7d5b;--l1-bg:#e1f3e9;--l2:#1f5fae;--l2-bg:#e3edf9;--l3:#b8336a;--l3-bg:#fbe6ef}
@media (prefers-color-scheme:dark){:root{--m:#f0a43a;--m-bg:#3a2a12;--bg:#0f1115;--card:#1a1d23;--ink:#eef0f4;--muted:#9aa3af;--line:#2b3039;--seg:#242830;--ok:#5cc494;--ok-bg:#173226;--warn:#ff8a80;--warn-bg:#3d1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.4);--l1:#5cc494;--l1-bg:#173226;--l2:#7ea6f0;--l2-bg:#1b2a44;--l3:#f07ab3;--l3-bg:#3d1a2b}
  .mtabs button.on,.btn.pri{color:#1b1306}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:8px 16px 0}
h1{font-size:28px;margin:10px 2px 2px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:800}
.sub{color:var(--muted);margin:0 2px 14px;font-size:15px}
.mtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 16px}.mtabs::-webkit-scrollbar{display:none}
.mtabs button{border:0;font:inherit;font-weight:700;font-size:15.5px;background:var(--card);color:var(--ink);padding:10px 15px;border-radius:14px;box-shadow:var(--shadow);white-space:nowrap;cursor:pointer}
.mtabs button.on{background:var(--m);color:#fff}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:inset 0 4px 0 var(--m),var(--shadow)}
.card.plain{box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{color:var(--muted);font-size:13.5px}
.pill{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--seg);color:var(--ink);white-space:nowrap}
.pill.m{background:var(--m-bg);color:var(--m)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.l1{background:var(--l1-bg);color:var(--l1)}.pill.l2{background:var(--l2-bg);color:var(--l2)}.pill.l3{background:var(--l3-bg);color:var(--l3)}
.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--seg);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--m);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:var(--warn-bg);color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lnk{font:inherit;font-size:14px;font-weight:700;color:var(--m);background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.week{display:flex;gap:14px;align-items:center}
.week .big{font-size:40px;line-height:1}
.steps{display:flex;gap:6px;margin-top:10px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--seg)}.steps i.on{background:var(--m)}.steps i.done{background:var(--m);opacity:.4}
.sf{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.sfc{text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:grid;gap:8px;align-content:start}
.sfc.on{border-color:var(--m);background:var(--m-bg)}
.sfc .t{font-size:16.5px;font-weight:650;line-height:1.35}
.sfc .h{display:flex;gap:6px;flex-wrap:wrap}
.done{display:flex;gap:12px;align-items:flex-start}
.done .tick{font-size:30px;line-height:1}
.faces{display:flex;gap:8px;margin-top:6px}
.faces button{font-size:28px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:4px 10px;cursor:pointer}
.faces button.on{border-color:var(--m);background:var(--m-bg)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.form .wide{grid-column:1/-1}
.form input,.form textarea,.form select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);color:var(--ink);width:100%;min-height:42px}
.form textarea{resize:vertical}
.sch{border-top:1px solid var(--line);padding:12px 0}.sch:first-of-type{border-top:0;padding-top:4px}
.sch b.t{font-size:16.5px}
.sch .es{font-style:italic;margin:6px 0;color:var(--ink)}
.sch .fr{display:inline-block;background:var(--m-bg);color:var(--m);font-weight:700;border-radius:10px;padding:4px 10px;margin:2px 0 6px}
.sch .bs{font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}.row small{display:block;color:var(--muted)}
.row .fc{font-size:24px;line-height:1.2}
.empty{color:var(--muted);margin:4px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0}
.kpi div{background:var(--seg);border-radius:14px;padding:10px 12px}.kpi b{display:block;font-size:24px}.kpi span{font-size:13px;color:var(--muted)}
.occ .meta{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.occ p{margin:6px 0}
.occ .primo{background:var(--m-bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#16191f;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:600px){h1{font-size:24px}.mtabs button{font-size:14.5px;padding:9px 12px}}
</style>
<script>window.APP_VERSION="dev";window.APP_BUILD="dev";</script>
</head>
<body>
<!--@NAV-->
<div class="wrap">
  <h1>🤝 Metodo</h1>
  <p class="sub" id="intro"></p>
  <nav class="mtabs" id="tabs" aria-label="Parti del Metodo"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= 🤝 METODO =================
   Allenamento a stare con gli altri: 4 abilità, una a settimana (👋 Aprire · 💬 Tenere viva la chiacchierata · 🔁 Farsi vivo · 😊 Calore);
   ogni giorno 3 sfide (facile, media, coraggiosa) in situazioni diverse; Regole d'oro; Preparo un incontro; Com'è andata con il
   riepilogo della domenica; Volontariato a Torino (file pubblico occasioni-torino.json, aggiornato dall'attività programmata).
   I contenuti (schede e sfide) sono in sezioni/metodo_dati.json, controllati a ogni build da strumenti/verifica_metodo.py.
   I dati personali (sfide scelte, note, incontri) restano su questo dispositivo: localStorage «pn-v1» → «met» + database «licenze-marco»
   voce «pianifica», quindi entrano nelle copie giornaliere e nella copia su iCloud. Nessun dato personale nel codice. */
"use strict";
const MD=/*@METODO_DATI*/null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"long",day:"numeric",month:"long"});
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}
const FACCE=[["🙂","bene"],["😐","così così"],["😕","non è andata"]];
const AB=MD.abilita,ABI=Object.fromEntries(AB.map((a,i)=>[a.id,i])),SF=Object.fromEntries(MD.sfide.map(x=>[x.id,x]));

/* ---------- dati (pn-v1 → met) ---------- */
const KEY="pn-v1";
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):st.put(val,key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
const normM=m=>{m=m&&typeof m==="object"?m:{};m.g=m.g&&typeof m.g==="object"?m.g:{};m.inc=Array.isArray(m.inc)?m.inc:[];m.occ=m.occ&&typeof m.occ==="object"?m.occ:{};m.lette=m.lette||{};return m;};
let M=normM((lsJ(KEY)||{}).met);
let saveT=null;
function save(){const P=lsJ(KEY)||{ver:1};P.met=M;P.savedAt=new Date().toISOString();const t=JSON.stringify(P); // riparto sempre dall'ultima versione salvata: le altre sezioni restano intatte
  try{localStorage.setItem(KEY,t);}catch(e){toast("⚠️ Memoria piena: non salvato");return;}clearTimeout(saveT);saveT=setTimeout(()=>kv("readwrite","pianifica",t).catch(()=>{}),300);}
async function recover(){if(lsJ(KEY))return;try{const t=await kv("readonly","pianifica");if(t){localStorage.setItem(KEY,t);M=normM(JSON.parse(t).met);render();}}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- il percorso: un'abilità a settimana, poi si riparte con sfide più impegnative ---------- */
function startOf(){if(!M.start){M.start=monday(today());save();}return M.start;}
function weekInfo(s){const w=Math.max(0,Math.floor(diff(startOf(),s)/7));return{w,ab:AB[w%4],n:w%4+1,ciclo:Math.floor(w/4)};}
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;};
const SITS=["nuove","colleghi","famiglia","gruppi"];
function propose(s,rnd){
  const W=weekInfo(s),lv=W.ciclo?[2,3,3]:[1,2,3],recent=new Set();
  for(let i=1;i<=14;i++){const g=M.g[add(s,-i)];if(g&&g.s)recent.add(g.s);}
  let seed=rnd?Math.floor(Math.random()*1e9):hash(s+W.ab.id);const out=[],used=new Set();
  lv.forEach((l,k)=>{let pool=MD.sfide.filter(x=>x.ab===W.ab.id&&x.liv===l&&!out.includes(x.id));
    const fresh=pool.filter(x=>!recent.has(x.id)&&!used.has(x.sit));if(fresh.length)pool=fresh;else{const f2=pool.filter(x=>!used.has(x.sit));if(f2.length)pool=f2;}
    if(!pool.length)return;const x=pool[(seed>>>(k*5))%pool.length];out.push(x.id);used.add(x.sit);});
  return out;
}
function dayG(s){let g=M.g[s];if(!g){g=M.g[s]={ab:weekInfo(s).ab.id,p:propose(s)};save();}return g;}
function occPrimo(s){const v=OCC&&(OCC.voci||[]).find(x=>"occ:"+x.id===s);return v?`<span class="lbl">${esc(v.primo)}</span>`:"";}
function sfTxt(g){if(!g||!g.s)return "";if(g.s.startsWith("occ:"))return g.txt||"";return (SF[g.s]||{}).t||"";}

/* ---------- interfaccia ---------- */
const TABS=[["oggi","🎯 Oggi"],["regole","📘 Regole d'oro"],["inc","🍽️ Incontri"],["diario","📝 Com'è andata"],["vol","🤲 Volontariato"]];
let tab=(()=>{const h=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h))return h;try{const v=localStorage.getItem("pn-metv");return TABS.some(t=>t[0]===v)?v:"oggi";}catch(e){return "oggi";}})();
let incEdit=null,incOpen=false;
function setTab(t){tab=t;try{localStorage.setItem("pn-metv",t);}catch(e){}history.replaceState(null,"","#"+t);render();scrollTo({top:0});}
function render(){
  $("intro").textContent=MD.intro;
  $("tabs").innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${n}</button>`).join("");
  $("main").innerHTML=tab==="oggi"?vOggi():tab==="regole"?vRegole():tab==="inc"?vInc():tab==="diario"?vDiario():vVol();
  bind();
}
const livP=l=>`<span class="pill l${l}">${["","🌱 facile","🌿 media","🔥 coraggiosa"][l]}</span>`;
const sitP=s=>`<span class="pill">${esc(MD.situazioni[s]||s)}</span>`;
function faces(cur,attr){return `<div class="faces">${FACCE.map((f,i)=>`<button ${attr}="${i+1}" class="${+cur===i+1?"on":""}" aria-label="${f[1]}">${f[0]}</button>`).join("")}</div>`;}

function vOggi(){
  const t=today(),W=weekInfo(t),g=dayG(t),wd=(parse(t).getDay()+6)%7;
  let o=`<div class="card"><div class="week"><span class="big">${W.ab.ic}</span><div><div class="lbl">Settimana ${W.n} di 4${W.ciclo?` · giro ${W.ciclo+1}, sfide più impegnative`:""}</div><h3 style="margin:2px 0">${esc(W.ab.n)}</h3><div class="lbl">${esc(W.ab.sotto)}</div></div></div>
    <div class="steps">${AB.map((a,i)=>`<i class="${i===W.n-1?"on":i<W.n-1?"done":""}" title="${esc(a.n)}"></i>`).join("")}</div></div>`;
  // la sfida
  if(g.s&&g.ok){o+=`<div class="card"><h3>🎯 La sfida di oggi</h3><div class="done"><span class="tick">✅</span><div class="grow"><b>${esc(sfTxt(g))}</b><div class="lbl">Fatta! Com'è andata?</div>${faces(g.f,"data-gf")}
      <div class="form"><label class="wide">Una riga: che cosa ha funzionato, che cosa hai notato<input id="gT" maxlength="200" value="${esc(g.t||"")}" placeholder="es. ha sorriso subito, abbiamo parlato dieci minuti"></label></div>
      <div class="btns"><button class="btn pri sm" data-a="gsave">Salva</button><button class="btn sm" data-a="gundo">Non l'ho ancora fatta</button></div></div></div></div>`;}
  else{o+=`<div class="card"><h3>🎯 La sfida di oggi <span class="lbl" style="font-weight:600">${g.s?"la tua scelta":"scegline una"}</span></h3><div class="sf">`+
      g.p.map(id=>{const x=SF[id];if(!x)return "";return `<button class="sfc${g.s===id?" on":""}" data-pick="${id}"><span class="h">${livP(x.liv)}${sitP(x.sit)}</span><span class="t">${esc(x.t)}</span></button>`;}).join("")+
      (g.s&&g.s.startsWith("occ:")?`<button class="sfc on" data-pick="${esc(g.s)}"><span class="h"><span class="pill l3">🔥 coraggiosa</span>${sitP("vol")}</span><span class="t">${esc(g.txt)}</span>${occPrimo(g.s)}</button>`:"")+
      `</div><div class="btns">${g.s?`<button class="btn ok" data-a="gdone">✓ Fatta</button>`:""}<button class="btn sm" data-a="gnew">🔄 Altre tre</button></div>
      <p class="lbl" style="margin:10px 0 0">Saltare un giorno va benissimo: non ci sono serie da tenere né punti da perdere.</p></div>`;}
  // la regola del giorno
  const sc=MD.schede.filter(x=>x.ab===W.ab.id),r=sc[(diff(startOf(),t)%7+7)%7%sc.length];
  if(r)o+=`<div class="card plain"><h3>📘 La regola di oggi <button class="lnk" data-tab="regole" style="margin-left:auto">Tutte le regole ›</button></h3>${schedaH(r)}</div>`;
  // incontri vicini
  const up=M.inc.filter(i=>i.d&&i.d>=t&&i.d<=add(t,7)).sort((a,b)=>a.d<b.d?-1:1),late=M.inc.filter(i=>i.d&&i.d<t&&!i.f);
  if(up.length||late.length)o+=`<div class="card plain"><h3>🍽️ Incontri <button class="lnk" data-tab="inc" style="margin-left:auto">Apri ›</button></h3>`+
    late.map(i=>`<div class="row"><span class="fc">📝</span><div class="grow"><b>${esc(i.chi)}</b><small>${cap(fmt(i.d))} · com'è andata? Scrivilo in Incontri</small></div></div>`).join("")+
    up.map(i=>`<div class="row"><span class="fc">🍽️</span><div class="grow"><b>${esc(i.chi)}</b><small>${i.d===t?"oggi":cap(fmt(i.d))}${i.o?" · "+esc(i.o):""}${i.dove?" · "+esc(i.dove):""}</small>${(i.dom||[]).filter(Boolean).length?`<small>Domande pronte: ${(i.dom||[]).filter(Boolean).map(esc).join(" · ")}</small>`:""}</div></div>`).join("")+`</div>`;
  // riepilogo (la domenica e il lunedì: la settimana appena passata)
  if(wd===6||wd===0)o+=riepilogo(wd===6?monday(t):monday(add(t,-1)));
  o+=`<p class="lbl" style="margin:18px 4px">💡 ${esc(MD.intro_base)}</p>`;
  return o;
}
function riepilogo(m){
  const days=[...Array(7)].map((_,i)=>add(m,i)).filter(s=>s<=today()),G=days.map(s=>M.g[s]).filter(g=>g&&g.s&&g.ok);
  const inc=M.inc.filter(i=>i.d>=m&&i.d<=add(m,6)&&i.f),n=[0,0,0];G.concat(inc).forEach(x=>{if(x.f)n[x.f-1]++;});
  const righe=G.filter(g=>g.t).map(g=>g.t).concat(inc.filter(i=>i.t).map(i=>i.t)),W=weekInfo(m);
  return `<div class="card"><h3>🗓️ Riepilogo della settimana · ${W.ab.ic} ${esc(W.ab.n)}</h3>
    <div class="kpi"><div><b>${G.length}</b><span>sfide fatte</span></div><div><b>${inc.length}</b><span>incontri</span></div><div><b>${FACCE.map((f,i)=>n[i]?f[0]+" "+n[i]:"").filter(Boolean).join("  ")||"—"}</b><span>com'è andata</span></div></div>
    ${righe.length?`<p class="lbl" style="margin:8px 0 4px">Quello che hai scritto:</p>${righe.slice(-5).map(r=>`<div class="row"><span class="fc">✍️</span><div class="grow">${esc(r)}</div></div>`).join("")}`:`<p class="lbl">Ogni sfida fatta è un passo, anche se è andata così così: conta averci provato.</p>`}
    <p class="lbl" style="margin:10px 0 0">Ricorda: dopo una chiacchierata, di solito sei piaciuto più di quanto pensi.</p></div>`;
}
function schedaH(x){return `<div class="sch"><b class="t">${esc(x.tit)}</b><p style="margin:6px 0">${esc(x.princ)}</p><p class="es">${esc(x.es)}</p><span class="fr">💬 «${esc(x.frase)}»</span><div class="bs">📚 ${esc(x.base)}</div></div>`;}
function vRegole(){const W=weekInfo(today());
  return `<p class="lbl" style="margin:0 4px 12px">${esc(MD.intro_base)}</p>`+AB.map(a=>`<div class="card${a.id===W.ab.id?"":" plain"}"><h3>${a.ic} ${esc(a.n)}${a.id===W.ab.id?` <span class="pill m">questa settimana</span>`:""}</h3><div class="lbl" style="margin-bottom:6px">${esc(a.sotto)}</div>${MD.schede.filter(x=>x.ab===a.id).map(schedaH).join("")}</div>`).join("");}

function vInc(){
  const t=today(),E=incEdit?M.inc.find(i=>i.id===incEdit):null,L=M.inc.slice().sort((a,b)=>(b.d||"")<(a.d||"")?-1:1);
  const up=L.filter(i=>!i.d||i.d>=t).reverse(),past=L.filter(i=>i.d&&i.d<t);
  let o=`<div class="card"><h3>🍽️ Preparo un incontro</h3><p class="lbl" style="margin:0">Prima di una cena, un ritrovo o una telefonata importante: che cosa sai della persona, 3 domande da fare, una storia da raccontare. Il giorno dell'incontro lo trovi nel Calendario.</p>
    ${incOpen||E?incForm(E):`<div class="btns"><button class="btn pri" data-a="inew">➕ Nuovo incontro</button></div>`}</div>`;
  o+=`<h2>In programma</h2>`+(up.length?up.map(i=>incCard(i,false)).join(""):`<p class="empty">Nessun incontro in programma.</p>`);
  if(past.length)o+=`<h2>Passati</h2>`+past.map(i=>incCard(i,true)).join("");
  return o;
}
function incForm(E){const e=E||{dom:["","",""]};
  return `<div class="form"><label>Chi vedrai<input id="iChi" maxlength="60" value="${esc(e.chi||"")}" placeholder="es. un ex collega, i vicini"></label>
    <label>Quando<input id="iD" type="date" value="${esc(e.d||today())}"></label><label>Ora<input id="iO" type="time" value="${esc(e.o||"")}"></label><label>Dove<input id="iDove" maxlength="60" value="${esc(e.dove||"")}" placeholder="facoltativo"></label>
    <label class="wide">Che cosa so di questa persona (interessi, famiglia, cose che sta vivendo)<textarea id="iSo" rows="2" maxlength="400">${esc(e.so||"")}</textarea></label>
    ${[0,1,2].map(k=>`<label class="wide">Domanda ${k+1}<input id="iQ${k}" maxlength="140" value="${esc((e.dom||[])[k]||"")}"></label>`).join("")}
    <div class="wide"><details><summary class="lnk">💡 Idee di domande</summary><div class="btns">${MD.domande_idee.map((q,k)=>`<button class="btn sm" data-qi="${k}">${esc(q)}</button>`).join("")}</div></details></div>
    <label class="wide">Una storia breve da raccontare<textarea id="iSt" rows="2" maxlength="400" placeholder="una cosa bella o buffa che ti è successa">${esc(e.storia||"")}</textarea></label>
    <div class="btns wide"><button class="btn pri" data-a="isave">${E?"Salva le modifiche":"Salva l'incontro"}</button><button class="btn" data-a="icancel">Annulla</button>${E?`<button class="btn danger" data-a="idel">Togli</button>`:""}</div></div>`;}
function incCard(i,past){
  return `<div class="card plain"><h3>${past?"📝":"🍽️"} ${esc(i.chi)} <span class="pill${past?"":" m"}">${i.d?cap(fmt(i.d,{weekday:"short",day:"numeric",month:"short"})):"senza data"}${i.o?" · "+esc(i.o):""}</span><button class="lnk" data-iedit="${i.id}" style="margin-left:auto">Modifica</button></h3>
    ${i.dove?`<div class="lbl">📍 ${esc(i.dove)}</div>`:""}${i.so?`<p style="margin:6px 0"><b>Che cosa so:</b> ${esc(i.so)}</p>`:""}
    ${(i.dom||[]).filter(Boolean).length?`<p style="margin:6px 0"><b>Domande:</b></p>${(i.dom||[]).filter(Boolean).map(q=>`<div class="lbl">❓ ${esc(q)}</div>`).join("")}`:""}
    ${i.storia?`<p style="margin:6px 0"><b>Da raccontare:</b> ${esc(i.storia)}</p>`:""}
    ${past||i.d===today()?`<div style="margin-top:8px"><b>Com'è andata?</b>${faces(i.f,"data-if=\""+i.id+"\" data-iv")}<div class="form"><label class="wide">Una riga<input data-it="${i.id}" maxlength="200" value="${esc(i.t||"")}" placeholder="che cosa ha funzionato"></label><label class="wide">Da chiedere la prossima volta («Com'è andata poi?»)<input data-ir="${i.id}" maxlength="200" value="${esc(i.ric||"")}" placeholder="es. l'esame del figlio, il viaggio in Puglia"></label></div></div>`:""}</div>`;}

function vDiario(){
  const L=[];Object.entries(M.g).forEach(([d,g])=>{if(g&&g.s&&g.ok)L.push({d,ic:"🎯",t:sfTxt(g),f:g.f,r:g.t});});
  M.inc.forEach(i=>{if(i.d&&(i.f||i.t))L.push({d:i.d,ic:"🍽️",t:"Incontro: "+i.chi,f:i.f,r:i.t,ric:i.ric});});
  L.sort((a,b)=>a.d<b.d?1:-1);
  const t=today();let o=riepilogo(monday(t));
  if(!L.length)return o+`<p class="empty">Qui compariranno le sfide fatte e gli incontri, con una riga su com'è andata.</p>`;
  let wk="";o+=L.map(x=>{const m=monday(x.d),h=m!==wk?`<h2>Settimana del ${parse(m).toLocaleDateString("it-IT",{day:"numeric",month:"long"})} · ${weekInfo(m).ab.ic} ${esc(weekInfo(m).ab.n)}</h2>`:"";wk=m;
    return h+`<div class="card plain" style="padding:12px 16px"><div class="row" style="border:0;padding:0"><span class="fc">${x.f?FACCE[x.f-1][0]:x.ic}</span><div class="grow"><b>${esc(x.t)}</b><small>${cap(fmt(x.d))}</small>${x.r?`<div style="margin-top:4px">✍️ ${esc(x.r)}</div>`:""}${x.ric?`<small>Da chiedere la prossima volta: ${esc(x.ric)}</small>`:""}</div></div></div>`;}).join("");
  return o;
}

/* ---------- 🤲 volontariato (file pubblico, aggiornato una volta a settimana) ---------- */
const OKEY="pn-occ";let OCC=lsJ(OKEY),occBusy=false;
async function occPull(){if(occBusy||navigator.onLine===false)return;occBusy=true;
  try{const r=await fetch("occasioni-torino.json",{cache:"no-store"});if(r.ok){const o=await r.json();if(o&&o.app==="pianificazione-occasioni"){OCC=o;try{localStorage.setItem(OKEY,JSON.stringify(o));}catch(e){}if(tab==="vol")render();}}}catch(e){}occBusy=false;}
const ST=[["","—"],["interessa","⭐ mi interessa"],["contattato","📞 ho contattato"],["iniziato","🤲 ho iniziato"],["no","✖️ non fa per me"]];
function vVol(){
  if(!OCC)return `<div class="card plain"><p class="empty">Sto scaricando le occasioni… serve internet la prima volta.</p></div>`;
  const AT=Object.fromEntries(AB.map(a=>[a.id,a]));
  let o=`<div class="card"><h3>🤲 Volontariato a Torino</h3><p style="margin:0">Fare volontariato vuol dire incontrare persone nuove ogni volta, con uno scopo comune: è la palestra più naturale per il Metodo. Qui ci sono realtà con molto contatto umano, con il primo passo da fare.</p>
    <p class="lbl" style="margin:8px 0 0">Controllate sulle pagine ufficiali · ultimo aggiornamento ${OCC.updated?new Date(OCC.updated).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}):"—"} · solo informazioni, nessun consiglio.</p></div>`;
  const an=(OCC.annunci||[]).filter(a=>!a.scade||a.scade>=today());
  if(an.length)o+=`<h2>📣 Annunci</h2>`+an.map(a=>`<div class="card plain occ"><h3>${esc(a.n)}</h3><p>${esc(a.cosa||"")}</p>${a.primo?`<div class="primo"><b>Primo passo:</b> ${esc(a.primo)}</div>`:""}<div class="lbl">${a.scade?"Fino al "+fmt(a.scade,{day:"numeric",month:"long"})+" · ":""}Fonte: <a class="lnk" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.fonte||"pagina")}</a></div></div>`).join("");
  o+=(OCC.voci||[]).map(v=>{const my=M.occ[v.id]||{};return `<div class="card plain occ"><h3>${esc(v.n)}</h3>
    <div class="meta">${v.contatto==="alto"?`<span class="pill m">👥 molto contatto con le persone</span>`:`<span class="pill">👥 contatto medio</span>`}${(v.ab||[]).map(a=>AT[a]?`<span class="pill">allena ${AT[a].ic} ${esc(AT[a].n)}</span>`:"").join("")}</div>
    <p>${esc(v.cosa)}</p><p><b>Impegno:</b> ${esc(v.impegno)}</p><p><b>Requisiti:</b> ${esc(v.requisiti)}</p>
    <div class="primo"><b>Primo passo:</b> ${esc(v.primo)}</div>
    <div class="form"><label>Per me<select data-ost="${esc(v.id)}">${ST.map(([k,n])=>`<option value="${k}"${(my.st||"")===k?" selected":""}>${n}</option>`).join("")}</select></label><label>Nota<input data-onote="${esc(v.id)}" maxlength="160" value="${esc(my.n||"")}" placeholder="facoltativa"></label></div>
    <div class="btns"><button class="btn sm" data-osf="${esc(v.id)}">🎯 Il primo passo è la sfida di oggi</button></div>
    <div class="lbl" style="margin-top:8px">Fonte: <a class="lnk" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.fonte)}</a> · controllato il ${fmt(v.ctrl,{day:"numeric",month:"long",year:"numeric"})}</div></div>`;}).join("");
  return o+`<p class="lbl" style="margin:14px 4px">Le tue scelte e le note restano su questo iPad.</p>`;
}

/* ---------- azioni ---------- */
function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const g=dayG(today()),id=b.dataset.pick;g.s=g.s===id&&!id.startsWith("occ:")?null:id;if(!g.s)delete g.txt;else if(SF[g.s])g.txt=SF[g.s].t;save();render();});
  document.querySelectorAll("[data-gf]").forEach(b=>b.onclick=()=>{const g=dayG(today());g.f=+b.dataset.gf;save();render();});
  document.querySelectorAll("[data-iv]").forEach(b=>b.onclick=()=>{const i=M.inc.find(x=>x.id===b.dataset.if);if(i){i.f=+b.dataset.iv;save();render();}});
  document.querySelectorAll("[data-it]").forEach(e=>e.onchange=()=>{const i=M.inc.find(x=>x.id===e.dataset.it);if(i){i.t=e.value.trim();save();toast("Salvato");}});
  document.querySelectorAll("[data-ir]").forEach(e=>e.onchange=()=>{const i=M.inc.find(x=>x.id===e.dataset.ir);if(i){i.ric=e.value.trim();save();toast("Salvato");}});
  document.querySelectorAll("[data-iedit]").forEach(b=>b.onclick=()=>{incEdit=b.dataset.iedit;incOpen=true;render();});
  document.querySelectorAll("[data-qi]").forEach(b=>b.onclick=()=>{const q=MD.domande_idee[+b.dataset.qi];for(const k of [0,1,2]){const e=$("iQ"+k);if(e&&!e.value){e.value=q;return;}}toast("Le 3 domande sono già piene");});
  document.querySelectorAll("[data-ost]").forEach(e=>e.onchange=()=>{const m=M.occ[e.dataset.ost]||(M.occ[e.dataset.ost]={});m.st=e.value;m.at=today();save();toast("Salvato");});
  document.querySelectorAll("[data-onote]").forEach(e=>e.onchange=()=>{const m=M.occ[e.dataset.onote]||(M.occ[e.dataset.onote]={});m.n=e.value.trim();save();toast("Salvato");});
  document.querySelectorAll("[data-osf]").forEach(b=>b.onclick=()=>{const v=(OCC.voci||[]).find(x=>x.id===b.dataset.osf);if(!v)return;const g=dayG(today());if(g.ok&&!confirm("Hai già fatto la sfida di oggi: la sostituisco con questo primo passo?"))return;g.s="occ:"+v.id;g.txt="Fai il primo passo con "+v.n;g.ok=false;delete g.f;delete g.t;save();setTab("oggi");toast("🎯 È la sfida di oggi");});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));
}
function act(a){const t=today();
  if(a==="gnew"){const g=dayG(t);g.p=propose(t,true);if(g.s&&!g.s.startsWith("occ:"))g.s=null;save();return render();}
  if(a==="gdone"){const g=dayG(t);g.ok=true;g.at=new Date().toISOString();save();toast("✅ Fatta, bravo!");return render();}
  if(a==="gundo"){const g=dayG(t);g.ok=false;save();return render();}
  if(a==="gsave"){const g=dayG(t);g.t=($("gT").value||"").trim();save();toast("Salvato");return render();}
  if(a==="inew"){incEdit=null;incOpen=true;return render();}
  if(a==="icancel"){incEdit=null;incOpen=false;return render();}
  if(a==="isave"){const chi=$("iChi").value.trim();if(!chi)return toast("Scrivi chi vedrai");
    const o={chi,d:$("iD").value||"",o:$("iO").value||"",dove:$("iDove").value.trim(),so:$("iSo").value.trim(),dom:[0,1,2].map(k=>$("iQ"+k).value.trim()),storia:$("iSt").value.trim()};
    if(incEdit){Object.assign(M.inc.find(i=>i.id===incEdit),o);}else M.inc.push(Object.assign({id:uid(),creato:t},o));
    incEdit=null;incOpen=false;save();toast("🍽️ Incontro salvato");return render();}
  if(a==="idel"){if(!confirm("Togliere questo incontro?"))return;M.inc=M.inc.filter(i=>i.id!==incEdit);incEdit=null;incOpen=false;save();return render();}
}
window.addEventListener("pageshow",e=>{if(e.persisted){M=normM((lsJ(KEY)||{}).met);render();}});
const busy=()=>incOpen||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(!busy()){M=normM((lsJ(KEY)||{}).met);render();}occPull();}});
render();recover();occPull();
</script>
